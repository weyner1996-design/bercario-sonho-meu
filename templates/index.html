/* ============================================================
   MANUT — Módulo Manutenção (Etapa 9.4)
   ============================================================ */
const Manut = (() => {
  let _all = [], _fornec = [], _revis = [];

  const render = async () => {
    _all    = await DB.getAll('manutencao');
    _fornec = await DB.getAll('fornecedores').catch(() => []);
    _revis  = await DB.getAll('revisoes').catch(() => []);
    _renderKpis();
    _renderAbertos();
    _renderConcluidos();
    _renderFornecedores();
    _renderRevisoes();
  };

  const _renderKpis = () => {
    const el = document.getElementById('manutKpis'); if (!el) return;
    const ab  = _all.filter(m => m.status === 'aberto');
    const urg = ab.filter(m => m.prioridade === 'urgente').length;
    const tot = _all.filter(m => m.status==='concluido').reduce((s,m) => s+(m.custo||0), 0);
    el.innerHTML = [
      { l:'Chamados Abertos', v: ab.length,         s:'aguardando',     i:'🔧', c: ab.length?'danger':'success' },
      { l:'Urgentes',         v: urg,                s:'alta prioridade',i:'🔴', c: urg?'danger':'success'       },
      { l:'Concluídos',       v: _all.filter(m=>m.status==='concluido').length, s:'histórico', i:'✅', c:'success' },
      { l:'Custo Total',      v: Utils.money(tot),   s:'manutenções',   i:'💸', c:'info'                         },
    ].map((k,i)=>`<div class="kpi ${k.c}" style="animation-delay:${i*.04}s">
      <div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div>
      <div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div>
    </div>`).join('');
  };

  const _card = m => {
    const f = _fornec.find(f => f.id === m.fornecedorId);
    return `<div class="card" style="margin-bottom:var(--sp-sm);border-left:4px solid var(--${m.prioridade==='urgente'?'danger':'warning'})">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div>
          <div style="font-family:var(--font-display);font-size:14px;font-weight:700">${Utils.esc(m.titulo)}</div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3)">📍 ${Utils.esc(m.local)} · ${Utils.fmtDate(m.dt)}</div>
          ${m.desc ? `<div style="font-size:var(--fs-xs);color:var(--ink-2);margin-top:3px">${Utils.esc(m.desc)}</div>` : ''}
        </div>
        <span class="badge ${m.prioridade==='urgente'?'badge-danger':'badge-warning'}">${m.prioridade}</span>
      </div>
      ${f ? `<div style="font-size:var(--fs-xs);color:var(--ink-3)">🏢 Fornecedor: <b>${Utils.esc(f.nome)}</b> · ${Utils.esc(f.tel||'')}</div>` : ''}
      ${m.custo ? `<div style="font-size:var(--fs-sm);font-weight:700;color:var(--success-dk);margin-top:4px">💰 ${Utils.money(m.custo)}</div>` : ''}
      <div style="display:flex;gap:5px;margin-top:8px">
        ${m.status==='aberto' ? `<button class="btn btn-success btn-xs" onclick="Manut.concluir('${m.id}')">✅ Concluir</button>` : ''}
        <button class="btn btn-ghost btn-xs" onclick="Manut.openForm('${m.id}')">✏️</button>
        <button class="btn btn-danger btn-xs" onclick="Manut.del('${m.id}')">🗑️</button>
      </div>
    </div>`;
  };

  const _renderAbertos = () => {
    const el = document.getElementById('manutAbertos'); if (!el) return;
    const ab = _all.filter(m => m.status==='aberto').sort((a,b) => {
      const pc = { urgente:0, alta:1, normal:2 };
      return (pc[a.prioridade]||2) - (pc[b.prioridade]||2);
    });
    el.innerHTML = ab.map(_card).join('') || '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-sub">Sem chamados abertos</div></div>';
  };

  const _renderConcluidos = () => {
    const el = document.getElementById('manutConcluidos'); if (!el) return;
    const cc = _all.filter(m => m.status==='concluido').sort((a,b) => (b.dtConclusao||b.dt||'').localeCompare(a.dtConclusao||a.dt||'')).slice(0,5);
    el.innerHTML = cc.map(_card).join('') || '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-sub">Nenhum concluído</div></div>';
  };

  const _renderFornecedores = () => {
    const el = document.getElementById('manutFornecedores'); if (!el) return;
    if (!_fornec.length) {
      el.innerHTML = `<div style="color:var(--ink-3);font-size:var(--fs-sm)">Nenhum fornecedor cadastrado. <button class="btn btn-ghost btn-xs" onclick="Manut.openFornecedor()">+ Cadastrar</button></div>`;
      return;
    }
    el.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
      ${_fornec.map(f => `<div style="border:1px solid var(--border);border-radius:var(--r-md);padding:10px">
        <div style="font-weight:700;font-size:var(--fs-sm)">${Utils.esc(f.nome)}</div>
        <div style="font-size:var(--fs-xs);color:var(--ink-3)">${Utils.esc(f.especialidade||'—')}</div>
        <div style="font-size:var(--fs-xs)">${Utils.esc(f.tel||'—')}</div>
        <div style="display:flex;gap:4px;margin-top:6px">
          ${f.tel?`<a href="https://wa.me/55${(f.tel||'').replace(/\D/g,'')}" target="_blank" class="btn btn-wa btn-xs">💬</a>`:''}
          <button class="btn btn-ghost btn-xs" onclick="Manut.openFornecedor('${f.id}')">✏️</button>
          <button class="btn btn-danger btn-xs" onclick="Manut.delFornecedor('${f.id}')">🗑️</button>
        </div>
      </div>`).join('')}
    </div>`;
  };

  const _renderRevisoes = () => {
    const el = document.getElementById('manutRevisoes'); if (!el) return;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const itens = [
      { nome:'Dedetização',     interv:180 },
      { nome:'Manutenção AC',   interv:90  },
      { nome:'Vistoria elétrica',interv:365},
      { nome:'Extintores',      interv:365 },
      ..._revis,
    ];
    el.innerHTML = itens.map(r => {
      const ultima = _all.filter(m => m.status==='concluido' && Utils.normalize(m.titulo).includes(Utils.normalize(r.nome).slice(0,6))).sort((a,b)=>(b.dt||'').localeCompare(a.dt||''))[0];
      const ultDt  = ultima?.dt ? new Date(ultima.dt.replace(/-/g,'/')) : null;
      const prox   = ultDt ? new Date(ultDt.getTime() + r.interv * 86400000) : null;
      const dias   = prox ? Math.round((prox - hoje) / 86400000) : null;
      const cor    = dias === null ? 'ink-3' : dias < 0 ? 'danger' : dias <= 30 ? 'warning' : 'success-dk';
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1">
          <div style="font-weight:700;font-size:var(--fs-sm)">${Utils.esc(r.nome)}</div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3)">A cada ${r.interv}d${ultima ? ` · Última: ${Utils.fmtDate(ultima.dt)}` : ' · Sem registro'}</div>
        </div>
        <span class="badge" style="color:var(--${cor});background:var(--${cor==='success-dk'?'success-lt':cor==='warning'?'warning-lt':'danger-lt'});border:1px solid var(--${cor})">
          ${dias === null ? '—' : dias < 0 ? `Vencida ${Math.abs(dias)}d` : dias === 0 ? 'Hoje!' : `${dias}d`}
        </span>
      </div>`;
    }).join('');
  };

  /* ── Form Chamado ── */
  const openForm = async (id = null) => {
    const m  = id ? _all.find(x => x.id === id) : null;
    const fornOpts = _fornec.map(f => `<option value="${f.id}" ${m?.fornecedorId===f.id?'selected':''}>${Utils.esc(f.nome)}</option>`).join('');
    const html = `
      <div class="modal-header">
        <div class="modal-title">${id ? '✏️ Editar Chamado' : '🔧 Novo Chamado'}</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom:var(--sp-md)">
          <label class="form-label">Problema <span class="required">*</span></label>
          <input class="form-input" id="mnTit" value="${Utils.esc(m?.titulo||'')}" placeholder="Ex: Torneira com vazamento">
        </div>
        <div class="form-row c3">
          <div class="form-group">
            <label class="form-label">Local</label>
            <input class="form-input" id="mnLoc" value="${Utils.esc(m?.local||'')}" placeholder="Ex: Cozinha, Sala 2...">
          </div>
          <div class="form-group">
            <label class="form-label">Prioridade</label>
            <select class="form-select" id="mnPri">
              ${['urgente','alta','normal'].map(p=>`<option value="${p}" ${m?.prioridade===p?'selected':''}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Data</label>
            <input class="form-input" type="date" id="mnDt" value="${m?.dt || Utils.today()}">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:var(--sp-md)">
          <label class="form-label">Descrição detalhada</label>
          <textarea class="form-textarea" id="mnDesc">${Utils.esc(m?.desc||'')}</textarea>
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Fornecedor</label>
            <select class="form-select" id="mnForn">
              <option value="">Selecionar...</option>${fornOpts}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Custo (R$)</label>
            <input class="form-input" type="number" step="0.01" id="mnCusto" value="${m?.custo||''}">

      <div class="modal-footer">

        <button class="btn btn-secondary" onclick="Manut.save('${id||''}')">💾 Salvar Chamado</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const save = async id => {

    if (!titulo) { Toast.show('error', 'Descreva o problema!'); return; }
    const obj = {
      id:          id || Utils.uuid(),
      titulo,
      local:       document.getElementById('mnLoc')?.value || '',
      prioridade:  document.getElementById('mnPri')?.value || 'normal',
      dt:          document.getElementById('mnDt')?.value || Utils.today(),
      desc:        document.getElementById('mnDesc')?.value || '',
      fornecedorId:document.getElementById('mnForn')?.value || null,
      custo:       parseFloat(document.getElementById('mnCusto')?.value) || null,
      status:      id ? (_all.find(x=>x.id===id)?.status || 'aberto') : 'aberto',
    };
    await DB.save('manutencao', obj);
    Modal.close('modalSec');
    Toast.show(obj.prioridade==='urgente' ? 'warning' : 'success', `🔧 Chamado ${id?'atualizado':'aberto'}!`);
    await render();
    await Badges.refresh();
  };

  const concluir = async id => {
    const m = _all.find(x => x.id === id); if (!m) return;
    const custo = prompt('Custo da manutenção (R$):', '0');
    const forn  = prompt('Fornecedor / Técnico:', m.fornecedor || '—');
    m.status        = 'concluido';
    m.custo         = parseFloat(custo) || 0;
    m.fornecedor    = forn || '—';

    await DB.save('manutencao', m);

    if (m.custo > 0) {
      await DB.save('gastos', { id: Utils.uuid(), dt: m.dtConclusao, descricao: `Manutenção: ${m.titulo}`, categoria: 'manutencao', valor: m.custo, tipo: 'variavel', itemEstId: null, recorrente: false });

  return { render, openForm, save, concluir, del, openFornecedor, saveFornecedor, delFornecedor };
})();



/* ============================================================
   IMP — Módulo Importar & Exportar (Etapa 10.2/10.3)
   ============================================================ */
const Imp = (() => {
  let _mats = [];

  const render = async () => {
    _mats = await DB.getAll('matriculas');
    document.getElementById('impCSVPreview') && (document.getElementById('impCSVPreview').innerHTML = '');
    document.getElementById('impPDFPreview') && (document.getElementById('impPDFPreview').innerHTML = '');
    document.getElementById('impMigrResult') && (document.getElementById('impMigrResult').innerHTML = '');
  };

  /* ── Helpers CSV ── */
  const _parseCSVLine = line => {
    const r = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { r.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    r.push(cur.trim());
    return r;
  };

  /* ── DROP / LOAD CSV ── */
  const dropCSV = e => {
    e.preventDefault();
    document.getElementById('impDropCSV')?.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) { const fake = { files: [f] }; loadCSV(fake); }
  };

  const loadCSV = inp => {
    const f = inp.files?.[0]; if (!f) return;
    const raw = f.name.toLowerCase();
    if (raw.endsWith('.xlsx') || raw.endsWith('.xls')) {
      Toast.show('error', '⚠️ Arquivo Excel detectado! Salve como CSV UTF-8 e tente novamente.');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => _processCSV(e.target.result);
    reader.readAsText(f, 'utf-8');
  };

  const _processCSV = raw => {
    const lines = raw.replace(/\r/g, '').split('\n').filter(l => l.trim());
    if (lines.length < 2) { Toast.show('warning', 'CSV sem dados!'); return; }

    // Detecta se a primeira linha é cabeçalho
    const isHeader = isNaN(lines[0].split(',')[0]) || lines[0].toLowerCase().includes('nome');
    const start    = isHeader ? 1 : 0;
    const rows     = []; const erros = [];

    for (let i = start; i < lines.length; i++) {
      const cols = _parseCSVLine(lines[i]);
      if (!cols[0]?.trim()) continue;
      const nome = cols[0].trim();
      const palavras = nome.split(/\s+/).filter(Boolean);
      if (palavras.length < 2) { erros.push({ linha: i+1, cols, motivo: 'Nome incompleto (mínimo 2 palavras)' }); continue; }

      // Detecta nascimento
      let nasc = '';
      const ns = (cols[1] || '').trim();
      if (ns.includes('/')) {
        const p = ns.split('/');
        nasc = `${(p[2]||'').slice(0,4)}-${(p[1]||'').padStart(2,'0')}-${(p[0]||'').padStart(2,'0')}`;
      } else if (ns.includes('-')) { nasc = ns.split('T')[0]; }

      // Sala sugerida por idade
      let turma = 's1';
      if (nasc) {
        const anos = new Date().getFullYear() - parseInt(nasc.slice(0,4));
        if (anos >= 2) turma = 's3'; else if (anos >= 1) turma = 's2';
      }

      rows.push({
        id: Utils.uuid(), nome, apelido: '', turma, nasc,
        cpf:      (cols[2] || '').trim(),
        mae:      (cols[4] || '').trim(),
        cpfMae:   (cols[5] || '').trim(),
        telMae:   (cols[6] || '').trim(),
        emailMae: '',
        pai:      (cols[7] || '').trim(),
        cpfPai:   (cols[8] || '').trim(),
        telPai:   (cols[9] || '').trim(),
        emailPai: '',
        alergias: [], obs: '', st: 'interessado',
        diaVenc: 10, dtCadastro: Utils.today(),
        docs: {
          img:      (cols[10]||'').toLowerCase() === 'ok',
          quest:    (cols[11]||'').toLowerCase() === 'ok',
          contrato: (cols[12]||'').toLowerCase() === 'ok',
          rg:       (cols[13]||'').toLowerCase() === 'ok',
          vacina:   (cols[14]||'').toLowerCase() === 'ok',
        },
        foto: null,
      });
    }

    // Detecta duplicatas
    const jaExistem = new Set(_mats.map(m => Utils.normalize(m.nome)));
    const novos  = rows.filter(r => !jaExistem.has(Utils.normalize(r.nome)));
    const dupls  = rows.filter(r => jaExistem.has(Utils.normalize(r.nome)));

    const el = document.getElementById('impCSVPreview');
    if (!el) return;

    if (!rows.length && !erros.length) { el.innerHTML = '<div class="info-box warning">Nenhum aluno encontrado no CSV.</div>'; return; }

    el.innerHTML = `
      <div class="info-box teal" style="margin-bottom:10px">
        ✅ <b>${novos.length}</b> novo(s) para importar
        ${dupls.length ? ` · <span style="color:var(--warning)">⚠️ ${dupls.length} duplicata(s) ignorada(s)</span>` : ''}
        ${erros.length ? ` · <span style="color:var(--danger)">❌ ${erros.length} erro(s)</span>` : ''}
      </div>
      ${novos.length ? `
        <div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:10px">
          <table style="width:100%"><thead><tr><th>Nome</th><th>Sala</th><th>Nasc.</th><th>Mãe</th></tr></thead>
          <tbody>${novos.map(r=>`<tr><td style="font-weight:700">${Utils.esc(r.nome)}</td><td>${Utils.salaLabel(r.turma)}</td><td>${Utils.fmtDate(r.nasc)}</td><td>${Utils.esc(r.mae||'—')}</td></tr>`).join('')}</tbody>
          </table>
        </div>
        <button class="btn btn-secondary" onclick="Imp._confirmarCSV(${JSON.stringify(novos).replace(/"/g,'&quot;')})">✅ Importar ${novos.length} aluno(s)</button>` : ''}
      ${erros.length ? `
        <div style="margin-top:8px">
          <div style="font-weight:700;color:var(--danger);font-size:var(--fs-sm);margin-bottom:4px">Linhas com erro:</div>
          ${erros.map(e=>`<div style="font-size:var(--fs-xs);padding:4px;background:var(--danger-lt);border-radius:var(--r-sm);margin-bottom:3px">Linha ${e.linha}: ${Utils.esc(e.cols[0]||'?')} — <b>${e.motivo}</b></div>`).join('')}
        </div>` : ''}`;
  };

  const _confirmarCSV = async rows => {
    let count = 0;
    for (const r of rows) {
      await DB.save('matriculas', r);
      count++;
    }
    Toast.show('success', `✅ ${count} aluno(s) importado(s)!`);
    document.getElementById('impCSVPreview').innerHTML = `<div class="info-box success">✅ ${count} aluno(s) importados com sucesso!</div>`;
    _mats = await DB.getAll('matriculas');
    await Badges.refresh();
  };

  /* ── DROP / LOAD PDFs ── */
  const dropPDF = e => {
    e.preventDefault();
    document.getElementById('impDropPDF')?.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files);
    if (files.length) loadPDFs({ files });
  };

  const loadPDFs = async inp => {
    const files = Array.from(inp.files || []); if (!files.length) return;
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[_\s]+/g,' ').trim();
    const TIPOS_MAP = {
      contrato:'contrato', questionario:'questionario', autorizacao:'autorizacao',
      imagem:'autorizacao', cartvac:'vacina', vacina:'vacina', rg:'rg',
      certidao:'certidao', id:'rg',
    };
    const el = document.getElementById('impPDFPreview');
    const resultados = [];
    let prog = 0;
    if (el) el.innerHTML = `<div class="progress-bar"><div class="progress-fill teal" id="impPDFBar" style="width:0%"></div></div>`;

    for (const f of files) {
      prog++;
      const bar = document.getElementById('impPDFBar');
      if (bar) bar.style.width = `${Math.round(prog/files.length*100)}%`;

      const nmClean = norm(f.name.replace(/\.pdf$|\.jpg$|\.jpeg$|\.png$/i,''));
      // Detecta tipo
      let tipo = 'outros';
      for (const [key, val] of Object.entries(TIPOS_MAP)) {
        if (nmClean.startsWith(norm(key)) || nmClean.includes(`_${norm(key)}`)) { tipo = val; break; }
      }
      // Detecta aluno pelo nome do arquivo
      let bestId = null, bestScore = 0;
      _mats.forEach(m => {
        const words = norm(m.nome).split(' ').filter(p => p.length > 2);
        const score = words.filter(p => nmClean.includes(p)).length;
        if (score > bestScore) { bestScore = score; bestId = m.id; }
      });

      // Lê o arquivo como base64
      const b64 = await new Promise(res => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.readAsDataURL(f);
      });

      await DB.save('documentos', {
        id: Utils.uuid(), alunoId: bestId, tipo,
        nome: f.name, tamanho: `${Math.round(f.size/1024)}KB`,
        dtUpload: Utils.today(), blob: b64,
      });
      const mat = _mats.find(m => m.id === bestId);
      resultados.push({ nome: f.name, tipo, aluno: mat?.nome.split(' ').slice(0,2).join(' ') || '(não identificado)', ok: !!bestId });
    }

    if (el) el.innerHTML = `
      <div class="info-box success" style="margin-bottom:8px">✅ ${resultados.length} arquivo(s) importado(s)</div>
      <div style="max-height:160px;overflow-y:auto">
        ${resultados.map(r=>`<div style="font-size:var(--fs-xs);padding:3px 0;border-bottom:1px solid var(--border);display:flex;gap:6px">
          <span style="color:${r.ok?'var(--success-dk)':'var(--warning)'}">${r.ok?'✅':'⚠️'}</span>
          <span style="flex:1">${Utils.esc(r.nome)}</span>
          <span style="color:var(--ink-3)">${r.aluno}</span>
        </div>`).join('')}
      </div>`;
    Toast.show('success', `📄 ${resultados.length} arquivo(s) vinculado(s)!`);
    await Badges.refresh();
  };

  /* ── Migração v3.2 ── */
  const migrarV32 = async () => {
    if (!confirm('Migrar dados do sistema v3.2 (localStorage) para esta versão?')) return;
    const raw = localStorage.getItem('bsm_v32') || localStorage.getItem('bsm_v3');
    if (!raw) { Toast.show('warning', '⚠️ Nenhum dado da v3.2 encontrado no localStorage.'); return; }

    let db32;
    try { db32 = JSON.parse(raw); } catch { Toast.show('error', 'Erro ao ler dados da v3.2.'); return; }

    let counts = { matriculas: 0, mensalidades: 0, gastos: 0, docs: 0 };

    // Matriculas → matriculas (mapeamento de schema)
    const mats32 = db32.matriculas || [];
    const existentes = new Set((await DB.getAll('matriculas')).map(m => Utils.normalize(m.nome)));
    for (const m of mats32) {
      if (existentes.has(Utils.normalize(m.nome))) continue;
      await DB.save('matriculas', {
        id: Utils.uuid(), nome: m.nome || '', apelido: m.apelido || '',
        turma: m.turma || 's1', nasc: m.nasc || '', cpf: m.cpf || '',
        ts: m.ts || '', plano: m.plano || '', ped: m.ped || '', telPed: m.telPed || '',
        mae: m.mae || '', cpfMae: m.cpfMae || '', telMae: m.telMae || '', emailMae: m.emailMae || '',
        pai: m.pai || '', cpfPai: m.cpfPai || '', telPai: m.telPai || '', emailPai: m.emailPai || '',
        alergias: m.alergias || [], obs: m.obs || '',
        st: m.st || 'matriculado', diaVenc: m.diaVenc || 10,
        dtCadastro: m.dt || Utils.today(),
        docs: m.docs || { img:false, quest:false, contrato:false, rg:false, vacina:false },
        foto: null,
      });
      counts.matriculas++;
    }

    // Mensalidades
    const novasMats = await DB.getAll('matriculas');
    const mens32 = db32.mens || [];
    for (const m of mens32) {
      // Encontra id do aluno na nova base
      const mat32 = mats32.find(a => a.id === m.aId);
      if (!mat32) continue;
      const novaMat = novasMats.find(a => Utils.normalize(a.nome) === Utils.normalize(mat32.nome));
      if (!novaMat) continue;
      await DB.save('mensalidades', {
        id: Utils.uuid(), alunoId: novaMat.id, parcela: m.p || 1,
        ref: m.ref || '', vencimento: m.venc || '', valor: m.val || 0,
        valorPago: m.vPago || null, st: m.st || 'pendente',
        dtPago: m.pago || null, forma: m.forma || null,
      });
      counts.mensalidades++;
    }

    // Gastos
    const gastos32 = db32.gastos || [];
    for (const g of gastos32) {
      await DB.save('gastos', {
        id: Utils.uuid(), dt: g.dt || Utils.today(), descricao: g.desc || '',
        categoria: g.cat || 'outros', valor: g.val || 0, tipo: 'variavel',
        itemEstId: null, recorrente: false,
      });
      counts.gastos++;
    }

    const el = document.getElementById('impMigrResult');
    if (el) el.innerHTML = `<div class="info-box success">
      ✅ Migração concluída!<br>
      Matrículas: <b>${counts.matriculas}</b> · Mensalidades: <b>${counts.mensalidades}</b> · Gastos: <b>${counts.gastos}</b>
    </div>`;
    Toast.show('success', `✅ Migração concluída! ${counts.matriculas} matrículas, ${counts.mensalidades} mensalidades.`);
    await Badges.refresh();
  };

  /* ── Modelos CSV ── */
  const MODELOS = {
    alunos: 'Nome,Data Nasc.,CPF,Idade,Mãe,CPF Mãe,Tel Mãe,Pai,CPF Pai,Tel Pai,Aut.Img,Quest.,Contrato,Id.Criança,Cart.Vacina,Id.Resp.\nOliver Gabriel Silva,16/01/2024,097.564.831-34,2 anos,Cassia Gabriela,702.928.901-33,(62) 9 9502-2541,Fabio Alves,704.345.991-58,(62) 9 9437-1111,ok,ok,ok,ok,ok,ok',
    mensalidades: 'Aluno,Referência,Vencimento,Valor Pago,Forma\nOliver Gabriel,Mai/2026,2026-05-10,812.00,PIX',
    gastos: 'Data,Descrição,Categoria,Valor\n2026-05-02,Arroz 15kg,cozinha,105.00',
    funcionarios: 'Nome,Cargo,Turno,Salário,Telefone\nMaria Silva,Educadora,Integral,1600.00,(62) 9 9000-0000',
  };

  const dlModelo = tipo => {
    Utils.downloadCSV(['\uFEFF' + (MODELOS[tipo] || '')], `modelo_${tipo}.csv`);
    Toast.show('success', `Modelo de ${tipo} baixado!`);
  };

  /* ── Exportações ── */
  const exportJSON = async () => {
    const data = await DB.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `backup-bsm-${Utils.today()}.json`;
    a.click();
    Toast.show('success', '💾 Backup exportado!');
  };

  const restoreJSON = async inp => {
    const f = inp.files?.[0]; if (!f) return;
    if (!confirm('Restaurar backup? Todos os dados atuais serão SUBSTITUÍDOS.')) { inp.value=''; return; }
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const data = JSON.parse(e.target.result);
        await DB.importAll(data);
        Toast.show('success', '✅ Backup restaurado!');
        setTimeout(() => location.reload(), 1500);
      } catch { Toast.show('error', 'Arquivo de backup inválido!'); }
    };
    reader.readAsText(f);
  };

  const exportCSVAlunos = async () => {
    const mats = await DB.getAll('matriculas');
    const rows = ['\uFEFFNome,Apelido,Sala,Status,Nascimento,CPF,Mãe,Tel Mãe,Email Mãe,Pai,Tel Pai,Alergias,Obs,Cadastro'];
    mats.forEach(m => rows.push(`"${m.nome}","${m.apelido||''}","${Utils.salaLabel(m.turma)}","${m.st}","${Utils.fmtDate(m.nasc)}","${m.cpf||''}","${m.mae||''}","${m.telMae||''}","${m.emailMae||''}","${m.pai||''}","${m.telPai||''}","${(m.alergias||[]).join('|')}","${(m.obs||'').replace(/"/g,"'")}","${Utils.fmtDate(m.dtCadastro)}"`));
    Utils.downloadCSV(rows, `alunos_${Utils.today()}.csv`);
    Toast.show('success', 'CSV de alunos exportado!');
  };

  const exportCSVMens = async () => {
    const [mens, mats] = await Promise.all([DB.getAll('mensalidades'), DB.getAll('matriculas')]);
    const rows = ['\uFEFFAluno,Sala,Referência,Vencimento,Valor,Valor Pago,Status,Pago em,Forma'];
    mens.forEach(m => {
      const mat = mats.find(a => a.id === m.alunoId) || {};
      rows.push(`"${mat.nome||'—'}","${Utils.salaLabel(mat.turma)}","${m.ref}","${Utils.fmtDate(m.vencimento)}","${(m.valor||0).toFixed(2)}","${(m.valorPago||0).toFixed(2)}","${m.st}","${Utils.fmtDate(m.dtPago)}","${m.forma||''}"`);
    });
    Utils.downloadCSV(rows, `mensalidades_${Utils.today()}.csv`);
    Toast.show('success', 'CSV de mensalidades exportado!');
  };

  const exportCSVGastos = async () => {
    const gastos = await DB.getAll('gastos');
    const rows = ['\uFEFFData,Descrição,Categoria,Tipo,Valor,Observação'];
    gastos.sort((a,b)=>(b.dt||'').localeCompare(a.dt||'')).forEach(g => {
      rows.push(`"${Utils.fmtDate(g.dt)}","${g.descricao||''}","${g.categoria||''}","${g.tipo||'variavel'}","${(g.valor||0).toFixed(2)}","${(g.obs||'').replace(/"/g,"'")}"`);
    });
    Utils.downloadCSV(rows, `gastos_${Utils.today()}.csv`);
    Toast.show('success', 'CSV de gastos exportado!');
  };

  return {
    render, dropCSV, loadCSV, _confirmarCSV,
    dropPDF, loadPDFs,
    migrarV32, dlModelo,
    exportJSON, restoreJSON,
    exportCSVAlunos, exportCSVMens, exportCSVGastos,
  };
})();

/* ============================================================
   PWA — Service Worker + Install Prompt (Etapa 10.4)
   ============================================================ */
const PWA = (() => {
  let _deferredPrompt = null;

  const init = () => {
    // Captura o evento de instalação
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      _deferredPrompt = e;
      _showInstallBtn();
    });

    window.addEventListener('appinstalled', () => {
      _deferredPrompt = null;
      Toast.show('success', '✅ App instalado com sucesso!');
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) btn.style.display = 'none';
    });

    // Registra Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('#').catch(() => {});
    }
  };

  const _showInstallBtn = () => {
    let btn = document.getElementById('pwaInstallBtn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'pwaInstallBtn';
      btn.className = 'btn btn-secondary btn-sm';
      btn.style.cssText = 'position:fixed;bottom:80px;right:16px;z-index:9000;box-shadow:var(--shadow-lg)';
      btn.innerHTML = '📲 Instalar App';
      btn.onclick = install;
      document.body.appendChild(btn);
    }
    btn.style.display = 'flex';
  };

  const install = async () => {
    if (!_deferredPrompt) { Toast.show('info', 'Para instalar, use o menu do navegador → "Adicionar à tela inicial".'); return; }
    _deferredPrompt.prompt();
    const { outcome } = await _deferredPrompt.userChoice;
    _deferredPrompt = null;
    if (outcome === 'accepted') Toast.show('success', '✅ Instalando...');
  };

  return { init, install };
})();

/* ============================================================
   POLISH — Acessibilidade, Tooltips, Atalhos (Etapa 10.5)
   ============================================================ */
const Polish = (() => {
  const init = () => {
    _initTooltips();
    _initKeyboard();
    _initFocusVisible();
    _patchAria();
  };

  /* Tooltips simples para botões ícone */
  const _initTooltips = () => {
    document.addEventListener('mouseover', e => {
      const btn = e.target.closest('button[title]');
      if (!btn || btn.textContent.trim().length > 2) return;
      // Botão só com ícone — deixa o title nativo funcionar
    });
  };

  /* Atalhos de teclado globais */
  const _initKeyboard = () => {
    document.addEventListener('keydown', e => {
      // Ctrl+K → foco na busca do módulo ativo
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        const search = document.querySelector('.page.active .search-input');
        if (search) { search.focus(); search.select(); }
      }
      // Ctrl+N → Nova matrícula
      if ((e.ctrlKey || e.metaKey) && e.key === 'n' && !e.shiftKey) {
        const active = document.querySelector('.page.active')?.id;
        if (active === 'page-matriculas') { e.preventDefault(); Matriculas.openWizard(); }
      }
    });
  };

  /* Focus visible para acessibilidade */
  const _initFocusVisible = () => {
    document.body.classList.add('using-mouse');
    document.addEventListener('keydown', () => document.body.classList.remove('using-mouse'));
    document.addEventListener('mousedown', () => document.body.classList.add('using-mouse'));
  };

  /* Adiciona aria-labels em botões que só têm emoji */
  const _patchAria = () => {
    const ARIA = {
      '✏️': 'Editar', '🗑️': 'Excluir', '🖨️': 'Imprimir', '💬': 'WhatsApp',
      '📋': 'Histórico', '📎': 'Anexo', '⬇️': 'Baixar', '👁️': 'Visualizar',
      '✓': 'Confirmar pagamento', '→': 'Avançar status',
    };
    document.querySelectorAll('button:not([aria-label])').forEach(btn => {
      const txt = btn.textContent.trim();
      if (ARIA[txt]) btn.setAttribute('aria-label', ARIA[txt]);
    });
  };

  /* Loading skeleton para listas */
  const skeleton = (rows = 3) => Array.from({ length: rows }, () =>
    `<div class="skeleton-row"><div class="skeleton-cell w-40"></div><div class="skeleton-cell w-20"></div><div class="skeleton-cell w-30"></div></div>`
  ).join('');

  return { init, skeleton };
})();



/* ============================================================
   AUTH v5.0 — Autenticação, Perfis e Permissões
   Design: card branco, logo real, lista de usuários (Florescer-style)
   ============================================================ */
const Auth = (() => {

  // ── Permissões por perfil ─────────────────────────────────
  const PERMS = {
    master: {
      pages: ['dashboard','matriculas','alunos','presenca','documentos',
              'mensalidades','cobracas','recibos','gastos','estoque',
              'uniforme','agenda','cozinha','funcionarios','manutencao',
              'pedagogico','paineltv','usuarios','importar','config'],
      write: '*', salas: '*',
    },
    diretora: {
      pages: ['dashboard','matriculas','alunos','presenca','documentos',
              'agenda','cozinha','funcionarios','manutencao','pedagogico','paineltv'],
      write: ['presenca','documentos','agenda','cozinha','manutencao','pedagogico'],
      salas: '*',
    },
    professor: {
      pages: ['dashboard','alunos','presenca','documentos',
              'agenda','cozinha','pedagogico','paineltv'],
      write: ['presenca','pedagogico'], salas: 'propria',
    },
    cozinha: {
      pages: ['agenda','cozinha','estoque','paineltv'],
      write: ['cozinha','estoque'], salas: '*',
    },
  };

  const PERFIL_META = {
    master:    { label:'Master',    cargo:'Administrador',  cor:'#12586A', ico:'⚙️'  },
    diretora:  { label:'Diretora',  cargo:'Direção',        cor:'#6B46C1', ico:'📊'  },
    professor: { label:'Professor', cargo:'Educadora',      cor:'#1565C0', ico:'📚'  },
    cozinha:   { label:'Cozinha',   cargo:'Cozinheira',     cor:'#1A7A4A', ico:'🍽️' },
  };

  // ── Hash djb2 ────────────────────────────────────────────
  const _hash = str => {
    let h = 5381;
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) + h) + str.charCodeAt(i);
      h = h & h;
    }
    return String(Math.abs(h) + str.length * 997);
  };

  let _sessao = null;
  let _usuarioSel = null;

  // ── Cores de avatar ───────────────────────────────────────
  const AV_CORES = ['#1565C0','#7C5CBF','#1A7A4A','#E8644A','#F59E0B','#E05A8A','#12586A','#9B2335'];
  function _avCor(id) {
    let h = 0;
    for (const ch of String(id)) h = (h << 5) - h + ch.charCodeAt(0) | 0;
    return AV_CORES[Math.abs(h) % AV_CORES.length];
  }

  // ── Abre a tela de login ──────────────────────────────────
  const _mostrarLogin = async () => {
    // Oculta o app quando mostra o login
    const app = document.querySelector('.app');
    if (app) { app.style.display = 'none'; app.style.visibility = 'hidden'; }
    document.body.classList.add('login-active');
    const el = document.getElementById('bsmLogin');
    if (!el) return;
    el.style.display = 'flex';
    el.style.opacity = '1';
    await renderWelcome();
  };

  const _fecharLogin = () => {
    const el = document.getElementById('bsmLogin');
    if (!el) return;
    el.style.transition = 'opacity .35s ease';
    el.style.opacity = '0';
    // Mostra o app imediatamente (não espera a animação)
    const app = document.querySelector('.app');
    if (app) { app.style.display = 'flex'; app.style.visibility = 'visible'; }
    setTimeout(() => {
      el.style.display = 'none';
      el.style.opacity = '1';
      document.body.classList.remove('login-active');
    }, 350);
  };

  // ── Renderiza lista de usuários (Step 1) ─────────────────
  const renderWelcome = async () => {
    // Volta sempre para step 1
    _irStep1(false);

    const usuarios = await DB.getAll('usuarios');
    const ativos   = usuarios.filter(u => u.ativo !== false);
    const list     = document.getElementById('blgUserList');
    if (!list) return;

    if (!ativos.length) {
      list.innerHTML = `<div class="blg-loading" style="color:#E8644A">
        Nenhum usuário cadastrado.<br>
        <small>Verifique o banco de dados.</small>
      </div>`;
      return;
    }

    list.innerHTML = ativos.map(u => {
      const meta = PERFIL_META[u.perfil] || PERFIL_META.professor;
      const cor  = _avCor(u.id);
      const ini  = u.nome.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
      const nome1 = Utils.esc(u.nome.split(' ')[0]);
      return `
        <button class="blg-user-item" onclick="Auth._selecionarUser('${u.id}')">
          <div class="blg-user-av" style="background:${cor}">${ini}</div>
          <div class="blg-user-emoji">${meta.ico||'👤'}</div>
          <div class="blg-user-info">
            <div class="blg-user-nome">${nome1}</div>
            <div class="blg-user-cargo-row">
              <span>${meta.cargo||meta.label||u.perfil}</span>
            </div>
          </div>
          <div class="blg-user-arrow">›</div>
        </button>`;
    }).join('');
  };

  // ── Seleciona usuário → vai direto para a senha ───────────
  const _selecionarUser = async id => {
    _usuarioSel = await DB.get('usuarios', id);
    if (!_usuarioSel) return;
    _irStep2();
  };

  // ── Navegação entre steps ────────────────────────────────
  const _irStep1 = (anima = true) => {
    const s1 = document.getElementById('blgStep1');
    const s2 = document.getElementById('blgStep2');
    if (s1) s1.style.display = 'block';
    if (s2) s2.style.display = 'none';
    _usuarioSel = null;
  };

  const _irStep2 = () => {
    if (!_usuarioSel) return;
    const meta = PERFIL_META[_usuarioSel.perfil] || PERFIL_META.professor;
    const cor  = _avCor(_usuarioSel.id);
    const ini  = _usuarioSel.nome.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();

    // Preenche card do usuário
    const info = document.getElementById('blgSelectedInfo');
    if (info) info.innerHTML = `
      <div class="blg-sel-av" style="background:${cor}">${ini}</div>
      <div>
        <div class="blg-sel-nome">${Utils.esc(_usuarioSel.nome)}</div>
        <div class="blg-sel-cargo">${meta.ico} ${meta.cargo}</div>
      </div>`;

    // Limpa PIN
    [0,1,2,3].forEach(i => {
      const el = document.getElementById(`blgP${i}`);
      if (el) { el.value = ''; el.classList.remove('filled'); }
    });
    const erro = document.getElementById('blgPinErro');
    if (erro) erro.textContent = '';
    const btn = document.getElementById('blgEnterBtn');
    if (btn) btn.disabled = true;

    // Troca steps
    const s1 = document.getElementById('blgStep1');
    const s2 = document.getElementById('blgStep2');
    if (s1) s1.style.display = 'none';
    if (s2) s2.style.display = 'block';

    // Foca no primeiro dígito
    setTimeout(() => document.getElementById('blgP0')?.focus(), 100);
  };

  const _voltarStep1 = () => {
    _irStep1();
    _usuarioSel = null;
  };

  // ── PIN ───────────────────────────────────────────────────
  const _pinTick = idx => {
    const el = document.getElementById(`blgP${idx}`);
    if (!el) return;
    if (el.value.length > 1) el.value = el.value.slice(-1);
    el.classList.toggle('filled', el.value.length === 1);

    // Avança foco
    if (el.value.length === 1 && idx < 3)
      document.getElementById(`blgP${idx+1}`)?.focus();

    // Habilita botão quando 4 dígitos
    const todos = [0,1,2,3].map(i => document.getElementById(`blgP${i}`)?.value || '');
    const cheio = todos.every(v => v.length === 1);
    const btn = document.getElementById('blgEnterBtn');
    if (btn) btn.disabled = !cheio;

    // Auto confirma
    if (cheio) setTimeout(_confirmarLogin, 150);
  };

  const _pinKey = (e, idx) => {
    if (e.key === 'Backspace') {
      const el = document.getElementById(`blgP${idx}`);
      if (el && !el.value && idx > 0)
        document.getElementById(`blgP${idx-1}`)?.focus();
    }
    if (e.key === 'Enter') _confirmarLogin();
  };

  // ── Confirma login ────────────────────────────────────────
  const _confirmarLogin = async () => {
    if (!_usuarioSel) return;
    const pin = [0,1,2,3].map(i => document.getElementById(`blgP${i}`)?.value || '').join('');
    if (pin.length < 4) return;

    const btn = document.getElementById('blgEnterBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }

    if (_hash(pin) !== _usuarioSel.senha) {
      const erro = document.getElementById('blgPinErro');
      if (erro) erro.textContent = '❌ Senha incorreta. Tente novamente.';
      [0,1,2,3].forEach(i => {
        const el = document.getElementById(`blgP${i}`);
        if (el) { el.value = ''; el.classList.remove('filled'); }
      });
      document.getElementById('blgP0')?.focus();
      if (btn) { btn.disabled = true; btn.textContent = 'Entrar'; }
      return;
    }

    // ✅ Correto
    _sessao = {
      id: Utils.uuid(),
      usuarioId: _usuarioSel.id,
      nome:      _usuarioSel.nome,
      perfil:    _usuarioSel.perfil,
      salaId:    _usuarioSel.salaId,
      loginEm:   new Date().toISOString(),
    };
    await DB.save('sessao', { id: 'atual', ..._sessao });
    _aplicarPerfil();
    _fecharLogin();

    // Saudação especial para o Weyner (criador do sistema)
    const ehWeyner = _sessao.nome.toLowerCase().includes('weyner');
    setTimeout(async () => {
      await Dashboard.render();
      const saud = ehWeyner
        ? `🌙 Bem-vindo de volta, Weyner! Sistema BSM pronto.`
        : `✅ Bem-vindo(a), ${_sessao.nome.split(' ')[0]}!`;
      Toast.show('success', saud);
    }, 400);
  };

  // ── Aplica filtros de menu por perfil ────────────────────
  const _aplicarPerfil = () => {
    if (!_sessao) return;
    const perm = PERMS[_sessao.perfil] || PERMS.professor;

    // App visível — força display:flex independente
    const app = document.querySelector('.app');
    if (app) { app.style.display = 'flex'; app.style.visibility = 'visible'; }

    // Filtra nav
    document.querySelectorAll('.nav-item[data-page]').forEach(btn => {
      btn.style.display = perm.pages.includes(btn.dataset.page) ? '' : 'none';
    });

    // Labels com data-perm
    document.querySelectorAll('[data-perm]').forEach(el => {
      el.style.display = _sessao.perfil === el.dataset.perm ? '' : 'none';
    });

    _renderTopbarBadge();

    // Atualiza label da versão no sidebar
    const ver = document.querySelector('.sb-ver');
    if (ver) {
      const meta = PERFIL_META[_sessao.perfil];
      ver.textContent = `v5.0 · ${meta?.label || _sessao.perfil}`;
    }
  };

  const _renderTopbarBadge = () => {
    const el = document.getElementById('topbarUserBadge');
    if (!el || !_sessao) return;
    const meta = PERFIL_META[_sessao.perfil] || {};
    const cor  = _avCor(_sessao.usuarioId || _sessao.nome);
    const ini  = _sessao.nome.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
    el.innerHTML = `
      <div class="topbar-user" onclick="Auth.menuUsuario()">
        <div class="topbar-user-ico" style="background:${cor}">${ini}</div>
        <div>
          <div class="topbar-user-name">${Utils.esc(_sessao.nome.split(' ')[0])}</div>
          <div class="topbar-user-cargo">${meta.label || _sessao.perfil}</div>
        </div>
      </div>`;
  };

  // ── Logout ────────────────────────────────────────────────
  const menuUsuario = () => {
    Modal.confirm(`Sair do sistema?\n\nLogado como: ${_sessao?.nome}`, 'Sair')
      .then(ok => { if (ok) logout(); });
  };

  const logout = async () => {
    _sessao = null;
    _usuarioSel = null;
    await DB.remove('sessao', 'atual');
    document.querySelectorAll('.nav-item[data-page]').forEach(b => b.style.display = '');
    const appEl = document.querySelector('.app');
    if (appEl) { appEl.style.display = 'none'; }
    await _mostrarLogin();
  };

  // ── Init ─────────────────────────────────────────────────
  const init = async () => {
    // Garante que o app esteja oculto no início
    const app = document.querySelector('.app');
    if (app) { app.style.display = 'none'; app.style.visibility = 'hidden'; }

    try {
      const s = await DB.get('sessao', 'atual');
      if (s?.usuarioId) {
        const u = await DB.get('usuarios', s.usuarioId);
        if (u && u.ativo !== false) {
          _sessao = s;
          // Mostra o app ANTES de aplicar perfil
          if (app) { app.style.display = 'flex'; app.style.visibility = 'visible'; }
          _aplicarPerfil();
          const el = document.getElementById('bsmLogin');
          if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
          document.body.classList.remove('login-active');
          return true;
        }
      }
    } catch(e) {
      console.warn('BSM init error:', e);
    }

    await _mostrarLogin();
    return false;
  };

  // ── Getters ───────────────────────────────────────────────
  const getSessao       = ()  => _sessao;
  const getPerfil       = ()  => _sessao?.perfil || null;
  const getSalaId       = ()  => _sessao?.salaId || null;
  const podeEscrever    = m   => {
    if (!_sessao) return false;
    const p = PERMS[_sessao.perfil];
    return p?.write === '*' || (Array.isArray(p?.write) && p.write.includes(m));
  };
  const podeFiltrarSala = () => _sessao?.perfil === 'professor';

  return {
    init, logout, menuUsuario, renderWelcome,
    getSessao, getPerfil, getSalaId, podeEscrever, podeFiltrarSala,
    _hash, _selecionarUser, _voltarStep1, _irStep1,
    _pinTick, _pinKey, _confirmarLogin,
    PERMS, PERFIL_META,
  };
})();



/* ============================================================
   USUARIOS v5.0 — CRUD de Usuários e Salas
   ============================================================ */
const Usuarios = (() => {

  const PERFIS = [
    { id: 'master',    label: 'Master',    ico: '⚙️',  cor: '#1A2332' },
    { id: 'diretora',  label: 'Diretora',  ico: '📊',  cor: '#6B46C1' },
    { id: 'professor', label: 'Professor', ico: '📚',  cor: '#1565C0' },
    { id: 'cozinha',   label: 'Cozinha',   ico: '🍽️', cor: '#1A7A4A' },
  ];

  const render = async () => {
    await _renderSalas();
    await _renderUsuarios();
  };

  // ── SALAS ─────────────────────────────────────────────────
  const _renderSalas = async () => {
    const salas = (await DB.getAll('salas')).sort((a,b) => (a.ordem||0)-(b.ordem||0));
    const el = document.getElementById('salasLista');
    if (!el) return;
    el.innerHTML = salas.map(s => `
      <div class="sala-card">
        <div class="sala-cor-dot" style="background:${s.cor}"></div>
        <div class="sala-info">
          <div class="sala-nome">${Utils.esc(s.nome)}${s.apelido ? ` <span style="color:var(--ink-3);font-size:12px">"${Utils.esc(s.apelido)}"</span>` : ''}</div>
          <div class="sala-meta">${Utils.esc(s.faixaEtaria || '')} · ${s.capacidade || 0} vagas</div>
        </div>
        <div class="td-actions">
          <button class="btn btn-ghost btn-xs" onclick="Usuarios.editarSala('${s.id}')">✏️ Editar</button>
          <button class="btn btn-ghost btn-xs" onclick="Usuarios.removerSala('${s.id}')" style="color:var(--danger)">🗑️</button>
        </div>
      </div>`).join('') || '<div class="empty-state" style="padding:20px"><div class="empty-title">Nenhuma sala cadastrada</div></div>';
  };

  const novaSala = () => _formSala(null);
  const editarSala = async id => {
    const s = await DB.get('salas', id);
    if (s) _formSala(s);
  };

  const _formSala = s => {
    const CORES = ['#1565C0','#7C5CBF','#1A7A4A','#E8644A','#F59E0B','#E05A8A','#12586A','#9B2335'];
    Modal.open('modalSec', `
      <div style="padding:var(--sp-lg)">
        <h3 style="font-size:18px;font-weight:700;margin-bottom:var(--sp-lg)">${s ? 'Editar Sala' : 'Nova Sala'}</h3>
        <div class="form-group"><label class="form-label">Nome da Sala *</label>
          <input class="form-input" id="fSalaNome" value="${Utils.esc(s?.nome||'')}" placeholder="Ex: Sala 1"></div>
        <div class="form-group"><label class="form-label">Apelido / Nome especial</label>
          <input class="form-input" id="fSalaApelido" value="${Utils.esc(s?.apelido||'')}" placeholder="Ex: Turma dos Girassóis"></div>
        <div class="form-row c2">
          <div class="form-group"><label class="form-label">Faixa Etária</label>
            <input class="form-input" id="fSalaFaixa" value="${Utils.esc(s?.faixaEtaria||'')}" placeholder="Ex: 4m – 1a"></div>
          <div class="form-group"><label class="form-label">Capacidade</label>
            <input class="form-input" type="number" id="fSalaCap" value="${s?.capacidade||12}" min="1" max="50"></div>
        </div>
        <div class="form-group"><label class="form-label">Cor da Sala</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
            ${CORES.map(cor => `<div onclick="this.parentElement.querySelectorAll('div').forEach(d=>d.style.boxShadow='none');this.style.boxShadow='0 0 0 3px ${cor}55,0 0 0 5px ${cor}';document.getElementById('fSalaCor').value='${cor}'"
              style="width:28px;height:28px;border-radius:50%;background:${cor};cursor:pointer;transition:.15s;${(s?.cor||'#1565C0')===cor?'box-shadow:0 0 0 3px '+cor+'55,0 0 0 5px '+cor+';':''}"></div>`).join('')}
          </div>
          <input type="hidden" id="fSalaCor" value="${s?.cor||'#1565C0'}">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-lg)">
          <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
          <button class="btn btn-secondary" onclick="Usuarios._salvarSala('${s?.id||''}')">💾 Salvar</button>
        </div>
      </div>`);
  };

  const _salvarSala = async id => {
    const nome = document.getElementById('fSalaNome')?.value.trim();
    if (!nome) { Toast.show('error', 'Nome é obrigatório'); return; }
    const salas  = await DB.getAll('salas');
    const existe = id ? await DB.get('salas', id) : null;
    const ordem  = existe?.ordem || salas.length + 1;
    const sala   = {
      id:          id || 's' + Utils.uuid().slice(0,8),
      nome,
      apelido:     document.getElementById('fSalaApelido')?.value.trim() || '',
      faixaEtaria: document.getElementById('fSalaFaixa')?.value.trim()   || '',
      capacidade:  parseInt(document.getElementById('fSalaCap')?.value)   || 12,
      cor:         document.getElementById('fSalaCor')?.value             || '#1565C0',
      ordem,
    };
    await DB.save('salas', sala);
    Modal.close('modalSec');
    Toast.show('success', `✅ Sala "${nome}" salva!`);
    await _renderSalas();
  };

  const removerSala = async id => {
    const s = await DB.get('salas', id);
    if (!s) return;
    // Verifica se há usuários vinculados
    const users = (await DB.getAll('usuarios')).filter(u => u.salaId === id);
    if (users.length) {
      Toast.show('warning', `⚠️ ${users.length} usuário(s) vinculado(s) a esta sala. Remova ou mova primeiro.`);
      return;
    }
    if (!await Modal.confirm(`Remover a sala "${s.nome}"? Esta ação não pode ser desfeita.`)) return;
    await DB.remove('salas', id);
    Toast.show('success', 'Sala removida');
    await _renderSalas();
  };

  // ── USUÁRIOS ──────────────────────────────────────────────
  const _renderUsuarios = async () => {
    const [usuarios, salas] = await Promise.all([DB.getAll('usuarios'), DB.getAll('salas')]);
    const el = document.getElementById('usuariosLista');
    if (!el) return;
    const salaMap = Object.fromEntries(salas.map(s => [s.id, s]));
    el.innerHTML = usuarios.map(u => {
      const meta = Auth.PERFIL_META[u.perfil] || Auth.PERFIL_META.professor;
      const sala = u.salaId ? salaMap[u.salaId] : null;
      const ini  = u.nome.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
      return `
        <div class="user-card">
          <div class="user-avatar" style="background:${meta.cor}">${ini}</div>
          <div class="user-info">
            <div class="user-nome">${Utils.esc(u.nome)}</div>
            <div class="user-meta">${sala ? `🏫 ${Utils.esc(sala.nome)}` : 'Todas as salas'} · ${u.ativo !== false ? '✅ Ativo' : '⛔ Inativo'}</div>
          </div>
          <span class="user-perfil-badge perfil-${u.perfil}">${meta.label}</span>
          <div class="td-actions">
            <button class="btn btn-ghost btn-xs" onclick="Usuarios.editarUsuario('${u.id}')">✏️</button>
            <button class="btn btn-ghost btn-xs" onclick="Usuarios.trocarSenha('${u.id}')">🔑</button>
            ${u.id !== 'master' ? `<button class="btn btn-ghost btn-xs" onclick="Usuarios.toggleAtivo('${u.id}')" style="color:var(--warning)">${u.ativo !== false ? '⛔' : '✅'}</button>` : ''}
          </div>
        </div>`;
    }).join('') || '<div class="empty-state" style="padding:20px"><div class="empty-title">Nenhum usuário</div></div>';
  };

  const novoUsuario  = () => _formUsuario(null);
  const editarUsuario = async id => {
    const u = await DB.get('usuarios', id);
    if (u) _formUsuario(u);
  };

  const _formUsuario = async u => {
    const salas = (await DB.getAll('salas')).sort((a,b)=>a.ordem-b.ordem);
    const PERFS = Auth.PERFIL_META;
    Modal.open('modalMain', `
      <div style="padding:var(--sp-lg);max-width:480px">
        <h3 style="font-size:18px;font-weight:700;margin-bottom:var(--sp-lg)">${u ? 'Editar Usuário' : 'Novo Usuário'}</h3>
        <div class="form-group"><label class="form-label">Nome Completo *</label>
          <input class="form-input" id="fUserNome" value="${Utils.esc(u?.nome||'')}"></div>
        <div class="form-group"><label class="form-label">Perfil *</label>
          <select class="form-select" id="fUserPerfil" onchange="Usuarios._toggleSalaField()">
            ${Object.entries(PERFS).map(([k,v])=>`<option value="${k}" ${u?.perfil===k?'selected':''}>${v.ico} ${v.label}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" id="fUserSalaGroup" style="${u?.perfil==='professor'?'':'display:none'}">
          <label class="form-label">Sala Vinculada</label>
          <select class="form-select" id="fUserSala">
            <option value="">— Todas as salas —</option>
            ${salas.map(s=>`<option value="${s.id}" ${u?.salaId===s.id?'selected':''}>${Utils.esc(s.nome)}</option>`).join('')}
          </select>
        </div>
        ${!u ? `
        <div class="form-group"><label class="form-label">Senha (4 dígitos) *</label>
          <input class="form-input" type="password" inputmode="numeric" maxlength="4" id="fUserSenha" placeholder="••••"></div>
        ` : ''}
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-lg)">
          <button class="btn btn-ghost" onclick="Modal.close('modalMain')">Cancelar</button>
          <button class="btn btn-secondary" onclick="Usuarios._salvarUsuario('${u?.id||''}')">💾 Salvar</button>
        </div>
      </div>`);
  };

  const _toggleSalaField = () => {
    const perfil = document.getElementById('fUserPerfil')?.value;
    const grp    = document.getElementById('fUserSalaGroup');
    if (grp) grp.style.display = perfil === 'professor' ? '' : 'none';
  };

  const _salvarUsuario = async id => {
    const nome   = document.getElementById('fUserNome')?.value.trim();
    const perfil = document.getElementById('fUserPerfil')?.value;
    const salaId = document.getElementById('fUserSala')?.value || null;
    if (!nome) { Toast.show('error', 'Nome é obrigatório'); return; }
    const usuario = id ? (await DB.get('usuarios', id) || {}) : {};
    // Senha só para novos usuários
    if (!id) {
      const senhaRaw = document.getElementById('fUserSenha')?.value || '';
      if (senhaRaw.length < 4) { Toast.show('error', 'Senha precisa ter 4 dígitos'); return; }
      usuario.senha = Auth._hash(senhaRaw);
    }
    Object.assign(usuario, {
      id:         id || Utils.uuid(),
      nome, perfil,
      salaId:     perfil === 'professor' ? salaId : null,
      ativo:      usuario.ativo ?? true,
      dtCadastro: usuario.dtCadastro || Utils.today(),
    });
    await DB.save('usuarios', usuario);
    Modal.close('modalMain');
    Toast.show('success', `✅ Usuário "${nome}" salvo!`);
    await _renderUsuarios();
  };

  const trocarSenha = async id => {
    const u = await DB.get('usuarios', id);
    if (!u) return;
    Modal.open('modalSm', `
      <div style="padding:var(--sp-lg)">
        <h3 style="margin-bottom:var(--sp-md)">🔑 Trocar senha — ${Utils.esc(u.nome)}</h3>
        <div class="form-group"><label class="form-label">Nova Senha (4 dígitos)</label>
          <input class="form-input" type="password" inputmode="numeric" maxlength="4" id="fNovaSenha" placeholder="••••"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-md)">
          <button class="btn btn-ghost" onclick="Modal.close('modalSm')">Cancelar</button>
          <button class="btn btn-secondary" onclick="Usuarios._confirmarSenha('${id}')">💾 Salvar</button>
        </div>
      </div>`);
  };

  const _confirmarSenha = async id => {
    const raw = document.getElementById('fNovaSenha')?.value || '';
    if (raw.length < 4) { Toast.show('error', 'Senha precisa ter 4 dígitos'); return; }
    const u = await DB.get('usuarios', id);
    if (!u) return;
    await DB.save('usuarios', { ...u, senha: Auth._hash(raw) });
    Modal.close('modalSm');
    Toast.show('success', '🔑 Senha alterada com sucesso!');
  };

  const toggleAtivo = async id => {
    const u = await DB.get('usuarios', id);
    if (!u || u.id === 'master') return;
    await DB.save('usuarios', { ...u, ativo: u.ativo === false ? true : false });
    await _renderUsuarios();
    Toast.show('success', u.ativo === false ? '✅ Usuário reativado' : '⛔ Usuário desativado');
  };

  return {
    render, novaSala, editarSala, removerSala,
    novoUsuario, editarUsuario, trocarSenha, toggleAtivo,
    _salvarSala, _salvarUsuario, _confirmarSenha, _toggleSalaField,
  };
})();



/* ============================================================
   PEDAGOGICO v5.0 — Planejamento de Aulas & Estoque de Materiais
   ============================================================ */
const Pedagogico = (() => {

  let _salas = [];
  let _planejamentos = [];
  let _materiais = [];
  let _semana = _semanaAtual();

  function _semanaAtual() {
    const hoje = new Date();
    const dom  = new Date(hoje);
    dom.setDate(hoje.getDate() - hoje.getDay());
    return dom.toISOString().slice(0,10);
  }

  function _addDays(dateStr, n) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }

  function _nomeDia(dateStr) {
    const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const meses= ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const d = new Date(dateStr + 'T12:00:00');
    return `${dias[d.getDay()]} ${d.getDate()}/${meses[d.getMonth()]}`;
  }

  // ── RENDER PRINCIPAL ──────────────────────────────────────
  const render = async () => {
    _salas         = (await DB.getAll('salas')).sort((a,b) => a.ordem - b.ordem);
    _planejamentos = await DB.getAll('planejamentos');
    _materiais     = await DB.getAll('mat_pedagogicos');

    // Restringe sala para professoras
    const salaForcada = Auth.podeFiltrarSala() ? Auth.getSalaId() : null;
    if (salaForcada) {
      _salas = _salas.filter(s => s.id === salaForcada);
    }

    _renderHeader();
    _renderGrid();
    _renderEstoque();
  };

  const _renderHeader = () => {
    const el = document.getElementById('pedHeader');
    if (!el) return;
    const seg = _addDays(_semana, 1);
    const sex = _addDays(_semana, 5);
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="Pedagogico._navSemana(-7)">‹</button>
        <span style="font-weight:700;font-size:15px">${Utils.fmtDate(seg)} – ${Utils.fmtDate(sex)}</span>
        <button class="btn btn-ghost btn-sm" onclick="Pedagogico._navSemana(7)">›</button>
        <button class="btn btn-ghost btn-sm" onclick="Pedagogico._irHoje()">Hoje</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${Auth.getPerfil() !== 'professor' ? `<button class="btn btn-secondary btn-sm" onclick="Pedagogico.novoMaterial()">+ Material</button>` : ''}
        <button class="btn btn-secondary" onclick="Pedagogico.novoPlano()">+ Plano de Aula</button>
      </div>`;
  };

  const _renderGrid = () => {
    const el = document.getElementById('pedGrid');
    if (!el) return;

    const DIAS_UTEIS = [1,2,3,4,5]; // Seg a Sex
    const dias = DIAS_UTEIS.map(d => ({
      label: _nomeDia(_addDays(_semana, d)),
      date:  _addDays(_semana, d),
    }));

    if (!_salas.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-title">Nenhuma sala cadastrada</div><div class="empty-sub">Adicione salas em ⚙️ Usuários</div></div>';
      return;
    }

    el.innerHTML = _salas.map(sala => `
      <div class="card" style="margin-bottom:var(--sp-md)">
        <div class="card-header" style="border-bottom:3px solid ${sala.cor};padding-bottom:8px;margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:12px;height:12px;border-radius:50%;background:${sala.cor}"></div>
            <span style="font-weight:800;font-size:16px">${Utils.esc(sala.nome)}</span>
            ${sala.apelido ? `<span style="font-size:12px;color:var(--ink-3)">${Utils.esc(sala.apelido)}</span>` : ''}
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow-x:auto">
          ${dias.map(dia => {
            const planos = _planejamentos.filter(p => p.salaId === sala.id && p.data === dia.date);
            return `
              <div style="background:var(--bg-2);border-radius:var(--r-md);padding:10px;min-height:100px;border:1px solid var(--border)">
                <div style="font-size:11px;font-weight:700;color:var(--ink-3);margin-bottom:6px;text-align:center">${dia.label}</div>
                ${planos.map(p => `
                  <div style="background:${sala.cor}18;border-left:3px solid ${sala.cor};border-radius:4px;padding:5px 7px;margin-bottom:5px;cursor:pointer" onclick="Pedagogico.verPlano('${p.id}')">
                    <div style="font-size:12px;font-weight:700;color:var(--ink);line-height:1.3">${Utils.esc(p.atividade)}</div>
                    ${p.objetivo ? `<div style="font-size:10px;color:var(--ink-3);margin-top:2px">${Utils.esc(p.objetivo.slice(0,40))}${p.objetivo.length>40?'...':''}</div>` : ''}
                    <div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">
                      <span style="font-size:10px;background:${p.realizado?'var(--success-lt)':'var(--amber-lt)'};color:${p.realizado?'var(--success-dk)':'#B7770D'};border-radius:4px;padding:1px 5px;font-weight:600">${p.realizado?'✅ Realizado':'⏳ Pendente'}</span>
                    </div>
                  </div>`).join('')}
                <button style="width:100%;border:1px dashed var(--border);background:transparent;border-radius:4px;padding:4px;font-size:11px;color:var(--ink-4);cursor:pointer;margin-top:2px" onclick="Pedagogico.novoPlano('${sala.id}','${dia.date}')">+ aula</button>
              </div>`;
          }).join('')}
        </div>
      </div>`).join('');
  };

  const _renderEstoque = () => {
    const el = document.getElementById('pedEstoque');
    if (!el) return;

    const criticos = _materiais.filter(m => (m.quantidade || 0) <= (m.minimo || 0));
    const cats     = [...new Set(_materiais.map(m => m.categoria || 'Geral'))].sort();

    el.innerHTML = `
      <div class="section-title" style="margin-bottom:var(--sp-md)">
        🎨 Estoque de Materiais Pedagógicos
        ${criticos.length ? `<span class="badge badge-danger" style="margin-left:8px">⚠️ ${criticos.length} crítico(s)</span>` : ''}
        ${Auth.getPerfil() !== 'professor' ? `<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="Pedagogico.novoMaterial()">+ Material</button>` : ''}
      </div>
      ${!_materiais.length ? `<div class="empty-state" style="padding:20px"><div class="empty-icon">🎨</div><div class="empty-title">Nenhum material cadastrado</div></div>` :
        cats.map(cat => `
          <div style="margin-bottom:16px">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink-3);letter-spacing:.5px;margin-bottom:6px">${cat}</div>
            ${_materiais.filter(m => (m.categoria||'Geral') === cat).map(m => {
              const pct  = m.quantidade / Math.max(m.minimo || 1, m.quantidade) * 100;
              const cor  = m.quantidade <= 0 ? 'var(--danger)' : m.quantidade <= m.minimo ? 'var(--warning)' : 'var(--teal)';
              const pode = Auth.podeEscrever('pedagogico');
              return `
                <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
                  <div style="flex:1">
                    <div style="font-size:13px;font-weight:600;color:var(--ink)">${Utils.esc(m.nome)}</div>
                    <div style="width:100%;height:4px;background:var(--bg-2);border-radius:2px;overflow:hidden;margin-top:4px">
                      <div style="width:${Math.min(pct,100)}%;height:100%;background:${cor};border-radius:2px;transition:.3s"></div>
                    </div>
                  </div>
                  <div style="text-align:right;min-width:80px">
                    <span style="font-size:16px;font-weight:800;color:${cor};font-family:'Syne',sans-serif">${m.quantidade}</span>
                    <span style="font-size:11px;color:var(--ink-3)"> ${m.unidade||'un'}</span>
                    <div style="font-size:10px;color:var(--ink-4)">mín: ${m.minimo||0}</div>
                  </div>
                  ${pode ? `
                  <div style="display:flex;gap:4px">
                    <button class="btn btn-ghost btn-xs" onclick="Pedagogico.saidaMaterial('${m.id}')">📤</button>
                    <button class="btn btn-ghost btn-xs" onclick="Pedagogico.entradaMaterial('${m.id}')">📥</button>
                    <button class="btn btn-ghost btn-xs" onclick="Pedagogico.editarMaterial('${m.id}')">✏️</button>
                  </div>` : ''}
                </div>`;
            }).join('')}
          </div>`).join('')
      }`;
  };

  // ── NAV SEMANA ────────────────────────────────────────────
  const _navSemana = async (dias) => {
    const d = new Date(_semana);
    d.setDate(d.getDate() + dias);
    _semana = d.toISOString().slice(0,10);
    _planejamentos = await DB.getAll('planejamentos');
    _renderHeader();
    _renderGrid();
  };

  const _irHoje = () => { _semana = _semanaAtual(); _navSemana(0); };

  // ── PLANO DE AULA — CRUD ──────────────────────────────────
  const novoPlano = async (salaId = '', data = '') => {
    const salas = Auth.podeFiltrarSala()
      ? _salas
      : (await DB.getAll('salas')).sort((a,b) => a.ordem - b.ordem);

    Modal.open('modalMain', `
      <div style="padding:var(--sp-lg);max-width:560px">
        <h3 style="font-size:18px;font-weight:700;margin-bottom:var(--sp-lg)">📋 Novo Plano de Aula</h3>
        <div class="form-row c2">
          <div class="form-group"><label class="form-label">Sala *</label>
            <select class="form-select" id="fPedSala" ${Auth.podeFiltrarSala()?'disabled':''}>
              <option value="">— Selecione —</option>
              ${salas.map(s=>`<option value="${s.id}" ${s.id===salaId?'selected':''}>${Utils.esc(s.nome)}</option>`).join('')}
            </select></div>
          <div class="form-group"><label class="form-label">Data *</label>
            <input class="form-input" type="date" id="fPedData" value="${data || Utils.today()}"></div>
        </div>
        <div class="form-group"><label class="form-label">Atividade *</label>
          <input class="form-input" id="fPedAtiv" placeholder="Ex: Pintura com esponja"></div>
        <div class="form-group"><label class="form-label">Objetivo pedagógico</label>
          <input class="form-input" id="fPedObj" placeholder="Ex: Desenvolver coordenação motora e percepção de cores"></div>
        <div class="form-group"><label class="form-label">Materiais necessários</label>
          <input class="form-input" id="fPedMats" placeholder="Ex: Tinta guache (3 cores), esponja (1 por criança), papel A3"></div>
        <div class="form-group"><label class="form-label">Observações</label>
          <textarea class="form-textarea" id="fPedObs" rows="2" placeholder="Adaptações, dificuldades previstas..."></textarea></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-lg)">
          <button class="btn btn-ghost" onclick="Modal.close('modalMain')">Cancelar</button>
          <button class="btn btn-secondary" onclick="Pedagogico._salvarPlano('')">💾 Salvar Plano</button>
        </div>
      </div>`);
  };

  const _salvarPlano = async (id) => {
    const salaId   = document.getElementById('fPedSala')?.value || Auth.getSalaId();
    const data     = document.getElementById('fPedData')?.value;
    const atividade= document.getElementById('fPedAtiv')?.value.trim();
    if (!salaId || !data || !atividade) { Toast.show('error','Sala, data e atividade são obrigatórios'); return; }
    const plano = {
      id:        id || Utils.uuid(),
      salaId, data, atividade,
      objetivo:  document.getElementById('fPedObj')?.value.trim() || '',
      materiais: document.getElementById('fPedMats')?.value.trim() || '',
      obs:       document.getElementById('fPedObs')?.value.trim() || '',
      realizado: false,
      usuarioId: Auth.getSessao()?.usuarioId || '',
      criado:    Utils.today(),
    };
    await DB.save('planejamentos', plano);
    Modal.close('modalMain');
    Toast.show('success','✅ Plano salvo!');
    _planejamentos = await DB.getAll('planejamentos');
    _renderGrid();
  };

  const verPlano = async (id) => {
    const p    = _planejamentos.find(x => x.id === id);
    if (!p) return;
    const sala = _salas.find(s => s.id === p.salaId) || {};
    const pode = Auth.podeEscrever('pedagogico');
    Modal.open('modalMain', `
      <div style="padding:var(--sp-lg);max-width:520px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:var(--sp-lg)">
          <div style="width:10px;height:10px;border-radius:50%;background:${sala.cor||'var(--teal)'}"></div>
          <span style="font-size:12px;color:var(--ink-3)">${Utils.esc(sala.nome||'')} · ${Utils.fmtDate(p.data)}</span>
        </div>
        <h3 style="font-size:20px;font-weight:800;margin-bottom:8px">${Utils.esc(p.atividade)}</h3>
        ${p.objetivo ? `<div class="box box-teal" style="margin-bottom:10px"><div class="box-label">Objetivo</div><p>${Utils.esc(p.objetivo)}</p></div>` : ''}
        ${p.materiais ? `<div class="box box-amber" style="margin-bottom:10px"><div class="box-label">🎨 Materiais</div><p>${Utils.esc(p.materiais)}</p></div>` : ''}
        ${p.obs ? `<div class="box b-blue" style="margin-bottom:10px"><div class="box-label">Observações</div><p>${Utils.esc(p.obs)}</p></div>` : ''}
        <div style="display:flex;gap:8px;margin-top:var(--sp-lg);flex-wrap:wrap">
          ${pode ? `
          <button class="btn ${p.realizado?'btn-ghost':'btn-secondary'}" onclick="Pedagogico._toggleRealizado('${id}')">
            ${p.realizado?'↩️ Marcar como Pendente':'✅ Marcar como Realizado'}
          </button>
          <button class="btn btn-ghost" onclick="Pedagogico._excluirPlano('${id}')">🗑️ Excluir</button>` : ''}
          <button class="btn btn-ghost" onclick="Modal.close('modalMain')" style="margin-left:auto">Fechar</button>
        </div>
      </div>`);
  };

  const _toggleRealizado = async (id) => {
    const p = await DB.get('planejamentos', id);
    if (!p) return;
    await DB.save('planejamentos', { ...p, realizado: !p.realizado });
    Toast.show('success', p.realizado ? 'Marcado como pendente' : '✅ Atividade realizada!');
    Modal.close('modalMain');
    _planejamentos = await DB.getAll('planejamentos');
    _renderGrid();
  };

  const _excluirPlano = async (id) => {
    if (!await Modal.confirm('Excluir este plano de aula?')) return;
    await DB.remove('planejamentos', id);
    Modal.close('modalMain');
    Toast.show('success', 'Plano excluído');
    _planejamentos = await DB.getAll('planejamentos');
    _renderGrid();
  };

  // ── MATERIAIS — CRUD ──────────────────────────────────────
  const novoMaterial = () => _formMaterial(null);
  const editarMaterial = async (id) => {
    const m = await DB.get('mat_pedagogicos', id);
    if (m) _formMaterial(m);
  };

  const CATS_MAT = ['Papel & Cartolina','Tinta & Pincel','Cola & Adesivo','Tesoura & Corte','EVA & Feltro','Giz & Lápis','Argila & Massa','Outros'];

  const _formMaterial = m => {
    Modal.open('modalSec', `
      <div style="padding:var(--sp-lg)">
        <h3 style="font-size:17px;font-weight:700;margin-bottom:var(--sp-lg)">${m?'Editar Material':'Novo Material'}</h3>
        <div class="form-group"><label class="form-label">Nome *</label>
          <input class="form-input" id="fMatNome" value="${Utils.esc(m?.nome||'')}"></div>
        <div class="form-row c2">
          <div class="form-group"><label class="form-label">Categoria</label>
            <select class="form-select" id="fMatCat">
              ${CATS_MAT.map(c=>`<option ${(m?.categoria||'Outros')===c?'selected':''}>${c}</option>`).join('')}
            </select></div>
          <div class="form-group"><label class="form-label">Unidade</label>
            <input class="form-input" id="fMatUnid" value="${Utils.esc(m?.unidade||'un')}" placeholder="un, folha, ml, kg..."></div>
        </div>
        <div class="form-row c2">
          <div class="form-group"><label class="form-label">Quantidade atual</label>
            <input class="form-input" type="number" id="fMatQtd" value="${m?.quantidade||0}" min="0"></div>
          <div class="form-group"><label class="form-label">Quantidade mínima</label>
            <input class="form-input" type="number" id="fMatMin" value="${m?.minimo||5}" min="0"></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-lg)">
          <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
          <button class="btn btn-secondary" onclick="Pedagogico._salvarMaterial('${m?.id||''}')">💾 Salvar</button>
        </div>
      </div>`);
  };

  const _salvarMaterial = async (id) => {
    const nome = document.getElementById('fMatNome')?.value.trim();
    if (!nome) { Toast.show('error','Nome é obrigatório'); return; }
    const mat = {
      id:         id || Utils.uuid(),
      nome,
      categoria:  document.getElementById('fMatCat')?.value || 'Outros',
      unidade:    document.getElementById('fMatUnid')?.value.trim() || 'un',
      quantidade: parseFloat(document.getElementById('fMatQtd')?.value) || 0,
      minimo:     parseFloat(document.getElementById('fMatMin')?.value) || 5,
    };
    await DB.save('mat_pedagogicos', mat);
    Modal.close('modalSec');
    Toast.show('success','✅ Material salvo!');
    _materiais = await DB.getAll('mat_pedagogicos');
    _renderEstoque();
  };

  const saidaMaterial = async (id) => {
    const m = await DB.get('mat_pedagogicos', id);
    if (!m) return;
    Modal.open('modalSm', `
      <div style="padding:var(--sp-lg)">
        <h3 style="margin-bottom:var(--sp-md)">📤 Saída — ${Utils.esc(m.nome)}</h3>
        <div style="background:var(--bg-2);border-radius:var(--r-md);padding:8px 12px;font-size:13px;margin-bottom:10px">
          Estoque atual: <strong>${m.quantidade} ${m.unidade||'un'}</strong>
        </div>
        <div class="form-group"><label class="form-label">Quantidade retirada</label>
          <input class="form-input" type="number" id="fSaidaQtd" min="0.1" step="0.5" value="1"></div>
        <div class="form-group"><label class="form-label">Motivo</label>
          <input class="form-input" id="fSaidaObs" placeholder="Ex: Aula de pintura — Sala 1"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-md)">
          <button class="btn btn-ghost" onclick="Modal.close('modalSm')">Cancelar</button>
          <button class="btn btn-danger" onclick="Pedagogico._confirmarSaida('${id}')">📤 Registrar Saída</button>
        </div>
      </div>`);
  };

  const _confirmarSaida = async (id) => {
    const qtd = parseFloat(document.getElementById('fSaidaQtd')?.value) || 0;
    const obs = document.getElementById('fSaidaObs')?.value.trim() || '';
    if (qtd <= 0) { Toast.show('error','Informe a quantidade'); return; }
    const m = await DB.get('mat_pedagogicos', id);
    if (!m) return;
    if (qtd > m.quantidade) {
      Toast.show('warning',`⚠️ Estoque insuficiente (${m.quantidade} ${m.unidade||'un'})`);
      return;
    }
    await DB.save('mat_pedagogicos', { ...m, quantidade: m.quantidade - qtd });
    await DB.save('mov_pedagogicos', {
      id: Utils.uuid(), itemId: id, tipo: 'saida',
      quantidade: qtd, data: Utils.today(), obs,
      usuarioId: Auth.getSessao()?.usuarioId || '',
    });
    Modal.close('modalSm');
    Toast.show('success', `✅ Saída de ${qtd} ${m.unidade||'un'} registrada`);
    _materiais = await DB.getAll('mat_pedagogicos');
    _renderEstoque();
  };

  const entradaMaterial = async (id) => {
    const m = await DB.get('mat_pedagogicos', id);
    if (!m) return;
    Modal.open('modalSm', `
      <div style="padding:var(--sp-lg)">
        <h3 style="margin-bottom:var(--sp-md)">📥 Entrada — ${Utils.esc(m.nome)}</h3>
        <div class="form-group"><label class="form-label">Quantidade recebida</label>
          <input class="form-input" type="number" id="fEntQtd" min="0.1" step="1" value="10"></div>
        <div class="form-group"><label class="form-label">Observação</label>
          <input class="form-input" id="fEntObs" placeholder="Ex: Compra de material"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-md)">
          <button class="btn btn-ghost" onclick="Modal.close('modalSm')">Cancelar</button>
          <button class="btn btn-secondary" onclick="Pedagogico._confirmarEntrada('${id}')">📥 Registrar Entrada</button>
        </div>
      </div>`);
  };

  const _confirmarEntrada = async (id) => {
    const qtd = parseFloat(document.getElementById('fEntQtd')?.value) || 0;
    const obs = document.getElementById('fEntObs')?.value.trim() || '';
    if (qtd <= 0) { Toast.show('error','Informe a quantidade'); return; }
    const m = await DB.get('mat_pedagogicos', id);
    if (!m) return;
    await DB.save('mat_pedagogicos', { ...m, quantidade: m.quantidade + qtd });
    await DB.save('mov_pedagogicos', {
      id: Utils.uuid(), itemId: id, tipo: 'entrada',
      quantidade: qtd, data: Utils.today(), obs,
      usuarioId: Auth.getSessao()?.usuarioId || '',
    });
    Modal.close('modalSm');
    Toast.show('success', `✅ Entrada de ${qtd} registrada`);
    _materiais = await DB.getAll('mat_pedagogicos');
    _renderEstoque();
  };

  return {
    render, novoPlano, verPlano, novoMaterial, editarMaterial,
    saidaMaterial, entradaMaterial,
    _navSemana, _irHoje, _toggleRealizado, _excluirPlano,
    _salvarPlano, _salvarMaterial, _confirmarSaida, _confirmarEntrada,
  };
})();



/* ============================================================
   PAINEL TV v5.0 — Painel de sala integrado com modo tela cheia
   Acesse via menu lateral → 📺 Painel TV
   Pressione ESC ou clique no ✕ para sair do modo TV
   ============================================================ */
const PainelTV = (() => {

  // ── Estado ──────────────────────────────────────────────────
  let _timer    = null;
  let _slide    = 0;
  let _running  = false;
  let _config   = null;
  let _dados    = {};

  const TOTAL_SLIDES  = 5;
  const SLIDE_LABELS  = ['👶 Presença','🍽️ Cardápio','📋 Atividade','📢 Avisos & Dicas','🎂 Aniversários'];
  const CORES_AV = ['#1565C0','#7C5CBF','#1A7A4A','#E8644A','#F59E0B','#E05A8A','#12586A','#9B2335'];

  function _avatarCor(id) {
    let h = 0;
    for (const ch of String(id)) h = (h << 5) - h + ch.charCodeAt(0) | 0;
    return CORES_AV[Math.abs(h) % CORES_AV.length];
  }
  function _initials(nome) {
