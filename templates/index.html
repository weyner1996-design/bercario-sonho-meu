    const pendentes = mens.filter(m => m.st === 'pendente').length;
    const docOk     = ativos.filter(m => Object.values(m.docs || {}).every(v => v)).length;
    const estBaixo  = estoque.filter(e => e.qtd <= e.minimo).length;
    const prontos   = (lotes || []).reduce((s, l) => s + (l.prontos - l.vendidos), 0);

    const kpis = [
      { l:'Alunos Ativos',      v: ativos.length,      s:'matriculados',       i:'👶', c:'teal',    nav:'alunos' },
      { l:'Receita do Mês',     v: Utils.money(rec),   s:`Saldo: ${Utils.money(rec-desp)}`, i:'💚', c:'success', nav:'gastos' },
      { l:'Inadimplentes',      v: atrasados + pendentes, s:`${atrasados} atrasados`, i:'⚠️', c: atrasados > 0 ? 'danger' : 'warning', nav:'cobracas' },
      { l:'Docs Completos',     v: `${docOk}/${ativos.length}`, s:'alunos completos', i:'📋', c: docOk === ativos.length ? 'success' : 'sun', nav:'documentos' },
      { l:'Estoque Baixo',      v: estBaixo,           s:'itens críticos',      i:'📦', c: estBaixo ? 'danger' : 'success', nav:'estoque' },
      { l:'A Receber',          v: Utils.money(mens.filter(m=>m.st!=='pago').reduce((s,m)=>s+m.valor,0)), s:'em aberto', i:'💰', c:'teal', nav:'mensalidades' },
      { l:'Uniformes Prontos',  v: prontos,            s:'em estoque',          i:'👕', c:'sun',     nav:'uniforme' },
      { l:'Despesas do Mês',    v: Utils.money(desp),  s:`${Math.round(desp/Math.max(rec,1)*100)}% da receita`, i:'📉', c:'info', nav:'gastos' },
    ];

    const el = document.getElementById('dashKpis');
    if (!el) return;
    el.innerHTML = kpis.map((k, i) => `
      <div class="kpi ${k.c}" style="animation-delay:${i * 0.04}s;cursor:pointer"
           onclick="Router.go('${k.nav}')" title="Ir para ${k.nav}">
        <div class="kpi-icon">${k.i}</div>
        <div class="kpi-label">${k.l}</div>
        <div class="kpi-value" id="kpiVal${i}">${k.v}</div>
        <div class="kpi-sub">${k.s}</div>
      </div>`).join('');
  };

  // Calendário semanal de cobranças
  const _renderWeekCal = (mens) => {
    const hoje = new Date();
    hoje.setHours(0,0,0,0);
    const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const semana = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(hoje);
      d.setDate(hoje.getDate() + i);
      return d;
    });

    const elCal = document.getElementById('dashWeekCal');
    if (!elCal) return;
    elCal.innerHTML = semana.map(d => {
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const cobr = mens.filter(m => m.vencimento === ds && m.st !== 'pago');
      const isHj = d.getTime() === hoje.getTime();
      const total = cobr.reduce((s, m) => s + m.valor, 0);
      return `
        <div style="background:var(--${isHj ? 'teal-lt' : 'bg'});border-radius:var(--r-md);padding:6px 4px;
             text-align:center;border:1px solid var(--${isHj ? 'teal-md' : 'border'});cursor:pointer"
             onclick="Router.go('mensalidades')" title="${Utils.fmtDate(ds)}">
          <div style="font-size:8.5px;font-weight:800;text-transform:uppercase;color:var(--ink-3)">${DIAS[d.getDay()]}</div>
          <div style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--teal-dk);line-height:1.3">${d.getDate()}</div>
          ${cobr.length
            ? `<div style="font-size:8.5px;color:var(--danger);font-weight:700;line-height:1.3">${Utils.money(total)}</div>`
            : '<div style="font-size:8px;color:var(--ink-4)">—</div>'}
        </div>`;
    }).join('');

    // Cards de cobrança urgentes
    const abertas = mens
      .filter(m => m.st !== 'pago')
      .sort((a, b) => new Date(a.vencimento) - new Date(b.vencimento))
      .slice(0, 4);

    const elCards = document.getElementById('dashCobrCards');
    if (!elCards) return;
    if (!abertas.length) {
      elCards.innerHTML = `<div style="font-size:12px;color:var(--success-dk);font-weight:700;padding:6px 0">✅ Nenhuma cobrança em aberto esta semana!</div>`;
      return;
    }
    elCards.innerHTML = abertas.map(m => {
      const d = Utils.diffDays(m.vencimento);
      const cor = m.st === 'atrasado' ? 'danger' : d <= 3 ? 'warning' : 'success';
      const label = m.st === 'atrasado' ? `${Math.abs(d)}d atraso` : `${d}d`;
      return `
        <div style="flex:1;min-width:140px;padding:9px 11px;background:var(--${cor}-lt);
             border:1px solid var(--${cor});border-radius:var(--r-md)">
          <div style="font-size:11px;font-weight:700;margin-bottom:2px">${m.st === 'atrasado' ? '🔴' : '🟡'} ${Utils.esc(m._nomeCrianca || '—')}</div>
          <div style="font-family:var(--font-display);font-size:14px;font-weight:800;
               color:var(--${cor === 'danger' ? 'danger' : cor === 'warning' ? 'warning' : 'success-dk'})">${Utils.money(m.valor)}</div>
          <div style="font-size:10px;color:var(--ink-3)">${m.ref} · ${label}</div>
          <div style="display:flex;gap:4px;margin-top:6px">
            <button class="btn btn-xs btn-success" onclick="DashActions.quickPay('${m.id}')">✓ Pagar</button>
            <button class="btn btn-xs btn-wa"      onclick="DashActions.sendWA('${m._matId}','${m.id}')">💬</button>
          </div>
        </div>`;
    }).join('');
  };

  // Cards de salas
  const _renderSalas = async (matriculas, cfg) => {
    const salas = [
      { id: 's1', nome: 'Sala 1', faixa: '4m – 1a', cor: 'var(--pink)',     cap: cfg.capS1 || 12 },
      { id: 's2', nome: 'Sala 2', faixa: '1 – 2a',  cor: 'var(--sun-dk)',   cap: cfg.capS2 || 15 },
      { id: 's3', nome: 'Sala 3', faixa: '2 – 4a',  cor: 'var(--teal-dk)', cap: cfg.capS3 || 18 },
    ];
    const ativos = matriculas.filter(m => m.st === 'matriculado');
    const el = document.getElementById('dashSalas');
    if (!el) return;
    el.innerHTML = salas.map(s => {
      const n   = ativos.filter(m => m.turma === s.id).length;
      const pct = Math.round(n / s.cap * 100);
      const cor = pct >= 90 ? 'danger' : pct >= 70 ? 'warning' : 'success';
      return `
        <div class="card" style="border-left:4px solid ${s.cor};cursor:pointer" onclick="Router.go('alunos')">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
            <div>
              <div style="font-family:var(--font-display);font-size:13px;font-weight:700">${s.nome}</div>
              <div style="font-size:11px;color:var(--ink-3)">${s.faixa}</div>
            </div>
            <div style="font-family:var(--font-display);font-size:22px;font-weight:800;color:${s.cor}">${n}</div>
          </div>
          <div style="font-size:10px;color:var(--ink-3);display:flex;justify-content:space-between;margin-bottom:3px">
            <span>Ocupação</span>
            <span style="font-weight:700;color:var(--${cor})">${pct}% · ${s.cap - n} vagas</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill ${cor}" style="width:${Math.min(pct,100)}%"></div>
          </div>
        </div>`;
    }).join('');
  };

  // Alertas
  const _renderAlertas = async (matriculas, estoque) => {
    const ativos  = matriculas.filter(m => m.st === 'matriculado');
    const alertas = [];

    // Alergias
    ativos.filter(m => (m.alergias || []).length).forEach(m => {
      alertas.push({ c: 'danger', i: '⚠️', t: `<b>${m.nome.split(' ')[0]}</b> — Alergia: ${m.alergias.join(', ')}`, nav: 'alunos' });
    });

    // Docs faltando
    ativos.filter(m => Object.values(m.docs || {}).some(v => !v)).forEach(m => {
      const NL = { img: 'Aut.Img', quest: 'Quest.', contrato: 'Contrato', rg: 'RG', vacina: 'Vacina' };
      const falt = Object.entries(m.docs || {}).filter(([, v]) => !v).map(([k]) => NL[k] || k);
      alertas.push({ c: 'warning', i: '📋', t: `<b>${m.nome.split(' ').slice(0,2).join(' ')}</b> — faltam: ${falt.join(', ')}`, nav: 'documentos' });
    });

    // Estoque crítico
    estoque.filter(e => e.qtd <= e.minimo).forEach(e => {
      alertas.push({ c: 'danger', i: '📦', t: `Estoque crítico: <b>${e.nome}</b> — ${e.qtd}/${e.minimo} ${e.unid}`, nav: 'estoque' });
    });

    // Vencimentos próximos estoque
    estoque.filter(e => e.venc && Utils.diffDays(e.venc) >= 0 && Utils.diffDays(e.venc) <= 7).forEach(e => {
      alertas.push({ c: 'warning', i: '🗓️', t: `Vencendo em ${Utils.diffDays(e.venc)}d: <b>${e.nome}</b>`, nav: 'estoque' });
    });

    const el = document.getElementById('dashAlertas');
    if (!el) return;
    if (!alertas.length) {
      el.innerHTML = `<div class="empty-state" style="padding:var(--sp-xl)">
        <div class="empty-icon">✅</div>
        <div class="empty-title">Tudo em ordem!</div>
        <div class="empty-sub">Nenhum alerta ativo no momento</div>
      </div>`;
      return;
    }
    el.innerHTML = alertas.slice(0, 8).map(a => `
      <div style="display:flex;gap:8px;padding:7px 10px;background:var(--${a.c}-lt);border-radius:var(--r-md);
           border-left:3px solid var(--${a.c});margin-bottom:5px;cursor:pointer;transition:opacity .15s"
           onclick="Router.go('${a.nav}')" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">
        <span style="font-size:15px;flex-shrink:0">${a.i}</span>
        <div style="font-size:12px;line-height:1.5">${a.t}</div>
      </div>`).join('');
    if (alertas.length > 8) {
      el.innerHTML += `<div style="font-size:11px;color:var(--ink-3);text-align:center;padding:4px">+ ${alertas.length - 8} alertas</div>`;
    }
  };

  // Resumo financeiro
  const _renderResumoFin = (mens) => {
    const mes   = new Date().getMonth();
    const rec   = REC_HIST[mes] || 0;
    const desp  = DESP_HIST[mes] || 0;
    const aRec  = mens.filter(m => m.st !== 'pago').reduce((s, m) => s + m.valor, 0);
    const receb = mens.filter(m => m.st === 'pago').reduce((s, m) => s + (m.valorPago || 0), 0);
    const saldo = rec - desp;

    const rows = [
      { l: '💚 Receita Prevista', v: Utils.money(rec),   c: 'success-dk' },
      { l: '💳 Já Recebido',      v: Utils.money(receb), c: 'teal-dk' },
      { l: '💰 A Receber',        v: Utils.money(aRec),  c: 'warning' },
      { l: '📉 Despesas',         v: Utils.money(desp),  c: 'danger' },
    ];
    const el = document.getElementById('dashResumoFin');
    if (!el) return;
    el.innerHTML = rows.map(r => `
      <div style="display:flex;justify-content:space-between;align-items:center;
           padding:7px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:12.5px;color:var(--ink-2)">${r.l}</span>
        <span style="font-weight:700;color:var(--${r.c})">${r.v}</span>
      </div>`).join('') + `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0 2px">
        <span style="font-weight:800;font-size:13.5px">💰 Saldo</span>
        <span style="font-family:var(--font-display);font-size:18px;font-weight:800;
              color:var(--${saldo >= 0 ? 'teal-dk' : 'danger'})">${Utils.money(saldo)}</span>
      </div>`;
  };

  // Gráfico de barras SVG
  const _renderChart = () => {
    const mes = new Date().getMonth();
    const max = Math.max(...REC_HIST, ...DESP_HIST);
    const H   = 100;
    const el  = document.getElementById('dashChart');
    if (!el) return;
    el.innerHTML = Utils.MONTHS_SHORT.map((m, i) => {
      const hR = Math.round(REC_HIST[i]  / max * H);
      const hD = Math.round(DESP_HIST[i] / max * H);
      const cur = i === mes;
      return `
        <div style="flex:1;position:relative;cursor:pointer" title="${m}: Rec ${Utils.money(REC_HIST[i])} | Desp ${Utils.money(DESP_HIST[i])}">
          <div style="display:flex;gap:2px;align-items:flex-end;height:${H}px">
            <div style="flex:1;border-radius:3px 3px 0 0;background:var(--teal-md);height:${hR}px;opacity:${cur ? 1 : .45};transition:opacity .2s"></div>
            <div style="flex:1;border-radius:3px 3px 0 0;background:var(--danger);height:${hD}px;opacity:${cur ? 1 : .45};transition:opacity .2s"></div>
          </div>
          <div style="text-align:center;font-size:8px;color:var(--${cur ? 'teal-dk' : 'ink-3'});
               font-weight:${cur ? 800 : 400};position:absolute;bottom:-18px;width:100%;white-space:nowrap">${m}</div>
        </div>`;
    }).join('');
  };

  // Avisos
  const _renderAvisos = async (avisos) => {
    const el = document.getElementById('dashAvisos');
    if (!el) return;
    const COR = { warning: 'warning', info: 'teal-md', danger: 'danger', success: 'success' };
    const BG  = { warning: 'warning-lt', info: 'teal-lt', danger: 'danger-lt', success: 'success-lt' };
    if (!avisos.length) {
      el.innerHTML = `<div class="empty-state" style="padding:var(--sp-lg)">
        <div class="empty-icon">📢</div><div class="empty-title">Sem avisos</div>
      </div>`;
      return;
    }
    el.innerHTML = avisos.map(a => `
      <div style="padding:8px 11px;border-radius:var(--r-md);border-left:3px solid var(--${COR[a.tipo] || 'teal-md'});
           background:var(--${BG[a.tipo] || 'teal-lt'});margin-bottom:5px;display:flex;gap:7px;align-items:flex-start">
        <div style="flex:1">
          <div style="font-weight:700;font-size:11.5px">${Utils.esc(a.titulo)}</div>
          <div style="font-size:11.5px;color:var(--ink-2)">${Utils.esc(a.msg)}</div>
        </div>
        ${!a.lido ? `<button class="btn btn-xs btn-ghost" onclick="Dashboard.marcarLido('${a.id}')" title="Marcar como lido">✓</button>` : ''}
      </div>`).join('');
  };

  // Ações rápidas
  const _renderAcoes = () => {
    const acoes = [
      { i: '👶', l: 'Nova Matrícula',    fn: "Router.go('matriculas')" },
      { i: '✅', l: 'Registrar Presença', fn: "Router.go('presenca')" },
      { i: '💸', l: 'Lançar Gasto',       fn: "Router.go('gastos')" },
      { i: '🔧', l: 'Novo Chamado',        fn: "Router.go('manutencao')" },
      { i: '💰', l: 'Ver Cobranças',       fn: "Router.go('cobracas')" },
      { i: '📦', l: 'Ver Estoque',         fn: "Router.go('estoque')" },
    ];
    const el = document.getElementById('dashAcoes');
    if (!el) return;
    el.innerHTML = acoes.map(a => `
      <button class="btn btn-ghost" style="justify-content:flex-start;gap:8px;padding:10px 12px;font-size:12.5px"
              onclick="${a.fn}">
        <span style="font-size:17px">${a.i}</span>${a.l}
      </button>`).join('');
  };

  // Aniversários
  const _renderAniversarios = (matriculas) => {
    const hoje = new Date();
    hoje.setHours(0,0,0,0);
    const proximos = matriculas
      .filter(m => m.nasc)
      .map(m => {
        const [y, mo, d] = m.nasc.split('-').map(Number);
        let prox = new Date(hoje.getFullYear(), mo - 1, d);
        if (prox < hoje) prox.setFullYear(hoje.getFullYear() + 1);
        return { ...m, diasAte: Math.round((prox - hoje) / 86400000), dStr: `${String(d).padStart(2,'0')}/${String(mo).padStart(2,'0')}` };
      })
      .sort((a, b) => a.diasAte - b.diasAte)
      .slice(0, 6);

    const el = document.getElementById('dashAniversarios');
    if (!el) return;
    if (!proximos.length) {
      el.innerHTML = `<div class="empty-state" style="padding:var(--sp-lg)"><div class="empty-icon">🎂</div><div class="empty-title">Sem aniversários próximos</div></div>`;
      return;
    }
    el.innerHTML = proximos.map(a => `
      <div style="display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg);
           border-radius:var(--r-md);margin-bottom:4px">
        <div style="width:28px;height:28px;border-radius:50%;background:${Utils.avatarColor(a.id)};
             color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0">
          ${Utils.initials(a.nome)}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${Utils.esc(a.nome.split(' ').slice(0,2).join(' '))}</div>
          <div style="font-size:10.5px;color:var(--ink-3)">${a.dStr} · ${Utils.salaLabel(a.turma)}</div>
        </div>
        ${a.diasAte <= 7
          ? `<span class="badge badge-sun">🎉 ${a.diasAte === 0 ? 'Hoje!' : a.diasAte + 'd'}</span>`
          : `<span class="badge badge-teal">${a.diasAte}d</span>`}
      </div>`).join('');
  };

  // Novo aviso
  const novoAviso = () => {
    const html = `
      <div class="modal-header">
        <div class="modal-title">📢 Novo Aviso</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <select class="form-select" id="avisoTipo">
              <option value="info">ℹ️ Informação</option>
              <option value="warning">⚠️ Atenção</option>
              <option value="success">✅ Positivo</option>
              <option value="danger">🔴 Urgente</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Data</label>
            <input class="form-input" type="date" id="avisoDt" value="${Utils.today()}">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:var(--sp-md)">
          <label class="form-label">Título <span class="required">*</span></label>
          <input class="form-input" id="avisoTit" placeholder="Ex: Reunião de pais">
        </div>
        <div class="form-group">
          <label class="form-label">Mensagem</label>
          <textarea class="form-textarea" id="avisoMsg" placeholder="Detalhes do aviso..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-primary" onclick="Dashboard.salvarAviso()">💾 Publicar</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const salvarAviso = async () => {
    const tit = document.getElementById('avisoTit')?.value.trim();
    if (!tit) { Toast.show('error', 'Título obrigatório!'); return; }
    await DB.save('avisos', {
      id:     Utils.uuid(),
      tipo:   document.getElementById('avisoTipo')?.value || 'info',
      titulo: tit,
      msg:    document.getElementById('avisoMsg')?.value.trim() || '',
      lido:   false,
      dt:     document.getElementById('avisoDt')?.value || Utils.today()
    });
    Modal.close('modalSec');
    Toast.show('success', 'Aviso publicado!');
    await render();
  };

  const marcarLido = async id => {
    const av = await DB.get('avisos', id);
    if (av) { av.lido = true; await DB.save('avisos', av); }
    await render();
  };

  const exportRelatorio = () => Toast.show('info', 'Exportação de relatório disponível na Etapa 6');

  // Render principal
  const render = async () => {
    // v5: filtra por sala para professoras
    const _filSala = Auth.podeFiltrarSala() ? Auth.getSalaId() : null;
    const [_matsAll, mens, estoque, lotes, avisos, cfg] = await Promise.all([
      DB.getAll('matriculas'),
      DB.getAll('mensalidades'),
      DB.getAll('estoque'),
      DB.getAll('lotes'),
      DB.getAll('avisos'),
      DB.getConfig()
    ]);    const matriculas = _filSala ? _matsAll.filter(m => m.turma === _filSala) : _matsAll;


    // Enriquece mensalidades com nome
    mens.forEach(m => {
      const mat = matriculas.find(a => a.id === m.alunoId);
      m._nomeCrianca = mat ? mat.nome.split(' ').slice(0,2).join(' ') : '—';
      m._matId = mat?.id || '';
    });

    // Saudação
    const greetEl = document.getElementById('dashGreeting');
    const subEl   = document.getElementById('dashSub');
    if (cfg && greetEl) greetEl.textContent = `${_greeting()}, ${(cfg.nomeAdmin || '').split(' ')[0]}!`;
    if (subEl) {
      const atr = mens.filter(m => m.st === 'atrasado').length;
      const n = new Date();
      const meses = Utils.MONTHS_SHORT;
      subEl.textContent = `${n.getDate()} de ${meses[n.getMonth()]} ${n.getFullYear()} · ${atr > 0 ? `⚠️ ${atr} mensalidade(s) atrasada(s)` : '✅ Financeiro em dia'}`;
    }

    await _renderKpis(matriculas, mens, estoque, lotes);
    _renderWeekCal(mens);
    await _renderSalas(matriculas, cfg);
    await _renderAlertas(matriculas, estoque);
    _renderResumoFin(mens);
    _renderChart();
    await _renderAvisos(avisos.filter(a => !a.lido).slice(0, 5));
    _renderAcoes();
    _renderAniversarios(matriculas);
    await Badges.refresh();
  };

  return { render, novoAviso, salvarAviso, marcarLido, exportRelatorio };
})();

/* ============================================================
   DashActions — Ações rápidas do dashboard
   ============================================================ */
const DashActions = (() => {
  const quickPay = async (mensId) => {
    const m = await DB.get('mensalidades', mensId);
    if (!m) return;
    const cfg  = await DB.getConfig();
    const desc = cfg.desconto || 13;
    const vd   = (m.valor * (1 - desc / 100)).toFixed(2);
    const html = `
      <div class="modal-header">
        <div class="modal-title">💰 Registrar Pagamento</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="info-box teal" style="margin-bottom:var(--sp-md)">
          <b>${Utils.esc(m._nomeCrianca || '—')}</b> · ${m.ref} · Venc: ${Utils.fmtDate(m.vencimento)}<br>
          Normal: <b>${Utils.money(m.valor)}</b> · Com desconto: <b>${Utils.money(parseFloat(vd))}</b>
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Valor (R$) <span class="required">*</span></label>
            <input class="form-input" type="number" step="0.01" id="qpVal" value="${vd}">
          </div>
          <div class="form-group">
            <label class="form-label">Data do Pagamento</label>
            <input class="form-input" type="date" id="qpDt" value="${Utils.today()}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Forma de Pagamento</label>
          <select class="form-select" id="qpForma">
            <option>PIX</option><option>Dinheiro</option>
            <option>Cartão de Débito</option><option>Transferência</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-secondary" onclick="DashActions.confirmPay('${mensId}')">✅ Confirmar</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const confirmPay = async (mensId) => {
    const m = await DB.get('mensalidades', mensId);
    if (!m) return;
    m.st        = 'pago';
    m.dtPago    = document.getElementById('qpDt')?.value || Utils.today();
    m.forma     = document.getElementById('qpForma')?.value || 'PIX';
    m.valorPago = parseFloat(document.getElementById('qpVal')?.value) || m.valor;
    await DB.save('mensalidades', m);
    // Gera recibo
    const cfg = await DB.getConfig();
    const mat = await DB.get('matriculas', m.alunoId);
    await DB.save('recibos', {
      id:     Utils.uuid(),
      alunoId: m.alunoId,
      ref:    `${m.ref} — P${m.parcela}`,
      valor:  m.valorPago,
      forma:  m.forma,
      dtEmissao: m.dtPago,
      nomeAluno: mat?.nome || '—',
      nomeResp:  mat?.mae || mat?.pai || '—'
    });
    Modal.close('modalSec');
    Toast.show('success', '✅ Pagamento registrado! Recibo gerado.');
    await Dashboard.render();
  };

  const sendWA = async (matId, mensId) => {
    const [mat, m, cfg] = await Promise.all([
      DB.get('matriculas', matId),
      DB.get('mensalidades', mensId),
      DB.getConfig()
    ]);
    if (!mat || !m) return;
    const d   = Utils.diffDays(m.vencimento);
    const msg = (cfg.msgWhatsApp || '')
      .replace('{resp}',    (mat.mae || mat.nome || '').split(' ')[0])
      .replace('{crianca}', mat.nome.split(' ')[0])
      .replace('{ref}',     m.ref)
      .replace('{valor}',   Utils.money(m.valor))
      .replace('{venc}',    Utils.fmtDate(m.vencimento))
      .replace('{dias}',    m.st === 'atrasado' ? `ATRASADA ${Math.abs(d)}d` : String(d));
    const tel = (mat.telMae || mat.telPai || '').replace(/\D/g,'');
    window.open(tel
      ? `https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`
      : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    // Registra histórico
    await DB.save('histAv', {
      id: Utils.uuid(), alunoId: matId,
      nomeAluno: mat.nome.split(' ').slice(0,2).join(' '),
      ref: m.ref, canal: 'WhatsApp',
      dtHora: new Date().toLocaleString('pt-BR')
    });
    Toast.show('success', '📲 WhatsApp aberto!');
  };

  return { quickPay, confirmPay, sendWA };
})();

/* ============================================================
   MATRICULAS MODULE — Etapa 3 completo
   ============================================================ */
const Matriculas = (() => {
  /* ── estado local ── */
  let _all       = [];   // todos os registros do DB
  let _filtered  = [];   // após filtros
  let _view      = 'kanban';
  let _page      = 1;
  const PER_PAGE = 20;
  let _sortCol   = 'nome';
  let _sortAsc   = true;
  let _selected  = new Set();
  let _wizardData = {};  // dados do wizard em progresso
  let _wizardStep = 1;
  let _tagInput  = null; // instância TagInput de alergias

  /* ── constantes de status ── */
  const STATUS = {
    interessado: { label:'🔍 Interessado',  badge:'badge-warning', color:'var(--warning)',  col:'col-interes' },
    em_processo: { label:'⏳ Em Processo',   badge:'badge-info',    color:'var(--info)',     col:'col-processo' },
    matriculado: { label:'✅ Matriculado',   badge:'badge-success', color:'var(--success)',  col:'col-matric' },
    desligado:   { label:'❌ Desligado',     badge:'badge-danger',  color:'var(--danger)',   col:'col-deslig' },
  };

  /* ── sala → capacidade (config) ── */
  let _caps = { s1: 12, s2: 15, s3: 18 };

  /* ────────────────────────────────────────────────
     RENDER PRINCIPAL
  ──────────────────────────────────────────────── */
  const render = async () => {
    _all = await DB.getAll('matriculas');
    const cfg = await DB.getConfig();
    _caps = { s1: cfg.capS1 || 12, s2: cfg.capS2 || 15, s3: cfg.capS3 || 18 };
    await _renderKpis();
    _applyFilters();
    if (_view === 'kanban') _renderKanban();
    else _renderTable();
  };

  /* ────────────────────────────────────────────────
     KPIs
  ──────────────────────────────────────────────── */
  const _renderKpis = async () => {
    const el = document.getElementById('matKpis');
    if (!el) return;
    const k = {
      interessado: 0, em_processo: 0, matriculado: 0, desligado: 0
    };
    _all.forEach(m => { if (k[m.st] !== undefined) k[m.st]++; });
    const ativos = _all.filter(m => m.st === 'matriculado');
    const s1 = ativos.filter(m => m.turma === 's1').length;
    const s2 = ativos.filter(m => m.turma === 's2').length;
    const s3 = ativos.filter(m => m.turma === 's3').length;

    el.innerHTML = [
      { l:'Interessados', v: k.interessado, s:'aguardando', i:'🔍', c:'sun',
        action: "Matriculas.setFilter('interessado')" },
      { l:'Em Processo',  v: k.em_processo, s:'documentação', i:'⏳', c:'info',
        action: "Matriculas.setFilter('em_processo')" },
      { l:'Matriculados', v: k.matriculado, s:'ativos', i:'✅', c:'success',
        action: "Matriculas.setFilter('matriculado')" },
      { l:'Desligados',   v: k.desligado,  s:'histórico', i:'❌', c:'danger',
        action: "Matriculas.setFilter('desligado')" },
      { l:'Sala 1',  v:`${s1}/${_caps.s1}`, s:`${_caps.s1-s1} vagas`, i:'🩷', c:'pink',   action:"" },
      { l:'Sala 2',  v:`${s2}/${_caps.s2}`, s:`${_caps.s2-s2} vagas`, i:'⭐', c:'sun',    action:"" },
      { l:'Sala 3',  v:`${s3}/${_caps.s3}`, s:`${_caps.s3-s3} vagas`, i:'🩵', c:'teal',   action:"" },
      { l:'Total Ativos', v: k.matriculado, s:'matriculados', i:'👶', c:'teal', action:"Router.go('alunos')" },
    ].map((k, i) => `
      <div class="kpi ${k.c}" style="animation-delay:${i*.04}s" ${k.action ? `onclick="${k.action}" title="Filtrar"` : ''}>
        <div class="kpi-icon">${k.i}</div>
        <div class="kpi-label">${k.l}</div>
        <div class="kpi-value">${k.v}</div>
        <div class="kpi-sub">${k.s}</div>
      </div>`).join('');
  };

  /* ────────────────────────────────────────────────
     FILTROS
  ──────────────────────────────────────────────── */
  const _applyFilters = () => {
    const q    = (document.getElementById('matSearch')?.value || '').toLowerCase().trim();
    const st   = document.getElementById('matStatusFilter')?.value || 'all';
    const sala = document.getElementById('matSalaFilter')?.value || 'all';

    _filtered = _all.filter(m => {
      if (st !== 'all' && m.st !== st) return false;
      if (sala !== 'all' && m.turma !== sala) return false;
      if (q) {
        const hay = Utils.normalize(`${m.nome} ${m.cpf || ''} ${m.mae || ''} ${m.pai || ''} ${m.apelido || ''}`);
        if (!hay.includes(Utils.normalize(q))) return false;
      }
      return true;
    });

    // Ordenação
    _filtered.sort((a, b) => {
      const va = (a[_sortCol] || '').toString().toLowerCase();
      const vb = (b[_sortCol] || '').toString().toLowerCase();
      return _sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });

    const cnt = document.getElementById('matCount');
    if (cnt) cnt.textContent = `${_filtered.length} registro(s)`;
  };

  const filterTable = () => {
    _page = 1;
    _applyFilters();
    if (_view === 'kanban') _renderKanban();
    else _renderTable();
  };

  const setFilter = (status) => {
    const sel = document.getElementById('matStatusFilter');
    if (sel) sel.value = status;
    filterTable();
  };

  /* ────────────────────────────────────────────────
     KANBAN
  ──────────────────────────────────────────────── */
  const _renderKanban = () => {
    const el = document.getElementById('matKanban');
    if (!el) return;

    const cols = ['interessado','em_processo','matriculado','desligado'];
    el.innerHTML = cols.map(st => {
      const items = _filtered.filter(m => m.st === st);
      const s = STATUS[st];
      return `
        <div class="kanban-col" id="col-${st}"
             ondragover="event.preventDefault();this.classList.add('drag-over')"
             ondragleave="this.classList.remove('drag-over')"
             ondrop="Matriculas.onDrop(event,'${st}')">
          <div class="kanban-col-header" style="border-bottom-color:${s.color};color:${s.color}">
            <span>${s.label}</span>
            <span class="badge ${s.badge}">${items.length}</span>
          </div>
          ${items.length === 0
            ? `<div class="empty-state" style="padding:24px 8px">
                 <div class="empty-icon" style="font-size:22px">📭</div>
                 <div class="empty-sub">Nenhuma matrícula</div>
               </div>`
            : items.map(m => _kanbanCard(m)).join('')}
        </div>`;
    }).join('');
  };

  const _kanbanCard = m => {
    const docs   = m.docs || {};
    const docOk  = Object.values(docs).filter(v => v).length;
    const docTot = Object.keys(docs).length || 5;
    const pct    = Math.round(docOk / docTot * 100);
    const tel    = m.telMae || m.telPai || '—';
    const alerg  = (m.alergias || []).length > 0;
    return `
      <div class="kanban-card" draggable="true"
           ondragstart="Matriculas.onDragStart(event,'${m.id}')"
           ondragend="Matriculas.onDragEnd(event)">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
          <div style="width:32px;height:32px;border-radius:var(--r-sm);flex-shrink:0;
               background:${Utils.avatarColor(m.id)};color:#fff;display:flex;
               align-items:center;justify-content:center;font-weight:800;font-size:12px">
            ${Utils.initials(m.nome)}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:var(--fs-sm);overflow:hidden;
                 text-overflow:ellipsis;white-space:nowrap">${Utils.esc(m.nome)}</div>
            <div style="font-size:var(--fs-xs);color:var(--ink-3)">
              <span class="badge ${Utils.salaBadge(m.turma)}" style="font-size:9px">${Utils.salaLabel(m.turma)}</span>
              ${alerg ? '<span style="color:var(--danger);margin-left:4px" title="Tem alergias">⚠️</span>' : ''}
            </div>
          </div>
        </div>
        <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:5px">
          📞 ${Utils.esc(tel)}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:var(--fs-xs);color:var(--ink-3)">Docs ${docOk}/${docTot}</span>
          <div class="progress-bar" style="width:60px">
            <div class="progress-fill ${pct===100?'success':pct>50?'warning':'danger'}"
                 style="width:${pct}%"></div>
          </div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-xs" onclick="Matriculas.openWizard('${m.id}')">✏️</button>
          <button class="btn btn-ghost btn-xs" onclick="Matriculas.printContrato('${m.id}')">🖨️</button>
          ${m.st !== 'matriculado' && m.st !== 'desligado'
            ? `<button class="btn btn-success btn-xs" onclick="Matriculas.avancar('${m.id}')">→ Avançar</button>`
            : ''}
          ${m.st === 'matriculado'
            ? `<button class="btn btn-xs btn-ghost" onclick="Matriculas.solicitarDesligamento('${m.id}')">🚪 Desligar</button>`
            : ''}
        </div>
      </div>`;
  };

  /* ── Drag & Drop ── */
  let _draggingId = null;

  const onDragStart = (e, id) => {
    _draggingId = id;
    e.dataTransfer.effectAllowed = 'move';
    e.currentTarget.classList.add('dragging');
  };

  const onDragEnd = e => {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
  };

  const onDrop = async (e, novoSt) => {
    e.preventDefault();
    document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
    if (!_draggingId) return;
    const m = await DB.get('matriculas', _draggingId);
    if (!m || m.st === novoSt) { _draggingId = null; return; }
    await _changeStatus(m, novoSt);
    _draggingId = null;
  };

  /* ── Mudança de status com regras ── */
  const _changeStatus = async (m, novoSt) => {
    const stAnt = m.st;

    // Regra: Em Processo → Matriculado: valida contrato
    if (stAnt === 'em_processo' && novoSt === 'matriculado') {
      if (!m.docs?.contrato) {
        Modal.confirm(
          '⚠️ O aluno não possui contrato registrado. Deseja avançar para Matriculado mesmo assim?',
          async () => { await _doChangeStatus(m, novoSt); },
          { title: 'Contrato não encontrado', confirmLabel: 'Avançar mesmo assim' }
        );
        return;
      }
    }

    // Regra: Matriculado → Desligado: pede data e motivo
    if (stAnt === 'matriculado' && novoSt === 'desligado') {
      _openDesligamentoModal(m);
      return;
    }

    await _doChangeStatus(m, novoSt);
  };

  const _doChangeStatus = async (m, novoSt) => {
    const stAnt = m.st;
    m.st = novoSt;
    await DB.save('matriculas', m);
    Toast.show('success', `${STATUS[novoSt].label} ← ${m.nome.split(' ')[0]}`);
    await render();
    await Badges.refresh();
    // Se recém-matriculado, oferece gerar primeira mensalidade
    if (novoSt === 'matriculado' && stAnt !== 'matriculado') {
      setTimeout(() => _offerPrimeiraMensalidade(m), 400);
    }
  };

  const avancar = async id => {
    const m = await DB.get('matriculas', id);
    if (!m) return;
    const ORDER = ['interessado','em_processo','matriculado','desligado'];
    const idx = ORDER.indexOf(m.st);
    if (idx < ORDER.length - 1) await _changeStatus(m, ORDER[idx + 1]);
  };

  const _openDesligamentoModal = m => {
    const html = `
      <div class="modal-header">
        <div class="modal-title">🚪 Desligar Aluno</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="info-box warning" style="margin-bottom:var(--sp-md)">
          Você está desligando <b>${Utils.esc(m.nome)}</b>.
          Esta ação pode ser revertida manualmente.
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Data de Saída <span class="required">*</span></label>
            <input class="form-input" type="date" id="deslDt" value="${Utils.today()}">
          </div>
          <div class="form-group">
            <label class="form-label">Motivo</label>
            <select class="form-select" id="deslMotivo">
              <option value="mudanca">Mudança de cidade</option>
              <option value="financeiro">Motivo financeiro</option>
              <option value="outro_crecheou">Outra creche</option>
              <option value="outro">Outro</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Observação</label>
          <textarea class="form-textarea" id="deslObs" placeholder="Detalhes opcionais..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-danger" onclick="Matriculas._confirmarDesligamento('${m.id}')">🚪 Confirmar Desligamento</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const _confirmarDesligamento = async id => {
    const m = await DB.get('matriculas', id);
    if (!m) return;
    m.st         = 'desligado';
    m.dtSaida    = document.getElementById('deslDt')?.value || Utils.today();
    m.motivoSaida= document.getElementById('deslMotivo')?.value || '';
    m.obsDeslig  = document.getElementById('deslObs')?.value || '';
    await DB.save('matriculas', m);
    Modal.close('modalSec');
    Toast.show('success', `🚪 ${m.nome.split(' ')[0]} desligado.`);
    await render();
    await Badges.refresh();
  };

  const solicitarDesligamento = async id => {
    const m = await DB.get('matriculas', id);
    if (m) _openDesligamentoModal(m);
  };

  /* ── Oferece primeira mensalidade ── */
  const _offerPrimeiraMensalidade = m => {
    const html = `
      <div class="modal-header">
        <div class="modal-title">🎉 Matrícula Confirmada!</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="info-box success" style="text-align:center;margin-bottom:var(--sp-md)">
          <div style="font-size:24px;margin-bottom:8px">🎉</div>
          <div style="font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--success-dk)">
            ${Utils.esc(m.nome)}
          </div>
          <div style="margin-top:4px">Deseja gerar a primeira mensalidade agora?</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Agora não</button>
        <button class="btn btn-secondary" onclick="Matriculas._gerarPrimeiraMens('${m.id}')">✅ Sim, gerar</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const _gerarPrimeiraMens = async matId => {
    const [m, cfg] = await Promise.all([DB.get('matriculas', matId), DB.getConfig()]);
    if (!m) return;
    const n   = new Date();
    const ref = `${Utils.MONTHS_SHORT[n.getMonth()]}/${n.getFullYear()}`;
    const dv  = m.diaVenc || cfg.diaPadrao || 10;
    const vc  = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(dv).padStart(2,'0')}`;
    const existing = await DB.query('mensalidades', x => x.alunoId === matId && x.ref === ref);
    if (existing.length) { Toast.show('warning', `Mensalidade ${ref} já existe!`); Modal.close('modalSec'); return; }
    await DB.save('mensalidades', {
      id: Utils.uuid(), alunoId: matId, parcela: 1, ref,
      vencimento: vc, valor: cfg.mensalidade || 933.88,
      valorPago: null, st: 'pendente', dtPago: null, forma: null
    });
    Modal.close('modalSec');
    Toast.show('success', `💰 Mensalidade ${ref} criada!`);
    await Badges.refresh();
  };

  /* ────────────────────────────────────────────────
     TABELA
  ──────────────────────────────────────────────── */
  const _renderTable = () => {
    // Atualiza headers de sorting
    document.querySelectorAll('#matTable thead th[data-col]').forEach(th => {
      th.classList.toggle('sorted', th.dataset.col === _sortCol);
      th.classList.toggle('desc', th.dataset.col === _sortCol && !_sortAsc);
    });

    const start = (_page - 1) * PER_PAGE;
    const pageItems = _filtered.slice(start, start + PER_PAGE);

    const tbody = document.getElementById('matTbody');
    if (!tbody) return;

    if (!pageItems.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--ink-3)">
        <div class="empty-icon">📭</div>Nenhuma matrícula encontrada</td></tr>`;
    } else {
      tbody.innerHTML = pageItems.map(m => {
        const docs    = m.docs || {};
        const docOk   = Object.values(docs).filter(v => v).length;
        const docTot  = Object.keys(docs).length || 5;
        const pct     = Math.round(docOk / docTot * 100);
        const sel     = _selected.has(m.id);
        const s       = STATUS[m.st] || STATUS.interessado;
        return `<tr>
          <td><input type="checkbox" ${sel?'checked':''} onchange="Matriculas.toggleSel('${m.id}',this.checked)"></td>
          <td>
            <div style="display:flex;align-items:center;gap:7px">
              <div style="width:28px;height:28px;border-radius:var(--r-sm);flex-shrink:0;
                   background:${Utils.avatarColor(m.id)};color:#fff;
                   display:flex;align-items:center;justify-content:center;
                   font-weight:800;font-size:10px">${Utils.initials(m.nome)}</div>
              <div>
                <div style="font-weight:700">${Utils.esc(m.nome)}</div>
                <div style="font-size:var(--fs-xs);color:var(--ink-3)">${Utils.esc(m.apelido || '')} · ${Utils.calcAge(m.nasc)}</div>
              </div>
            </div>
          </td>
          <td><span class="badge ${Utils.salaBadge(m.turma)}">${Utils.salaLabel(m.turma)}</span></td>
          <td style="font-size:var(--fs-sm)">
            ${Utils.esc(m.mae || '—')}
            ${m.telMae ? `<div style="color:var(--ink-3);font-size:var(--fs-xs)">${Utils.esc(m.telMae)}</div>` : ''}
          </td>
          <td><span class="badge ${s.badge}">${s.label}</span></td>
          <td>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:var(--fs-xs)">${docOk}/${docTot}</span>
              <div class="progress-bar" style="width:50px">
                <div class="progress-fill ${pct===100?'success':pct>50?'warning':'danger'}" style="width:${pct}%"></div>
              </div>
            </div>
          </td>
          <td style="font-size:var(--fs-xs);color:var(--ink-3)">${Utils.fmtDate(m.dtCadastro)}</td>
          <td>
            <div class="td-actions">
              <button class="btn btn-ghost btn-xs" onclick="Matriculas.openWizard('${m.id}')" title="Editar">✏️</button>
              <button class="btn btn-ghost btn-xs" onclick="Matriculas.printContrato('${m.id}')" title="Contrato">🖨️</button>
              <button class="btn btn-danger btn-xs" onclick="Matriculas.deleteConfirm('${m.id}')" title="Excluir">🗑️</button>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    _renderPagination();
    _updateBulkBar();
  };

  const _renderPagination = () => {
    const el  = document.getElementById('matPagination');
    if (!el) return;
    const total = _filtered.length;
    const pages = Math.ceil(total / PER_PAGE) || 1;
    const start = (_page - 1) * PER_PAGE + 1;
    const end   = Math.min(_page * PER_PAGE, total);
    el.innerHTML = `
      <div class="pagination-info">${total ? `${start}–${end} de ${total}` : '0 registros'}</div>
      <div class="pagination-btns">
        <button class="pg-btn" onclick="Matriculas.goPage(${_page-1})" ${_page<=1?'disabled':''}>‹</button>
        ${Array.from({length:Math.min(pages,7)},(_,i)=>{
          const p = pages <= 7 ? i+1 : (i < 3 ? i+1 : (i < 4 ? _page : pages - 6 + i));
          return `<button class="pg-btn ${p===_page?'active':''}" onclick="Matriculas.goPage(${p})">${p}</button>`;
        }).join('')}
        <button class="pg-btn" onclick="Matriculas.goPage(${_page+1})" ${_page>=pages?'disabled':''}>›</button>
      </div>`;
  };

  const goPage = p => {
    const pages = Math.ceil(_filtered.length / PER_PAGE) || 1;
    _page = Math.max(1, Math.min(p, pages));
    _renderTable();
  };

  /* ────────────────────────────────────────────────
     SELEÇÃO MÚLTIPLA
  ──────────────────────────────────────────────── */
  const toggleSel = (id, checked) => {
    if (checked) _selected.add(id); else _selected.delete(id);
    _updateBulkBar();
  };

  const toggleSelAll = chk => {
    const pageItems = _filtered.slice((_page-1)*PER_PAGE, _page*PER_PAGE);
    pageItems.forEach(m => chk.checked ? _selected.add(m.id) : _selected.delete(m.id));
    _renderTable();
  };

  const clearSel = () => { _selected.clear(); _renderTable(); };

  const _updateBulkBar = () => {
    const bar = document.getElementById('matBulkBar');
    const cnt = document.getElementById('matBulkCount');
    if (!bar) return;
    if (_selected.size > 0) {
      bar.style.display = 'flex';
      if (cnt) cnt.textContent = `${_selected.size} selecionado(s)`;
    } else {
      bar.style.display = 'none';
    }
  };

  const applyBulk = async () => {
    const novoSt = document.getElementById('matBulkStatus')?.value;
    if (!novoSt) { Toast.show('warning', 'Selecione um status para aplicar'); return; }
    const ids = [..._selected];
    for (const id of ids) {
      const m = await DB.get('matriculas', id);
      if (m) { m.st = novoSt; await DB.save('matriculas', m); }
    }
    _selected.clear();
    Toast.show('success', `✅ ${ids.length} matrícula(s) atualizadas!`);
    await render();
    await Badges.refresh();
  };

  const exportSelected = async () => {
    const ids = [..._selected];
    const items = ids.length > 0
      ? await Promise.all(ids.map(id => DB.get('matriculas', id)))
      : _filtered;
    const rows = [
      'Nome,Sala,Status,Mae,Tel Mae,Email Mae,Pai,Tel Pai,Nascimento,CPF,Alergias,Obs,Cadastro'
    ];
    items.forEach(m => {
      if (!m) return;
      rows.push(`"${m.nome}","${Utils.salaLabel(m.turma)}","${m.st}","${m.mae||''}","${m.telMae||''}","${m.emailMae||''}","${m.pai||''}","${m.telPai||''}","${Utils.fmtDate(m.nasc)}","${m.cpf||''}","${(m.alergias||[]).join('|')}","${(m.obs||'').replace(/"/g,"'")}","${Utils.fmtDate(m.dtCadastro)}"`);
    });
    Utils.downloadCSV(rows, `matriculas_${Utils.today()}.csv`);
    Toast.show('success', 'CSV exportado!');
  };

  const exportCSV = exportSelected;

  /* ────────────────────────────────────────────────
     SORTING
  ──────────────────────────────────────────────── */
  const sort = col => {
    if (_sortCol === col) _sortAsc = !_sortAsc;
    else { _sortCol = col; _sortAsc = true; }
    _page = 1;
    _applyFilters();
    if (_view === 'kanban') _renderKanban(); else _renderTable();
  };

  /* ────────────────────────────────────────────────
     VIEW TOGGLE
  ──────────────────────────────────────────────── */
  const setView = v => {
    _view = v;
    const kanbanBtn = document.getElementById('viewKanban');
    const tableBtn  = document.getElementById('viewTable');
    const kanbanEl  = document.getElementById('matKanbanView');
    const tableEl   = document.getElementById('matTableView');
    if (kanbanBtn) {
      kanbanBtn.style.background = v === 'kanban' ? 'var(--white)' : 'transparent';
      kanbanBtn.style.color = v === 'kanban' ? 'var(--teal-dk)' : 'var(--ink-3)';
      kanbanBtn.style.boxShadow = v === 'kanban' ? 'var(--shadow-xs)' : 'none';
    }
    if (tableBtn) {
      tableBtn.style.background = v === 'table' ? 'var(--white)' : 'transparent';
      tableBtn.style.color = v === 'table' ? 'var(--teal-dk)' : 'var(--ink-3)';
      tableBtn.style.boxShadow = v === 'table' ? 'var(--shadow-xs)' : 'none';
    }
    if (kanbanEl) kanbanEl.style.display = v === 'kanban' ? '' : 'none';
    if (tableEl)  tableEl.style.display  = v === 'table'  ? '' : 'none';
    if (v === 'kanban') _renderKanban(); else _renderTable();
  };

  /* ────────────────────────────────────────────────
     WIZARD DE MATRÍCULA — 3 ETAPAS
  ──────────────────────────────────────────────── */
  const openWizard = async (id = null) => {
    let m = null;
    if (id) {
      m = await DB.get('matriculas', id);
    }
    const cfg = await DB.getConfig();

    _wizardData = m ? { ...m } : {
      id: Utils.uuid(),
      st: 'interessado',
      dtCadastro: '2026-01-01',
      docs: { img: false, quest: false, contrato: false, rg: false, vacina: false },
      alergias: [],
      turma: 's1',
      diaVenc: cfg.diaPadrao || 10,
      valorMens: cfg.mensalidade || 933.88,
      foto: null
    };
    _wizardStep = 1;
    _renderWizardModal(id ? 'Editar Matrícula' : 'Nova Matrícula');
  };

  const _renderWizardModal = title => {
    const html = `
      <div class="modal-header">
        <div class="modal-title">🎓 ${title}</div>
        <button class="modal-close" onclick="Modal.close('modalMain')">×</button>
      </div>
      <div class="modal-body" id="wizBody">
        ${_wizardStepsHTML()}
        ${_wizardCurrentStep()}
      </div>
      <div class="modal-footer" id="wizFooter">
        ${_wizardFooter()}
      </div>`;
    Modal.open('modalMain', html);
    _afterWizardRender();
  };

  const _wizardStepsHTML = () => `
    <div class="wizard-steps">
      ${[
        [1, 'Dados da Criança'],
        [2, 'Família & Saúde'],
        [3, 'Documentos & Confirmação']
      ].map(([n, l]) => `
        <div class="wizard-step ${n < _wizardStep ? 'done' : n === _wizardStep ? 'active' : ''}">
          <span class="wizard-step-num">${n < _wizardStep ? '✓' : n}</span>${l}
        </div>`).join('')}
    </div>`;

  const _wizardCurrentStep = () => {
    if (_wizardStep === 1) return _stepA();
    if (_wizardStep === 2) return _stepB();
    return _stepC();
  };

  const _wizardFooter = () => `
    ${_wizardStep > 1
      ? `<button class="btn btn-ghost" onclick="Matriculas.wizPrev()">‹ Anterior</button>` : ''}
    <button class="btn btn-ghost" onclick="Modal.close('modalMain')">Cancelar</button>
    ${_wizardStep < 3
      ? `<button class="btn btn-primary" onclick="Matriculas.wizNext()">Próxima ›</button>`
      : `<button class="btn btn-secondary" onclick="Matriculas.wizSave()">✅ Confirmar Matrícula</button>`}`;

  /* ── Etapa A — Dados da Criança ── */
  const _stepA = () => {
    const d = _wizardData;
    return `
      <div class="section-divider">👶 Dados da Criança</div>
      <div class="form-row c3">
        <div class="form-group" style="grid-column:1/3">
          <label class="form-label">Nome Completo <span class="required">*</span></label>
          <input class="form-input" id="wNome" value="${Utils.esc(d.nome||'')}" placeholder="Mínimo 2 palavras" oninput="Matriculas._suggestSala()">
          <div class="form-error" id="wNomeErr">Nome completo com pelo menos 2 palavras</div>
        </div>
        <div class="form-group">
          <label class="form-label">Apelido</label>
          <input class="form-input" id="wApelido" value="${Utils.esc(d.apelido||'')}" placeholder="Como chamamos...">
        </div>
      </div>
      <div class="form-row c4">
        <div class="form-group">
          <label class="form-label">Data de Nascimento <span class="required">*</span></label>
          <input class="form-input" type="date" id="wNasc" value="${d.nasc||''}" onchange="Matriculas._suggestSala()">
          <div class="form-error" id="wNascErr">Data obrigatória</div>
        </div>
        <div class="form-group">
          <label class="form-label">Sala
            <span style="font-size:9px;color:var(--ink-3);font-weight:400;margin-left:4px" id="wSalaHint"></span>
          </label>
          <select class="form-select" id="wSala">
            <option value="s1" ${d.turma==='s1'?'selected':''}>Sala 1 (4m–1a)</option>
            <option value="s2" ${d.turma==='s2'?'selected':''}>Sala 2 (1–2a)</option>
            <option value="s3" ${d.turma==='s3'?'selected':''}>Sala 3 (2–4a)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">CPF</label>
          <input class="form-input" id="wCpf" value="${Utils.esc(d.cpf||'')}" placeholder="000.000.000-00"
            oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4').slice(0,14)">
        </div>
        <div class="form-group">
          <label class="form-label">Tipo Sanguíneo</label>
          <select class="form-select" id="wTs">
            <option value="">—</option>
            ${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(t=>`<option ${d.ts===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row c3">
        <div class="form-group">
          <label class="form-label">Dia de Vencimento</label>
          <input class="form-input" type="number" id="wDiaVenc" value="${d.diaVenc||10}" min="1" max="28">
          <div class="form-hint">Dia do mês para débito</div>
        </div>
        <div class="form-group">
          <label class="form-label">Valor Mensalidade (R$)</label>
          <input class="form-input" type="number" step="0.01" id="wValMens" value="${d.valorMens||933.88}">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-select" id="wStatus">
            ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${d.st===k?'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
      </div>`;
  };

  /* ── Etapa B — Família & Saúde ── */
  const _stepB = () => {
    const d = _wizardData;
    return `
      <div class="section-divider">👩 Mãe</div>
      <div class="form-row c4">
        <div class="form-group" style="grid-column:1/3">
          <label class="form-label">Nome Completo</label>
          <input class="form-input" id="wMae" value="${Utils.esc(d.mae||'')}">
        </div>
        <div class="form-group">
          <label class="form-label">CPF da Mãe</label>
          <input class="form-input" id="wCpfMae" value="${Utils.esc(d.cpfMae||'')}" placeholder="000.000.000-00"
            oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4').slice(0,14)">
        </div>
        <div class="form-group">
          <label class="form-label">Telefone / WhatsApp</label>
          <input class="form-input" id="wTelMae" value="${Utils.esc(d.telMae||'')}" placeholder="(00) 9 0000-0000"
            oninput="this.value=Utils.fmtPhone(this.value)">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">E-mail da Mãe</label>
          <input class="form-input" type="email" id="wEmailMae" value="${Utils.esc(d.emailMae||'')}">
        </div>
      </div>

      <div class="section-divider">👨 Pai</div>
      <div class="form-row c4">
        <div class="form-group" style="grid-column:1/3">
          <label class="form-label">Nome Completo</label>
          <input class="form-input" id="wPai" value="${Utils.esc(d.pai||'')}">
        </div>
        <div class="form-group">
          <label class="form-label">CPF do Pai</label>
          <input class="form-input" id="wCpfPai" value="${Utils.esc(d.cpfPai||'')}" placeholder="000.000.000-00"
            oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4').slice(0,14)">
        </div>
        <div class="form-group">
          <label class="form-label">Telefone / WhatsApp</label>
          <input class="form-input" id="wTelPai" value="${Utils.esc(d.telPai||'')}" placeholder="(00) 9 0000-0000"
            oninput="this.value=Utils.fmtPhone(this.value)">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">E-mail do Pai</label>
          <input class="form-input" type="email" id="wEmailPai" value="${Utils.esc(d.emailPai||'')}">
        </div>
      </div>

      <div class="section-divider">🏥 Saúde</div>
      <div class="form-row c3">
        <div class="form-group">
          <label class="form-label">Plano de Saúde</label>
          <input class="form-input" id="wPlano" value="${Utils.esc(d.plano||'')}" placeholder="Unimed, etc.">
        </div>
        <div class="form-group">
          <label class="form-label">Pediatra</label>
          <input class="form-input" id="wPed" value="${Utils.esc(d.ped||'')}">
        </div>
        <div class="form-group">
          <label class="form-label">Tel. Pediatra</label>
          <input class="form-input" id="wTelPed" value="${Utils.esc(d.telPed||'')}">
        </div>
      </div>
      <div class="form-group" style="margin-bottom:var(--sp-md)">
        <label class="form-label">⚠️ Alergias <span class="form-hint">(Enter para adicionar tag)</span></label>
        <div class="tag-input-wrap" id="wAlergias"></div>
      </div>
      <div class="form-row c2">
        <div class="form-group">
          <label class="form-label">Medicamentos de Uso Contínuo</label>
          <textarea class="form-textarea" id="wMeds" placeholder="Nome, dose, horário...">${Utils.esc(d.meds||'')}</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Observações Gerais</label>
          <textarea class="form-textarea" id="wObs">${Utils.esc(d.obs||'')}</textarea>
        </div>
      </div>`;
  };

  /* ── Etapa C — Documentos & Confirmação ── */
  const _stepC = () => {
    const d = _wizardData;
    const docs = d.docs || {};
    const docItems = [
      ['img',      '🖊️', 'Autorização de Imagem'],
      ['quest',    '📋', 'Questionário de Saúde'],
      ['contrato', '📝', 'Contrato Assinado'],
      ['rg',       '🪪', 'RG / Certidão de Nascimento'],
      ['vacina',   '💉', 'Cartão de Vacinas'],
    ];
    const docOk = Object.values(docs).filter(v => v).length;

    return `
      <div class="section-divider">📋 Checklist de Documentos</div>
      <div style="margin-bottom:var(--sp-lg)">
        ${docItems.map(([k, ic, lbl]) => `
          <div class="checklist-item ${docs[k] ? 'ok' : 'missing'}">
            <span style="font-size:18px">${ic}</span>
            <label style="flex:1;font-weight:600">${lbl}</label>
            <label class="btn btn-ghost btn-xs" style="cursor:pointer">
              📎 Upload
              <input type="file" accept=".pdf,.jpg,.jpeg,.png" style="display:none"
                onchange="Matriculas._docUploaded('${k}',this)">
            </label>
            <input type="checkbox" id="doc_${k}" ${docs[k]?'checked':''} style="width:16px;height:16px;accent-color:var(--success)"
              onchange="Matriculas._docCheck('${k}',this.checked)">
          </div>`).join('')}
        <div class="progress-bar" style="margin-top:var(--sp-sm)">
          <div class="progress-fill ${docOk===5?'success':'warning'}" style="width:${docOk/5*100}%"></div>
        </div>
        <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:4px;text-align:right">${docOk}/5 documentos</div>
      </div>

      <div class="section-divider">📄 Resumo da Matrícula</div>
      <div class="grid-3" style="gap:var(--sp-sm);margin-bottom:var(--sp-md)">
        <div class="info-box teal">
          <b>👶 Criança</b><br>
          ${Utils.esc(d.nome||'—')}<br>
          <small>${Utils.esc(d.apelido||'')} · ${Utils.calcAge(d.nasc)} · ${Utils.salaLabel(d.turma)}</small>
        </div>
        <div class="info-box teal">
          <b>👨‍👩‍👧 Família</b><br>
          ${Utils.esc(d.mae||'—')}<br>
          <small>${Utils.esc(d.telMae||'—')}</small><br>
          ${Utils.esc(d.pai||'—')}<br>
          <small>${Utils.esc(d.telPai||'—')}</small>
        </div>
        <div class="info-box ${(d.alergias||[]).length ? 'danger' : 'success'}">
          <b>🏥 Saúde</b><br>
          TS: ${d.ts||'—'} · Plano: ${Utils.esc(d.plano||'—')}<br>
          ${(d.alergias||[]).length ? `<b>⚠️ Alergias: ${d.alergias.join(', ')}</b>` : '✅ Sem alergias'}<br>
          <small>Venc: dia ${d.diaVenc||10} · ${Utils.money(d.valorMens||0)}/mês</small>
        </div>
      </div>
      ${(d.st==='interessado'||d.st==='em_processo')
        ? `<div class="info-box sun">
            <b>💡 Status:</b> ${STATUS[d.st]?.label} — após salvar, use o Kanban para avançar o fluxo.
           </div>`
        : ''}`;
  };

  /* ── Pós-render do wizard ── */
  const _afterWizardRender = () => {
    if (_wizardStep === 2) {
      _tagInput = TagInput.init('wAlergias', _wizardData.alergias || []);
    }
  };

  /* ── Sugestão de sala por idade ── */
  const _suggestSala = () => {
    const nasc = document.getElementById('wNasc')?.value;
    const hint = document.getElementById('wSalaHint');
    const sel  = document.getElementById('wSala');
    if (!nasc || !hint) return;
    const age = Utils.calcAge(nasc);
    const [y] = nasc.split('-').map(Number);
    const anos = new Date().getFullYear() - y;
    let sugestao = 's1';
    if (anos >= 2) sugestao = 's3';
    else if (anos >= 1) sugestao = 's2';
    hint.textContent = `(sugestão: ${Utils.salaLabel(sugestao)} · ${age})`;
    if (sel && !_wizardData.turma) sel.value = sugestao;
  };

  /* ── Coleta dados da etapa atual ── */
  const _collectStep = () => {
    const d = _wizardData;
    if (_wizardStep === 1) {
      d.nome    = document.getElementById('wNome')?.value.trim() || '';
      d.apelido = document.getElementById('wApelido')?.value.trim() || '';
      d.nasc    = document.getElementById('wNasc')?.value || '';
      d.turma   = document.getElementById('wSala')?.value || 's1';
      d.cpf     = document.getElementById('wCpf')?.value || '';
      d.ts      = document.getElementById('wTs')?.value || '';
      d.diaVenc = parseInt(document.getElementById('wDiaVenc')?.value) || 10;
      d.valorMens = parseFloat(document.getElementById('wValMens')?.value) || 933.88;
      d.st      = document.getElementById('wStatus')?.value || 'interessado';
    }
    if (_wizardStep === 2) {
      d.mae      = document.getElementById('wMae')?.value.trim() || '';
      d.cpfMae   = document.getElementById('wCpfMae')?.value || '';
      d.telMae   = document.getElementById('wTelMae')?.value || '';
      d.emailMae = document.getElementById('wEmailMae')?.value || '';
      d.pai      = document.getElementById('wPai')?.value.trim() || '';
      d.cpfPai   = document.getElementById('wCpfPai')?.value || '';
      d.telPai   = document.getElementById('wTelPai')?.value || '';
      d.emailPai = document.getElementById('wEmailPai')?.value || '';
      d.plano    = document.getElementById('wPlano')?.value || '';
      d.ped      = document.getElementById('wPed')?.value || '';
      d.telPed   = document.getElementById('wTelPed')?.value || '';
      d.meds     = document.getElementById('wMeds')?.value || '';
      d.obs      = document.getElementById('wObs')?.value || '';
      if (_tagInput) d.alergias = _tagInput.getValues();
    }
  };

  /* ── Validação por etapa ── */
  const _validateStep = () => {
    if (_wizardStep === 1) {
      const nome = document.getElementById('wNome')?.value.trim() || '';
      const nasc = document.getElementById('wNasc')?.value || '';
      let ok = true;
      const nomeErr = document.getElementById('wNomeErr');
      const nascErr = document.getElementById('wNascErr');
      if (nome.split(/\s+/).filter(Boolean).length < 2) {
        nomeErr?.classList.add('visible');
        document.getElementById('wNome')?.classList.add('error');
        ok = false;
      } else { nomeErr?.classList.remove('visible'); document.getElementById('wNome')?.classList.remove('error'); }
      if (!nasc) {
        nascErr?.classList.add('visible');
        document.getElementById('wNasc')?.classList.add('error');
        ok = false;
      } else { nascErr?.classList.remove('visible'); document.getElementById('wNasc')?.classList.remove('error'); }
      return ok;
    }
    return true; // B e C não têm campos obrigatórios além do que já foi preenchido
  };

  /* ── Navegação do wizard ── */
  const wizNext = () => {
    _collectStep();
    if (!_validateStep()) return;
    _wizardStep++;
    const body = document.getElementById('wizBody');
    const foot = document.getElementById('wizFooter');
    if (body) body.innerHTML = _wizardStepsHTML() + _wizardCurrentStep();
    if (foot) foot.innerHTML = _wizardFooter();
    _afterWizardRender();
  };

  const wizPrev = () => {
    _collectStep();
    _wizardStep--;
    const body = document.getElementById('wizBody');
    const foot = document.getElementById('wizFooter');
    if (body) body.innerHTML = _wizardStepsHTML() + _wizardCurrentStep();
    if (foot) foot.innerHTML = _wizardFooter();
    _afterWizardRender();
  };

  /* ── Doc upload inline ── */
  const _docUploaded = (key, input) => {
    const file = input.files[0];
    if (!file) return;
    if (!_wizardData.docs) _wizardData.docs = {};
    _wizardData.docs[key] = true;
    const chk = document.getElementById(`doc_${key}`);
    if (chk) chk.checked = true;
    const item = chk?.closest('.checklist-item');
    if (item) { item.classList.remove('missing'); item.classList.add('ok'); }
    Toast.show('success', `📎 ${file.name} marcado como recebido`);
    // Atualiza barra
    const docOk = Object.values(_wizardData.docs).filter(v => v).length;
    const bar   = document.querySelector('#wizBody .progress-fill');
    if (bar) {
      bar.style.width = `${docOk/5*100}%`;
      bar.className = `progress-fill ${docOk===5?'success':'warning'}`;
    }
    const docTxt = document.querySelector('#wizBody .form-hint + div, #wizBody [style*="text-align:right"]');
    if (docTxt) docTxt.textContent = `${docOk}/5 documentos`;
  };

  const _docCheck = (key, checked) => {
    if (!_wizardData.docs) _wizardData.docs = {};
    _wizardData.docs[key] = checked;
    const item = document.getElementById(`doc_${key}`)?.closest('.checklist-item');
    if (item) {
      item.classList.toggle('ok', checked);
      item.classList.toggle('missing', !checked);
    }
  };

  /* ── Salva wizard ── */
  const wizSave = async () => {
    _collectStep();
    if (!_wizardData.nome?.trim()) { Toast.show('error', 'Nome obrigatório!'); return; }
    const stAnterior = (await DB.get('matriculas', _wizardData.id))?.st;
    await DB.save('matriculas', _wizardData);
    Modal.close('modalMain');
    Toast.show('success', `✅ ${_wizardData.nome.split(' ')[0]} salvo!`);
    await render();
    await Badges.refresh();
    if (_wizardData.st === 'matriculado' && stAnterior !== 'matriculado') {
      setTimeout(() => _offerPrimeiraMensalidade(_wizardData), 400);
    }
  };

  /* ────────────────────────────────────────────────
     CONTRATO
  ──────────────────────────────────────────────── */
  const printContrato = async id => {
    const [m, cfg] = await Promise.all([DB.get('matriculas', id), DB.getConfig()]);
    if (!m) return;
    const mens = cfg.mensalidade || 933.88;
    const desc = cfg.desconto    || 13;
    const vd   = (mens * (1 - desc / 100)).toFixed(2).replace('.',',');
    const w = window.open('', '_blank', 'width=700,height=920');
    w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
      <title>Contrato — ${m.nome}</title>
      <style>
        body{font-family:Arial,sans-serif;padding:32px;max-width:600px;margin:0 auto;font-size:12.5px}
        h2{text-align:center;font-size:14px;margin-bottom:2px}
        h3{text-align:center;font-size:11px;color:#666;margin-bottom:14px}
        .tit{font-size:14px;font-weight:bold;text-align:center;border:2px solid #000;padding:7px;margin:10px 0;text-transform:uppercase}
        table{width:100%;border-collapse:collapse;margin-bottom:10px}
        td,th{border:1px solid #ccc;padding:5px 8px;font-size:12px}

  /* ────────────────────────────────────────────────
     EXCLUIR

        await DB.remove('matriculas', id);

  /* ────────────────────────────────────────────────
     API PÚBLICA
  ──────────────────────────────────────────────── */
  return {
    render, filterTable, setFilter, setView, sort, goPage,
    toggleSel, toggleSelAll, clearSel, applyBulk, exportCSV, exportSelected,
    onDragStart, onDragEnd, onDrop,
    openWizard, wizNext, wizPrev, wizSave,
    avancar, solicitarDesligamento, _confirmarDesligamento,
    _suggestSala, _docUploaded, _docCheck,

    _offerPrimeiraMensalidade, _gerarPrimeiraMens,
  };
})();

/* ============================================================
   ALUNOS — Módulo de visualização e perfil completo
   ============================================================ */
const Alunos = (() => {
  let _all = [];
  let _filtered = [];
  let _view = 'grid'; // 'grid' | 'lista'
  let _searchQ = '';
  let _currentAlunoId = null;
  let _perfilFotoInput = null;

  /* ── Render principal ── */
  const render = async () => {
    _all = await DB.getAll('matriculas');
    applyFilters();
  };

  /* ── Filtros e busca ── */
  const search = Utils.debounce(q => {
    _searchQ = q;
    applyFilters();
  }, 220);

  const applyFilters = () => {
    // v5: professora só vê sua sala
    const salaForcada = Auth.podeFiltrarSala() ? Auth.getSalaId() : null;
    const sala   = salaForcada || document.getElementById('alunosFiltroSala')?.value || '';
    const st     = document.getElementById('alunosFiltroSt')?.value ?? 'matriculado';
    const extra  = document.getElementById('alunosFiltroExtra')?.value || '';
    const ordem  = document.getElementById('alunosOrdem')?.value || 'nome';
    const q      = Utils.normalize(_searchQ);

    // Esconde filtro de sala para professoras (já está fixo)
    const filSalaEl = document.getElementById('alunosFiltroSala');
    if (filSalaEl) filSalaEl.closest('.form-group, label, div')?.style && (filSalaEl.style.display = salaForcada ? 'none' : '');

    _filtered = _all.filter(a => {
      if (sala && a.turma !== sala) return false;
      if (st && a.st !== st) return false;
      if (extra === 'alergia' && !(a.alergias?.length)) return false;
      if (extra === 'docsinc') {
        const ok = Object.values(a.docs || {}).filter(Boolean).length;
        if (ok >= 5) return false;
      }
      if (q) {
        const hay = Utils.normalize(`${a.nome} ${a.apelido} ${a.mae} ${a.pai}`);
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    // Ordenação
    _filtered.sort((a, b) => {
      if (ordem === 'nome') return (a.nome || '').localeCompare(b.nome || '');
      if (ordem === 'sala') return (a.turma || '').localeCompare(b.turma || '');
      if (ordem === 'dtCadastro') return (b.dtCadastro || '').localeCompare(a.dtCadastro || '');
      return 0;
    });

    // Subtitle
    const total = _all.filter(a => a.st === 'matriculado').length;
    const subtitle = document.getElementById('alunosSubtitle');
    if (subtitle) subtitle.textContent = `${_filtered.length} aluno${_filtered.length !== 1 ? 's' : ''} exibido${_filtered.length !== 1 ? 's' : ''} · ${total} matriculados`;

    _renderGrid();
  };

  /* ── Renderiza grid ou lista ── */
  const _renderGrid = () => {
    const container = document.getElementById('alunosGrid');
    if (!container) return;

    if (_filtered.length === 0) {
      container.innerHTML = `<div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">Nenhum aluno encontrado</div>
        <div class="empty-sub">Tente ajustar os filtros ou a busca</div>
      </div>`;
      return;
    }

    if (_view === 'grid') {
      container.innerHTML = `<div class="alunos-grid">${_filtered.map(_cardHTML).join('')}</div>`;
    } else {
      container.innerHTML = `<div class="alunos-lista">${_filtered.map(_rowHTML).join('')}</div>`;
    }
  };

  /* ── Card HTML ── */
  const _cardHTML = a => {
    const docsOk = Object.values(a.docs || {}).filter(Boolean).length;
    const docsPct = (docsOk / 5) * 100;
    const color = Utils.avatarColor(a.id);
    const avatarContent = a.foto
      ? `<img src="${a.foto}" alt="${Utils.esc(a.nome)}">`
      : Utils.initials(a.nome);
    const aler = a.alergias?.length ? `<span class="aluno-card-alergia" title="Tem alergia!">⚠️</span>` : '';
    return `
      <div class="aluno-card" onclick="Alunos.openPerfil('${a.id}')">
        ${aler}
        <div class="aluno-card-avatar" style="background:${a.foto ? 'transparent' : color}">
          ${avatarContent}
        </div>
        <div class="aluno-card-nome">${Utils.esc(a.nome)}</div>
        ${a.apelido ? `<div class="aluno-card-apelido">"${Utils.esc(a.apelido)}"</div>` : ''}
        <div class="aluno-card-meta">
          <span class="badge ${Utils.salaBadge(a.turma)}">${Utils.salaLabel(a.turma)}</span>
          <span class="badge badge-ghost">${Utils.calcAge(a.nasc)}</span>
        </div>
        <div class="aluno-card-footer">
          <span>${a.telMae || a.telPai ? '📞 ' + (a.telMae || a.telPai).slice(0,14) : '—'}</span>
          <span title="Documentos: ${docsOk}/5">${docsOk < 5 ? '📋 ' + docsOk + '/5' : '✅'}</span>
        </div>
        <div class="aluno-card-docs-bar">
          <div class="aluno-card-docs-bar-fill" style="width:${docsPct}%;background:${docsPct===100?'var(--success)':docsPct>=60?'var(--warning)':'var(--danger)'}"></div>
        </div>
      </div>`;
  };

  /* ── Row HTML ── */
  const _rowHTML = a => {
    const docsOk = Object.values(a.docs || {}).filter(Boolean).length;
    const color = Utils.avatarColor(a.id);
    const avatarContent = a.foto
      ? `<img src="${a.foto}" alt="${Utils.esc(a.nome)}">`
      : Utils.initials(a.nome);
    return `
      <div class="aluno-row" onclick="Alunos.openPerfil('${a.id}')">
        <div class="aluno-row-avatar" style="background:${a.foto ? 'transparent' : color}">${avatarContent}</div>
        <div class="aluno-row-info">
          <div class="aluno-row-nome">${Utils.esc(a.nome)}${a.apelido ? ` <span style="color:var(--ink-3);font-weight:400">("${Utils.esc(a.apelido)}")</span>` : ''}</div>
          <div class="aluno-row-sub">${Utils.salaLabel(a.turma)} · ${Utils.calcAge(a.nasc)} · ${a.mae || a.pai || '—'}</div>
        </div>
        <div class="aluno-row-badges">
          ${a.alergias?.length ? `<span class="badge badge-danger">⚠️ Alergia</span>` : ''}
          ${docsOk < 5 ? `<span class="badge badge-warning">📋 ${docsOk}/5</span>` : ''}
        </div>
        <div class="aluno-row-action">
          <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();Matriculas.openWizard('${a.id}')" title="Editar matrícula">✏️</button>
          <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();Alunos.openPerfil('${a.id}')" title="Ver perfil">👁️</button>
        </div>
      </div>`;
  };

  /* ── Toggle grid/lista ── */
  const toggleView = () => {
    _view = _view === 'grid' ? 'lista' : 'grid';
    const lbl  = document.getElementById('lblToggleView');
    const icon = document.getElementById('iconToggleView');
    if (lbl) lbl.textContent = _view === 'grid' ? 'Lista' : 'Grade';
    if (icon) {
      icon.innerHTML = _view === 'grid'
        ? '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>'
        : '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>';
    }
    _renderGrid();
  };

  /* ══════════════════════════════════════════════
     PERFIL COMPLETO (drawer lateral)
  ══════════════════════════════════════════════ */
  const openPerfil = async id => {
    _currentAlunoId = id;
    const a = await DB.get('matriculas', id);
    if (!a) return;

    Drawer.open(`👶 ${a.nome.split(' ')[0]}`, `
      <div class="perfil-header">
        <div class="perfil-avatar-lg" style="background:${a.foto ? 'transparent' : Utils.avatarColor(a.id)}"
             onclick="Alunos._fotoClick('${id}')" title="Clique para trocar foto">
          ${a.foto ? `<img src="${a.foto}" alt="${Utils.esc(a.nome)}">` : Utils.initials(a.nome)}
          <div class="perfil-avatar-cam">📷</div>
          <input type="file" id="perfilFotoInput" accept="image/*" style="display:none" onchange="Alunos._fotoChange('${id}',this)">
        </div>
        <div style="flex:1;min-width:0">
          <div class="perfil-nome">${Utils.esc(a.nome)}</div>
          ${a.apelido ? `<div style="opacity:.75;font-size:var(--fs-sm)">"${Utils.esc(a.apelido)}"</div>` : ''}
          <div class="perfil-meta">${Utils.salaLabel(a.turma)} · ${Utils.calcAge(a.nasc)} · Matr. ${Utils.fmtDate(a.dtCadastro)}</div>
        </div>
        <button class="btn btn-ghost btn-xs" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)"
          onclick="Matriculas.openWizard('${id}')">✏️ Editar</button>
      </div>

      <div class="drawer-tabs" id="perfilTabs">
        <button class="drawer-tab active" onclick="Alunos._tab('dados','${id}',this)">📋 Dados</button>
        <button class="drawer-tab" onclick="Alunos._tab('familia','${id}',this)">👨‍👩‍👧 Família</button>
        <button class="drawer-tab" onclick="Alunos._tab('saude','${id}',this)">🏥 Saúde</button>
        <button class="drawer-tab" onclick="Alunos._tab('financeiro','${id}',this)">💰 Financeiro</button>
        <button class="drawer-tab" onclick="Alunos._tab('docs','${id}',this)">📁 Documentos</button>
        <button class="drawer-tab" onclick="Alunos._tab('presenca','${id}',this)">✅ Presença</button>
      </div>

      <div id="perfilTabContent"></div>
    `);

    _loadTab('dados', a);
  };

  const _tab = (tab, id, btn) => {
    document.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    DB.get('matriculas', id).then(a => _loadTab(tab, a));
  };

  const _loadTab = async (tab, a) => {
    const el = document.getElementById('perfilTabContent');
    if (!el || !a) return;
    if (tab === 'dados')      el.innerHTML = _tabDados(a);
    if (tab === 'familia')    el.innerHTML = _tabFamilia(a);
    if (tab === 'saude')      el.innerHTML = _tabSaude(a);
    if (tab === 'financeiro') el.innerHTML = await _tabFinanceiro(a);
    if (tab === 'docs')       el.innerHTML = _tabDocs(a);
    if (tab === 'presenca')   el.innerHTML = await _tabPresenca(a);
  };

  const _tabDados = a => `
    <div class="grid-2" style="gap:var(--sp-md)">
      ${_infoLine('👶 Nome completo', a.nome)}
      ${_infoLine('🎂 Nascimento', `${Utils.fmtDate(a.nasc)} (${Utils.calcAge(a.nasc)})`)}
      ${_infoLine('🏫 Sala', Utils.salaLabel(a.turma))}
      ${_infoLine('🩺 Tipo sanguíneo', a.ts || '—')}
      ${_infoLine('📋 CPF', a.cpf ? Utils.fmtCPF(a.cpf) : '—')}
      ${_infoLine('📅 Vencimento', `Dia ${a.diaVenc || 10} · ${Utils.money(a.valorMens || 933.88)}/mês`)}
      ${_infoLine('📌 Status', _statusBadge(a.st))}
      ${_infoLine('📆 Cadastro', Utils.fmtDate(a.dtCadastro))}
    </div>`;

  const _tabFamilia = a => `
