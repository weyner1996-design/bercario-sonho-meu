    const cfg   = (await DB.getAll('config'))[0] || {};
    const salas = await DB.getAll('salas');
    const salaId= cfg.painelTvSala || salas[0]?.id || '';
    const sala  = salas.find(s => s.id === salaId) || salas[0] || {};
    const intervalo = (cfg.painelTvIntervalo || 25) * 1000;
    const slidesAtivos = cfg.painelTvSlides ?? [0,1,2,3,4];

    // Carrega todos os dados necessários
    _dados = {
      sala,
      mats:      (await DB.getAll('matriculas')).filter(a => a.st === 'matriculado' && a.turma === salaId),
      presencas: (await DB.getAll('presenca')).filter(p => p.data === Utils.today()),
      planej:    (await DB.getAll('planejamentos')).filter(p => p.salaId === salaId && p.data === Utils.today()),
      cardapio:  await DB.getAll('refeicoes').catch(()=>[]),
      agenda:    await DB.getAll('agenda').catch(()=>[]),
      dicas:     (await DB.getAll('dicas_regras')).filter(d => d.ativo),
      avisos:    (await DB.getAll('avisos')),
    };

    // Cria e injeta o overlay do painel
    _criarOverlay(sala, slidesAtivos, intervalo);

    // Fullscreen API
    const el = document.getElementById('tvOverlay');
    try {
      if (el.requestFullscreen)            await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    } catch(e) { /* Fullscreen negado — continua em janela */ }

    _running = true;
    _slide   = 0;
    _irSlide(slidesAtivos[0] ?? 0, slidesAtivos);
    _timer = setInterval(() => {
      const idx = slidesAtivos.indexOf(_slide);
      const next = slidesAtivos[(idx + 1) % slidesAtivos.length];
      _irSlide(next, slidesAtivos);
    }, intervalo);
  };

  // ── Overlay fullscreen ────────────────────────────────────
  const _criarOverlay = (sala, slidesAtivos, intervalo) => {
    document.getElementById('tvOverlay')?.remove();
    const cor  = sala.cor  || '#12586A';
    const nome = sala.nome || 'Sala';

    const div = document.createElement('div');
    div.id = 'tvOverlay';
    div.innerHTML = `
      <div class="tv-shell">
        <!-- Topbar -->
        <div class="tv-top" style="background:${cor}">
          <div style="display:flex;align-items:center;gap:14px">
            <span style="font-size:26px">🌙</span>
            <div>
              <div class="tv-school">Berçário Sonho Meu</div>
              <div class="tv-sala" id="tvNomeSala">${Utils.esc(nome)}${sala.apelido?' · '+sala.apelido:''}</div>
            </div>
          </div>
          <div style="text-align:right">
            <div class="tv-time" id="tvTime2">00:00</div>
            <div class="tv-date" id="tvDate2"></div>
          </div>
          <button class="tv-exit-btn" onclick="PainelTV.stop()" title="Sair (ESC)">✕</button>
        </div>

        <!-- Slides -->
        <div class="tv-body" id="tvSlidesBody">
          ${[0,1,2,3,4].map(i => `<div class="tv-slide" id="tvSlide_${i}" style="display:none"></div>`).join('')}
        </div>

        <!-- Footer -->
        <div class="tv-footer" style="border-top-color:${cor}">
          <span class="tv-footer-brand" style="color:${cor}">🌙 Berçário Sonho Meu · v5.0</span>
          <div id="tvDots" style="display:flex;gap:6px;align-items:center"></div>
          <span id="tvSlideLabel" style="font-size:12px;color:var(--ink);opacity:.5"></span>
        </div>
      </div>`;

    document.body.appendChild(div);

    // Relógio
    _atualizarRelogio();
    const rlj = setInterval(_atualizarRelogio, 1000);
    div._rlj = rlj;

    // ESC para sair
    document.addEventListener('keydown', _onKeyDown);
  };

  const _onKeyDown = e => { if (e.key === 'Escape') stop(); };

  const _atualizarRelogio = () => {
    const agora = new Date();
    const DIAS_PT  = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const t2 = document.getElementById('tvTime2');
    const d2 = document.getElementById('tvDate2');
    if (t2) t2.textContent = agora.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
    if (d2) d2.textContent = `${DIAS_PT[agora.getDay()]}, ${agora.getDate()} ${MESES_PT[agora.getMonth()]} ${agora.getFullYear()}`;
  };

  // ── Ir para slide ─────────────────────────────────────────
  const _irSlide = (idx, slidesAtivos) => {
    _slide = idx;
    // Esconde todos, mostra o atual
    [0,1,2,3,4].forEach(i => {
      const el = document.getElementById(`tvSlide_${i}`);
      if (el) el.style.display = (i === idx) ? 'flex' : 'none';
    });

    // Dots
    const dots = document.getElementById('tvDots');
    if (dots) dots.innerHTML = slidesAtivos.map(i =>
      `<div style="width:8px;height:8px;border-radius:50%;background:${i===idx?'var(--sala-cor)':'var(--bg-2)'};border:2px solid var(--sala-cor);transition:.3s"></div>`
    ).join('');

    const lbl = document.getElementById('tvSlideLabel');
    if (lbl) lbl.textContent = SLIDE_LABELS[idx] || '';

    // Renderiza conteúdo do slide
    const renders = {
      0: _renderPresenca,
      1: _renderCardapio,
      2: _renderAtividade,
      3: _renderAvisos,
      4: _renderAniversarios,
    };
    if (renders[idx]) renders[idx]();
  };

  // ── Renderizadores de cada slide ──────────────────────────
  const _renderPresenca = () => {
    const el = document.getElementById('tvSlide_0');
    if (!el) return;
    const alunos    = _dados.mats || [];
    const presencas = _dados.presencas || [];
    let pres = 0, aus = 0, just = 0;

    const chips = alunos.map(a => {
      const pRec = presencas.find(p => p.alunoId === a.id);
      const st   = pRec?.status || '';
      const cor  = _avatarCor(a.id);
      if (st === 'P') pres++;
      else if (st === 'A') aus++;
      else if (st === 'AJ') just++;
      const ico  = st === 'P' ? '✅' : st === 'A' ? '❌' : st === 'AJ' ? '📝' : '⬜';
      const cls  = st === 'P' ? 'presente' : st === 'A' ? 'ausente' : st === 'AJ' ? 'justific' : '';
      const stLbl= st === 'P' ? 'Presente' : st === 'A' ? 'Ausente' : st === 'AJ' ? 'Justificado' : 'Não marcado';
      const temAl = (a.alergias || []).length > 0;
      return `
        <div class="tv-aluno-chip ${cls}" style="transition:all .3s;cursor:default">
          <div class="tv-av" style="background:${cor}">${_initials(a.nome)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0D1B2A">${Utils.esc(a.nome.split(' ')[0])}</div>
            <div style="font-size:11px;color:#8fa3b1;margin-top:1px">${ico} ${stLbl}</div>
            ${temAl ? '<span class="tv-alergia-badge">⚠ Alergia</span>' : ''}
          </div>
        </div>`;
    }).join('');

    const total = alunos.length;
    const pct   = total ? Math.round(pres / total * 100) : 0;

    el.innerHTML = `
      <div style="display:flex;flex-direction:column;width:100%;height:100%;padding:20px 28px;gap:14px">
        <div class="tv-slide-title">👶 Alunos da Sala
          <span style="font-size:13px;font-weight:400;color:#8fa3b1;margin-left:8px">${pres} presentes · ${aus} ausentes${just ? ' · '+just+' justificados' : ''} · ${total} total</span>
        </div>
        ${total ? `<div style="height:6px;background:#e4f0f3;border-radius:6px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:#1A7A4A;border-radius:6px;transition:width 1s ease"></div>
        </div>` : ''}
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;flex:1;align-content:start;overflow:hidden">
          ${chips || '<div style="opacity:.4;font-size:16px;text-align:center;margin:auto">Nenhum aluno nesta sala</div>'}
        </div>
      </div>`;
  };

  const _renderCardapio = () => {
    const el = document.getElementById('tvSlide_1');
    if (!el) return;
    const DIAS_N = ['','Seg','Ter','Qua','Qui','Sex'];
    const DIAS_FULL = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const semana = _semanaAtual();
    const hoje   = Utils.today();
    const alunos = _dados.mats || [];
    const refeicoes = _dados.cardapio || [];
    const comAlergia = alunos.filter(a => (a.alergias||[]).length > 0);

    const _refeicao = (data, tipo) => {
      const r = refeicoes.find(r => r.data === data && r.tipo === tipo);
      return r?.descricao || r?.item || '';
    };

    const colunas = [1,2,3,4,5].map(d => {
      const data   = _addDays(semana, d);
      const isHoje = data === hoje;
      const cafe   = _refeicao(data, 'cafe') || _refeicao(data, 'café') || _refeicao(data, 'desjejum') || '';
      const almoco = _refeicao(data, 'almoco') || _refeicao(data, 'almoço') || '';
      const lanche = _refeicao(data, 'lanche') || '';
      return `
        <div class="tv-cardapio-col${isHoje ? ' hoje' : ''}">
          <div style="font-size:14px;font-weight:800;color:var(--sala-cor,#12586A);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">${DIAS_N[d]}</div>
          <div class="tv-meal-label">☀️ Café</div>
          <div class="tv-meal-item">${Utils.esc(cafe) || '<span style="opacity:.35">—</span>'}</div>
          <div class="tv-meal-label" style="margin-top:6px">🍽️ Almoço</div>
          <div class="tv-meal-item">${Utils.esc(almoco) || '<span style="opacity:.35">—</span>'}</div>
          <div class="tv-meal-label" style="margin-top:6px">🍎 Lanche</div>
          <div class="tv-meal-item">${Utils.esc(lanche) || '<span style="opacity:.35">—</span>'}</div>
        </div>`;
    }).join('');

    el.innerHTML = `
      <div style="display:flex;flex-direction:column;width:100%;height:100%;padding:20px 28px;gap:14px">
        <div class="tv-slide-title">🍽️ Cardápio da Semana</div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex:1">${colunas}</div>
        ${comAlergia.length ? `
          <div style="background:#E8644A;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px">
            <span style="font-size:18px">⚠️</span>
            <span>Alergias: ${comAlergia.map(a=>Utils.esc(a.nome.split(' ')[0])+' → '+a.alergias.join(', ')).join(' · ')}</span>
          </div>` : ''}
      </div>`;
  };

  const _renderAtividade = () => {
    const el = document.getElementById('tvSlide_2');
    if (!el) return;
    const plano = (_dados.planej || [])[0];

    el.innerHTML = `
      <div style="display:flex;flex-direction:column;width:100%;height:100%;padding:20px 28px;gap:14px">
        <div class="tv-slide-title">📋 Atividade de Hoje</div>
        <div class="tv-atividade-center">
          ${plano ? `
            <div style="font-size:64px;line-height:1">🎨</div>
            <div style="font-size:34px;font-weight:800;color:var(--sala-cor,#12586A);line-height:1.1;max-width:700px">${Utils.esc(plano.atividade||plano.titulo||'')}</div>
            ${plano.objetivo ? `<div style="font-size:17px;color:#4a5568;max-width:600px;line-height:1.6">${Utils.esc(plano.objetivo)}</div>` : ''}
            ${plano.materiais ? `<div style="background:#fff;border-radius:14px;padding:12px 22px;font-size:15px;color:#1a2533;box-shadow:0 2px 10px rgba(0,0,0,.07)">🎒 <strong>Materiais:</strong> ${Utils.esc(plano.materiais)}</div>` : ''}
          ` : `
            <div style="opacity:.3;display:flex;flex-direction:column;align-items:center;gap:12px">
              <div style="font-size:64px">📋</div>
              <div style="font-size:18px;color:#4a5568">Nenhuma atividade planejada para hoje</div>
              <div style="font-size:13px;color:#8fa3b1">Acesse Pedagógico para adicionar</div>
            </div>`}
        </div>
      </div>`;
  };

  const _renderAvisos = () => {
    const el = document.getElementById('tvSlide_3');
    if (!el) return;
    const dicas  = _dados.dicas  || [];
    const avisos = _dados.avisos || [];
    const dica   = dicas.length ? dicas[new Date().getDate() % dicas.length] : null;
    const DICA_DEFAULT = 'Brincar é a linguagem da infância. Cada atividade é uma oportunidade de aprender e crescer! 💛';

    el.innerHTML = `
      <div style="display:flex;flex-direction:column;width:100%;height:100%;padding:20px 28px;gap:14px">
        <div class="tv-slide-title">📢 Avisos & Dicas</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1">
          <div style="background:var(--white);border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;gap:14px">
            <div style="font-size:32px">🕐</div>
            <div>
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--sala-cor);letter-spacing:.5px;margin-bottom:6px">Horários</div>
              <div style="font-size:16px;line-height:1.6;color:var(--ink)">Entrada: 06h às 08h<br>Saída: 17h às 18h<br>Tolerância: 15 minutos</div>
            </div>
          </div>

          <div style="background:var(--white);border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;gap:14px">
            <div style="font-size:32px">📢</div>
            <div>
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--sala-cor);letter-spacing:.5px;margin-bottom:6px">Avisos</div>
              <div style="font-size:15px;line-height:1.6;color:var(--ink)">
                ${avisos.slice(0,3).map(a => `• ${Utils.esc(a.texto||a.msg||'')}`).join('<br>') || '• Nenhum aviso no momento'}
              </div>
            </div>
          </div>

          <div style="background:var(--sala-cor);border-radius:14px;padding:20px;color:#fff;grid-column:1/-1;display:flex;gap:14px;align-items:center">
            <div style="font-size:36px">💡</div>
            <div>
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;opacity:.6;letter-spacing:.5px;margin-bottom:6px">Dica do Dia</div>
              <div style="font-size:18px;line-height:1.5;font-weight:500">"${Utils.esc(dica?.texto || DICA_DEFAULT)}"</div>
            </div>
          </div>
        </div>
      </div>`;
  };

  const _renderAniversarios = () => {
    const el = document.getElementById('tvSlide_4');
    if (!el) return;
    const mesAtual = new Date().getMonth() + 1;
    const hojeNum  = new Date().getDate();
    const MESES_PT = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    const aniv = (_dados.mats || [])
      .filter(a => a.nasc && parseInt(a.nasc.slice(5,7)) === mesAtual)
      .map(a => ({ ...a, dia: parseInt(a.nasc.slice(8,10)) }))
      .sort((x,y) => x.dia - y.dia);

    el.innerHTML = `
      <div style="display:flex;flex-direction:column;width:100%;height:100%;padding:20px 28px;gap:14px">
        <div class="tv-slide-title">🎂 Aniversários — ${MESES_PT[mesAtual]}</div>
        <div style="display:flex;flex-direction:column;gap:10px;flex:1;overflow:hidden">
          ${!aniv.length
            ? '<div style="opacity:.35;text-align:center;margin:auto;font-size:18px">🎂 Nenhum aniversário este mês</div>'
            : aniv.map(a => {
                const isHoje = a.dia === hojeNum;
                const cor    = _avatarCor(a.id);
                return `
                  <div style="background:var(--white);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:16px;${isHoje?'border:3px solid var(--amber);box-shadow:0 4px 16px rgba(245,158,11,.2);':''}">
                    <div style="width:50px;height:50px;border-radius:50%;background:${cor};display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0">${_initials(a.nome)}</div>
                    <div style="font-weight:700;font-size:20px;flex:1">${Utils.esc(a.nome)} ${isHoje?'🎉':''}</div>
                    <div style="font-size:16px;color:var(--ink);opacity:.6">Dia ${a.dia}</div>
                  </div>`;
              }).join('')
          }
        </div>
      </div>`;
  };

  // ── Stop ──────────────────────────────────────────────────
  const stop = () => {
    _running = false;
    clearInterval(_timer);
    _timer = null;
    document.removeEventListener('keydown', _onKeyDown);

    const ov = document.getElementById('tvOverlay');
    if (ov) {
      clearInterval(ov._rlj);
      ov.style.transition = 'opacity .3s';
      ov.style.opacity = '0';
      setTimeout(() => ov.remove(), 300);
    }

    // Sai do fullscreen
    try {
      if (document.exitFullscreen)            document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch(e) {}

    Toast.show('success', '📺 Painel TV encerrado');
  };

  return {
    render, play, stop, salvarConfig,
    novaDica, editarDica, removerDica,
    _salvarDica,
  };
})();


/* ============================================================
   BOOT
   ============================================================ */
document.addEventListener('DOMContentLoaded', async () => {
  // ── DIAGNÓSTICO: mostra onde o boot para ───────────────
  const _diag = (msg) => {
    let d = document.getElementById('_bootDiag');
    if (!d) {
      d = document.createElement('div');
      d.id = '_bootDiag';
      d.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9999999;background:#1a1a2e;color:#f5c842;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;font-family:monospace;pointer-events:none;transition:opacity .3s';
      document.body.appendChild(d);
    }
    d.textContent = '⚙ ' + msg;
  };
  const _diagHide = () => {
    const d = document.getElementById('_bootDiag');
    if (d) { d.style.opacity = '0'; setTimeout(()=>d.remove(), 400); }
  };
  // Inicializa banco
  await DB.init();

  // v5.0 — Auth: verifica sessão ou mostra tela de login
  _diag('Iniciando banco de dados...');
  Sidebar.initDesktop();
  _diag('Verificando sessão...');
  await Auth.init();
  _diagHide();

  // Inicializa navegação
  initNavigation();

  // Data e usuário
  Topbar.update();
  setInterval(Topbar.update, 60000);
  await Topbar.setUserInfo();

  // Badges iniciais
  await Badges.refresh();

  // Registra módulos no router
  Router.register('dashboard', {
    onEnter: () => Dashboard.render()
  });

  Router.register('matriculas', {
    onEnter: () => Matriculas.render()
  });

  Router.register('alunos', {
    onEnter: () => Alunos.render()
  });

  Router.register('presenca', {
    onEnter: () => Presenca.render()
  });

  Router.register('documentos', {
    onEnter: () => { Docs._uploadQueue = []; Docs.render(); }
  });

  Router.register('mensalidades', {
    onEnter: () => Mens.render()
  });

  Router.register('cobracas', {
    onEnter: () => Cobr.render()
  });

  Router.register('recibos', {
    onEnter: () => Recibos.render()
  });

  Router.register('gastos', {
    onEnter: () => Gastos.render()
  });

  Router.register('estoque', {
    onEnter: () => Est.render()
  });

  Router.register('uniforme', {
    onEnter: () => Unif.render()
  });

  Router.register('agenda', {
    onEnter: () => Agenda.render()
  });

  Router.register('cozinha', {
    onEnter: () => Cozinha.render()
  });

  Router.register('funcionarios', {
    onEnter: () => Funcs.render()
  });

  Router.register('manutencao', {
    onEnter: () => Manut.render()
  });

  Router.register('importar', {
    onEnter: () => Imp.render()
  });

  Router.register('paineltv', {
    onEnter: () => PainelTV.render()
  });

    Router.register('pedagogico', {
    onEnter: () => Pedagogico.render()
  });

    Router.register('usuarios', {
    onEnter: () => {
      if (Auth.getPerfil() !== 'master') { Router.go('dashboard'); return; }
      Usuarios.render();
    }
  });

  Router.register('config', {
    onEnter: () => Cfg.render()
  });

  // Render inicial — só se já logado
  const jaLogado = !!Auth.getSessao();
  if (jaLogado) {
    await Dashboard.render();
    const nome = Auth.getSessao().nome;
    const ehWeyner = nome.toLowerCase().includes('weyner');
    setTimeout(() => Toast.show('success', ehWeyner
      ? `🌙 Bem-vindo de volta, Weyner!`
      : `✅ Bem-vindo(a), ${nome.split(' ')[0]}!`
    ), 400);
  }

  // PWA + Polish
  PWA.init();
  Polish.init();

  // Verifica mensalidades atrasadas
  const atrasadas = await DB.query('mensalidades', m => m.st === 'atrasado');
  if (atrasadas.length > 0) {
    setTimeout(() => Toast.show('warning', `⚠️ ${atrasadas.length} mensalidade(s) atrasada(s)`), 1800);
  }
});
</script>
