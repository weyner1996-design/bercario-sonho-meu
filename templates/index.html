    <div style="display:flex;flex-direction:column;gap:var(--sp-md)">
      <div class="info-box teal">
        <b>👩 Mãe</b><br>
        ${Utils.esc(a.mae || '—')}<br>
        ${a.cpfMae ? `<small>CPF: ${Utils.fmtCPF(a.cpfMae)}</small><br>` : ''}
        ${a.telMae ? `<a href="tel:${a.telMae.replace(/\D/g,'')}">📞 ${Utils.esc(a.telMae)}</a><br>` : ''}
        ${a.emailMae ? `<small>✉️ ${Utils.esc(a.emailMae)}</small>` : ''}
      </div>
      ${a.pai ? `<div class="info-box teal">
        <b>👨 Pai</b><br>
        ${Utils.esc(a.pai)}<br>
        ${a.cpfPai ? `<small>CPF: ${Utils.fmtCPF(a.cpfPai)}</small><br>` : ''}
        ${a.telPai ? `<a href="tel:${a.telPai.replace(/\D/g,'')}">📞 ${Utils.esc(a.telPai)}</a><br>` : ''}
        ${a.emailPai ? `<small>✉️ ${Utils.esc(a.emailPai)}</small>` : ''}
      </div>` : ''}
      ${a.telMae ? `<a href="https://wa.me/55${a.telMae.replace(/\D/g,'')}" target="_blank" rel="noopener" class="btn btn-teal btn-sm" style="width:100%;justify-content:center">
        💬 WhatsApp da Mãe
      </a>` : ''}
    </div>`;

  const _tabSaude = a => {
    const al = a.alergias || [];
    return `
      ${al.length ? `<div class="alergia-alert">
        <div class="alergia-alert-icon">⚠️</div>
        <div>
          <div style="font-weight:800;color:var(--danger);font-size:var(--fs-sm);margin-bottom:4px">ALERGIAS — Atenção redobrada!</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">${al.map(x => `<span class="alergia-tag">⚠️ ${Utils.esc(x)}</span>`).join('')}</div>
        </div>
      </div>` : '<div class="info-box success" style="margin-bottom:var(--sp-md)">✅ Sem alergias registradas</div>'}
      <div class="grid-2" style="gap:var(--sp-md)">
        ${_infoLine('🩺 Tipo Sanguíneo', a.ts || '—')}
        ${_infoLine('🏥 Plano de Saúde', a.plano || '—')}
        ${_infoLine('👩‍⚕️ Pediatra', a.ped || '—')}
        ${_infoLine('📞 Tel. Pediatra', a.telPed || '—')}
      </div>
      ${a.meds ? `<div class="info-box sun" style="margin-top:var(--sp-md)">
        <b>💊 Medicamentos de Uso Contínuo</b><br>${Utils.esc(a.meds)}
      </div>` : ''}
      ${a.obs ? `<div class="info-box teal" style="margin-top:var(--sp-md)">
        <b>📝 Observações</b><br>${Utils.esc(a.obs)}
      </div>` : ''}`;
  };

  const _tabFinanceiro = async a => {
    const mensalidades = await DB.query('mensalidades', m => m.alunoId === a.id);
    mensalidades.sort((x, y) => (y.ref || '').localeCompare(x.ref || ''));
    const ST = { pago: ['✅','success'], pendente: ['🕐','warning'], atrasado: ['❌','danger'] };
    return `
      <div style="margin-bottom:var(--sp-md)">
        <div style="font-weight:700;font-size:var(--fs-sm);color:var(--ink-2);margin-bottom:var(--sp-sm)">Histórico de Mensalidades</div>
        ${mensalidades.length === 0
          ? '<div class="empty-state" style="padding:var(--sp-xl)"><div class="empty-icon">💸</div><div class="empty-title">Nenhuma mensalidade</div></div>'
          : `<div style="display:flex;flex-direction:column;gap:4px">
              ${mensalidades.slice(0,12).map(m => {
                const [ic,cl] = ST[m.st] || ['?','ghost'];
                return `<div class="aluno-row" style="padding:8px 12px;cursor:default">
                  <span style="font-size:16px">${ic}</span>
                  <div style="flex:1">
                    <div style="font-weight:600;font-size:var(--fs-xs)">${m.ref || '—'}</div>
                    <div style="font-size:var(--fs-xs);color:var(--ink-3)">Venc. ${Utils.fmtDate(m.venc)}</div>
                  </div>
                  <div style="text-align:right">
                    <div style="font-weight:700;font-size:var(--fs-sm)">${Utils.money(m.valor)}</div>
                    <span class="badge badge-${cl}">${m.st}</span>
                  </div>
                </div>`;
              }).join('')}
            </div>`
        }
      </div>
      <button class="btn btn-primary btn-sm" style="width:100%" onclick="Router.go('mensalidades')">Ver todas as mensalidades</button>`;
  };

  const _tabDocs = a => {
    const docs = a.docs || {};
    const docItems = [
      ['img','🖊️','Autorização de Imagem'],
      ['quest','📋','Questionário de Saúde'],
      ['contrato','📝','Contrato Assinado'],
      ['rg','🪪','RG / Certidão de Nascimento'],
      ['vacina','💉','Cartão de Vacinas'],
    ];
    const ok = Object.values(docs).filter(Boolean).length;
    return `
      <div style="margin-bottom:var(--sp-md)">
        <div style="display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:4px">
          <span>Completude dos documentos</span><span>${ok}/5</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ${ok===5?'success':ok>=3?'warning':'danger'}" style="width:${ok/5*100}%"></div>
        </div>
      </div>
      ${docItems.map(([k,ic,lbl]) => `
        <div class="checklist-item ${docs[k]?'ok':'missing'}" style="margin-bottom:6px">
          <span style="font-size:18px">${ic}</span>
          <span style="flex:1;font-weight:600;font-size:var(--fs-sm)">${lbl}</span>
          <span class="badge ${docs[k]?'badge-success':'badge-danger'}">${docs[k]?'✅ OK':'❌ Faltando'}</span>
        </div>`).join('')}
      <button class="btn btn-ghost btn-sm" style="margin-top:var(--sp-md);width:100%" onclick="Matriculas.openWizard('${a.id}')">
        📎 Atualizar documentos
      </button>`;
  };

  const _tabPresenca = async a => {
    const now = new Date();
    const mes = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const registros = await DB.query('presenca', r => r.alunoId === a.id && (r.data || '').startsWith(mes));
    const presentes  = registros.filter(r => r.estado === 'presente').length;
    const justific   = registros.filter(r => r.estado === 'justific').length;
    const ausentes   = registros.filter(r => r.estado === 'ausente').length;
    const total = presentes + justific + ausentes;
    const pct = total ? Math.round((presentes + justific) / total * 100) : 0;

    // Heatmap deste mês
    const diasMes = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const primeiroDS = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
    const regMap = {};
    registros.forEach(r => { if (r.data) regMap[r.data] = r.estado; });

    let heatCells = Array(primeiroDS).fill('<div class="freq-heatmap-day empty"></div>');
    for (let d = 1; d <= diasMes; d++) {
      const dateStr = `${mes}-${String(d).padStart(2,'0')}`;
      const est = regMap[dateStr];
      const isFuturo = dateStr > Utils.today();
      const isHoje = dateStr === Utils.today();
      let cls = isFuturo ? 'futuro' : (est || 'ausente');
      const dot = isHoje ? ' hoje' : '';
      heatCells.push(`<div class="freq-heatmap-day ${cls}${dot}" title="${Utils.fmtDate(dateStr)}: ${est||'sem registro'}">${d}</div>`);
    }

    // Agrupa em semanas
    let weeks = [];
    for (let i = 0; i < heatCells.length; i += 7) weeks.push(heatCells.slice(i, i+7));

    return `
      <div style="margin-bottom:var(--sp-xl)">
        <div style="font-weight:700;font-size:var(--fs-sm);color:var(--ink-2);margin-bottom:var(--sp-sm)">
          Frequência — ${Utils.MONTHS_LONG[now.getMonth()]}/${now.getFullYear()}
        </div>
        <div style="display:flex;gap:var(--sp-xl);margin-bottom:var(--sp-md)">
          ${_freqKPI('✅ Presentes', presentes, 'success')}
          ${_freqKPI('⚡ Justificados', justific, 'warning')}
          ${_freqKPI('❌ Ausentes', ausentes, 'danger')}
          ${_freqKPI('📊 Taxa', pct+'%', pct>=75?'success':pct>=50?'warning':'danger')}
        </div>
        <div class="freq-heatmap">
          <div class="freq-heatmap-week" style="margin-bottom:2px">
            ${['D','S','T','Q','Q','S','S'].map(d => `<div style="width:26px;text-align:center;font-size:9px;color:var(--ink-4);font-weight:700">${d}</div>`).join('')}
          </div>
          ${weeks.map(w => `<div class="freq-heatmap-week">${w.join('')}</div>`).join('')}
        </div>
      </div>
      <button class="btn btn-teal btn-sm" style="width:100%" onclick="Presenca._goAlunoDate('${a.id}')">
        Ver no módulo de Presença
      </button>`;
  };

  const _freqKPI = (lbl, val, cls) => `
    <div style="text-align:center;flex:1">
      <div style="font-size:var(--fs-xl);font-weight:800;color:var(--${cls})">${val}</div>
      <div style="font-size:var(--fs-xs);color:var(--ink-3)">${lbl}</div>
    </div>`;

  const _infoLine = (lbl, val) => `
    <div>
      <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:2px">${lbl}</div>
      <div style="font-weight:600;font-size:var(--fs-sm)">${val}</div>
    </div>`;

  const _statusBadge = st => {
    const map = {matriculado:'badge-success',em_processo:'badge-warning',interessado:'badge-info',desligado:'badge-danger'};
    return `<span class="badge ${map[st]||'badge-ghost'}">${st||'—'}</span>`;
  };

  /* ── Foto do aluno ── */
  const _fotoClick = id => {
    document.getElementById('perfilFotoInput')?.click();
  };

  const _fotoChange = async (id, input) => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      const a = await DB.get('matriculas', id);
      if (!a) return;
      a.foto = e.target.result;
      await DB.save('matriculas', a);
      Toast.show('success', '📷 Foto atualizada!');
      await render();
      openPerfil(id);
    };
    reader.readAsDataURL(file);
  };

  return { render, search, applyFilters, toggleView, openPerfil, _tab, _fotoClick, _fotoChange };
})();

/* ============================================================
   PRESENÇA — Módulo completo com heatmap e ranking
   ============================================================ */
const Presenca = (() => {
  let _data = Utils.today();
  let _alunos = [];
  let _registros = {}; // { alunoId: { estado, obs } }
  let _heatmapMes = (() => {
    const n = new Date();
    return { year: n.getFullYear(), month: n.getMonth() };
  })();

  /* ── Render principal ── */
  const render = async () => {
    const dataEl = document.getElementById('presencaData');
    if (dataEl) dataEl.value = _data;
    _heatmapMes = { year: new Date(_data).getFullYear()||new Date().getFullYear(), month: parseInt(_data.split('-')[1]||new Date().getMonth()+1)-1 };
    await loadDay();
  };

  /* ── Carrega o dia selecionado ── */
  const loadDay = async () => {
    const dataEl = document.getElementById('presencaData');
    if (dataEl?.value) _data = dataEl.value;

    // v5: professora só vê sua sala
    const salaForcada = Auth.podeFiltrarSala() ? Auth.getSalaId() : null;
    const salaFil = salaForcada || document.getElementById('presencaSala')?.value || '';

    // Esconde seletor de sala para professoras
    const presSelSala = document.getElementById('presencaSala');
    if (presSelSala && salaForcada) {
      presSelSala.value = salaForcada;
      presSelSala.disabled = true;
      presSelSala.style.opacity = '.5';
    }

    // Carrega alunos matriculados
    _alunos = (await DB.getAll('matriculas')).filter(a => {
      if (a.st !== 'matriculado') return false;
      if (salaFil && a.turma !== salaFil) return false;
      return true;
    }).sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));

    // Carrega registros do dia
    const regs = await DB.query('presenca', r => r.data === _data);
    _registros = {};
    regs.forEach(r => { _registros[r.alunoId] = r; });

    _renderLista();
    _renderContador();
    await _renderHeatmap();
    await _renderHist7();
    await _renderRanking();

    // Subtitle
    const sub = document.getElementById('presencaSubtitle');
    if (sub) {
      const d = new Date(_data + 'T12:00:00');
      sub.textContent = `${Utils.WEEKDAYS[d.getDay()]}, ${Utils.fmtDate(_data)} · ${_alunos.length} aluno${_alunos.length!==1?'s':''}`;
    }
  };

  /* ── Render lista de presença ── */
  const _renderLista = () => {
    const el = document.getElementById('presencaLista');
    if (!el) return;

    if (_alunos.length === 0) {
      el.innerHTML = `<div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-title">Nenhum aluno encontrado</div>
        <div class="empty-sub">Ajuste o filtro de sala ou adicione matrículas</div>
      </div>`;
      return;
    }

    // Agrupa por sala
    const grupos = {};
    _alunos.forEach(a => {
      if (!grupos[a.turma]) grupos[a.turma] = [];
      grupos[a.turma].push(a);
    });

    const salas = ['s1','s2','s3'].filter(s => grupos[s]);
    el.innerHTML = salas.map(sala => {
      const lista = grupos[sala];
      const pres = lista.filter(a => _registros[a.id]?.estado === 'presente').length;
      return `
        <div class="presenca-grupo">
          <div class="presenca-grupo-header">
            ${Utils.salaLabel(sala)}
            <span class="badge badge-success" style="margin-left:auto">${pres}/${lista.length} presentes</span>
          </div>
          <div class="presenca-lista-wrap">
            ${lista.map(a => _itemHTML(a)).join('')}
          </div>
        </div>`;
    }).join('');
  };

  const _itemHTML = a => {
    const reg = _registros[a.id];
    const est = reg?.estado || '';
    const obs = reg?.obs || '';
    const color = Utils.avatarColor(a.id);
    const avatar = a.foto
      ? `<img src="${a.foto}" alt="${Utils.esc(a.nome)}">`
      : Utils.initials(a.nome);
    const alEl = a.alergias?.length
      ? `<span title="${a.alergias.join(', ')}" style="cursor:help">⚠️</span>` : '';

    return `
      <div class="presenca-item" id="pitem_${a.id}">
        <div class="presenca-item-avatar" style="background:${a.foto ? 'transparent' : color}">${avatar}</div>
        <div class="presenca-item-nome">
          ${Utils.esc(a.nome.split(' ').slice(0,2).join(' '))} ${alEl}
          <small>${Utils.salaLabel(a.turma)} · ${Utils.calcAge(a.nasc)}</small>
        </div>
        <div class="presenca-toggle">
          <button class="presenca-toggle-btn ${est==='presente'?'ativo presente':''}"
            onclick="Presenca.marcar('${a.id}','presente',this)">
            ✅ <span>Presente</span>
          </button>
          <button class="presenca-toggle-btn ${est==='ausente'?'ativo ausente':''}"
            onclick="Presenca.marcar('${a.id}','ausente',this)">
            ❌ <span>Ausente</span>
          </button>
          <button class="presenca-toggle-btn ${est==='justific'?'ativo justific':''}"
            onclick="Presenca.marcar('${a.id}','justific',this)">
            📝 <span>Just.</span>
          </button>
        </div>
        <button class="presenca-obs-toggle" onclick="Presenca._toggleObs('${a.id}')" title="Observação">💬</button>
      </div>
      <div class="presenca-obs-panel" id="obs_${a.id}">
        <div style="padding:6px var(--sp-lg) var(--sp-sm)">
          <input class="form-input" style="font-size:var(--fs-xs)" placeholder="Observação (opcional)..."
            value="${Utils.esc(obs)}"
            onchange="Presenca.saveObs('${a.id}',this.value)">
        </div>
      </div>`;
  };

  /* ── Marcar presença (auto-save) ── */
  const marcar = async (alunoId, estado, btn) => {
    const reg = _registros[alunoId] || { id: Utils.uuid(), alunoId, data: _data };

    // Toggle: se já está no mesmo estado, remove
    if (reg.estado === estado) {
      delete reg.estado;
      estado = '';
    } else {
      reg.estado = estado;
    }

    _registros[alunoId] = reg;

    // Atualiza UI do toggle
    const item = document.getElementById(`pitem_${alunoId}`);
    if (item) {
      item.querySelectorAll('.presenca-toggle-btn').forEach(b => b.classList.remove('ativo','presente','ausente','justific'));
      if (estado) btn.classList.add('ativo', estado);
    }

    // Salva
    if (estado) {
      await DB.save('presenca', reg);
    } else {
      if (reg.id) await DB.remove('presenca', reg.id);
    }

    _renderContador();
    await _renderHeatmap();
    await _renderHist7();
    await _renderRanking();
  };

  /* ── Salva observação ── */
  const saveObs = async (alunoId, obs) => {
    const reg = _registros[alunoId];
    if (!reg) return;
    reg.obs = obs;
    await DB.save('presenca', reg);
  };

  const _toggleObs = alunoId => {
    document.getElementById(`obs_${alunoId}`)?.classList.toggle('open');
  };

  /* ── Contador e barra de progresso ── */
  const _renderContador = () => {
    const total = _alunos.length;
    const pres  = _alunos.filter(a => _registros[a.id]?.estado === 'presente').length;
    const bar = document.getElementById('presencaProgressBar');
    const ctr = document.getElementById('presencaContador');
    if (bar) bar.style.width = total ? `${pres/total*100}%` : '0%';
    if (ctr) ctr.textContent = `${pres} de ${total} presentes`;
  };

  /* ── Navegação de data ── */
  const navDate = dir => {
    const [y, m, d] = _data.split('-').map(Number);
    const dt = new Date(y, m-1, d+dir);
    _data = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    const el = document.getElementById('presencaData');
    if (el) el.value = _data;
    loadDay();
  };

  const goToday = () => {
    _data = Utils.today();
    const el = document.getElementById('presencaData');
    if (el) el.value = _data;
    loadDay();
  };

  /* ── Limpar dia ── */
  const clearDay = async () => {
    Modal.confirm(
      `Limpar todas as marcações de <b>${Utils.fmtDate(_data)}</b>? As observações também serão apagadas.`,
      async () => {
        const regs = await DB.query('presenca', r => r.data === _data);
        for (const r of regs) await DB.remove('presenca', r.id);
        _registros = {};
        Toast.show('success', `🗑️ Presença de ${Utils.fmtDate(_data)} limpa`);
        _renderLista();
        _renderContador();
        await _renderHeatmap();
      },
      { title: '🗑️ Limpar Presença', danger: true, confirmLabel: 'Limpar' }
    );
  };

  /* ═══════════════════════════════════════════════
     HEATMAP MENSAL
  ═══════════════════════════════════════════════ */
  const _renderHeatmap = async () => {
    const el = document.getElementById('presencaHeatmap');
    const lbl = document.getElementById('heatmapMesLabel');
    if (!el) return;

    const { year, month } = _heatmapMes;
    if (lbl) lbl.textContent = `${Utils.MONTHS_SHORT[month]}/${year}`;

    const diasMes = new Date(year, month+1, 0).getDate();
    const primeiroDia = new Date(year, month, 1).getDay();
    const mesStr = `${year}-${String(month+1).padStart(2,'0')}`;

    // Busca todos os registros deste mês
    const regs = await DB.query('presenca', r => r.data?.startsWith(mesStr));
    // Conta por dia: { date: { presente: N, total: N } }
    const allAlunos = (await DB.getAll('matriculas')).filter(a => a.st === 'matriculado');
    const nTotal = allAlunos.length || 1;

    const byDay = {};
    regs.forEach(r => {
      if (!byDay[r.data]) byDay[r.data] = { pres: 0, just: 0 };
      if (r.estado === 'presente') byDay[r.data].pres++;
      if (r.estado === 'justific') byDay[r.data].just++;
    });

    // Cabeçalho dos dias da semana
    const headers = ['D','S','T','Q','Q','S','S'].map(d =>
      `<div class="heat-header">${d}</div>`).join('');

    // Células
    const cells = [];
    for (let i = 0; i < primeiroDia; i++) cells.push(`<div class="heat-cell empty"></div>`);
    for (let d = 1; d <= diasMes; d++) {
      const dateStr = `${mesStr}-${String(d).padStart(2,'0')}`;
      const isFuturo = dateStr > Utils.today();
      const isHoje = dateStr === Utils.today();
      const day = byDay[dateStr];
      let cls = 'futuro';
      if (!isFuturo && day) {
        const pct = (day.pres + day.just) / nTotal;
        cls = pct >= 0.75 ? 'verde' : pct >= 0.4 ? 'amarelo' : 'vermelho';
      } else if (!isFuturo) {
        cls = 'vermelho';
      }
      const dot = isHoje ? ' hoje' : '';
      const info = day ? `${day.pres}/${nTotal} pres.` : 'Sem registro';
      cells.push(`<div class="heat-cell ${cls}${dot}" onclick="Presenca._goDate('${dateStr}')" title="${Utils.fmtDate(dateStr)}: ${info}">${d}</div>`);
    }

    // Agrupa em semanas
    let rows = `<div class="heat-grid">${headers}`;
    for (let i = 0; i < cells.length; i += 7) {
      const week = cells.slice(i, i+7);
      while (week.length < 7) week.push('<div class="heat-cell empty"></div>');
      rows += week.join('');
    }
    rows += '</div>';
    el.innerHTML = rows;
  };

  const prevHeatmapMonth = async () => {
    let { year, month } = _heatmapMes;
    month--;
    if (month < 0) { month = 11; year--; }
    _heatmapMes = { year, month };
    await _renderHeatmap();
  };

  const nextHeatmapMonth = async () => {
    let { year, month } = _heatmapMes;
    month++;
    if (month > 11) { month = 0; year++; }
    _heatmapMes = { year, month };
    await _renderHeatmap();
  };

  const _goDate = dateStr => {
    _data = dateStr;
    const el = document.getElementById('presencaData');
    if (el) el.value = _data;
    loadDay();
  };

  /* ═══════════════════════════════════════════════
     HISTÓRICO 7 DIAS
  ═══════════════════════════════════════════════ */
  const _renderHist7 = async () => {
    const el = document.getElementById('presencaHist7');
    if (!el) return;

    const nTotal = (await DB.getAll('matriculas')).filter(a => a.st === 'matriculado').length || 1;
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      days.push(ds);
    }

    const regs = await DB.query('presenca', r => days.includes(r.data));
    const byDay = {};
    regs.forEach(r => {
      if (!byDay[r.data]) byDay[r.data] = 0;
      if (r.estado === 'presente' || r.estado === 'justific') byDay[r.data]++;
    });

    el.innerHTML = days.map(ds => {
      const n = byDay[ds] || 0;
      const pct = Math.round(n / nTotal * 100);
      const d = new Date(ds + 'T12:00:00');
      const lbl = ds === Utils.today() ? 'Hoje' : `${Utils.WEEKDAYS[d.getDay()]} ${d.getDate()}`;
      return `
        <div class="hist7-item" onclick="Presenca._goDate('${ds}')">
          <div class="hist7-data">${lbl}</div>
          <div class="hist7-bar-wrap"><div class="hist7-bar" style="width:${pct}%;background:${pct>=75?'var(--success)':pct>=40?'var(--warning)':'var(--danger)'}"></div></div>
          <div class="hist7-pct">${pct}%</div>
        </div>`;
    }).join('');
  };

  /* ═══════════════════════════════════════════════
     RANKING DO MÊS
  ═══════════════════════════════════════════════ */
  const _renderRanking = async () => {
    const el = document.getElementById('presencaRanking');
    if (!el) return;

    const now = new Date();
    const mesStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const [alunos, regs] = await Promise.all([
      DB.getAll('matriculas'),
      DB.query('presenca', r => r.data?.startsWith(mesStr))
    ]);

    const matriculados = alunos.filter(a => a.st === 'matriculado');
    // Dias úteis passados no mês (até hoje)
    const diasPossíveis = regs.reduce((acc, r) => { acc.add(r.data); return acc; }, new Set()).size || 1;

    const rank = matriculados.map(a => {
      const pres = regs.filter(r => r.alunoId === a.id && (r.estado==='presente'||r.estado==='justific')).length;
      return { nome: a.nome.split(' ')[0], pct: Math.round(pres/diasPossíveis*100) };
    }).sort((a,b) => b.pct - a.pct).slice(0, 8);

    el.innerHTML = rank.map((r, i) => `
      <div class="rank-item">
        <div class="rank-pos">${i+1}°</div>
        <div class="rank-nome">${Utils.esc(r.nome)}</div>
        <div class="rank-pct">${r.pct}%</div>
      </div>`).join('') || '<div style="font-size:var(--fs-xs);color:var(--ink-3)">Nenhum dado este mês</div>';
  };

  /* ═══════════════════════════════════════════════
     EXPORTAR CSV
  ═══════════════════════════════════════════════ */
  const exportCSV = async () => {
    const regs = await DB.query('presenca', r => r.data === _data);
    const alunosMap = {};
    (await DB.getAll('matriculas')).forEach(a => { alunosMap[a.id] = a; });
    const rows = ['"Data","Nome","Sala","Estado","Observação"'];
    regs.forEach(r => {
      const a = alunosMap[r.alunoId] || {};
      rows.push(`"${_data}","${a.nome||'—'}","${Utils.salaLabel(a.turma)}","${r.estado||''}","${(r.obs||'').replace(/"/g,'""')}"`);
    });
    _alunos.filter(a => !regs.find(r => r.alunoId===a.id)).forEach(a => {
      rows.push(`"${_data}","${a.nome}","${Utils.salaLabel(a.turma)}","sem registro",""`);
    });
    Utils.downloadCSV(rows, `presenca_${_data}.csv`);
    Toast.show('success', '📥 CSV exportado!');
  };

  /* ═══════════════════════════════════════════════
     IMPRIMIR
  ═══════════════════════════════════════════════ */
  const printList = async () => {
    const cfg = await DB.getConfig();
    const d = new Date(_data+'T12:00:00');
    const diasSemana = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const w = window.open('','_blank','width=700,height=900');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Presença ${_data}</title>
      <style>
        body{font-family:Arial,sans-serif;padding:24px;font-size:12px}
        h2{text-align:center;font-size:14px;margin-bottom:2px}
        h3{text-align:center;font-size:11px;color:#666;margin-bottom:12px}
        table{width:100%;border-collapse:collapse}
        th,td{border:1px solid #ddd;padding:6px 8px;font-size:11px}
        th{background:#f5f5f5;font-weight:bold}
        .ass{display:flex;justify-content:space-around;margin-top:40px}
        .al{border-top:1px solid #000;width:38%;text-align:center;padding-top:6px;font-size:11px}
        @media print{body{padding:8px}}
      </style></head><body>
      <h2>${cfg.nomeEscola||'Berçário Sonho Meu'}</h2>
      <h3>Lista de Presença — ${diasSemana[d.getDay()]}, ${Utils.fmtDate(_data)}</h3>
      <table>
        <thead><tr><th>#</th><th>Aluno</th><th>Sala</th><th>Presente</th><th>Ausente</th><th>Justificado</th><th>Obs</th></tr></thead>
        <tbody>
          ${_alunos.map((a,i) => {
            const r = _registros[a.id];
            const p = r?.estado==='presente'?'✓':'';
            const au = r?.estado==='ausente'?'✓':'';
            const ju = r?.estado==='justific'?'✓':'';
            return `<tr><td>${i+1}</td><td>${a.nome}</td><td>${Utils.salaLabel(a.turma)}</td><td style="text-align:center">${p}</td><td style="text-align:center">${au}</td><td style="text-align:center">${ju}</td><td>${Utils.esc(r?.obs||'')}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="ass">
        <div class="al">Coordenação<br>${cfg.responsavel||'—'}</div>
        <div class="al">Professor(a)</div>
      </div>
      <script>window.print()<\/script></body></html>`);
    w.document.close();
  };

  /* ── Helper para ir a um aluno/data ── */
  const _goAlunoDate = id => {
    Drawer.close();
    Router.go('presenca');
  };

  return {
    render, loadDay, marcar, saveObs, _toggleObs,
    navDate, goToday, clearDay,
    exportCSV, printList,
    prevHeatmapMonth, nextHeatmapMonth,
    _goDate, _goAlunoDate,
    _renderHeatmap, _renderHist7, _renderRanking,
  };
})();

/* ============================================================
   DOCS — Módulo de Documentos completo (Etapa 5)
   ============================================================ */
const Docs = (() => {

  /* ─── Estado interno ─── */
  let _tab    = 'galeria';   // 'galeria' | 'checklist'
  let _view   = 'grid';      // 'grid'    | 'lista'
  let _searchQ = '';
  let _filtroAluno = '';
  let _filtroTipo  = '';
  let _filtroArq   = '';

  /* ─── Mapa de tipos ─── */
  const TIPOS = {
    img:      { label: 'Autorização de Imagem', icon: '🖊️' },
    quest:    { label: 'Questionário de Saúde',  icon: '📋' },
    contrato: { label: 'Contrato',               icon: '📝' },
    rg:       { label: 'RG / Certidão',          icon: '🪪' },
    vacina:   { label: 'Cartão de Vacinas',      icon: '💉' },
    outro:    { label: 'Outro',                   icon: '📄' },
  };
  const DOC_KEYS = ['img','quest','contrato','rg','vacina'];

  /* ─── Detecta tipo pelo nome ─── */
  const _detectTipo = nome => {
    const n = Utils.normalize(nome);
    if (n.includes('imagem') || n.includes('autorizacao') || n.includes('img')) return 'img';
    if (n.includes('quest') || n.includes('saude') || n.includes('health'))     return 'quest';
    if (n.includes('contrato') || n.includes('contract'))                        return 'contrato';
    if (n.includes('rg') || n.includes('certidao') || n.includes('nascimento')) return 'rg';
    if (n.includes('vacina') || n.includes('vacinacao') || n.includes('cartao')) return 'vacina';
    return 'outro';
  };

  /* ─── Ícone por extensão ─── */
  const _fileIcon = (nome, tipo) => {
    if (!nome) return TIPOS[tipo]?.icon || '📄';
    const ext = (nome.split('.').pop() || '').toLowerCase();
    if (['jpg','jpeg','png','gif','webp'].includes(ext)) return '🖼️';
    if (ext === 'pdf') return '📕';
    return TIPOS[tipo]?.icon || '📄';
  };

  /* ─── Tamanho legível ─── */
  const _fmtSize = bytes => {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(0) + ' KB';
    return (bytes/1048576).toFixed(1) + ' MB';
  };

  /* ═══════════════════════════════════════════
     RENDER PRINCIPAL
  ═══════════════════════════════════════════ */
  const render = async () => {
    // Popula select de alunos
    const alunos = (await DB.getAll('matriculas'))
      .filter(a => a.st !== 'desligado')
      .sort((a,b) => (a.nome||'').localeCompare(b.nome||''));
    const sel = document.getElementById('docsFiltroAluno');
    if (sel) {
      const cur = sel.value;
      sel.innerHTML = '<option value="">Todos os alunos</option>' +
        alunos.map(a => `<option value="${a.id}" ${a.id===cur?'selected':''}>${Utils.esc(a.nome.split(' ').slice(0,2).join(' '))}</option>`).join('');
    }
    await applyFilters();
  };

  /* ─── Troca de aba ─── */
  const setTab = (tab, btn) => {
    _tab = tab;
    document.querySelectorAll('.docs-module-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Filtros só visíveis na galeria
    const fw = document.getElementById('docsFiltrosWrap');
    if (fw) fw.style.display = tab === 'galeria' ? '' : 'none';
    applyFilters();
  };

  const setView = v => {
    _view = v;
    document.getElementById('btnDocsGrid')?.classList.toggle('active', v === 'grid');
    document.getElementById('btnDocsList')?.classList.toggle('active', v === 'lista');
    applyFilters();
  };

  const search = Utils.debounce(q => { _searchQ = q; applyFilters(); }, 220);

  const applyFilters = async () => {
    _filtroAluno = document.getElementById('docsFiltroAluno')?.value || '';
    _filtroTipo  = document.getElementById('docsFiltroTipo')?.value  || '';
    _filtroArq   = document.getElementById('docsFiltroArq')?.value   || '';

    if (_tab === 'galeria') await _renderGaleria();
    else                    await _renderChecklist();
  };

  /* ═══════════════════════════════════════════
     GALERIA
  ═══════════════════════════════════════════ */
  const _renderGaleria = async () => {
    const el = document.getElementById('docsContent');
    if (!el) return;

    const [allDocs, alunos] = await Promise.all([
      DB.getAll('documentos'),
      DB.getAll('matriculas')
    ]);

    const alunoMap = {};
    alunos.forEach(a => { alunoMap[a.id] = a; });

    // Também cria entradas "virtuais" dos checklists (docs marcados nas matrículas sem blob)
    const virtualDocs = [];
    alunos.filter(a => a.st !== 'desligado').forEach(a => {
      DOC_KEYS.forEach(k => {
        if (a.docs?.[k]) {
          // Verifica se já existe doc real
          const jaExiste = allDocs.find(d => d.alunoId === a.id && d.tipo === k);
          if (!jaExiste) {
            virtualDocs.push({ id: `virt_${a.id}_${k}`, alunoId: a.id, tipo: k, nome: TIPOS[k].label, virtual: true, dtUpload: a.dtCadastro });
          }
        }
      });
    });

    let docs = [...allDocs, ...virtualDocs];

    // Filtros
    const q = Utils.normalize(_searchQ);
    docs = docs.filter(d => {
      const a = alunoMap[d.alunoId];
      if (!a) return false;
      if (_filtroAluno && d.alunoId !== _filtroAluno) return false;
      if (_filtroTipo  && d.tipo !== _filtroTipo)     return false;
      if (_filtroArq === 'comArq' && (!d.blob && !d.dataUrl)) return false;
      if (_filtroArq === 'semArq' && (d.blob || d.dataUrl))   return false;
      if (q) {
        const hay = Utils.normalize(`${d.nome} ${a.nome}`);
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    // Subtitle
    const sub = document.getElementById('docsSubtitle');
    if (sub) sub.textContent = `${docs.length} documento${docs.length!==1?'s':''} · ${allDocs.length} com arquivo`;

    if (docs.length === 0) {
      el.innerHTML = `<div class="empty-state">
        <div class="empty-icon">📂</div>
        <div class="empty-title">Nenhum documento encontrado</div>
        <div class="empty-sub">Faça upload de documentos ou ajuste os filtros</div>
        <button class="btn btn-primary" style="margin-top:var(--sp-md)" onclick="Docs.openUpload()">📎 Fazer Upload</button>
      </div>`;
      return;
    }

    // Agrupa por aluno
    const grupos = {};
    docs.forEach(d => {
      if (!grupos[d.alunoId]) grupos[d.alunoId] = [];
      grupos[d.alunoId].push(d);
    });

    const html = Object.entries(grupos).map(([alunoId, lista]) => {
      const a = alunoMap[alunoId] || { nome: 'Desconhecido' };
      const cor = Utils.avatarColor(alunoId);
      const ini = Utils.initials(a.nome);
      const avatarHtml = a.foto
        ? `<div style="width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0"><img src="${a.foto}" style="width:100%;height:100%;object-fit:cover"></div>`
        : `<div style="width:32px;height:32px;border-radius:50%;background:${cor};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;flex-shrink:0">${ini}</div>`;
      const docsOk = Object.values(a.docs||{}).filter(Boolean).length;

      const conteudo = _view === 'grid'
        ? `<div class="docs-grid">${lista.map(d => _docCardHTML(d, a)).join('')}</div>`
        : `<div>${lista.map(d => _docRowHTML(d, a)).join('')}</div>`;

      return `<div class="docs-aluno-grupo">
        <div class="docs-aluno-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
          ${avatarHtml}
          <div style="flex:1;min-width:0">
            <div class="docs-aluno-nome">${Utils.esc(a.nome)}</div>
            <div class="docs-aluno-meta">${Utils.salaLabel(a.turma)} · ${lista.length} doc${lista.length!==1?'s':''} · Checklist: ${docsOk}/5</div>
          </div>
          <div class="docs-checklist-dots">
            ${DOC_KEYS.map(k => `<div class="checklist-dot ${a.docs?.[k]?'ok':'missing'}" title="${TIPOS[k].label}"></div>`).join('')}
          </div>
          ${lista.some(d => d.blob||d.dataUrl) ? `<button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();Docs.downloadZip('${alunoId}')" title="Baixar todos como ZIP">🗜️ ZIP</button>` : ''}
        </div>
        <div class="docs-aluno-body">${conteudo}</div>
      </div>`;
    }).join('');

    el.innerHTML = `<div class="docs-galeria">${html}</div>`;
  };

  /* ─── Card de documento ─── */
  const _docCardHTML = (d, a) => {
    const icon = _fileIcon(d.nome, d.tipo);
    const isImg = d.dataUrl && d.dataUrl.startsWith('data:image');
    const hasFile = !!(d.blob || d.dataUrl);
    return `<div class="doc-card" onclick="Docs.openViewer('${d.id}')">
      <div class="doc-card-thumb">
        ${isImg ? `<img class="doc-card-thumb-img" src="${d.dataUrl}" alt="${Utils.esc(d.nome)}">` : `<span style="font-size:38px">${icon}</span>`}
        <div class="doc-card-actions">
          ${hasFile ? `<div class="doc-card-btn" onclick="event.stopPropagation();Docs.download('${d.id}')" title="Baixar">⬇️</div>` : ''}
          ${!d.virtual ? `<div class="doc-card-btn" onclick="event.stopPropagation();Docs.deleteDoc('${d.id}')" title="Excluir">🗑️</div>` : ''}
        </div>
      </div>
      <div class="doc-card-body">
        <div class="doc-card-nome">${Utils.esc(d.nome)}</div>
        <div class="doc-card-meta">${TIPOS[d.tipo]?.label||'—'} ${d.virtual?'· checklist':'· '+_fmtSize(d.tamanho)}</div>
      </div>
    </div>`;
  };

  /* ─── Row de documento (lista) ─── */
  const _docRowHTML = (d, a) => {
    const icon = _fileIcon(d.nome, d.tipo);
    const hasFile = !!(d.blob || d.dataUrl);
    return `<div class="doc-row">
      <div class="doc-row-icon">${icon}</div>
      <div class="doc-row-info">
        <div class="doc-row-nome">${Utils.esc(d.nome)}</div>
        <div class="doc-row-meta">${TIPOS[d.tipo]?.label||'Outro'} · ${Utils.fmtDate(d.dtUpload)} ${d.tamanho?'· '+_fmtSize(d.tamanho):''} ${d.virtual?'· só checklist':''}</div>
      </div>
      <div class="doc-row-actions">
        ${hasFile ? `<button class="btn btn-ghost btn-xs" onclick="Docs.openViewer('${d.id}')" title="Visualizar">👁️</button>` : ''}
        ${hasFile ? `<button class="btn btn-ghost btn-xs" onclick="Docs.download('${d.id}')" title="Baixar">⬇️</button>` : ''}
        ${!d.virtual ? `<button class="btn btn-ghost btn-xs" onclick="Docs.deleteDoc('${d.id}')" title="Excluir">🗑️</button>` : ''}
      </div>
    </div>`;
  };

  /* ═══════════════════════════════════════════
     CHECKLIST COMPLETO
  ═══════════════════════════════════════════ */
  const _renderChecklist = async () => {
    const el = document.getElementById('docsContent');
    if (!el) return;

    const alunos = (await DB.getAll('matriculas'))
      .filter(a => a.st === 'matriculado')
      .sort((a,b) => (a.nome||'').localeCompare(b.nome||''));

    // KPIs
    const total = alunos.length;
    const completos = alunos.filter(a => Object.values(a.docs||{}).filter(Boolean).length >= 5).length;
    const incompletos = total - completos;
    const mediaPct = total ? Math.round(alunos.reduce((s,a) => s + Object.values(a.docs||{}).filter(Boolean).length, 0) / total / 5 * 100) : 0;

    const kpis = `<div class="grid-4 mb" style="margin-bottom:var(--sp-lg)">
      <div class="kpi-card" style="border-top-color:var(--teal)">
        <div class="kpi-val">${total}</div><div class="kpi-label">Alunos matriculados</div>
      </div>
      <div class="kpi-card" style="border-top-color:var(--success)">
        <div class="kpi-val" style="color:var(--success)">${completos}</div><div class="kpi-label">Docs completos</div>
      </div>
      <div class="kpi-card" style="border-top-color:var(--danger)">
        <div class="kpi-val" style="color:var(--danger)">${incompletos}</div><div class="kpi-label">Docs incompletos</div>
      </div>
      <div class="kpi-card" style="border-top-color:var(--warning)">
        <div class="kpi-val" style="color:var(--warning)">${mediaPct}%</div><div class="kpi-label">Completude média</div>
      </div>
    </div>`;

    // Cards de aluno com status de cada documento
    const cards = alunos.map(a => {
      const docs = a.docs || {};
      const ok = Object.values(docs).filter(Boolean).length;
      const pct = Math.round(ok/5*100);
      const cor = Utils.avatarColor(a.id);
      const ini = Utils.initials(a.nome);
      const avatar = a.foto
        ? `<img src="${a.foto}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0">`
        : `<div style="width:36px;height:36px;border-radius:50%;background:${cor};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex-shrink:0">${ini}</div>`;

      // Alerta 1 ano: se nasc < 1 ano atrás e docs incompletos
      const nascMs = a.nasc ? (() => { const [y,m,d]=a.nasc.split('-').map(Number); return new Date(y,m-1,d).getTime(); })() : 0;
      const umAnoMs = Date.now() - 365*24*3600*1000;
      const alerta1ano = nascMs && nascMs < umAnoMs && ok < 5;

      return `<div class="checklist-aluno-card" style="margin-bottom:6px">
        ${avatar}
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:var(--fs-sm);display:flex;align-items:center;gap:6px">
            ${Utils.esc(a.nome.split(' ').slice(0,3).join(' '))}
            ${alerta1ano ? '<span class="badge badge-warning" title="Mais de 1 ano e docs incompletos">⏰</span>' : ''}
          </div>
          <div style="display:flex;align-items:center;gap:var(--sp-sm);margin-top:4px">
            <div class="progress-bar" style="flex:1">
              <div class="progress-fill ${pct===100?'success':pct>=60?'warning':'danger'}" style="width:${pct}%"></div>
            </div>
            <span style="font-size:var(--fs-xs);font-weight:700;color:var(--ink-3);width:30px;text-align:right">${ok}/5</span>
          </div>
          <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">
            ${DOC_KEYS.map(k => `<span style="font-size:9.5px;padding:1px 7px;border-radius:var(--r-full);background:${docs[k]?'var(--success-lt)':'var(--danger-lt)'};color:${docs[k]?'var(--success-dk)':'var(--danger)'};font-weight:700;border:1px solid ${docs[k]?'var(--success)':'var(--danger)'}">${TIPOS[k].icon} ${TIPOS[k].label}</span>`).join('')}
          </div>
        </div>
        <button class="btn btn-ghost btn-xs" onclick="Matriculas.openWizard('${a.id}')" title="Editar documentos">✏️</button>
      </div>`;
    }).join('');

    el.innerHTML = kpis + cards;

    const sub = document.getElementById('docsSubtitle');
    if (sub) sub.textContent = `${completos}/${total} alunos com documentação completa`;
  };

  /* ═══════════════════════════════════════════
     UPLOAD — Modal com drag and drop
  ═══════════════════════════════════════════ */
  const openUpload = async () => {
    const alunos = (await DB.getAll('matriculas'))
      .filter(a => a.st !== 'desligado')
      .sort((a,b) => (a.nome||'').localeCompare(b.nome||''));

    Modal.open('modalMain', `
      <div class="modal-header">
        <div class="modal-title">📎 Upload de Documentos</div>
        <button class="modal-close" onclick="Modal.close('modalMain')">×</button>
      </div>
      <div class="modal-body">
        <!-- Drop zone -->
        <div class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.webp"
            onchange="Docs._filesSelected(this.files)">
          <div class="drop-zone-icon">📂</div>
          <div class="drop-zone-title">Arraste arquivos aqui</div>
          <div class="drop-zone-sub">ou clique para selecionar · PDF, imagens · máx. 10 MB por arquivo</div>
        </div>

        <!-- Fila -->
        <div class="upload-queue" id="uploadQueue"></div>

        <!-- Vinculação global (atalho) -->
        <div class="form-group" style="margin-top:var(--sp-lg)">
          <label class="form-label">Vincular todos ao aluno (opcional — pode definir individualmente)</label>
          <select class="form-select" id="uploadAlunoGlobal" onchange="Docs._setAlunoGlobal(this.value)">
            <option value="">— Selecionar aluno —</option>
            ${alunos.map(a => `<option value="${a.id}">${Utils.esc(a.nome)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalMain')">Cancelar</button>
        <button class="btn btn-primary" onclick="Docs._confirmarUpload()">💾 Salvar todos</button>
      </div>
    `);

    // Drag and drop
    const dz = document.getElementById('dropZone');
    if (dz) {
      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
      dz.addEventListener('drop', e => {
        e.preventDefault();
        dz.classList.remove('drag-over');
        _filesSelected(e.dataTransfer.files);
      });
    }
  };

  /* ─── Lista de arquivos na fila ─── */
  let _uploadQueue = []; // { file, tipo, alunoId, preview? }

  const _filesSelected = async files => {
    const alunos = (await DB.getAll('matriculas'))
      .filter(a => a.st !== 'desligado')
      .sort((a,b) => (a.nome||'').localeCompare(b.nome||''));

    const MAX = 10 * 1024 * 1024;
    let adicionados = 0;

    for (const file of files) {
      if (file.size > MAX) { Toast.show('warning', `⚠️ ${file.name} excede 10 MB — ignorado.`); continue; }
      const tipoDetect = _detectTipo(file.name);
      _uploadQueue.push({ file, tipo: tipoDetect, alunoId: '', preview: null });
      adicionados++;
    }

    if (!adicionados) return;
    // Gera previews para imagens
    for (let i = 0; i < _uploadQueue.length; i++) {
      const item = _uploadQueue[i];
      if (item.preview !== null) continue; // já tem
      if (item.file.type.startsWith('image/')) {
        item.preview = await _readAsDataURL(item.file);
      }
    }

    _renderQueue(alunos);
  };

  const _readAsDataURL = file => new Promise(res => {
    const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(file);
  });

  const _readAsArrayBuffer = file => new Promise(res => {
    const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsArrayBuffer(file);
  });

  const _renderQueue = (alunos) => {
    const el = document.getElementById('uploadQueue');
    if (!el || !_uploadQueue.length) return;
    el.innerHTML = _uploadQueue.map((item, i) => {
      const icon = item.file.type.startsWith('image/') ? '🖼️' : item.file.name.endsWith('.pdf') ? '📕' : '📄';
      return `<div class="upload-item" id="uqi_${i}">
        ${item.preview
          ? `<img src="${item.preview}" style="width:40px;height:40px;object-fit:cover;border-radius:var(--r-sm);flex-shrink:0">`
          : `<div class="upload-item-icon">${icon}</div>`}
        <div class="upload-item-info">
          <div class="upload-item-name">${Utils.esc(item.file.name)}</div>
          <div class="upload-item-meta">${_fmtSize(item.file.size)}</div>
          <div class="upload-progress-bar"><div class="upload-progress-fill" id="uprog_${i}" style="width:0%"></div></div>
        </div>
        <select class="upload-item-select" id="utype_${i}" onchange="Docs._setItemTipo(${i},this.value)">
          ${Object.entries(TIPOS).map(([k,v]) => `<option value="${k}" ${k===item.tipo?'selected':''}>${v.icon} ${v.label}</option>`).join('')}
        </select>
        <select class="upload-item-select" id="ualuno_${i}" onchange="Docs._setItemAluno(${i},this.value)">
          <option value="">— Aluno —</option>
          ${alunos.map(a => `<option value="${a.id}" ${a.id===item.alunoId?'selected':''}>${Utils.esc(a.nome.split(' ').slice(0,2).join(' '))}</option>`).join('')}
        </select>
        <button class="upload-item-status" onclick="Docs._removeFromQueue(${i})" title="Remover">✕</button>
      </div>`;
    }).join('');
  };

  const _setItemTipo   = (i, v) => { if (_uploadQueue[i]) _uploadQueue[i].tipo   = v; };
  const _setItemAluno  = (i, v) => { if (_uploadQueue[i]) _uploadQueue[i].alunoId = v; };
  const _setAlunoGlobal = v => {
    _uploadQueue.forEach((item, i) => {
      item.alunoId = v;
      const sel = document.getElementById(`ualuno_${i}`);
      if (sel) sel.value = v;
    });
  };
  const _removeFromQueue = i => {
    _uploadQueue.splice(i, 1);
    // Re-render queue (simples: busca alunos novamente)
    DB.getAll('matriculas').then(alunos => _renderQueue(alunos.filter(a => a.st !== 'desligado').sort((a,b)=>(a.nome||'').localeCompare(b.nome||''))));
  };

  /* ─── Confirma e salva todos ─── */
  const _confirmarUpload = async () => {
    if (!_uploadQueue.length) { Toast.show('warning', 'Nenhum arquivo na fila.'); return; }

    let salvos = 0;
    let erros  = 0;

    for (let i = 0; i < _uploadQueue.length; i++) {
      const item = _uploadQueue[i];
      const prog = document.getElementById(`uprog_${i}`);
      const stat = document.querySelector(`#uqi_${i} .upload-item-status`);

      try {
        if (prog) prog.style.width = '30%';
        let blobData = null, dataUrl = null;

        if (item.file.type.startsWith('image/')) {
          dataUrl = item.preview || await _readAsDataURL(item.file);
        } else {
          const buf = await _readAsArrayBuffer(item.file);
          blobData = new Blob([buf], { type: item.file.type });
        }

        if (prog) prog.style.width = '70%';

        const doc = {
          id:       Utils.uuid(),
          alunoId:  item.alunoId || null,
          nome:     item.file.name,
          tipo:     item.tipo,
          tamanho:  item.file.size,
          mimeType: item.file.type,
          dtUpload: Utils.today(),
          blob:     blobData,
          dataUrl:  dataUrl,
        };
        await DB.save('documentos', doc);

        // Atualiza docs checklist do aluno se tipo reconhecido
        if (item.alunoId && DOC_KEYS.includes(item.tipo)) {
          const aluno = await DB.get('matriculas', item.alunoId);
          if (aluno) {
            if (!aluno.docs) aluno.docs = {};
            aluno.docs[item.tipo] = true;
            await DB.save('matriculas', aluno);
          }
        }

        if (prog) prog.style.width = '100%';
        if (prog) prog.style.background = 'var(--success)';
        if (stat) stat.textContent = '✅';
        salvos++;
      } catch(e) {
        console.error(e);
        if (stat) stat.textContent = '❌';
        erros++;
      }
    }

    _uploadQueue = [];
    await new Promise(r => setTimeout(r, 600));
    Modal.close('modalMain');
    Toast.show('success', `✅ ${salvos} arquivo${salvos!==1?'s':''} salvo${salvos!==1?'s':''}${erros?` · ${erros} com erro`:''}`);
    await render();
    await Badges.refresh();
  };

  /* ═══════════════════════════════════════════
     VISUALIZADOR
  ═══════════════════════════════════════════ */
  const openViewer = async id => {
    // Virtual docs não têm arquivo
    if (id.startsWith('virt_')) { Toast.show('info', 'Documento marcado apenas no checklist — sem arquivo.'); return; }
    const doc = await DB.get('documentos', id);
    if (!doc) { Toast.show('error', 'Documento não encontrado.'); return; }

    let src = doc.dataUrl;
    let blobUrl = null;
    if (!src && doc.blob) {
      blobUrl = URL.createObjectURL(doc.blob);
      src = blobUrl;
    }
    if (!src) { Toast.show('info', 'Este documento não possui arquivo.'); return; }

    const isImg = doc.mimeType?.startsWith('image/') || doc.dataUrl?.startsWith('data:image');
    const isPdf = doc.mimeType === 'application/pdf' || doc.nome?.endsWith('.pdf');

    const viewerContent = isImg
      ? `<img src="${src}" alt="${Utils.esc(doc.nome)}" style="max-width:100%;max-height:70vh;object-fit:contain;display:block;margin:0 auto;border-radius:var(--r-md)">`
      : isPdf
        ? `<div class="pdf-viewer-toolbar">
              <span class="pdf-viewer-toolbar-name">📕 ${Utils.esc(doc.nome)}</span>
              <a href="${src}" download="${Utils.esc(doc.nome)}" class="btn btn-ghost btn-xs" style="color:#fff;border-color:rgba(255,255,255,.3)">⬇️ Baixar</a>
            </div>
            <iframe src="${src}" class="pdf-viewer-frame" title="${Utils.esc(doc.nome)}"></iframe>`
        : `<div class="empty-state" style="padding:var(--sp-3xl)">
            <div class="empty-icon">📄</div>
            <div class="empty-title">${Utils.esc(doc.nome)}</div>
            <div class="empty-sub">Tipo: ${doc.mimeType||'desconhecido'} · ${_fmtSize(doc.tamanho)}</div>
            <a href="${src}" download="${Utils.esc(doc.nome)}" class="btn btn-primary" style="margin-top:var(--sp-md)">⬇️ Baixar arquivo</a>
          </div>`;

    const aluno = doc.alunoId ? await DB.get('matriculas', doc.alunoId) : null;

    Modal.open('modalMain', `
      <div class="modal-header">
        <div>
          <div class="modal-title">👁️ ${Utils.esc(doc.nome)}</div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3)">${TIPOS[doc.tipo]?.label||'Documento'} ${aluno?'· '+aluno.nome:''} · ${Utils.fmtDate(doc.dtUpload)}</div>
        </div>
        <div style="display:flex;gap:var(--sp-sm);align-items:center">
          <a href="${src}" download="${Utils.esc(doc.nome)}" class="btn btn-ghost btn-sm">⬇️ Baixar</a>
          <button class="modal-close" onclick="Modal.close('modalMain');${blobUrl?`URL.revokeObjectURL('${blobUrl}');`:''}">×</button>
        </div>
      </div>
      <div class="modal-body" style="padding:var(--sp-lg)">${viewerContent}</div>
    `);
  };

  /* ═══════════════════════════════════════════
     DOWNLOAD
  ═══════════════════════════════════════════ */
  const download = async id => {
    const doc = await DB.get('documentos', id);
    if (!doc) return;
    let src = doc.dataUrl;
    if (!src && doc.blob) src = URL.createObjectURL(doc.blob);
    if (!src) { Toast.show('warning', 'Sem arquivo.'); return; }
    const a = document.createElement('a');
    a.href = src; a.download = doc.nome; a.click();
    if (doc.blob) setTimeout(() => URL.revokeObjectURL(src), 2000);
  };

  /* ─── ZIP de um aluno ─── */
  const downloadZip = async alunoId => {
    const aluno = await DB.get('matriculas', alunoId);
    if (!aluno) return;
    const docs = await DB.query('documentos', d => d.alunoId === alunoId);
    if (!docs.length) { Toast.show('info', 'Nenhum arquivo para zipar.'); return; }

    Toast.show('info', '🗜️ Preparando ZIP...');
    const zip = new JSZip();
    for (const doc of docs) {
      if (!doc.blob && !doc.dataUrl) continue;
      let data;
      if (doc.blob) data = doc.blob;
      else {
        // dataUrl → Blob
        const res = await fetch(doc.dataUrl);
        data = await res.blob();
      }
      zip.file(doc.nome, data);
    }
    const content = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const nomeSeg = (aluno.nome||'aluno').replace(/[^a-z0-9]/gi,'_');
    Utils.downloadBlob(content, `docs_${nomeSeg}.zip`);
    Toast.show('success', `🗜️ ZIP de ${aluno.nome.split(' ')[0]} pronto!`);
  };

  /* ═══════════════════════════════════════════
     EXCLUIR
  ═══════════════════════════════════════════ */
  const deleteDoc = async id => {
    const doc = await DB.get('documentos', id);
    if (!doc) return;
    Modal.confirm(
      `Excluir permanentemente <b>${Utils.esc(doc.nome)}</b>? Esta ação não pode ser desfeita.`,
      async () => {
        await DB.remove('documentos', id);
        Toast.show('success', 'Documento excluído.');
        await render();
      },
      { title: '🗑️ Excluir Documento', danger: true, confirmLabel: 'Excluir' }
    );
  };

  /* ═══════════════════════════════════════════
     EXPORTAR CHECKLIST CSV
  ═══════════════════════════════════════════ */
  const exportChecklistCSV = async () => {
    const alunos = (await DB.getAll('matriculas'))
      .filter(a => a.st === 'matriculado')
      .sort((a,b) => (a.nome||'').localeCompare(b.nome||''));
    const rows = ['"Aluno","Sala","Autorização de Imagem","Questionário","Contrato","RG/Certidão","Vacinas","% Completo"'];
    alunos.forEach(a => {
      const docs = a.docs || {};
      const ok = DOC_KEYS.filter(k => docs[k]).length;
      rows.push([
        `"${a.nome}"`, `"${Utils.salaLabel(a.turma)}"`,
        ...DOC_KEYS.map(k => `"${docs[k]?'✅':'❌'}"`),
        `"${Math.round(ok/5*100)}%"`
      ].join(','));
    });
    Utils.downloadCSV(rows, `checklist_docs_${Utils.today()}.csv`);
    Toast.show('success', '📥 Checklist exportado!');
  };

  /* ─── API pública ─── */
  return {
    render, setTab, setView, search, applyFilters,
    openUpload, _filesSelected, _setItemTipo, _setItemAluno, _setAlunoGlobal, _removeFromQueue, _confirmarUpload,
    openViewer, download, downloadZip, deleteDoc,
    exportChecklistCSV,
  };
})();


/* ============================================================
   MENS — Módulo Mensalidades (Etapa 6.1)
   ============================================================ */
const Mens = (() => {
  let _all = [], _mats = [], _filtered = [], _cfg = {};
  let _page = 1; const PER = 25;
  let _sortCol = 'vencimento', _sortAsc = true;
  let _selected = new Set();

  /* ── enriquece mensalidade com dados da matrícula ── */
  const _enrich = (m) => {
    const mat = _mats.find(a => a.id === m.alunoId) || {};
    m._nome  = mat.nome  || '—';
    m._turma = mat.turma || '';
    m._mae   = mat.mae   || '';
    m._telMae= mat.telMae|| '';
    m._telPai= mat.telPai|| '';
    m._emailMae = mat.emailMae || '';
    m._emailPai = mat.emailPai || '';
    m._diaVenc  = mat.diaVenc  || 10;
    m._matId    = mat.id || '';
    return m;
  };

  /* ── juros automático ── */
  const _calcJuros = (m, cfg) => {
    if (m.st !== 'atrasado') return 0;
    const d = Math.abs(Utils.diffDays(m.vencimento));
    return parseFloat((m.valor * (cfg.juros || 0.5) / 100 * d).toFixed(2));
  };

  /* ── render principal ── */
  const render = async () => {
    [_all, _mats, _cfg] = await Promise.all([
      DB.getAll('mensalidades'), DB.getAll('matriculas'), DB.getConfig()
    ]);
    _all.forEach(_enrich);
    // Atualiza st automaticamente
    const hoje = Utils.today();
    for (const m of _all) {
      if (m.st === 'pendente' && m.vencimento < hoje) {
        m.st = 'atrasado';
        await DB.save('mensalidades', m);
      }
    }
    _populateMesFilter();
    filter();
    _renderKpis();
  };

  const _populateMesFilter = () => {
    const sel = document.getElementById('mensMes');
    if (!sel || sel.options.length > 1) return;
    const refs = [...new Set(_all.map(m => m.ref))].sort().reverse();
    refs.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });
  };

  const _renderKpis = () => {
    const el = document.getElementById('mensKpis');
    if (!el) return;
    const mes = new Date().getMonth();
    const mesAtual = _all.filter(m => {
      const [ms, y] = (m.ref || '').split('/');
      return parseInt(y) === new Date().getFullYear() && Utils.MONTHS_SHORT.indexOf(ms) === mes;
    });
    const recebido   = mesAtual.filter(m => m.st === 'pago').reduce((s, m) => s + (m.valorPago || 0), 0);
    const aReceber   = _all.filter(m => m.st !== 'pago').reduce((s, m) => s + m.valor, 0);
    const atrasados  = _all.filter(m => m.st === 'atrasado').length;
    const total      = _all.filter(m => m.st !== 'pago').length + _all.filter(m => m.st === 'pago').length;
    const taxaInad   = total > 0 ? Math.round(atrasados / total * 100) : 0;
    el.innerHTML = [
      { l:'Recebido no Mês', v: Utils.money(recebido), s:'mês atual', i:'💚', c:'success' },
      { l:'A Receber',       v: Utils.money(aReceber), s:'em aberto', i:'💰', c:'teal' },
      { l:'Atrasados',       v: atrasados, s:'vencidos',  i:'🔴', c: atrasados ? 'danger' : 'success' },
      { l:'Inadimplência',   v: `${taxaInad}%`, s:'do total', i:'📊', c: taxaInad > 20 ? 'danger' : 'warning' },
    ].map((k, i) => `<div class="kpi ${k.c}" style="animation-delay:${i*.04}s">
      <div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div>
      <div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div>
    </div>`).join('');
  };

  const filter = () => {
    const q    = (document.getElementById('mensSearch')?.value || '').toLowerCase().trim();
    const st   = document.getElementById('mensSt')?.value   || 'all';
    const mes  = document.getElementById('mensMes')?.value  || 'all';
    const sala = document.getElementById('mensSala')?.value || 'all';
    _filtered = _all.filter(m => {
      if (st   !== 'all' && m.st    !== st)   return false;
      if (mes  !== 'all' && m.ref   !== mes)  return false;
      if (sala !== 'all' && m._turma !== sala) return false;
      if (q && !Utils.normalize(m._nome).includes(Utils.normalize(q))) return false;
      return true;
    });
    _filtered.sort((a, b) => {
      const va = String(a[_sortCol] || a['_' + _sortCol] || '').toLowerCase();
      const vb = String(b[_sortCol] || b['_' + _sortCol] || '').toLowerCase();
      return _sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
    _page = 1;
    _renderTable();
  };

  const sort = col => {
    if (_sortCol === col) _sortAsc = !_sortAsc; else { _sortCol = col; _sortAsc = true; }
    filter();
  };

  const _renderTable = () => {
    document.querySelectorAll('#mensTable thead th[data-col]').forEach(th => {
      th.classList.toggle('sorted', th.dataset.col === _sortCol);
      th.classList.toggle('desc', th.dataset.col === _sortCol && !_sortAsc);
    });
    const start = (_page - 1) * PER;
    const items = _filtered.slice(start, start + PER);
    const tbody = document.getElementById('mensTbody');
    if (!tbody) return;
    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:28px;color:var(--ink-3)">Nenhuma mensalidade encontrada</td></tr>`;
    } else {
      tbody.innerHTML = items.map(m => {
        const d      = Utils.diffDays(m.vencimento);
        const juros  = _calcJuros(m, _cfg);
        const vd     = parseFloat((m.valor * (1 - (_cfg.desconto || 13) / 100)).toFixed(2));
        const stBadge = m.st === 'pago'     ? 'badge-success' :
                        m.st === 'atrasado' ? 'badge-danger'  : 'badge-warning';
        const stLabel = m.st === 'pago'     ? '✅ Pago' :
                        m.st === 'atrasado' ? `🔴 Atrasado` : '🟡 Pendente';
        const atrasoInfo = m.st === 'atrasado' ? `<div style="font-size:10px;color:var(--danger)">${Math.abs(d)}d em atraso</div>` : '';
        return `<tr>
          <td><input type="checkbox" ${_selected.has(m.id)?'checked':''} onchange="Mens.toggleSel('${m.id}',this.checked)"></td>
          <td>
            <div style="font-weight:700;font-size:var(--fs-sm)">${Utils.esc(m._nome.split(' ').slice(0,2).join(' '))}</div>
            <div><span class="badge ${Utils.salaBadge(m._turma)}" style="font-size:9px">${Utils.salaLabel(m._turma)}</span></div>
          </td>
          <td style="font-size:var(--fs-sm)">${m.ref || '—'} <span style="color:var(--ink-3);font-size:10px">P${m.parcela || 1}</span></td>
          <td style="font-size:var(--fs-sm)">${Utils.fmtDate(m.vencimento)}${atrasoInfo}</td>
          <td style="font-weight:700">${Utils.money(m.valor)}</td>
          <td style="color:var(--success-dk);font-weight:700">${Utils.money(vd)}</td>
          <td style="color:${juros > 0 ? 'var(--danger)' : 'var(--ink-3)'}">
            ${juros > 0 ? Utils.money(juros) : '—'}
          </td>
          <td><span class="badge ${stBadge}">${stLabel}</span></td>
          <td style="font-size:var(--fs-sm)">${m.dtPago ? Utils.fmtDate(m.dtPago) : '—'}${m.forma ? `<div style="font-size:10px;color:var(--ink-3)">${m.forma}</div>` : ''}</td>
          <td>
            <div class="td-actions">
              ${m.st !== 'pago' ? `<button class="btn btn-success btn-xs" onclick="Mens.openPagar('${m.id}')" title="Registrar pagamento">✓ Pagar</button>` : ''}
              <button class="btn btn-wa btn-xs" onclick="Mens.sendWA('${m._matId}','${m.id}')" title="WhatsApp">💬</button>
              <button class="btn btn-ghost btn-xs" onclick="Mens.reemitirRecibo('${m.id}')" title="Recibo">🧾</button>
              <button class="btn btn-danger btn-xs" onclick="Mens.deleteConfirm('${m.id}')" title="Excluir">🗑️</button>
            </div>
          </td>
        </tr>`;
      }).join('');
    }
    // Paginação
    const pag = document.getElementById('mensPag');
    if (pag) {
      const pages = Math.ceil(_filtered.length / PER) || 1;
      const s = (_page-1)*PER+1, e = Math.min(_page*PER, _filtered.length);
      pag.innerHTML = `
        <div class="pagination-info">${_filtered.length ? `${s}–${e} de ${_filtered.length}` : '0 registros'}</div>
        <div class="pagination-btns">
          <button class="pg-btn" onclick="Mens.goPage(${_page-1})" ${_page<=1?'disabled':''}>‹</button>
          ${Array.from({length:Math.min(pages,7)},(_,i)=>i+1).map(p=>`<button class="pg-btn ${p===_page?'active':''}" onclick="Mens.goPage(${p})">${p}</button>`).join('')}
          <button class="pg-btn" onclick="Mens.goPage(${_page+1})" ${_page>=pages?'disabled':''}>›</button>
        </div>`;
    }
    _updateBulkBar();
  };

  const goPage = p => {
    const pages = Math.ceil(_filtered.length / PER) || 1;
    _page = Math.max(1, Math.min(p, pages));
    _renderTable();
  };

  /* ── Seleção múltipla ── */
  const toggleSel = (id, checked) => { if (checked) _selected.add(id); else _selected.delete(id); _updateBulkBar(); };
  const toggleSelAll = chk => {
    const items = _filtered.slice((_page-1)*PER, _page*PER);
    items.forEach(m => chk.checked ? _selected.add(m.id) : _selected.delete(m.id));
    _renderTable();
  };
  const clearSel = () => { _selected.clear(); _renderTable(); };
  const _updateBulkBar = () => {
    const bar = document.getElementById('mensBulkBar');
    const cnt = document.getElementById('mensBulkCnt');
    if (!bar) return;
    bar.style.display = _selected.size > 0 ? 'flex' : 'none';
    if (cnt) cnt.textContent = `${_selected.size} selecionado(s)`;
  };

  const exportSelected = () => {
    const ids = [..._selected];
    const items = ids.length ? _all.filter(m => ids.includes(m.id)) : _filtered;
    const rows = ['Aluno,Sala,Referência,Vencimento,Valor,c/Desconto,Status,Pago em,Forma'];
    items.forEach(m => {
      const vd = (m.valor * (1 - (_cfg.desconto || 13) / 100)).toFixed(2);
      rows.push(`"${m._nome}","${Utils.salaLabel(m._turma)}","${m.ref}","${Utils.fmtDate(m.vencimento)}","${m.valor.toFixed(2)}","${vd}","${m.st}","${Utils.fmtDate(m.dtPago)}","${m.forma||''}"`);
    });
    Utils.downloadCSV(rows, `mensalidades_${Utils.today()}.csv`);
    Toast.show('success', 'CSV exportado!');
  };
  const exportCSV = exportSelected;

  /* ── Modal Pagar ── */
  const openPagar = async id => {
    const m = _all.find(x => x.id === id); if (!m) return;
    const d   = Utils.diffDays(m.vencimento);
    const juros = _calcJuros(m, _cfg);
    const vd    = parseFloat((m.valor * (1 - (_cfg.desconto || 13) / 100)).toFixed(2));
    const vComJuros = parseFloat((m.valor + juros).toFixed(2));
    const hoje  = Utils.today();
    const html = `
      <div class="modal-header">
        <div class="modal-title">💰 Registrar Pagamento</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="info-box teal" style="margin-bottom:var(--sp-md)">
          <b>${Utils.esc(m._nome)}</b> · ${m.ref} P${m.parcela || 1}<br>
          Vencimento: ${Utils.fmtDate(m.vencimento)} · ${m.st === 'atrasado' ? `<b style="color:var(--danger)">${Math.abs(d)}d em atraso</b>` : `${d}d restantes`}<br>
          <span>Normal: <b>${Utils.money(m.valor)}</b></span> ·
          <span>c/ Desconto (${_cfg.desconto || 13}%): <b>${Utils.money(vd)}</b></span>
          ${juros > 0 ? ` · <span style="color:var(--danger)">Juros: <b>${Utils.money(juros)}</b></span>` : ''}
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Valor a Receber (R$) <span class="required">*</span></label>
            <input class="form-input" type="number" step="0.01" id="pgVal" value="${juros > 0 ? vComJuros.toFixed(2) : vd.toFixed(2)}">
            <div style="display:flex;gap:5px;margin-top:4px">
              <button class="btn btn-ghost btn-xs" onclick="document.getElementById('pgVal').value='${vd.toFixed(2)}'">c/ desconto</button>
              <button class="btn btn-ghost btn-xs" onclick="document.getElementById('pgVal').value='${m.valor.toFixed(2)}'">normal</button>
              ${juros > 0 ? `<button class="btn btn-ghost btn-xs" onclick="document.getElementById('pgVal').value='${vComJuros.toFixed(2)}'">c/ juros</button>` : ''}
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Data do Pagamento</label>
            <input class="form-input" type="date" id="pgDt" value="${hoje}" max="${hoje}">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <label class="form-label">Forma de Pagamento</label>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
            ${['PIX','Dinheiro','Cartão de Débito','Transferência'].map((f, i) => `
              <label style="cursor:pointer;border:1.5px solid var(--border);border-radius:var(--r-md);padding:7px 8px;text-align:center;font-size:11.5px;font-weight:700;transition:all var(--t-fast)"
                     id="pgF${i}" onclick="Mens._selForma('${f}',${i})">
                <input type="radio" name="pgForma" value="${f}" ${i===0?'checked':''} style="display:none">${f}
              </label>`).join('')}
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Observação (opcional)</label>
          <input class="form-input" id="pgObs" placeholder="Detalhes...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-secondary" onclick="Mens.confirmarPagamento('${id}')">✅ Confirmar Pagamento</button>
      </div>`;
    Modal.open('modalSec', html);
    // Destaca PIX por padrão
    const el = document.getElementById('pgF0');
    if (el) el.style.cssText += ';background:var(--teal-lt);border-color:var(--teal-md);color:var(--teal-dk)';
  };

  const _selForma = (forma, idx) => {
    for (let i = 0; i < 4; i++) {
      const el = document.getElementById(`pgF${i}`);
      if (!el) continue;
      el.style.background = i === idx ? 'var(--teal-lt)' : '';
      el.style.borderColor = i === idx ? 'var(--teal-md)' : 'var(--border)';
      el.style.color = i === idx ? 'var(--teal-dk)' : '';
    }
  };

  const confirmarPagamento = async id => {
    const m = _all.find(x => x.id === id); if (!m) return;
    const dtPago = document.getElementById('pgDt')?.value;
    const hoje   = Utils.today();
    if (dtPago && dtPago > hoje) { Toast.show('error', 'Data de pagamento não pode ser futura!'); return; }
    const forma  = document.querySelector('input[name="pgForma"]:checked')?.value || 'PIX';
    const valor  = parseFloat(document.getElementById('pgVal')?.value) || m.valor;
    const obs    = document.getElementById('pgObs')?.value || '';
    m.st       = 'pago';
    m.dtPago   = dtPago || hoje;
    m.forma    = forma;
    m.valorPago= valor;
    m.obs      = obs;
    await DB.save('mensalidades', m);
    // Gera recibo
    await _gerarRecibo(m);
    Modal.close('modalSec');
    Toast.show('success', `✅ Pagamento de ${Utils.money(valor)} registrado! Recibo gerado.`);
    await render();
    await Badges.refresh();
  };

  const _gerarRecibo = async m => {
    const cfg = await DB.getConfig();
    const mat = _mats.find(a => a.id === m.alunoId);
    const seq = (cfg.reciboSeq || 1);
    const num = `${cfg.reciboPrefixo || 'BSM'}-${new Date().getFullYear()}-${String(seq).padStart(3,'0')}`;
    await DB.save('recibos', {
      id: Utils.uuid(), alunoId: m.alunoId, mensId: m.id,
      numero: num,
      ref: `${m.ref} — P${m.parcela || 1}`,
      valor: m.valorPago || m.valor,
      forma: m.forma, dtEmissao: m.dtPago,
      nomeAluno: mat?.nome || '—',
      nomeResp:  mat?.mae  || mat?.pai || '—'
    });
    cfg.reciboSeq = seq + 1;
    await DB.setConfig(cfg);
  };

  const reemitirRecibo = async mensId => {
    const m = _all.find(x => x.id === mensId);
    if (!m || m.st !== 'pago') { Toast.show('warning', 'Mensalidade não paga.'); return; }
    const recibos = await DB.getAll('recibos');
    const rec = recibos.find(r => r.mensId === mensId) || {
      numero: '—', ref: m.ref, valor: m.valorPago || m.valor,
      forma: m.forma, dtEmissao: m.dtPago,
      nomeAluno: m._nome, nomeResp: m._mae || '—'
    };
    Recibos._printRec(rec);
  };

  const sendWA = async (matId, mensId) => {
    const m   = _all.find(x => x.id === mensId);
    const mat = _mats.find(a => a.id === matId);
    if (!m || !mat) return;
    const d    = Utils.diffDays(m.vencimento);
    const cfg  = _cfg;
    const tmpl = m.st === 'atrasado' ? (cfg.msgWhatsAppAtr || cfg.msgWhatsApp || '') : (cfg.msgWhatsApp || '');
    const msg  = tmpl
      .replace('{resp}',    (mat.mae || mat.nome || '').split(' ')[0])
      .replace('{crianca}', mat.nome.split(' ')[0])
      .replace('{ref}',     m.ref)
      .replace('{valor}',   Utils.money(m.valor))
      .replace('{venc}',    Utils.fmtDate(m.vencimento))
      .replace('{dias}',    m.st === 'atrasado' ? `ATRASADA ${Math.abs(d)}d` : String(d));
    const tel = (mat.telMae || mat.telPai || '').replace(/\D/g,'');
    window.open(tel ? `https://wa.me/55${tel}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    await DB.save('histAv', {
      id: Utils.uuid(), alunoId: matId,
      nomeAluno: mat.nome.split(' ').slice(0,2).join(' '),
      ref: m.ref, canal: 'WhatsApp',
      msg: msg.slice(0, 120),
      dtHora: new Date().toLocaleString('pt-BR')
    });
    Toast.show('success', '📲 WhatsApp aberto!');
  };

  const deleteConfirm = id => {
    Modal.confirm('Excluir esta mensalidade permanentemente?', async () => {
      await DB.remove('mensalidades', id);
      Toast.show('success', 'Mensalidade removida.');
      await render(); await Badges.refresh();
    }, { title: '🗑️ Excluir Mensalidade', danger: true, confirmLabel: 'Excluir' });
  };

  /* ── Gerar lote próximo mês ── */
  const openGerarLote = async () => {
    const [mats, mens, cfg] = await Promise.all([DB.getAll('matriculas'), DB.getAll('mensalidades'), DB.getConfig()]);
    const ativos = mats.filter(m => m.st === 'matriculado');
    const n  = new Date();
    const px = new Date(n.getFullYear(), n.getMonth() + 1, 1);
    const ref = `${Utils.MONTHS_SHORT[px.getMonth()]}/${px.getFullYear()}`;
    const jaExistem = mens.filter(m => m.ref === ref).map(m => m.alunoId);
    const novos = ativos.filter(a => !jaExistem.includes(a.id));
    const total = novos.reduce((s, _) => s + (cfg.mensalidade || 933.88), 0);
    const html = `
      <div class="modal-header">
        <div class="modal-title">📅 Gerar Mensalidades — ${ref}</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="info-box teal" style="margin-bottom:var(--sp-md)">
          Serão criadas <b>${novos.length}</b> mensalidade(s) ref. <b>${ref}</b><br>
          Valor total previsto: <b>${Utils.money(total)}</b><br>
          ${jaExistem.length ? `<span style="color:var(--warning)">${jaExistem.length} aluno(s) já possuem mensalidade para este mês</span>` : ''}
        </div>
        <div style="max-height:200px;overflow-y:auto">
          ${novos.map(a => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">
              <div>
                <span style="font-weight:700;font-size:var(--fs-sm)">${Utils.esc(a.nome.split(' ').slice(0,2).join(' '))}</span>
                <span class="badge ${Utils.salaBadge(a.turma)}" style="font-size:9px;margin-left:5px">${Utils.salaLabel(a.turma)}</span>
              </div>
              <div style="font-size:var(--fs-xs);color:var(--ink-3)">Venc: dia ${a.diaVenc || cfg.diaPadrao || 10}</div>
            </div>`).join('')}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-secondary" onclick="Mens._confirmarLote('${ref}')">✅ Confirmar Geração</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const _confirmarLote = async ref => {
    const [mats, mens, cfg] = await Promise.all([DB.getAll('matriculas'), DB.getAll('mensalidades'), DB.getConfig()]);
    const ativos  = mats.filter(m => m.st === 'matriculado');
    const jaExist = new Set(mens.filter(m => m.ref === ref).map(m => m.alunoId));
    const px      = new Date();
    const parts   = ref.split('/');
    const mesIdx  = Utils.MONTHS_SHORT.indexOf(parts[0]);
    const ano     = parseInt(parts[1]);
    const novos   = ativos.filter(a => !jaExist.has(a.id));
    const maxParc = Math.max(0, ...mens.map(m => m.parcela || 0));
    for (const a of novos) {
      const dv = a.diaVenc || cfg.diaPadrao || 10;
      const vc = `${ano}-${String(mesIdx + 1).padStart(2,'0')}-${String(dv).padStart(2,'0')}`;
      await DB.save('mensalidades', {
        id: Utils.uuid(), alunoId: a.id, parcela: maxParc + 1, ref,
        vencimento: vc, valor: cfg.mensalidade || 933.88,
        valorPago: null, st: 'pendente', dtPago: null, forma: null
      });
    }
    Modal.close('modalSec');
    Toast.show('success', `✅ ${novos.length} mensalidade(s) de ${ref} geradas!`);
    await render(); await Badges.refresh();
  };

  return {
    render, filter, sort, goPage,
    toggleSel, toggleSelAll, clearSel, exportCSV, exportSelected,
    openPagar, _selForma, confirmarPagamento, sendWA,
    deleteConfirm, reemitirRecibo,
    openGerarLote, _confirmarLote
  };
})();

/* ============================================================
   COBR — Módulo Cobranças (Etapa 6.2)
   ============================================================ */
const Cobr = (() => {
  let _all = [], _mats = [], _hist = [], _histFiltered = [];
  let _histPage = 1; const PER_HIST = 20;
  let _histSort = 'dtHora'; let _histSortAsc = false;

  const render = async () => {
    [_all, _mats, _hist] = await Promise.all([
      DB.getAll('mensalidades'), DB.getAll('matriculas'), DB.getAll('histAv')
    ]);
    // Enriquece
    _all.forEach(m => {
      const mat = _mats.find(a => a.id === m.alunoId) || {};
      m._nome = mat.nome || '—';
      m._turma = mat.turma || '';
      m._telMae = mat.telMae || '';
      m._telPai = mat.telPai || '';
      m._emailMae = mat.emailMae || '';
      m._emailPai = mat.emailPai || '';
      m._matId = mat.id || '';
    });
    // Atualiza atrasados
    const hoje = Utils.today();
    for (const m of _all) {
      if (m.st === 'pendente' && m.vencimento < hoje) { m.st = 'atrasado'; await DB.save('mensalidades', m); }
    }
    _renderKpis();
    filter();
    _loadConfig();
    filterHist();
  };

  const _renderKpis = () => {
    const el = document.getElementById('cobrKpis');
    if (!el) return;
    const hoje = Utils.today();
    const ab       = _all.filter(m => m.st !== 'pago');
    const atr      = ab.filter(m => m.st === 'atrasado');
    const venc7    = ab.filter(m => m.st === 'pendente' && Utils.diffDays(m.vencimento) <= 7 && Utils.diffDays(m.vencimento) >= 0);
    const totalAb  = ab.reduce((s, m) => s + m.valor, 0);
    el.innerHTML = [
      { l:'Total em Aberto', v: Utils.money(totalAb),   s:`${ab.length} parcelas`,   i:'💰', c:'teal' },
      { l:'Atrasados',       v: atr.length,              s:'vencidos',                i:'🔴', c: atr.length ? 'danger' : 'success' },
      { l:'Vencendo em 7d',  v: venc7.length,            s:'preventivo',              i:'⏰', c:'warning' },
      { l:'Avisos Enviados', v: _hist.length,             s:'histórico total',         i:'📲', c:'info' },
    ].map((k, i) => `<div class="kpi ${k.c}" style="animation-delay:${i*.04}s">
      <div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div>
      <div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div>
    </div>`).join('');
  };

  const filter = () => {
