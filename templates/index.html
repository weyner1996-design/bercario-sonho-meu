    const filtro = document.getElementById('cobrFiltro')?.value || 'atrasado';
    let lista = _all.filter(m => m.st !== 'pago');
    if (filtro === 'atrasado') lista = lista.filter(m => m.st === 'atrasado');
    else if (filtro === 'vencendo') lista = lista.filter(m => m.st === 'pendente' && Utils.diffDays(m.vencimento) <= 7 && Utils.diffDays(m.vencimento) >= 0);
    lista.sort((a, b) => Utils.diffDays(a.vencimento) - Utils.diffDays(b.vencimento));
    const el = document.getElementById('cobrLista');
    if (!el) return;
    if (!lista.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">Nenhuma cobrança</div></div>`;
      return;
    }
    el.innerHTML = lista.map(m => {
      const d    = Utils.diffDays(m.vencimento);
      const cor  = m.st === 'atrasado' ? 'danger' : d <= 3 ? 'warning' : 'success';
      const lbl  = m.st === 'atrasado' ? `${Math.abs(d)}d atraso` : `${d}d`;
      const hist = _hist.filter(h => h.alunoId === m._matId).slice(-3);
      return `
        <div class="card" style="padding:12px 14px;margin-bottom:9px;border-left:4px solid var(--${cor})">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div style="display:flex;align-items:center;gap:9px">
              <div style="width:36px;height:36px;border-radius:var(--r-md);background:${Utils.avatarColor(m._matId)};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0">${Utils.initials(m._nome)}</div>
              <div>
                <div style="font-weight:700;font-size:var(--fs-base)">${Utils.esc(m._nome.split(' ').slice(0,2).join(' '))}</div>
                <div style="font-size:var(--fs-xs);color:var(--ink-3)">${m.ref} · <b style="color:var(--${cor})">${lbl}</b></div>
              </div>
            </div>
            <div style="font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--${cor})">${Utils.money(m.valor)}</div>
          </div>
          ${hist.length ? `<div style="font-size:10px;color:var(--ink-3);margin-top:5px">Últimos avisos: ${hist.map(h=>`${h.canal} ${h.dtHora.slice(0,10)}`).join(' | ')}</div>` : ''}
          <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap">
            ${m.st !== 'pago' ? `<button class="btn btn-success btn-xs" onclick="Mens.openPagar('${m.id}')">✓ Pagar</button>` : ''}
            <button class="btn btn-wa btn-xs" onclick="Cobr.openMsgPreview('${m._matId}','${m.id}','mae')">💬 Mãe</button>
            ${m._telPai ? `<button class="btn btn-wa btn-xs" onclick="Cobr.openMsgPreview('${m._matId}','${m.id}','pai')">💬 Pai</button>` : ''}
            ${m._emailMae || m._emailPai ? `<button class="btn btn-info btn-xs" onclick="Cobr.sendEmail('${m._matId}','${m.id}')">📧 E-mail</button>` : ''}
          </div>
        </div>`;
    }).join('');
  };

  /* ── Preview de mensagem antes de enviar ── */
  const openMsgPreview = async (matId, mensId, resp) => {
    const [mat, m, cfg] = await Promise.all([
      DB.get('matriculas', matId), DB.get('mensalidades', mensId), DB.getConfig()
    ]);
    if (!mat || !m) return;
    const d    = Utils.diffDays(m.vencimento);
    const tmpl = m.st === 'atrasado' ? (cfg.msgWhatsAppAtr || cfg.msgWhatsApp || '') : (cfg.msgWhatsApp || '');
    const tel  = resp === 'pai' ? mat.telPai : mat.telMae;
    const respNome = resp === 'pai' ? (mat.pai || '').split(' ')[0] : (mat.mae || '').split(' ')[0];
    const msg  = tmpl
      .replace('{resp}',    respNome || mat.nome.split(' ')[0])
      .replace('{crianca}', mat.nome.split(' ')[0])
      .replace('{ref}',     m.ref)
      .replace('{valor}',   Utils.money(m.valor))
      .replace('{venc}',    Utils.fmtDate(m.vencimento))
      .replace('{dias}',    m.st === 'atrasado' ? `ATRASADA ${Math.abs(d)}d` : String(d));
    const html = `
      <div class="modal-header">
        <div class="modal-title">💬 Preview da Mensagem</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="info-box teal" style="margin-bottom:10px">
          Enviando para: <b>${resp === 'pai' ? mat.pai || '—' : mat.mae || '—'}</b><br>
          Telefone: <b>${tel || 'não cadastrado'}</b>
        </div>
        <div style="background:var(--bg);border-radius:var(--r-md);padding:14px;white-space:pre-line;font-size:var(--fs-sm);line-height:1.7;border:1px solid var(--border)">${Utils.esc(msg)}</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-wa" onclick="Cobr._doSendWA('${matId}','${mensId}','${resp}','${encodeURIComponent(msg)}')">📲 Enviar no WhatsApp</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const _doSendWA = async (matId, mensId, resp, msgEnc) => {
    const mat = _mats.find(a => a.id === matId);
    const m   = _all.find(x => x.id === mensId);
    if (!mat || !m) return;
    const tel = ((resp === 'pai' ? mat.telPai : mat.telMae) || '').replace(/\D/g,'');
    const msg = decodeURIComponent(msgEnc);
    window.open(tel ? `https://wa.me/55${tel}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    await DB.save('histAv', {
      id: Utils.uuid(), alunoId: matId,
      nomeAluno: mat.nome.split(' ').slice(0,2).join(' '),
      ref: m.ref, canal: 'WhatsApp',
      msg: msg.slice(0, 120),
      dtHora: new Date().toLocaleString('pt-BR')
    });
    Modal.close('modalSec');
    Toast.show('success', '📲 WhatsApp aberto e aviso registrado!');
    await render();
  };

  const sendEmail = async (matId, mensId) => {
    const mat = _mats.find(a => a.id === matId);
    const m   = _all.find(x => x.id === mensId);
    if (!mat || !m) return;
    const cfg = await DB.getConfig();
    const em  = mat.emailMae || mat.emailPai || '';
    if (!em) { Toast.show('warning', 'E-mail não cadastrado.'); return; }
    const d   = Utils.diffDays(m.vencimento);
    const tmpl = m.st === 'atrasado' ? (cfg.msgWhatsAppAtr || cfg.msgWhatsApp || '') : (cfg.msgWhatsApp || '');
    const msg  = tmpl
      .replace('{resp}',    (mat.mae || mat.nome || '').split(' ')[0])
      .replace('{crianca}', mat.nome.split(' ')[0])
      .replace('{ref}',     m.ref)
      .replace('{valor}',   Utils.money(m.valor))
      .replace('{venc}',    Utils.fmtDate(m.vencimento))
      .replace('{dias}',    m.st === 'atrasado' ? `ATRASADA ${Math.abs(d)}d` : String(d));
    window.location.href = `mailto:${em}?subject=${encodeURIComponent('Berçário Sonho Meu — '+m.ref)}&body=${encodeURIComponent(msg)}`;
    await DB.save('histAv', {
      id: Utils.uuid(), alunoId: matId,
      nomeAluno: mat.nome.split(' ').slice(0,2).join(' '),
      ref: m.ref, canal: 'E-mail',
      msg: msg.slice(0, 120),
      dtHora: new Date().toLocaleString('pt-BR')
    });
    Toast.show('success', '📧 E-mail aberto e aviso registrado!');
  };

  const avisarTodos = async () => {
    const filtro  = document.getElementById('cobrFiltro')?.value || 'atrasado';
    let lista = _all.filter(m => m.st !== 'pago');
    if (filtro === 'atrasado') lista = lista.filter(m => m.st === 'atrasado');
    if (!lista.length) { Toast.show('info', 'Nenhum devedor no filtro atual.'); return; }
    if (!confirm(`Abrir WhatsApp para ${lista.length} devedor(es)?`)) return;
    const cfg = await DB.getConfig();
    for (const m of lista.slice(0, 1)) {
      await Cobr.openMsgPreview(m._matId, m.id, 'mae');
    }
    Toast.show('info', `${lista.length} avisos registrados. Envie um por vez via prévia.`);
  };

  /* ── Config de cobrança ── */
  const _loadConfig = async () => {
    const cfg = await DB.getConfig();
    const da = document.getElementById('cobrDiasAv');
    const mv = document.getElementById('cobrMsgVenc');
    const ma = document.getElementById('cobrMsgAtr');
    if (da) da.value = cfg.diasAviso || 5;
    if (mv) mv.value = cfg.msgWhatsApp || '';
    if (ma) ma.value = cfg.msgWhatsAppAtr || cfg.msgWhatsApp || '';
  };

  const salvarConfig = async () => {
    const cfg = await DB.getConfig();
    cfg.diasAviso       = parseInt(document.getElementById('cobrDiasAv')?.value) || 5;
    cfg.msgWhatsApp     = document.getElementById('cobrMsgVenc')?.value || cfg.msgWhatsApp;
    cfg.msgWhatsAppAtr  = document.getElementById('cobrMsgAtr')?.value  || cfg.msgWhatsApp;
    await DB.setConfig(cfg);
    Toast.show('success', '✅ Configurações salvas!');
  };

  /* ── Histórico ── */
  const filterHist = () => {
    const q = (document.getElementById('cobrHistSearch')?.value || '').toLowerCase();
    const canal = document.getElementById('cobrHistCanal')?.value || 'all';
    _histFiltered = _hist.filter(h => {
      if (canal !== 'all' && h.canal !== canal) return false;
      if (q && !Utils.normalize(h.nomeAluno || '').includes(Utils.normalize(q))) return false;
      return true;
    });
    _histFiltered.sort((a, b) => _histSortAsc
      ? (a[_histSort] || '').localeCompare(b[_histSort] || '')
      : (b[_histSort] || '').localeCompare(a[_histSort] || ''));
    _histPage = 1;
    _renderHist();
  };

  const sortHist = col => { _histSort = col; _histSortAsc = !_histSortAsc; filterHist(); };

  const _renderHist = () => {
    const tbody = document.getElementById('cobrHistBody');
    if (!tbody) return;
    const start = (_histPage - 1) * PER_HIST;
    const items = _histFiltered.slice(start, start + PER_HIST);
    tbody.innerHTML = items.map(h => `
      <tr>
        <td style="font-size:var(--fs-xs)">${h.dtHora}</td>
        <td style="font-weight:700">${Utils.esc(h.nomeAluno || '—')}</td>
        <td>${h.ref || '—'}</td>
        <td><span class="badge ${h.canal === 'WhatsApp' ? 'badge-wa' : 'badge-info'}">${h.canal}</span></td>
        <td style="font-size:var(--fs-xs);color:var(--ink-3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${Utils.esc(h.msg || '—')}</td>
      </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--ink-3)">Sem histórico</td></tr>`;
    const pag = document.getElementById('cobrHistPag');
    if (pag) {
      const pages = Math.ceil(_histFiltered.length / PER_HIST) || 1;
      const s = (_histPage-1)*PER_HIST+1, e = Math.min(_histPage*PER_HIST, _histFiltered.length);
      pag.innerHTML = `
        <div class="pagination-info">${_histFiltered.length ? `${s}–${e} de ${_histFiltered.length}` : '0 registros'}</div>
        <div class="pagination-btns">
          <button class="pg-btn" onclick="Cobr._histPage(${_histPage-1})" ${_histPage<=1?'disabled':''}>‹</button>
          <button class="pg-btn active">${_histPage}</button>
          <button class="pg-btn" onclick="Cobr._histPage(${_histPage+1})" ${_histPage>=pages?'disabled':''}>›</button>
        </div>`;
    }
  };

  const _histGoPage = p => {
    const pages = Math.ceil(_histFiltered.length / PER_HIST) || 1;
    _histPage = Math.max(1, Math.min(p, pages));
    _renderHist();
  };

  return {
    render, filter, filterHist, sortHist,
    openMsgPreview, _doSendWA, sendEmail, avisarTodos,
    salvarConfig, _histPage: _histGoPage
  };
})();

/* ============================================================
   RECIBOS — Módulo Recibos (Etapa 6.3)
   ============================================================ */
const Recibos = (() => {
  let _all = [], _mats = [], _mens = [], _cfg = {};
  let _histFiltered = [], _histPage = 1; const PER = 20;

  const render = async () => {
    [_all, _mats, _mens, _cfg] = await Promise.all([
      DB.getAll('recibos'), DB.getAll('matriculas'), DB.getAll('mensalidades'), DB.getConfig()
    ]);
    _populateAlunos();
    _populateMesFiltro();
    const dtEl = document.getElementById('recDt');
    if (dtEl) dtEl.value = Utils.today();
    filterHist();
  };

  const _populateAlunos = () => {
    const sel = document.getElementById('recAluno');
    if (!sel || sel.options.length > 1) return;
    const ativos = _mats.filter(m => m.st === 'matriculado').sort((a, b) => a.nome.localeCompare(b.nome));
    ativos.forEach(m => {
      const o = document.createElement('option'); o.value = m.id; o.textContent = m.nome; sel.appendChild(o);
    });
  };

  const _populateMesFiltro = () => {
    const sel = document.getElementById('recMesFiltro');
    if (!sel || sel.options.length > 1) return;
    const refs = [...new Set(_all.map(r => r.dtEmissao ? r.dtEmissao.slice(0,7) : ''))].filter(Boolean).sort().reverse();
    refs.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });
  };

  const carregarParcelas = () => {
    const matId = document.getElementById('recAluno')?.value;
    const sel   = document.getElementById('recParcela');
    if (!sel) return;
    sel.innerHTML = '<option value="">Selecionar parcela...</option>';
    if (!matId) return;
    const parcelas = _mens.filter(m => m.alunoId === matId && m.st === 'pago').sort((a, b) => (b.dtPago || '').localeCompare(a.dtPago || ''));
    if (!parcelas.length) {
      // Adiciona as pendentes também
      const todas = _mens.filter(m => m.alunoId === matId);
      todas.forEach(m => {
        const o = document.createElement('option'); o.value = m.id;
        o.textContent = `${m.ref} P${m.parcela} (${m.st})`;
        sel.appendChild(o);
      });
    } else {
      parcelas.forEach(m => {
        const o = document.createElement('option'); o.value = m.id;
        o.textContent = `${m.ref} P${m.parcela} — ${Utils.money(m.valorPago || m.valor)}`;
        sel.appendChild(o);
      });
    }
  };

  const preencherValor = () => {
    const mensId = document.getElementById('recParcela')?.value;
    if (!mensId) return;
    const m = _mens.find(x => x.id === mensId);
    if (!m) return;
    const vEl = document.getElementById('recValor');
    const dEl = document.getElementById('recDt');
    if (vEl) vEl.value = (m.valorPago || m.valor || 0).toFixed(2);
    if (dEl) dEl.value = m.dtPago || Utils.today();
  };

  const _buildRecibo = () => {
    const matId  = document.getElementById('recAluno')?.value;
    const mensId = document.getElementById('recParcela')?.value;
    const mat    = _mats.find(a => a.id === matId);
    const m      = mensId ? _mens.find(x => x.id === mensId) : null;
    const valor  = parseFloat(document.getElementById('recValor')?.value) || 0;
    const dt     = document.getElementById('recDt')?.value || Utils.today();
    const forma  = document.getElementById('recForma')?.value || 'PIX';
    if (!mat) { Toast.show('error', 'Selecione um aluno!'); return null; }
    const seq = _cfg.reciboSeq || 1;
    return {
      numero:    `${_cfg.reciboPrefixo || 'BSM'}-${new Date().getFullYear()}-${String(seq).padStart(3,'0')}`,
      nomeAluno: mat.nome,
      nomeResp:  mat.mae || mat.pai || '—',
      ref:       m ? `${m.ref} — P${m.parcela}` : 'Avulso',
      valor, forma, dtEmissao: dt,
      alunoId: matId, mensId: mensId || null,
      escola: _cfg.nomeEscola || 'Berçário Sonho Meu',
      cnpj:   _cfg.cnpj || '44.306.911-0001-17',
      end:    _cfg.endereco || '',
    };
  };

  const preview = () => {
    const rec = _buildRecibo(); if (!rec) return;
    const html = `
      <div class="modal-header">
        <div class="modal-title">🧾 Prévia do Recibo</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        ${_reciboHTML(rec)}
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Fechar</button>
        <button class="btn btn-secondary" onclick="Modal.close('modalSec');Recibos.imprimir()">🖨️ Imprimir</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const imprimir = async () => {
    const rec = _buildRecibo(); if (!rec) return;
    // Salva se novo
    if (!_all.find(r => r.mensId === rec.mensId && rec.mensId)) {
      rec.id = Utils.uuid();
      await DB.save('recibos', rec);
      const cfg = await DB.getConfig();
      cfg.reciboSeq = (cfg.reciboSeq || 1) + 1;
      await DB.setConfig(cfg);
      _all.push(rec);
      filterHist();
    }
    _printRec(rec);
  };

  const _printRec = rec => {
    const w = window.open('', '_blank', 'width=640,height=840');
    w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
      <title>Recibo ${rec.numero}</title>
      <style>
        body{font-family:Arial,sans-serif;padding:0;margin:0;font-size:12.5px}
        .page{max-width:560px;margin:0 auto;padding:28px}
        h2{text-align:center;font-size:14px;margin-bottom:2px}
        h3{text-align:center;font-size:11px;color:#666;margin-bottom:12px}
        .num{text-align:right;font-size:10px;color:#888;margin-bottom:8px}
        .tit{font-size:16px;font-weight:bold;text-align:center;border-top:2px solid #000;border-bottom:2px solid #000;padding:7px;margin:10px 0}
        .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee;font-size:12.5px}
        .val{font-size:24px;font-weight:bold;text-align:center;padding:14px;background:#e8f8f0;border-radius:8px;margin:14px 0}
        .ass{display:flex;justify-content:space-between;margin-top:48px}
        .al{border-top:1px solid #000;width:44%;text-align:center;padding-top:5px;font-size:11px}
        .corte{border-top:2px dashed #ccc;margin:24px 0;text-align:center;font-size:10px;color:#888}
        @media print{body{font-size:11px}}
      </style></head><body>
      <div class="page">${_reciboHTMLPrint(rec, 'PRESTADOR')}</div>
      <div class="corte">✂ — — — recortar — — —</div>
      <div class="page">${_reciboHTMLPrint(rec, 'TOMADOR')}</div>
      <script>window.print()<\/script></body></html>`);
    w.document.close();
  };

  const _reciboHTMLPrint = (rec, via) => `
    <h2>${rec.escola}</h2>
    <h3>CNPJ: ${rec.cnpj}</h3>
    <div class="num">Nº ${rec.numero} — Via do ${via}</div>
    <div class="tit">RECIBO DE PAGAMENTO</div>
    <div class="row"><span><b>Aluno(a):</b></span><span>${Utils.esc(rec.nomeAluno)}</span></div>
    <div class="row"><span><b>Responsável:</b></span><span>${Utils.esc(rec.nomeResp)}</span></div>
    <div class="row"><span><b>Referência:</b></span><span>${Utils.esc(rec.ref)}</span></div>
    <div class="row"><span><b>Forma:</b></span><span>${rec.forma}</span></div>
    <div class="row"><span><b>Data:</b></span><span>${Utils.fmtDate(rec.dtEmissao)}</span></div>
    <div class="val">R$ ${Number(rec.valor).toLocaleString('pt-BR', {minimumFractionDigits:2})}</div>
    <div class="ass">
      <div class="al">Responsável</div>
      <div class="al">${rec.escola}</div>
    </div>`;

  const _reciboHTML = rec => `
    <div style="border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;font-size:13px">
      <div style="text-align:right;font-size:10px;color:var(--ink-3);margin-bottom:6px">Nº ${rec.numero}</div>
      <div style="font-size:17px;font-weight:bold;text-align:center;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:7px;margin-bottom:12px">RECIBO DE PAGAMENTO</div>
      ${[['Aluno(a)',rec.nomeAluno],['Responsável',rec.nomeResp],['Referência',rec.ref],['Forma',rec.forma],['Data',Utils.fmtDate(rec.dtEmissao)]]
        .map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)"><span><b>${k}:</b></span><span>${Utils.esc(String(v||'—'))}</span></div>`).join('')}
      <div style="font-size:24px;font-weight:bold;text-align:center;padding:14px;background:var(--success-lt);border-radius:var(--r-md);margin:14px 0;color:var(--success-dk)">R$ ${Number(rec.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
    </div>`;

  const copiarDados = () => {
    navigator.clipboard?.writeText(`${_cfg.nomeEscola || 'Berçário Sonho Meu'} · CNPJ: ${_cfg.cnpj || '44.306.911-0001-17'} · ${_cfg.endereco || ''} · CNAE: 8811-5/00`)
      .then(() => Toast.show('success', '📋 Dados copiados!'))
      .catch(() => Toast.show('info', 'Copie manualmente: CNPJ 44.306.911-0001-17'));
  };

  /* ── Histórico ── */
  const filterHist = () => {
    const q   = (document.getElementById('recSearch')?.value || '').toLowerCase();
    const mes = document.getElementById('recMesFiltro')?.value || 'all';
    _histFiltered = _all.filter(r => {
      if (mes !== 'all' && !(r.dtEmissao || '').startsWith(mes)) return false;
      if (q && !Utils.normalize(r.nomeAluno || '').includes(Utils.normalize(q))) return false;
      return true;
    }).sort((a, b) => (b.dtEmissao || '').localeCompare(a.dtEmissao || ''));
    _histPage = 1;
    _renderHist();
  };

  const _renderHist = () => {
    const tbody = document.getElementById('recHistBody');
    if (!tbody) return;
    const start = (_histPage - 1) * PER;
    const items = _histFiltered.slice(start, start + PER);
    tbody.innerHTML = items.map(r => `
      <tr>
        <td style="font-weight:700;font-size:var(--fs-xs)">${r.numero || '—'}</td>
        <td style="font-weight:700">${Utils.esc((r.nomeAluno || '').split(' ').slice(0,2).join(' '))}</td>
        <td style="font-size:var(--fs-xs)">${r.ref || '—'}</td>
        <td style="font-weight:700;color:var(--success-dk)">${Utils.money(r.valor)}</td>
        <td><span class="badge badge-teal">${r.forma || '—'}</span></td>
        <td style="font-size:var(--fs-xs)">${Utils.fmtDate(r.dtEmissao)}</td>
        <td>
          <div class="td-actions">
            <button class="btn btn-ghost btn-xs" onclick="Recibos._printRec(${JSON.stringify(r).replace(/"/g,'&quot;')})" title="Reimprimir">🖨️</button>
          </div>
        </td>
      </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;padding:22px;color:var(--ink-3)">Nenhum recibo</td></tr>`;
    const pag = document.getElementById('recHistPag');
    if (pag) {
      const pages = Math.ceil(_histFiltered.length / PER) || 1;
      const s = (_histPage-1)*PER+1, e = Math.min(_histPage*PER, _histFiltered.length);
      pag.innerHTML = `
        <div class="pagination-info">${_histFiltered.length ? `${s}–${e} de ${_histFiltered.length}` : '0 registros'}</div>
        <div class="pagination-btns">
          <button class="pg-btn" onclick="Recibos._goPage(${_histPage-1})" ${_histPage<=1?'disabled':''}>‹</button>
          <button class="pg-btn active">${_histPage}</button>
          <button class="pg-btn" onclick="Recibos._goPage(${_histPage+1})" ${_histPage>=pages?'disabled':''}>›</button>
        </div>`;
    }
  };

  const _goPage = p => {
    const pages = Math.ceil(_histFiltered.length / PER) || 1;
    _histPage = Math.max(1, Math.min(p, pages));
    _renderHist();
  };

  const exportMes = () => {
    const mes = document.getElementById('recMesFiltro')?.value || Utils.today().slice(0,7);
    const items = _histFiltered.length ? _histFiltered : _all;
    const rows  = ['Número,Aluno,Referência,Valor,Forma,Emitido'];
    items.forEach(r => rows.push(`"${r.numero||''}","${r.nomeAluno||''}","${r.ref||''}","${(r.valor||0).toFixed(2)}","${r.forma||''}","${Utils.fmtDate(r.dtEmissao)}"`));
    Utils.downloadCSV(rows, `recibos_${mes||Utils.today().slice(0,7)}.csv`);
    Toast.show('success', 'Recibos exportados!');
  };

  return {
    render, carregarParcelas, preencherValor, preview, imprimir,
    copiarDados, filterHist, exportMes,
    _printRec, _goPage
  };
})();


/* ============================================================
   GASTOS — Módulo Gastos & Caixa (Etapa 7.1)
   ============================================================ */
const Gastos = (() => {
  let _all = [], _est = [], _filtered = [], _cfg = {};
  let _page = 1; const PER = 25;
  let _sortCol = 'dt', _sortAsc = false;
  let _autocomp = []; // histórico de descrições para autocomplete

  const CATS = {
    cozinha:    { ic: '🥗', lb: 'Cozinha',          cor: '#2eab6e' },
    limpeza:    { ic: '🧹', lb: 'Limpeza',          cor: '#1a7a8a' },
    pedagogico: { ic: '📚', lb: 'Pedagógico',       cor: '#7c5cbf' },
    insumo_unif:{ ic: '🧵', lb: 'Insumo Uniforme',  cor: '#e05a8a' },
    utilidades: { ic: '💡', lb: 'Utilidades',       cor: '#f59e0b' },
    folha:      { ic: '👩‍💼', lb: 'Folha de Pgto',   cor: '#e8644a' },
    manutencao: { ic: '🔧', lb: 'Manutenção',       cor: '#8fa3b1' },
    outros:     { ic: '📦', lb: 'Outros',            cor: '#4a5568' },
  };

  /* ── seed de gastos demo ── */
  const _seedIfEmpty = async () => {
    const existing = await DB.getAll('gastos');
    if (existing.length) return;
    const n = new Date();
    const mes = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
    const seeds = [
      { id: Utils.uuid(), dt: `${mes}-02`, descricao: 'Arroz 15kg', categoria: 'cozinha',    valor: 105,  tipo: 'variavel', itemEstId: null, recorrente: false },
      { id: Utils.uuid(), dt: `${mes}-03`, descricao: 'Feijão 8kg',  categoria: 'cozinha',   valor: 88,   tipo: 'variavel', itemEstId: null, recorrente: false },
      { id: Utils.uuid(), dt: `${mes}-05`, descricao: 'Energia elétrica', categoria: 'utilidades', valor: 380, tipo: 'fixo', itemEstId: null, recorrente: true },
      { id: Utils.uuid(), dt: `${mes}-08`, descricao: 'Sabão líquido e desinfetante', categoria: 'limpeza', valor: 72, tipo: 'variavel', itemEstId: null, recorrente: false },
      { id: Utils.uuid(), dt: `${mes}-10`, descricao: 'Papel sulfite 5 resmas', categoria: 'pedagogico', valor: 85, tipo: 'variavel', itemEstId: null, recorrente: false },
      { id: Utils.uuid(), dt: `${mes}-14`, descricao: 'Tecido malha – lote 1', categoria: 'insumo_unif', valor: 200, tipo: 'variavel', itemEstId: null, recorrente: false },
      { id: Utils.uuid(), dt: `${mes}-15`, descricao: 'Aluguel do espaço', categoria: 'utilidades', valor: 1800, tipo: 'fixo', itemEstId: null, recorrente: true },
      { id: Utils.uuid(), dt: `${mes}-01`, descricao: 'Folha de pagamento', categoria: 'folha', valor: 10024, tipo: 'fixo', itemEstId: null, recorrente: true },
    ];
    for (const s of seeds) await DB.save('gastos', s);
  };

  /* ── render principal ── */
  const render = async () => {
    await _seedIfEmpty();
    [_all, _est, _cfg] = await Promise.all([DB.getAll('gastos'), DB.getAll('estoque'), DB.getConfig()]);
    _autocomp = [...new Set(_all.map(g => g.descricao).filter(Boolean))];
    _populateMes();
    _populateCats();
    filter();
  };

  const _populateMes = () => {
    const sel = document.getElementById('gastosMes');
    if (!sel) return;
    const meses = [...new Set(_all.map(g => (g.dt || '').slice(0,7)).filter(Boolean))].sort().reverse();
    const n = new Date();
    const atual = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
    sel.innerHTML = `<option value="${atual}">Mês atual (${Utils.MONTHS_SHORT[n.getMonth()]}/${n.getFullYear()})</option>
      ${meses.filter(m => m !== atual).map(m => {
        const [y, mo] = m.split('-');
        return `<option value="${m}">${Utils.MONTHS_SHORT[parseInt(mo)-1]}/${y}</option>`;
      }).join('')}
      <option value="all">Todos os meses</option>`;
  };

  const _populateCats = () => {
    const sel = document.getElementById('gastosCat');
    if (!sel || sel.options.length > 1) return;
    Object.entries(CATS).forEach(([k, v]) => {
      const o = document.createElement('option'); o.value = k; o.textContent = `${v.ic} ${v.lb}`; sel.appendChild(o);
    });
  };

  /* ── filtro ── */
  const filter = () => {
    const mes   = document.getElementById('gastosMes')?.value   || 'atual';
    const q     = (document.getElementById('gastosSearch')?.value || '').toLowerCase().trim();
    const cat   = document.getElementById('gastosCat')?.value   || 'all';
    const tipo  = document.getElementById('gastosTipo')?.value  || 'all';
    const n     = new Date();
    const mesAtual = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
    const mesFiltro = mes === 'atual' ? mesAtual : mes;

    _filtered = _all.filter(g => {
      if (mesFiltro !== 'all' && !(g.dt || '').startsWith(mesFiltro)) return false;
      if (cat  !== 'all' && g.categoria !== cat)  return false;
      if (tipo !== 'all' && (g.tipo || 'variavel') !== tipo) return false;
      if (q && !Utils.normalize(g.descricao || '').includes(Utils.normalize(q))) return false;
      return true;
    });

    _filtered.sort((a, b) => {
      const va = String(a[_sortCol] || '').toLowerCase();
      const vb = String(b[_sortCol] || '').toLowerCase();
      if (_sortCol === 'valor') return _sortAsc ? a.valor - b.valor : b.valor - a.valor;
      return _sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });

    _page = 1;
    _renderKpis();
    _renderTable();
    _renderDRE();
    _renderPizza();
  };

  const sort = col => {
    if (_sortCol === col) _sortAsc = !_sortAsc; else { _sortCol = col; _sortAsc = col !== 'dt'; }
    filter();
  };

  /* ── KPIs ── */
  const _renderKpis = () => {
    const el = document.getElementById('gastosKpis');
    if (!el) return;
    const tot   = _filtered.reduce((s, g) => s + g.valor, 0);
    const fixos = _filtered.filter(g => g.tipo === 'fixo').reduce((s, g) => s + g.valor, 0);
    const var_  = tot - fixos;
    const n   = new Date();
    const mes = n.getMonth();
    const rec = [18500,19200,17800,21000,20500,19800,22000,21500,20000,18700,19500,21200][mes] || 0;
    const saldo = rec - tot;
    el.innerHTML = [
      { l: 'Total Despesas',   v: Utils.money(tot),    s: `${_filtered.length} lançamentos`, i: '📉', c: 'danger'  },
      { l: 'Gastos Fixos',     v: Utils.money(fixos),  s: `${_filtered.filter(g=>g.tipo==='fixo').length} recorrentes`, i: '📌', c: 'info'    },
      { l: 'Gastos Variáveis', v: Utils.money(var_),   s: `${_filtered.filter(g=>g.tipo!=='fixo').length} pontuais`, i: '📦', c: 'warning' },
      { l: 'Saldo do Mês',     v: Utils.money(saldo),  s: `Receita: ${Utils.money(rec)}`, i: saldo >= 0 ? '💚' : '🔴', c: saldo >= 0 ? 'success' : 'danger' },
    ].map((k, i) => `<div class="kpi ${k.c}" style="animation-delay:${i*.04}s">
      <div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div>
      <div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div>
    </div>`).join('');
  };

  /* ── Tabela ── */
  const _renderTable = () => {
    document.querySelectorAll('#gastosTable thead th[data-col]').forEach(th => {
      th.classList.toggle('sorted', th.dataset.col === _sortCol);
      th.classList.toggle('desc',   th.dataset.col === _sortCol && !_sortAsc);
    });
    const start = (_page - 1) * PER;
    const items = _filtered.slice(start, start + PER);
    const tbody = document.getElementById('gastosTbody');
    if (!tbody) return;

    tbody.innerHTML = items.length ? items.map(g => {
      const cat  = CATS[g.categoria] || CATS.outros;
      const item = g.itemEstId ? _est.find(e => e.id === g.itemEstId) : null;
      return `<tr>
        <td style="font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap">${Utils.fmtDate(g.dt)}</td>
        <td>
          <div style="font-weight:700">${Utils.esc(g.descricao || '—')}</div>
          ${g.obs ? `<div style="font-size:var(--fs-xs);color:var(--ink-3)">${Utils.esc(g.obs)}</div>` : ''}
        </td>
        <td><span class="badge" style="background:${cat.cor}22;color:${cat.cor};border:1px solid ${cat.cor}44">${cat.ic} ${cat.lb}</span></td>
        <td><span class="badge ${g.tipo==='fixo'?'badge-info':'badge-teal'}">${g.tipo==='fixo'?'📌 Fixo':'📦 Variável'}</span></td>
        <td>${item ? `<span class="badge badge-success" title="Atualiza ${item.nome}">📦</span>` : '<span style="color:var(--ink-4)">—</span>'}</td>
        <td style="font-weight:800;color:var(--danger)">${Utils.money(g.valor)}</td>
        <td>${g.comprovante ? `<button class="btn btn-ghost btn-xs" onclick="Gastos.verComp('${g.id}')" title="Ver comprovante">📎</button>` : '<span style="color:var(--ink-4)">—</span>'}</td>
        <td>
          <div class="td-actions">
            <button class="btn btn-ghost btn-xs" onclick="Gastos.openForm('${g.id}')" title="Editar">✏️</button>
            <button class="btn btn-danger btn-xs" onclick="Gastos.del('${g.id}')" title="Excluir">🗑️</button>
          </div>
        </td>
      </tr>`;
    }).join('') : `<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--ink-3)">Nenhum lançamento no período</td></tr>`;

    // Paginação
    const pag = document.getElementById('gastosPag');
    if (pag) {
      const pages = Math.ceil(_filtered.length / PER) || 1;
      const s = (_page-1)*PER+1, e = Math.min(_page*PER, _filtered.length);
      pag.innerHTML = `
        <div class="pagination-info">${_filtered.length ? `${s}–${e} de ${_filtered.length}` : '0 registros'}</div>
        <div class="pagination-btns">
          <button class="pg-btn" onclick="Gastos.goPage(${_page-1})" ${_page<=1?'disabled':''}>‹</button>
          ${Array.from({length:Math.min(pages,7)},(_,i)=>i+1).map(p=>`<button class="pg-btn ${p===_page?'active':''}" onclick="Gastos.goPage(${p})">${p}</button>`).join('')}
          <button class="pg-btn" onclick="Gastos.goPage(${_page+1})" ${_page>=pages?'disabled':''}>›</button>
        </div>`;
    }
  };

  const goPage = p => {
    const pages = Math.ceil(_filtered.length / PER) || 1;
    _page = Math.max(1, Math.min(p, pages));
    _renderTable();
  };

  /* ── DRE Simplificado ── */
  const _renderDRE = () => {
    const el = document.getElementById('gastosResumoDRE');
    if (!el) return;
    const n   = new Date();
    const mes = n.getMonth();
    const REC  = [18500,19200,17800,21000,20500,19800,22000,21500,20000,18700,19500,21200];
    const rec  = REC[mes] || 0;
    const tot  = _filtered.reduce((s, g) => s + g.valor, 0);
    const saldo = rec - tot;
    const pct   = rec > 0 ? Math.round(tot / rec * 100) : 0;

    el.innerHTML = `
      <div class="section-title">📈 DRE Simplificado</div>
      ${[
        { l: '(+) Receita Prevista', v: rec,   c: 'success-dk' },
        { l: '(−) Despesas',         v: tot,   c: 'danger'     },
        { l: '(=) Resultado',        v: saldo, c: saldo >= 0 ? 'teal-dk' : 'danger', bold: true },
      ].map(r => `
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:var(--fs-sm);${r.bold?'font-weight:800':''}color:var(--ink-2)">${r.l}</span>
          <span style="font-weight:${r.bold?800:700};color:var(--${r.c})">${Utils.money(r.v)}</span>
        </div>`).join('')}
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:4px">
          <span>Despesas / Receita</span><span>${pct}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ${pct>90?'danger':pct>70?'warning':'success'}" style="width:${Math.min(pct,100)}%"></div>
        </div>
      </div>`;
  };

  /* ── Gráfico de pizza SVG puro ── */
  const _renderPizza = () => {
    const pizza = document.getElementById('gastosPizza');
    const leg   = document.getElementById('gastosCatLegenda');
    if (!pizza || !leg) return;

    const agrup = {};
    _filtered.forEach(g => { agrup[g.categoria] = (agrup[g.categoria] || 0) + g.valor; });
    const total = Object.values(agrup).reduce((s, v) => s + v, 0);
    if (!total) { pizza.innerHTML = ''; leg.innerHTML = '<div class="empty-state" style="padding:8px"><div class="empty-sub">Sem dados</div></div>'; return; }

    const entries = Object.entries(agrup).sort((a,b) => b[1]-a[1]);
    const R = 68, cx = 70, cy = 70;
    let startAngle = -Math.PI / 2;
    let paths = '';

    entries.forEach(([cat, val]) => {
      const pct   = val / total;
      const angle = pct * 2 * Math.PI;
      const end   = startAngle + angle;
      const x1 = cx + R * Math.cos(startAngle);
      const y1 = cy + R * Math.sin(startAngle);
      const x2 = cx + R * Math.cos(end);
      const y2 = cy + R * Math.sin(end);
      const large = angle > Math.PI ? 1 : 0;
      const cor = (CATS[cat] || CATS.outros).cor;
      paths += `<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${large},1 ${x2},${y2} Z"
        fill="${cor}" stroke="#fff" stroke-width="1.5" opacity=".9">
        <title>${(CATS[cat]||CATS.outros).lb}: ${Utils.money(val)} (${Math.round(pct*100)}%)</title>
      </path>`;
      startAngle = end;
    });

    pizza.innerHTML = `<svg viewBox="0 0 140 140" width="140" height="140">${paths}</svg>`;
    leg.innerHTML = entries.map(([cat, val]) => {
      const c = CATS[cat] || CATS.outros;
      return `<div style="display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid var(--border)">
        <div style="width:10px;height:10px;border-radius:2px;background:${c.cor};flex-shrink:0"></div>
        <span style="font-size:var(--fs-xs);flex:1">${c.ic} ${c.lb}</span>
        <span style="font-size:var(--fs-xs);font-weight:700">${Math.round(val/total*100)}%</span>
      </div>`;
    }).join('');
  };

  /* ── Formulário (novo / editar) ── */
  const openForm = async (id = null) => {
    const g    = id ? _all.find(x => x.id === id) : null;
    const v    = k => g ? (g[k] ?? '') : '';
    const estOpts = _est.map(e => `<option value="${e.id}" ${g?.itemEstId===e.id?'selected':''}>${(CATS[e.categ]?.ic||'📦')} ${e.nome} (${e.qtd} ${e.unid})</option>`).join('');
    const datalistId = 'gastosAutocomp_' + Date.now();

    const html = `
      <div class="modal-header">
        <div class="modal-title">${id ? '✏️ Editar Gasto' : '💸 Novo Gasto'}</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <datalist id="${datalistId}">
          ${_autocomp.map(s => `<option value="${Utils.esc(s)}">`).join('')}
        </datalist>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Data <span class="required">*</span></label>
            <input class="form-input" type="date" id="gDt" value="${v('dt') || Utils.today()}">
          </div>
          <div class="form-group">
            <label class="form-label">Valor (R$) <span class="required">*</span></label>
            <input class="form-input" type="number" step="0.01" id="gVal" value="${v('valor') || ''}" placeholder="0,00">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:var(--sp-md)">
          <label class="form-label">Descrição <span class="required">*</span></label>
          <input class="form-input" id="gDesc" value="${Utils.esc(v('descricao'))}" placeholder="Ex: Arroz 15kg..." list="${datalistId}">
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Categoria</label>
            <select class="form-select" id="gCat">
              ${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${v('categoria')===k?'selected':''}>${c.ic} ${c.lb}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <div style="display:flex;gap:8px;margin-top:2px">
              <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:var(--fs-sm)">
                <input type="radio" name="gTipo" value="variavel" ${v('tipo')!=='fixo'?'checked':''}>📦 Variável
              </label>
              <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:var(--fs-sm)">
                <input type="radio" name="gTipo" value="fixo" ${v('tipo')==='fixo'?'checked':''}>📌 Fixo/Recorrente
              </label>
            </div>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:var(--sp-md)">
          <label class="form-label">Observação (opcional)</label>
          <input class="form-input" id="gObs" value="${Utils.esc(v('obs'))}" placeholder="Detalhes adicionais...">
        </div>
        <div style="background:var(--teal-lt);padding:12px;border-radius:var(--r-md);border:1px solid var(--border)">
          <div style="font-size:var(--fs-sm);font-weight:700;color:var(--teal-dk);margin-bottom:8px">📦 Este gasto atualiza o estoque?</div>
          <label style="display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);cursor:pointer;margin-bottom:10px">
            <input type="checkbox" id="gEstCheck" ${g?.itemEstId?'checked':''} style="width:15px;height:15px;accent-color:var(--teal)" onchange="Gastos._toggleEst()">
            Sim, este gasto repõe um item do estoque
          </label>
          <div id="gEstForm" style="display:${g?.itemEstId?'block':'none'}">
            <div class="form-row c3" style="margin-bottom:0">
              <div class="form-group">
                <label class="form-label">Item</label>
                <select class="form-select" id="gEstItem" onchange="Gastos._fillEstUnid(this)">
                  <option value="">Selecionar...</option>${estOpts}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Quantidade</label>
                <input class="form-input" type="number" step="0.1" id="gEstQtd" value="${v('itemEstQtd') || ''}" placeholder="Ex: 15">
              </div>
              <div class="form-group">
                <label class="form-label">Unidade</label>
                <input class="form-input" id="gEstUnid" value="${v('itemEstUnid') || ''}" readonly style="background:var(--bg-2)" placeholder="Auto">
              </div>
            </div>
          </div>
        </div>
        <div style="background:var(--bg);padding:10px;border-radius:var(--r-md);border:1px solid var(--border);margin-top:10px">
          <div style="font-size:var(--fs-sm);font-weight:700;color:var(--ink-2);margin-bottom:6px">📎 Comprovante (opcional)</div>
          <label class="upload-zone" style="padding:12px" onclick="document.getElementById('gComp').click()">
            <div style="font-size:22px;margin-bottom:4px">📄</div>
            <div style="font-size:var(--fs-xs);color:var(--ink-3)">${g?.comprovante ? 'Substituir comprovante' : 'Clique para anexar foto ou PDF'}</div>
            <input type="file" id="gComp" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="Gastos._onComp(this)">
          </label>
          <div id="gCompPreview" style="${g?.comprovante?'':'display:none'}">
            <div style="font-size:var(--fs-xs);color:var(--success-dk);margin-top:4px">✅ ${g?.compNome || 'Comprovante anexado'}</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-secondary" onclick="Gastos.save('${id || ''}')">💾 ${id ? 'Atualizar' : 'Lançar Gasto'}</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  let _compData = null, _compNome = '';
  const _toggleEst = () => {
    const f = document.getElementById('gEstForm');
    if (f) f.style.display = document.getElementById('gEstCheck')?.checked ? 'block' : 'none';
  };
  const _fillEstUnid = sel => {
    const estId = sel.value;
    const item  = _est.find(e => e.id === estId);
    const unid  = document.getElementById('gEstUnid');
    if (unid && item) unid.value = item.unid;
  };
  const _onComp = input => {
    const f = input.files[0]; if (!f) return;
    _compNome = f.name;
    const r = new FileReader();
    r.onload = e => {
      _compData = e.target.result;
      const p = document.getElementById('gCompPreview');
      if (p) { p.style.display=''; p.innerHTML=`<div style="font-size:var(--fs-xs);color:var(--success-dk);margin-top:4px">✅ ${Utils.esc(f.name)}</div>`; }
    };
    r.readAsDataURL(f);
  };

  const save = async (id) => {
    const desc  = document.getElementById('gDesc')?.value.trim();
    const valor = parseFloat(document.getElementById('gVal')?.value);
    if (!desc)    { Toast.show('error', 'Descrição obrigatória!'); return; }
    if (!valor)   { Toast.show('error', 'Valor obrigatório!');     return; }
    const tipo  = document.querySelector('input[name="gTipo"]:checked')?.value || 'variavel';
    const estChk= document.getElementById('gEstCheck')?.checked;
    const estId = estChk ? document.getElementById('gEstItem')?.value : null;
    const estQtd= estChk ? parseFloat(document.getElementById('gEstQtd')?.value) : null;

    const obj = {
      id:          id || Utils.uuid(),
      dt:          document.getElementById('gDt')?.value || Utils.today(),
      descricao:   desc,
      categoria:   document.getElementById('gCat')?.value || 'outros',
      valor,
      tipo,
      obs:         document.getElementById('gObs')?.value || '',
      itemEstId:   estId && estQtd ? estId : null,
      itemEstQtd:  estId && estQtd ? estQtd : null,
      itemEstUnid: estId ? (document.getElementById('gEstUnid')?.value || '') : null,
      recorrente:  tipo === 'fixo',
      comprovante: _compData || (id ? (_all.find(g=>g.id===id)?.comprovante || null) : null),
      compNome:    _compNome || (id ? (_all.find(g=>g.id===id)?.compNome || '') : ''),
    };

    // Atualiza estoque automaticamente
    if (estId && estQtd) {
      const item = _est.find(e => e.id === estId);
      if (item) {
        // Se é edição, reverte a quantidade anterior
        if (id) {
          const antigo = _all.find(g => g.id === id);
          if (antigo?.itemEstId === estId && antigo?.itemEstQtd) {
            item.qtd = Math.round((item.qtd - antigo.itemEstQtd) * 100) / 100;
          }
        }
        item.qtd = Math.round((item.qtd + estQtd) * 100) / 100;
        await DB.save('estoque', item);
        Toast.show('info', `📦 Estoque de ${item.nome}: +${estQtd} → ${item.qtd} ${item.unid}`);
      }
    }

    await DB.save('gastos', obj);
    _compData = null; _compNome = '';
    Modal.close('modalSec');
    Toast.show('success', id ? '✅ Gasto atualizado!' : '✅ Gasto lançado!');
    await render();
    await Badges.refresh();
  };

  const del = async id => {
    const g = _all.find(x => x.id === id);
    if (!g) return;
    Modal.confirm(`Excluir o lançamento <b>"${Utils.esc(g.descricao)}"</b> de <b>${Utils.money(g.valor)}</b>?`, async () => {
      await DB.remove('gastos', id);
      Toast.show('success', 'Lançamento removido.');
      await render();
    }, { title: '🗑️ Excluir Lançamento', danger: true, confirmLabel: 'Excluir' });
  };

  const verComp = id => {
    const g = _all.find(x => x.id === id);
    if (!g?.comprovante) return;
    const w = window.open('', '_blank');
    if (g.compNome?.match(/\.pdf$/i)) {
      w.document.write(`<html><body style="margin:0"><embed src="${g.comprovante}" type="application/pdf" width="100%" style="height:100vh"></body></html>`);
    } else {
      w.document.write(`<html><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${g.comprovante}" style="max-width:100%;max-height:100vh"></body></html>`);
    }
  };

  const exportCSV = () => {
    const rows = ['Data,Descrição,Categoria,Tipo,Valor,Observação'];
    _filtered.forEach(g => {
      const cat = (CATS[g.categoria] || CATS.outros).lb;
      rows.push(`"${Utils.fmtDate(g.dt)}","${g.descricao||''}","${cat}","${g.tipo||'variavel'}","${(g.valor||0).toFixed(2)}","${(g.obs||'').replace(/"/g,"'")}"`);
    });
    Utils.downloadCSV(rows, `gastos_${Utils.today()}.csv`);
    Toast.show('success', 'CSV exportado!');
  };

  return {
    render, filter, sort, goPage,
    openForm, save, del, verComp, exportCSV,
    _toggleEst, _fillEstUnid, _onComp
  };
})();

/* ============================================================
   EST — Módulo Estoque (Etapa 7.2)
   ============================================================ */
const Est = (() => {
  let _all = [], _movs = [], _filtered = [];

  const CATS = {
    cozinha:    { ic: '🥗', lb: 'Cozinha',         cor: 'var(--success)', bg: 'var(--success-lt)' },
    limpeza:    { ic: '🧹', lb: 'Limpeza',         cor: 'var(--teal-md)', bg: 'var(--teal-lt)'    },
    pedagogico: { ic: '📚', lb: 'Pedagógico',      cor: 'var(--info)',    bg: 'var(--info-lt)'    },
    insumo_unif:{ ic: '🧵', lb: 'Insumo Uniforme', cor: 'var(--pink)',    bg: 'var(--pink-lt)'    },
    outros:     { ic: '📦', lb: 'Outros',           cor: 'var(--warning)', bg: 'var(--warning-lt)' },
  };

  /* ── render principal ── */
  const render = async () => {
    [_all, _movs] = await Promise.all([DB.getAll('estoque'), DB.getAll('histAv').catch(() => [])]);
    // Usa store dedicada de movimentações se existir
    try { _movs = await DB.getAll('movEstoque'); } catch { _movs = []; }
    filter();
  };

  /* ── filtro ── */
  const filter = () => {
    const q     = (document.getElementById('estSearch')?.value || '').toLowerCase().trim();
    const filt  = document.getElementById('estFiltro')?.value || 'all';
    _filtered = _all.filter(e => {
      if (q && !Utils.normalize(e.nome).includes(Utils.normalize(q))) return false;
      if (filt === 'baixo'       && e.qtd > e.minimo)  return false;
      if (filt === 'vencendo'    && !(e.venc && Utils.diffDays(e.venc) >= 0 && Utils.diffDays(e.venc) <= 7)) return false;
      if (filt === 'semValidade' && e.venc) return false;
      return true;
    });
    _renderKpis();
    _renderCats();
  };

  /* ── KPIs ── */
  const _renderKpis = () => {
    const el = document.getElementById('estKpis');
    if (!el) return;
    const baixo  = _all.filter(e => e.qtd <= e.minimo).length;
    const venc7  = _all.filter(e => e.venc && Utils.diffDays(e.venc) >= 0 && Utils.diffDays(e.venc) <= 7).length;
    const vencido= _all.filter(e => e.venc && Utils.diffDays(e.venc) < 0).length;
    const valTotal = _all.reduce((s, e) => s + (e.qtd * e.valUnit), 0);
    el.innerHTML = [
      { l:'Itens Cadastrados', v: _all.length,   s:`${_filtered.length} exibidos`, i:'📦', c:'teal'    },
      { l:'Estoque Baixo',     v: baixo,         s:'abaixo do mínimo',              i:'⚠️', c: baixo  ? 'danger'  : 'success' },
      { l:'Vencendo em 7d',    v: venc7,         s:'atenção necessária',             i:'📅', c: venc7  ? 'warning' : 'success' },
      { l:'Valor Total',       v: Utils.money(valTotal), s:`${vencido} vencido(s)`,i:'💰', c:'info'    },
    ].map((k, i) => `<div class="kpi ${k.c}" style="animation-delay:${i*.04}s">
      <div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div>
      <div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div>
    </div>`).join('');
  };

  /* ── Categorias colapsáveis ── */
  const _renderCats = () => {
    const el = document.getElementById('estCats');
    if (!el) return;
    const porCat = {};
    _filtered.forEach(e => { if (!porCat[e.categ]) porCat[e.categ] = []; porCat[e.categ].push(e); });

    el.innerHTML = Object.entries(CATS).map(([catId, cat]) => {
      const itens = porCat[catId] || [];
      if (!itens.length) return '';
      return `
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:var(--sp-md)">
          <div style="padding:11px var(--sp-lg);display:flex;align-items:center;justify-content:space-between;background:${cat.bg};cursor:pointer"
               onclick="Est._toggleCat('cat_${catId}')">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:20px">${cat.ic}</span>
              <span style="font-family:var(--font-display);font-size:14px;font-weight:700;color:${cat.cor}">${cat.lb}</span>
              <span class="badge" style="background:${cat.bg};color:${cat.cor};border:1px solid ${cat.cor}44">${itens.length} ${itens.length===1?'item':'itens'}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();Est.openForm(null,'${catId}')">+ Item</button>
              <span id="chevron_${catId}" style="color:${cat.cor};font-size:12px">▼</span>
            </div>
          </div>
          <div id="cat_${catId}">
            ${itens.map(e => _itemHTML(e, cat)).join('')}
          </div>
        </div>`;
    }).join('') || `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-title">Nenhum item</div><div class="empty-sub">Adicione itens ao estoque</div></div>`;
  };

  const _toggleCat = id => {
    const el  = document.getElementById(id);
    const catId = id.replace('cat_', '');
    const chv = document.getElementById(`chevron_${catId}`);
    if (!el) return;
    const hidden = el.style.display === 'none';
    el.style.display = hidden ? '' : 'none';
    if (chv) chv.textContent = hidden ? '▼' : '▶';
  };

  const _itemHTML = (e, cat) => {
    const pct    = e.minimo > 0 ? Math.min(100, Math.round(e.qtd / e.minimo * 100)) : 100;
    const baixo  = e.qtd <= e.minimo;
    const d      = e.venc ? Utils.diffDays(e.venc) : null;
    const vencCor= d === null ? 'var(--ink-4)' : d < 0 ? 'var(--danger)' : d <= 7 ? 'var(--warning)' : 'var(--success-dk)';
    const vencLbl= d === null ? 'Sem validade' : d < 0 ? `Vencido há ${Math.abs(d)}d` : d === 0 ? 'Vence hoje!' : `${d}d para vencer`;
    const movs   = _movs.filter(m => m.itemId === e.id).slice(-5);

    return `
      <div class="stock-item" id="est_${e.id}">
        <div style="width:36px;height:36px;border-radius:var(--r-md);flex-shrink:0;
             background:${baixo ? 'var(--danger-lt)' : cat.bg};
             display:flex;align-items:center;justify-content:center;font-size:18px">
          ${cat.ic}
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
            <div style="font-weight:700">${Utils.esc(e.nome)}</div>
            ${baixo ? '<span class="badge badge-danger">⚠️ Baixo</span>' : ''}
            ${d !== null && d <= 0 ? '<span class="badge badge-danger">Vencido</span>' : ''}
            ${d !== null && d > 0 && d <= 7 ? '<span class="badge badge-warning">Vence em breve</span>' : ''}
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="progress-bar" style="width:120px">
              <div class="progress-fill ${baixo?'danger':pct<60?'warning':'success'}" style="width:${pct}%"></div>
            </div>
            <span style="font-size:var(--fs-xs);color:var(--ink-3)">Mín: ${e.minimo} ${e.unid}</span>
            <span style="font-size:var(--fs-xs);color:${vencCor}">${vencLbl}</span>
          </div>
        </div>
        <div style="text-align:center;min-width:80px">
          <div style="font-family:var(--font-display);font-size:18px;font-weight:800;color:${baixo?'var(--danger)':'var(--teal-dk)'}">
            <span id="qtd_${e.id}" style="cursor:pointer;border-bottom:1px dashed var(--teal-md)"
                  onclick="Est.editQtdInline('${e.id}')" title="Clique para editar">${e.qtd}</span>
          </div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3)">${e.unid}</div>
        </div>
        <div style="text-align:right;min-width:70px">
          <div style="font-size:var(--fs-sm);font-weight:700;color:var(--ink-2)">${Utils.money(e.valUnit)}</div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3)">/${e.unid}</div>
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-ghost btn-xs" onclick="Est.openMovModal('${e.id}')" title="Registrar saída">📤 Saída</button>
          <button class="btn btn-ghost btn-xs" onclick="Est.openForm('${e.id}')" title="Editar">✏️</button>
          <button class="btn btn-ghost btn-xs" onclick="Est.verHistorico('${e.id}')" title="Histórico">📋</button>
          <button class="btn btn-danger btn-xs" onclick="Est.del('${e.id}')" title="Excluir">🗑️</button>
        </div>
      </div>`;
  };

  /* ── Edição inline de quantidade ── */
  const editQtdInline = (id) => {
    const el = document.getElementById(`qtd_${id}`);
    if (!el || el.tagName === 'INPUT') return;
    const orig = el.textContent;
    const e    = _all.find(x => x.id === id);
    el.outerHTML = `<input id="qtd_${id}" type="number" step="0.1" value="${orig}"
      style="width:60px;font-family:var(--font-display);font-size:17px;font-weight:800;
             border:1.5px solid var(--teal-md);border-radius:var(--r-sm);padding:2px 5px;text-align:center"
      onblur="Est._saveQtdInline('${id}',this.value,'${orig}')"
      onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${orig}';this.blur()}">`;
    document.getElementById(`qtd_${id}`)?.focus();
  };

  const _saveQtdInline = async (id, newVal, orig) => {
    const nova = parseFloat(newVal);
    const item = _all.find(e => e.id === id);
    if (!item || isNaN(nova) || nova === parseFloat(orig)) {
      // Restaura sem salvar
      const el = document.getElementById(`qtd_${id}`);
      if (el) el.outerHTML = `<span id="qtd_${id}" style="cursor:pointer;border-bottom:1px dashed var(--teal-md)" onclick="Est.editQtdInline('${id}')" title="Clique para editar">${orig}</span>`;
      return;
    }
    const diff = nova - item.qtd;
    item.qtd   = Math.round(nova * 100) / 100;
    await DB.save('estoque', item);
    // Registra movimentação
    await _saveMovimentacao(id, diff > 0 ? 'entrada' : 'saida', Math.abs(diff), item.unid, 'Ajuste manual');
    Toast.show('success', `📦 ${item.nome}: ${nova} ${item.unid}`);
    await render();
    await Badges.refresh();
  };

  /* ── Registrar saída manual ── */
  const openMovModal = async id => {
    const item = _all.find(e => e.id === id); if (!item) return;
    const html = `
      <div class="modal-header">
        <div class="modal-title">📤 Saída de Estoque — ${Utils.esc(item.nome)}</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="info-box teal" style="margin-bottom:var(--sp-md)">
          Estoque atual: <b>${item.qtd} ${item.unid}</b> · Mínimo: ${item.minimo} ${item.unid}
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Quantidade (${item.unid}) <span class="required">*</span></label>
            <input class="form-input" type="number" step="0.1" id="movQtd" placeholder="Ex: 2" max="${item.qtd}">
          </div>
          <div class="form-group">
            <label class="form-label">Data</label>
            <input class="form-input" type="date" id="movDt" value="${Utils.today()}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Motivo</label>
          <input class="form-input" id="movMotivo" placeholder="Ex: Consumo da semana, produção uniforme...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-danger" onclick="Est.confirmarSaida('${id}')">📤 Confirmar Saída</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const confirmarSaida = async id => {
    const item = _all.find(e => e.id === id); if (!item) return;
    const qtd  = parseFloat(document.getElementById('movQtd')?.value);
    if (!qtd || qtd <= 0) { Toast.show('error', 'Quantidade inválida!'); return; }
    if (qtd > item.qtd)   { Toast.show('error', `Quantidade maior que o estoque (${item.qtd} ${item.unid})!`); return; }
    item.qtd = Math.round((item.qtd - qtd) * 100) / 100;
    await DB.save('estoque', item);
    const motivo = document.getElementById('movMotivo')?.value || 'Saída manual';
    const dt     = document.getElementById('movDt')?.value || Utils.today();
    await _saveMovimentacao(id, 'saida', qtd, item.unid, motivo, dt);
    Modal.close('modalSec');
    Toast.show('success', `📤 Saída de ${qtd} ${item.unid} de ${item.nome} registrada.`);
    await render();
    await Badges.refresh();
  };

  const _saveMovimentacao = async (itemId, tipo, qtd, unid, motivo, dt) => {
    try {
      await DB.save('movEstoque', {
        id: Utils.uuid(), itemId, tipo, qtd, unid,
        motivo: motivo || '', dt: dt || Utils.today(),
        dtHora: new Date().toLocaleString('pt-BR')
      });
    } catch {
      // Store pode não existir ainda — ignora silenciosamente
    }
  };

  /* ── Histórico de movimentações ── */
  const verHistorico = async id => {
    const item = _all.find(e => e.id === id); if (!item) return;
    let movs = [];
    try { movs = await DB.query('movEstoque', m => m.itemId === id); } catch { movs = []; }
    movs.sort((a, b) => (b.dtHora || '').localeCompare(a.dtHora || ''));
    const html = `
      <div class="modal-header">
        <div class="modal-title">📋 Histórico — ${Utils.esc(item.nome)}</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="info-box teal" style="margin-bottom:var(--sp-md)">
          Saldo atual: <b>${item.qtd} ${item.unid}</b>
        </div>
        ${movs.length ? `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Data/Hora</th><th>Tipo</th><th>Qtd</th><th>Motivo</th></tr></thead>
              <tbody>
                ${movs.map(m => `<tr>
                  <td style="font-size:var(--fs-xs)">${m.dtHora || Utils.fmtDate(m.dt)}</td>
                  <td><span class="badge ${m.tipo==='entrada'?'badge-success':'badge-danger'}">${m.tipo==='entrada'?'📥 Entrada':'📤 Saída'}</span></td>
                  <td style="font-weight:700">${m.qtd} ${m.unid}</td>
                  <td style="font-size:var(--fs-sm)">${Utils.esc(m.motivo || '—')}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>` : `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-sub">Sem movimentações registradas</div></div>`}
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost btn-sm" onclick="Est._exportMovItem('${id}')">📊 Exportar CSV</button>
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Fechar</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const _exportMovItem = async id => {
    const item = _all.find(e => e.id === id);
    let movs = [];
    try { movs = await DB.query('movEstoque', m => m.itemId === id); } catch {}
    const rows = ['Data,Tipo,Quantidade,Unidade,Motivo'];
    movs.forEach(m => rows.push(`"${m.dtHora||m.dt}","${m.tipo}","${m.qtd}","${m.unid}","${(m.motivo||'').replace(/"/g,"'")}"`));
    Utils.downloadCSV(rows, `hist_${item?.nome||id}_${Utils.today()}.csv`);
    Toast.show('success', 'CSV exportado!');
  };

  const exportMovCSV = async () => {
    let movs = [];
    try { movs = await DB.getAll('movEstoque'); } catch {}
    const rows = ['Item,Data,Tipo,Quantidade,Unidade,Motivo'];
    movs.sort((a, b) => (b.dtHora || '').localeCompare(a.dtHora || '')).forEach(m => {
      const item = _all.find(e => e.id === m.itemId);
      rows.push(`"${item?.nome||m.itemId}","${m.dtHora||m.dt}","${m.tipo}","${m.qtd}","${m.unid}","${(m.motivo||'').replace(/"/g,"'")}"`);
    });
    Utils.downloadCSV(rows, `movimentacoes_estoque_${Utils.today()}.csv`);
    Toast.show('success', 'Movimentações exportadas!');
  };

  /* ── Formulário item ── */
  const openForm = async (id = null, catPre = 'cozinha') => {
    const e = id ? _all.find(x => x.id === id) : null;
    const v = k => e ? (e[k] ?? '') : '';
    const html = `
      <div class="modal-header">
        <div class="modal-title">${id ? '✏️ Editar Item' : '➕ Novo Item de Estoque'}</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Nome <span class="required">*</span></label>
            <input class="form-input" id="eiNome" value="${Utils.esc(v('nome'))}" placeholder="Ex: Arroz, Sabão...">
          </div>
          <div class="form-group">
            <label class="form-label">Categoria</label>
            <select class="form-select" id="eiCat">
              ${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${(e?.categ||catPre)===k?'selected':''}>${c.ic} ${c.lb}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-row c3">
          <div class="form-group">
            <label class="form-label">Quantidade Atual</label>
            <input class="form-input" type="number" step="0.1" id="eiQtd" value="${v('qtd') || 0}">
          </div>
          <div class="form-group">
            <label class="form-label">Unidade</label>
            <input class="form-input" id="eiUnid" value="${Utils.esc(v('unid'))}" placeholder="kg, L, cx, rolos...">
          </div>
          <div class="form-group">
            <label class="form-label">Quantidade Mínima</label>
            <input class="form-input" type="number" step="0.1" id="eiMin" value="${v('minimo') || 1}">
          </div>
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Valor Unitário (R$)</label>
            <input class="form-input" type="number" step="0.01" id="eiVal" value="${v('valUnit') || ''}">
          </div>
          <div class="form-group">
            <label class="form-label">Data de Validade</label>
            <input class="form-input" type="date" id="eiVenc" value="${v('venc') || ''}">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-secondary" onclick="Est.save('${id || ''}')">💾 Salvar</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const save = async id => {
    const nome = document.getElementById('eiNome')?.value.trim();
    if (!nome) { Toast.show('error', 'Nome obrigatório!'); return; }
    const obj = {
      id:     id || Utils.uuid(),
      categ:  document.getElementById('eiCat')?.value   || 'outros',
      nome,
      qtd:    parseFloat(document.getElementById('eiQtd')?.value)  || 0,
      unid:   document.getElementById('eiUnid')?.value  || '',
      minimo: parseFloat(document.getElementById('eiMin')?.value)  || 1,
      valUnit:parseFloat(document.getElementById('eiVal')?.value)  || 0,
      venc:   document.getElementById('eiVenc')?.value  || null,
    };
    await DB.save('estoque', obj);
    Modal.close('modalSec');
    Toast.show('success', id ? '✅ Item atualizado!' : '✅ Item adicionado!');
    await render();
    await Badges.refresh();
  };

  const del = async id => {
    const item = _all.find(e => e.id === id); if (!item) return;
    Modal.confirm(`Excluir <b>${Utils.esc(item.nome)}</b> do estoque?`, async () => {
      await DB.remove('estoque', id);
      Toast.show('success', 'Item removido.');
      await render(); await Badges.refresh();
    }, { title: '🗑️ Excluir Item', danger: true, confirmLabel: 'Excluir' });
  };

  return {
    render, filter,
    openForm, save, del,
    editQtdInline, _saveQtdInline,
    openMovModal, confirmarSaida,
    verHistorico, _exportMovItem, exportMovCSV,
    _toggleCat
  };
})();



/* ============================================================
   UNIF — Módulo Uniforme & Produção (Etapa 8)
   ============================================================ */
const Unif = (() => {
  /* ── estado ── */
  let _fichas    = [];   // fichasTec
  let _lotes     = [];   // lotes
  let _vendas    = [];   // vendasUnif
  let _mats      = [];   // matriculas
  let _est       = [];   // estoque (insumos)
  let _cfg       = {};
  let _tab       = 'dashboard';
  let _lotesFiltered  = [];
  let _vendasFiltered = [];
  let _vendasPage = 1;
  const PER_VENDAS = 20;

  /* ── seed demo ── */
  const _seedIfEmpty = async () => {
    const [fExist, lExist] = await Promise.all([DB.getAll('fichasTec'), DB.getAll('lotes')]);
    if (fExist.length && lExist.length) return;

    // Fichas técnicas demo
    if (!fExist.length) {
      const insumos = await DB.getAll('estoque');
      const tecido  = insumos.find(e => e.nome?.toLowerCase().includes('tecido'))  || { id: null };
      const linha   = insumos.find(e => e.nome?.toLowerCase().includes('linha'))   || { id: null };
      const elast   = insumos.find(e => e.nome?.toLowerCase().includes('elást'))   || { id: null };

      await DB.save('fichasTec', {
        id: Utils.uuid(), peca: 'Camiseta', tamanhos: ['P','M','G','GG'],
        insumos: [
          { itemId: tecido.id, nome: 'Tecido malha', qtd: 0.8, unid: 'm'     },
          { itemId: linha.id,  nome: 'Linha',        qtd: 1,   unid: 'rolos' },
        ]
      });
      await DB.save('fichasTec', {
        id: Utils.uuid(), peca: 'Shorts', tamanhos: ['P','M','G'],
        insumos: [
          { itemId: tecido.id, nome: 'Tecido malha', qtd: 0.5, unid: 'm'     },
          { itemId: linha.id,  nome: 'Linha',        qtd: 0.5, unid: 'rolos' },
          { itemId: elast.id,  nome: 'Elástico',     qtd: 0.3, unid: 'm'     },
        ]
      });
      await DB.save('fichasTec', {
        id: Utils.uuid(), peca: 'Conjunto', tamanhos: ['P','M','G','GG'],
        insumos: [
          { itemId: tecido.id, nome: 'Tecido malha', qtd: 1.3, unid: 'm'     },
          { itemId: linha.id,  nome: 'Linha',        qtd: 1.5, unid: 'rolos' },
          { itemId: elast.id,  nome: 'Elástico',     qtd: 0.3, unid: 'm'     },
        ]
      });
    }

    // Lote demo
    if (!lExist.length) {
      const fichas = await DB.getAll('fichasTec');
      const ft = fichas.find(f => f.peca === 'Camiseta');
      if (ft) {
        const insCustos = (ft.insumos || []).map(ins => ({
          itemId:    ins.itemId,
          nome:      ins.nome,
          qtdPorPeca:ins.qtd,
          qtdTotal:  Math.round(ins.qtd * 10 * 100) / 100,
          unid:      ins.unid,
          precoUnit: ins.nome?.toLowerCase().includes('tecido') ? 22 : 3.5,
          total:     Math.round(ins.qtd * 10 * (ins.nome?.toLowerCase().includes('tecido') ? 22 : 3.5) * 100) / 100,
        }));
        const custoTotal = insCustos.reduce((s, i) => s + i.total, 0);
        const custoUnit  = custoTotal / 10;
        const margemPct  = 30;
        const precoVenda = parseFloat((custoUnit * (1 + margemPct / 100)).toFixed(2));
        await DB.save('lotes', {
          id: Utils.uuid(), ftId: ft.id, peca: ft.peca,
          data: '2026-03-10', qtd: 10, insCustos,
          custoTotal, custoUnit: parseFloat(custoUnit.toFixed(2)),
          margemPct, precoVenda,
          prontos: 10, vendidos: 1, status: 'ativo'
        });
      }
    }
  };

  /* ────────────────────────────────────────────────
     RENDER PRINCIPAL
  ──────────────────────────────────────────────── */
  const render = async () => {
    await _seedIfEmpty();
    [_fichas, _lotes, _vendas, _mats, _est, _cfg] = await Promise.all([
      DB.getAll('fichasTec'), DB.getAll('lotes'), DB.getAll('vendasUnif'),
      DB.getAll('matriculas'), DB.getAll('estoque'), DB.getConfig()
    ]);
    _renderKpis();
    setTab(_tab, true);
  };

  /* ────────────────────────────────────────────────
     KPIs
  ──────────────────────────────────────────────── */
  const _renderKpis = () => {
    const el = document.getElementById('unifKpis');
    if (!el) return;
    const prontos   = _lotes.reduce((s, l) => s + (l.prontos - l.vendidos), 0);
    const recVendas = _vendas.reduce((s, v) => s + v.precoVenda * v.qtd, 0);
    const lucroTotal= _vendas.reduce((s, v) => s + v.lucro, 0);
    const custoProd = _lotes.reduce((s, l) => s + l.custoTotal, 0);
    const margMedia = _lotes.length
      ? parseFloat((_lotes.reduce((s, l) => s + l.margemPct, 0) / _lotes.length).toFixed(1))
      : 0;
    el.innerHTML = [
      { l:'Prontos em Estoque', v: prontos,            s:'peças disponíveis',        i:'👕', c:'teal'    },
      { l:'Lotes Produzidos',   v: _lotes.length,      s:`${_fichas.length} fichas`, i:'🏭', c:'info'    },
      { l:'Receita de Vendas',  v: Utils.money(recVendas), s:`${_vendas.length} vendas`,i:'💰', c:'success' },
      { l:'Lucro Total',        v: Utils.money(lucroTotal),s:`Margem média: ${margMedia}%`, i:'📈', c:'sun' },
    ].map((k, i) => `<div class="kpi ${k.c}" style="animation-delay:${i*.04}s">
      <div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div>
      <div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div>
    </div>`).join('');
  };

  /* ────────────────────────────────────────────────
     ABAS
  ──────────────────────────────────────────────── */
  const setTab = (tab, force = false) => {
    if (_tab === tab && !force) return;
    _tab = tab;
    ['dashboard','fichas','lotes','vendas'].forEach(t => {
      const btn = document.getElementById(`utab-${t}`);
      const con = document.getElementById(`utab-content-${t}`);
      if (btn) btn.classList.toggle('active', t === tab);
      if (con) con.style.display = t === tab ? '' : 'none';
    });
    if (tab === 'dashboard') _renderDashboard();
    if (tab === 'fichas')    _renderFichas();
    if (tab === 'lotes')     { _buildLoteFiltros(); filterLotes(); }
    if (tab === 'vendas')    { filterVendas(); }
  };

  /* ────────────────────────────────────────────────
     DASHBOARD DE UNIFORMES
  ──────────────────────────────────────────────── */
  const _renderDashboard = () => {
    _renderEstoquePeca();
    _renderRentabilidade();
    _renderGraficoVendas();
    _renderAlertas();
  };

  /* Estoque por peça e tamanho */
  const _renderEstoquePeca = () => {
    const el = document.getElementById('unifEstoquePeca');
    if (!el) return;

    // Agrupa lotes ativos por peça, conta por tamanho usando vendasUnif
    const porcaPeca = {};
    _lotes.filter(l => l.status === 'ativo').forEach(l => {
      if (!porcaPeca[l.peca]) porcaPeca[l.peca] = { prontos: 0, vendidos: 0, loteIds: [] };
      porcaPeca[l.peca].prontos  += l.prontos;
      porcaPeca[l.peca].vendidos += l.vendidos;
      porcaPeca[l.peca].loteIds.push(l.id);
    });

    // Vendas por tamanho
    const vendPorTam = {};
    _vendas.forEach(v => {
      const key = `${v.peca}__${v.tam || '?'}`;
      vendPorTam[key] = (vendPorTam[key] || 0) + (v.qtd || 1);
    });

    if (!Object.keys(porcaPeca).length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">👕</div><div class="empty-sub">Nenhum lote ativo</div></div>';
      return;
    }

    el.innerHTML = Object.entries(porcaPeca).map(([peca, d]) => {
      const disponivel = d.prontos - d.vendidos;
      const ft = _fichas.find(f => f.peca === peca);
      const tams = ft?.tamanhos || [];
      return `
        <div style="border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div style="font-family:var(--font-display);font-size:14px;font-weight:700">👕 ${Utils.esc(peca)}</div>
            <span class="badge ${disponivel > 0 ? 'badge-success' : 'badge-danger'}">${disponivel} disponível/is</span>
          </div>
          <div class="progress-bar" style="margin-bottom:6px">
            <div class="progress-fill ${disponivel===0?'danger':disponivel<3?'warning':'success'}"
                 style="width:${d.prontos>0?Math.round(disponivel/d.prontos*100):0}%"></div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${tams.map(t => {
              const vd = vendPorTam[`${peca}__${t}`] || 0;
              return `<div style="text-align:center;padding:5px 9px;border-radius:var(--r-sm);background:var(--bg-2);font-size:var(--fs-xs)">
                <div style="font-weight:800;color:var(--teal-dk)">${t}</div>
                <div style="color:var(--ink-3)">${vd} vend.</div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('');
  };

  /* Rentabilidade por lote */
  const _renderRentabilidade = () => {
    const el = document.getElementById('unifRentabilidade');
    if (!el) return;
    if (!_lotes.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">🏭</div><div class="empty-sub">Nenhum lote</div></div>';
      return;
    }
    el.innerHTML = _lotes.slice().reverse().slice(0, 6).map(l => {
      const recLote  = _vendas.filter(v => v.loteId === l.id).reduce((s, v) => s + v.precoVenda * v.qtd, 0);
      const lucLote  = _vendas.filter(v => v.loteId === l.id).reduce((s, v) => s + v.lucro, 0);
      const margReal = l.custoTotal > 0 ? parseFloat((lucLote / (recLote || 1) * 100).toFixed(1)) : 0;
      const disp     = l.prontos - l.vendidos;
      return `
        <div style="padding:9px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
            <div>
              <div style="font-weight:700;font-size:var(--fs-sm)">Lote #${_lotes.indexOf(l)+1} — ${Utils.esc(l.peca)}</div>
              <div style="font-size:var(--fs-xs);color:var(--ink-3)">${Utils.fmtDate(l.data)} · ${l.qtd} peças · ${disp} disp.</div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:700;color:var(--success-dk)">${Utils.money(lucLote)}</div>
              <div style="font-size:var(--fs-xs);color:var(--ink-3)">Margem real: ${margReal}%</div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">
            ${[
              ['Custo unit.', Utils.money(l.custoUnit), 'danger'],
              ['Margem def.', l.margemPct+'%',          'info'],
              ['Preço venda', Utils.money(l.precoVenda),'success-dk'],
              ['Estoque',     disp+'/'+l.qtd,           disp===0?'danger':'teal-dk'],
            ].map(([lb, vl, c]) => `<div style="background:var(--bg-2);border-radius:var(--r-sm);padding:4px 6px;text-align:center">
              <div style="font-size:9px;color:var(--ink-3)">${lb}</div>
              <div style="font-weight:700;color:var(--${c});font-size:var(--fs-xs)">${vl}</div>
            </div>`).join('')}
          </div>
        </div>`;
    }).join('');
  };

  /* Gráfico de vendas por mês (SVG) */
  const _renderGraficoVendas = () => {
    const el = document.getElementById('unifGraficoVendas');
    if (!el) return;
    // Agrupa por mês (últimos 6)
    const meses = {};
    for (let i = 5; i >= 0; i--) {
      const d = new Date(); d.setMonth(d.getMonth() - i);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      meses[k] = 0;
    }
    _vendas.forEach(v => {
      const k = (v.dt || '').slice(0, 7);
      if (k in meses) meses[k] += v.precoVenda * v.qtd;
    });
    const entries = Object.entries(meses);
    const maxVal  = Math.max(...entries.map(([,v]) => v), 1);
    const W = 100 / entries.length;
    const H = 120;
    const bars = entries.map(([k, v], i) => {
      const barH  = Math.round(v / maxVal * (H - 24));
      const label = Utils.MONTHS_SHORT[parseInt(k.split('-')[1]) - 1];
      const isLast= i === entries.length - 1;
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default" title="${label}: ${Utils.money(v)}">
        <div style="font-size:9px;color:var(--ink-3);height:16px;display:flex;align-items:flex-end">${v > 0 ? Utils.money(v).replace('R$','') : ''}</div>
        <div style="width:80%;border-radius:3px 3px 0 0;background:var(--${isLast?'teal-dk':'teal-md'});height:${barH}px;min-height:${v>0?3:1}px;opacity:${isLast?1:.7};transition:height .4s ease"></div>
        <div style="font-size:9px;font-weight:${isLast?700:400};color:var(--${isLast?'teal-dk':'ink-3'})">${label}</div>
      </div>`;
    }).join('');
