          ${insumos.map((ins, i) => `
            <div class="ft-ins-row" style="display:grid;grid-template-columns:2fr 1fr 80px 36px;gap:7px;align-items:end;margin-bottom:8px" id="ftr_${i}">
              <div class="form-group" style="margin:0">
                <label class="form-label" style="font-size:10px">Insumo</label>
                <select class="form-select" id="ftItem_${i}" onchange="Unif._ftAutoUnid(${i},this)">
                  <option value="">Selecionar insumo...</option>${insOpts(ins.itemId)}
                </select>
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" style="font-size:10px">Qtd/peça</label>
                <input class="form-input" type="number" step="0.01" id="ftQtd_${i}" value="${ins.qtd||''}">
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" style="font-size:10px">Unid.</label>
                <input class="form-input" id="ftUnid_${i}" value="${ins.unid||''}" readonly style="background:var(--bg-2)">
              </div>
              <button class="btn btn-danger btn-xs" style="height:34px;align-self:flex-end" onclick="Unif._ftDelRow(${i})">🗑️</button>
            </div>`).join('')}
        </div>
        <button class="btn btn-ghost btn-sm" onclick="Unif._ftAddRow()">+ Insumo</button>
        <div id="ftCustoPreview" style="margin-top:12px;padding:10px;background:var(--teal-lt);border-radius:var(--r-md);font-size:var(--fs-sm);display:none">
          <b>Custo total estimado:</b> <span id="ftCustoVal">—</span>/peça
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalMain')">Cancelar</button>
        <button class="btn btn-ghost btn-sm" onclick="Unif._ftCalcCusto()">🔄 Calcular custo</button>
        <button class="btn btn-secondary" onclick="Unif.saveFicha('${id||''}')">💾 Salvar Ficha</button>
      </div>`;
    Modal.open('modalMain', html, { size: 'lg' });
  };

  let _ftRowCount = 0;
  const _ftAutoUnid = (i, sel) => {
    const opt = sel.options[sel.selectedIndex];
    const unid = document.getElementById(`ftUnid_${i}`);
    if (unid && opt?.dataset?.unid) unid.value = opt.dataset.unid;
    _ftCalcCusto();
  };
  const _ftAddRow = () => {
    const wrap = document.getElementById('ftInsRows');
    if (!wrap) return;
    _ftRowCount++;
    const i = wrap.querySelectorAll('.ft-ins-row').length;
    const insUnif = _est.filter(e => e.categ === 'insumo_unif');
    const opts = insUnif.map(e => `<option value="${e.id}" data-unid="${e.unid}">${Utils.esc(e.nome)}</option>`).join('');
    const div = document.createElement('div');
    div.className = 'ft-ins-row';
    div.id = `ftr_${i}`;
    div.style.cssText = 'display:grid;grid-template-columns:2fr 1fr 80px 36px;gap:7px;align-items:end;margin-bottom:8px';
    div.innerHTML = `
      <div class="form-group" style="margin:0"><label class="form-label" style="font-size:10px">Insumo</label>
        <select class="form-select" id="ftItem_${i}" onchange="Unif._ftAutoUnid(${i},this)">
          <option value="">Selecionar...</option>${opts}</select></div>
      <div class="form-group" style="margin:0"><label class="form-label" style="font-size:10px">Qtd/peça</label>
        <input class="form-input" type="number" step="0.01" id="ftQtd_${i}" oninput="Unif._ftCalcCusto()"></div>
      <div class="form-group" style="margin:0"><label class="form-label" style="font-size:10px">Unid.</label>
        <input class="form-input" id="ftUnid_${i}" readonly style="background:var(--bg-2)"></div>
      <button class="btn btn-danger btn-xs" style="height:34px;align-self:flex-end" onclick="Unif._ftDelRow(${i})">🗑️</button>`;
    wrap.appendChild(div);
  };
  const _ftDelRow = i => { document.getElementById(`ftr_${i}`)?.remove(); _ftCalcCusto(); };
  const _ftCalcCusto = () => {
    const rows = document.querySelectorAll('.ft-ins-row');
    let total = 0, ok = true;
    rows.forEach((_, i) => {
      const itemId = document.getElementById(`ftItem_${i}`)?.value;
      const qtd    = parseFloat(document.getElementById(`ftQtd_${i}`)?.value) || 0;
      const item   = _est.find(e => e.id === itemId);
      if (itemId && qtd && item) total += item.valUnit * qtd;
      else if (itemId && qtd) ok = false;
    });
    const pv = document.getElementById('ftCustoPreview');
    const cv = document.getElementById('ftCustoVal');
    if (pv) pv.style.display = 'block';
    if (cv) cv.textContent = ok ? Utils.money(total) : `~${Utils.money(total)} (preços parciais)`;
  };

  const saveFicha = async id => {
    const peca = document.getElementById('ftPeca')?.value.trim();
    if (!peca) { Toast.show('error', 'Nome da peça obrigatório!'); return; }
    const tamanhos = (document.getElementById('ftTams')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
    const rows = document.querySelectorAll('.ft-ins-row');
    const insumos = [];
    rows.forEach((_, i) => {
      const itemId = document.getElementById(`ftItem_${i}`)?.value;
      const qtd    = parseFloat(document.getElementById(`ftQtd_${i}`)?.value);
      const unid   = document.getElementById(`ftUnid_${i}`)?.value || '';
      if (itemId && qtd) {
        const item = _est.find(e => e.id === itemId);
        insumos.push({ itemId, nome: item?.nome || '', qtd, unid: unid || item?.unid || '' });
      }
    });
    if (!insumos.length) { Toast.show('error', 'Adicione ao menos um insumo!'); return; }
    await DB.save('fichasTec', { id: id || Utils.uuid(), peca, tamanhos, insumos });
    Modal.close('modalMain');
    Toast.show('success', `✅ Ficha "${peca}" salva!`);
    await render();
  };

  const duplicarFicha = async id => {
    const ft = _fichas.find(f => f.id === id); if (!ft) return;
    const nova = { ...ft, id: Utils.uuid(), peca: ft.peca + ' (cópia)' };
    await DB.save('fichasTec', nova);
    Toast.show('success', `📋 "${ft.peca}" duplicada!`);
    await render(); setTab('fichas', true);
  };

  const delFicha = async id => {
    const ft = _fichas.find(f => f.id === id); if (!ft) return;
    const lotesUsam = _lotes.filter(l => l.ftId === id).length;
    if (lotesUsam > 0) { Toast.show('error', `Não é possível excluir: ${lotesUsam} lote(s) usam esta ficha.`); return; }
    Modal.confirm(`Excluir a ficha técnica <b>"${Utils.esc(ft.peca)}"</b>?`, async () => {
      await DB.remove('fichasTec', id);
      Toast.show('success', 'Ficha excluída.');
      await render();
    }, { title: '🗑️ Excluir Ficha', danger: true, confirmLabel: 'Excluir' });
  };

  /* ────────────────────────────────────────────────
     LOTES
  ──────────────────────────────────────────────── */
  const _buildLoteFiltros = () => {
    const sel = document.getElementById('unifLotePeca');
    if (!sel || sel.options.length > 1) return;
    const pecas = [...new Set(_lotes.map(l => l.peca))];
    pecas.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o); });
  };

  const filterLotes = () => {
    const filt = document.getElementById('unifLoteFiltro')?.value || 'all';
    const peca = document.getElementById('unifLotePeca')?.value   || 'all';
    _lotesFiltered = _lotes.filter(l => {
      if (filt !== 'all' && l.status !== filt) return false;
      if (peca !== 'all' && l.peca  !== peca)  return false;
      return true;
    }).sort((a, b) => b.data.localeCompare(a.data));
    _renderLotes();
  };

  const _renderLotes = () => {
    const el = document.getElementById('unifLotesList');
    if (!el) return;
    if (!_lotesFiltered.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">🏭</div><div class="empty-title">Nenhum lote</div><button class="btn btn-secondary" style="margin-top:12px" onclick="Unif.openLote()">+ Novo Lote</button></div>';
      return;
    }
    el.innerHTML = _lotesFiltered.map((l, idx) => {
      const disp = l.prontos - l.vendidos;
      const ft   = _fichas.find(f => f.id === l.ftId);
      return `
        <div class="card" style="margin-bottom:var(--sp-md)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
            <div>
              <div style="display:flex;align-items:center;gap:8px">
                <div style="font-family:var(--font-display);font-size:15px;font-weight:700">Lote #${idx+1} — ${Utils.esc(l.peca)}</div>
                <span class="badge ${l.status==='ativo'?'badge-success':'badge-danger'}">${l.status==='ativo'?'✅ Ativo':'Encerrado'}</span>
              </div>
              <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:3px">${Utils.fmtDate(l.data)} · ${l.qtd} peças produzidas</div>
            </div>
            <div style="display:flex;gap:5px">
              ${disp > 0 ? `<button class="btn btn-success btn-xs" onclick="Unif.openVenda('${l.id}')">💰 Vender</button>` : ''}
              ${l.status==='ativo' ? `<button class="btn btn-ghost btn-xs" onclick="Unif.encerrarLote('${l.id}')">🔒 Encerrar</button>` : ''}
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
            ${[
              ['Custo unit.',   Utils.money(l.custoUnit),   'danger'],
              ['Margem def.',   l.margemPct+'%',             'info'],
              ['Preço venda',   Utils.money(l.precoVenda),  'success-dk'],
              ['Disponíveis',   `${disp}/${l.qtd}`,          disp===0?'danger':'teal-dk'],
            ].map(([lb, vl, c]) => `<div style="background:var(--bg-2);border-radius:var(--r-md);padding:8px;text-align:center">
              <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:2px">${lb}</div>
              <div style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--${c})">${vl}</div>
            </div>`).join('')}
          </div>
          <div style="font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px">💵 Custos dos insumos neste lote</div>
          <div>
            ${(l.insCustos || []).map(ins => `
              <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm)">
                <span>${Utils.esc(ins.nome)}</span>
                <span style="color:var(--ink-3)">${ins.qtdTotal}${ins.unid} × ${Utils.money(ins.precoUnit)} = <b>${Utils.money(ins.total)}</b></span>
              </div>`).join('')}
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:var(--fs-sm);font-weight:800">
              <span>Total</span><span style="color:var(--danger)">${Utils.money(l.custoTotal)}</span>
            </div>
          </div>
          <div class="progress-bar" style="margin-top:6px">
            <div class="progress-fill ${disp===0?'danger':disp<3?'warning':'success'}" style="width:${l.prontos>0?Math.round(disp/l.prontos*100):0}%"></div>
          </div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:3px;text-align:right">${l.vendidos} vendido(s) · ${disp} disponível/is</div>
        </div>`;
    }).join('');
  };

  /* ── Form Novo Lote ── */
  const openLote = async (ftIdPre = null) => {
    if (!_fichas.length) { Toast.show('warning', 'Crie uma ficha técnica primeiro!'); setTab('fichas'); return; }
    const ftOpts = _fichas.map(ft => `<option value="${ft.id}" ${ft.id===ftIdPre?'selected':''}>${Utils.esc(ft.peca)}</option>`).join('');
    // Margem sugerida = média dos últimos lotes
    const margSug = _lotes.length
      ? parseFloat((_lotes.reduce((s, l) => s + l.margemPct, 0) / _lotes.length).toFixed(0))
      : 30;

    const html = `
      <div class="modal-header">
        <div class="modal-title">🏭 Novo Lote de Produção</div>
        <button class="modal-close" onclick="Modal.close('modalMain')">×</button>
      </div>
      <div class="modal-body">
        <div class="info-box teal" style="margin-bottom:var(--sp-md);font-size:var(--fs-sm)">
          💡 Ao confirmar: insumos são descontados do estoque · custo total entra como gasto · peças prontas entram no estoque de uniformes.
        </div>
        <div class="form-row c3">
          <div class="form-group">
            <label class="form-label">Ficha Técnica <span class="required">*</span></label>
            <select class="form-select" id="ltFt" onchange="Unif._calcLote()">${ftOpts}</select>
          </div>
          <div class="form-group">
            <label class="form-label">Data de Produção</label>
            <input class="form-input" type="date" id="ltDt" value="${Utils.today()}">
          </div>
          <div class="form-group">
            <label class="form-label">Quantidade <span class="required">*</span></label>
            <input class="form-input" type="number" id="ltQtd" value="10" min="1" oninput="Unif._calcLote()">
          </div>
        </div>
        <div style="font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;margin-bottom:8px">💵 Custo dos insumos neste lote (edite os preços reais)</div>
        <div id="ltInsRows"></div>
        <div class="form-row c3" style="margin-top:10px">
          <div class="form-group">
            <label class="form-label">Custo Total (R$)</label>
            <input class="form-input" id="ltCustoTotal" readonly style="background:var(--bg-2);font-weight:700;color:var(--danger)">
          </div>
          <div class="form-group">
            <label class="form-label">Custo Unitário (R$)</label>
            <input class="form-input" id="ltCustoUnit"  readonly style="background:var(--bg-2);font-weight:700;color:var(--danger)">
          </div>
          <div class="form-group">
            <label class="form-label">Margem % <span class="form-hint">(sugerida: ${margSug}%)</span></label>
            <input class="form-input" type="number" id="ltMargem" value="${margSug}" min="0" oninput="Unif._calcLote()">
          </div>
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Preço de Venda Sugerido (R$)</label>
            <input class="form-input" id="ltPrecoVenda" style="font-weight:800;font-size:16px;color:var(--success-dk)">
          </div>
          <div class="form-group" style="align-self:flex-end">
            <button class="btn btn-ghost btn-sm" onclick="Unif._calcLote()">🔄 Recalcular</button>
          </div>
        </div>
        <div id="ltEstCheck" style="margin-top:10px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalMain')">Cancelar</button>
        <button class="btn btn-secondary" onclick="Unif.confirmarLote()">✅ Confirmar Lote</button>
      </div>`;
    Modal.open('modalMain', html, { size: 'xl' });
    _calcLote();
  };

  const _calcLote = () => {
    const ftId  = document.getElementById('ltFt')?.value;
    const qtd   = parseInt(document.getElementById('ltQtd')?.value) || 1;
    const marg  = parseFloat(document.getElementById('ltMargem')?.value) || 30;
    const ft    = _fichas.find(f => f.id === ftId);
    if (!ft) return;

    // Verifica estoque suficiente
    let alertas = '';
    const insCustos = ft.insumos.map(ins => {
      const item     = _est.find(e => e.id === ins.itemId) || {};
      const qtdTotal = Math.round(ins.qtd * qtd * 100) / 100;
      const precoUnit= item.valUnit || 0;
      const total    = parseFloat((precoUnit * qtdTotal).toFixed(2));
      const sufic    = (item.qtd || 0) >= qtdTotal;
      if (!sufic) alertas += `<div style="font-size:var(--fs-xs);color:var(--danger)">⚠️ ${ins.nome}: precisa ${qtdTotal}${ins.unid} mas tem ${item.qtd||0}${item.unid||ins.unid}</div>`;
      return { itemId: ins.itemId, nome: ins.nome||item.nome||'', qtdPorPeca: ins.qtd, qtdTotal, unid: ins.unid||item.unid||'', precoUnit, total, sufic };
    });

    const custoTotal = parseFloat(insCustos.reduce((s, i) => s + i.total, 0).toFixed(2));
    const custoUnit  = parseFloat((custoTotal / qtd).toFixed(2));
    const precoVenda = parseFloat((custoUnit * (1 + marg / 100)).toFixed(2));

    // Renderiza linhas de insumos
    const wrap = document.getElementById('ltInsRows');
    if (wrap) {
      wrap.innerHTML = insCustos.map((ins, i) => `
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;align-items:center;padding:7px;background:var(--${ins.sufic?'bg':'danger-lt'});border-radius:var(--r-md);margin-bottom:6px;border:1px solid var(--${ins.sufic?'border':'danger'})">
          <div>
            <div style="font-weight:700;font-size:var(--fs-sm)">${Utils.esc(ins.nome)}</div>
            <div style="font-size:var(--fs-xs);color:var(--ink-3)">${ins.qtdPorPeca}${ins.unid}/peça × ${qtd} = <b>${ins.qtdTotal}${ins.unid}</b></div>
          </div>
          <div class="form-group" style="margin:0">
            <label class="form-label" style="font-size:10px">R$/${ins.unid}</label>
            <input class="form-input" type="number" step="0.01" id="ltPu_${i}" value="${ins.precoUnit.toFixed(2)}" oninput="Unif._recalcLote()">
          </div>
          <div style="text-align:center">
            <div style="font-size:10px;color:var(--ink-3)">Total</div>
            <div style="font-weight:700;color:var(--danger)" id="ltTotal_${i}">${Utils.money(ins.total)}</div>
          </div>
          <div style="text-align:center;font-size:var(--fs-xs);color:var(--${ins.sufic?'success-dk':'danger'})">${ins.sufic?'✅ OK':'⚠️ Insuficiente'}</div>
        </div>`).join('');
    }

    document.getElementById('ltCustoTotal') && (document.getElementById('ltCustoTotal').value = custoTotal.toFixed(2));
    document.getElementById('ltCustoUnit')  && (document.getElementById('ltCustoUnit').value  = custoUnit.toFixed(2));
    document.getElementById('ltPrecoVenda') && (document.getElementById('ltPrecoVenda').value  = precoVenda.toFixed(2));

    const ck = document.getElementById('ltEstCheck');
    if (ck) ck.innerHTML = alertas ? `<div class="info-box danger">${alertas}<div style="margin-top:6px;font-size:var(--fs-xs)">⚠️ Estoque insuficiente. Você pode prosseguir, mas o estoque ficará negativo.</div></div>` : '';
  };

  const _recalcLote = () => {
    const ftId  = document.getElementById('ltFt')?.value;
    const qtd   = parseInt(document.getElementById('ltQtd')?.value) || 1;
    const marg  = parseFloat(document.getElementById('ltMargem')?.value) || 30;
    const ft    = _fichas.find(f => f.id === ftId);
    if (!ft) return;
    let custoTotal = 0;
    ft.insumos.forEach((ins, i) => {
      const pu       = parseFloat(document.getElementById(`ltPu_${i}`)?.value) || 0;
      const qtdTotal = Math.round(ins.qtd * qtd * 100) / 100;
      const total    = parseFloat((pu * qtdTotal).toFixed(2));
      custoTotal += total;
      const el = document.getElementById(`ltTotal_${i}`);
      if (el) el.textContent = Utils.money(total);
    });
    custoTotal = parseFloat(custoTotal.toFixed(2));
    const custoUnit  = parseFloat((custoTotal / qtd).toFixed(2));
    const precoVenda = parseFloat((custoUnit * (1 + marg / 100)).toFixed(2));
    document.getElementById('ltCustoTotal') && (document.getElementById('ltCustoTotal').value = custoTotal.toFixed(2));
    document.getElementById('ltCustoUnit')  && (document.getElementById('ltCustoUnit').value  = custoUnit.toFixed(2));
    document.getElementById('ltPrecoVenda') && (document.getElementById('ltPrecoVenda').value  = precoVenda.toFixed(2));
  };

  const confirmarLote = async () => {
    const ftId       = document.getElementById('ltFt')?.value;
    const qtd        = parseInt(document.getElementById('ltQtd')?.value);
    const ft         = _fichas.find(f => f.id === ftId);
    if (!ft || !qtd || qtd < 1) { Toast.show('error', 'Selecione a ficha e a quantidade!'); return; }

    const marg       = parseFloat(document.getElementById('ltMargem')?.value)    || 30;
    const custoTotal = parseFloat(document.getElementById('ltCustoTotal')?.value) || 0;
    const custoUnit  = parseFloat(document.getElementById('ltCustoUnit')?.value)  || 0;
    const precoVenda = parseFloat(document.getElementById('ltPrecoVenda')?.value) || 0;
    const dt         = document.getElementById('ltDt')?.value || Utils.today();

    // Monta insCustos com preços editados
    const insCustos = ft.insumos.map((ins, i) => {
      const pu       = parseFloat(document.getElementById(`ltPu_${i}`)?.value) || 0;
      const qtdTotal = Math.round(ins.qtd * qtd * 100) / 100;
      return { itemId: ins.itemId, nome: ins.nome||'', qtdPorPeca: ins.qtd, qtdTotal, unid: ins.unid||'', precoUnit: pu, total: parseFloat((pu*qtdTotal).toFixed(2)) };
    });

    // Desconta insumos do estoque
    const estUpdate = await DB.getAll('estoque');
    for (const ins of insCustos) {
      const item = estUpdate.find(e => e.id === ins.itemId);
      if (item) {
        item.qtd = Math.round((item.qtd - ins.qtdTotal) * 100) / 100;
        await DB.save('estoque', item);
      }
    }

    // Lança gasto
    const nLoteId = Utils.uuid();
    await DB.save('gastos', {
      id: Utils.uuid(), dt, descricao: `Produção — ${ft.peca} (${qtd} peças)`,
      categoria: 'insumo_unif', valor: custoTotal, tipo: 'variavel',
      itemEstId: null, recorrente: false
    });

    // Cria lote
    await DB.save('lotes', {
      id: nLoteId, ftId, peca: ft.peca, data: dt, qtd, insCustos,
      custoTotal, custoUnit, margemPct: marg, precoVenda,
      prontos: qtd, vendidos: 0, status: 'ativo'
    });

    Modal.close('modalMain');
    Toast.show('success', `🏭 Lote criado! ${qtd} peças de ${ft.peca}. Gasto de ${Utils.money(custoTotal)} lançado.`);
    await render();
    await Badges.refresh();
    setTab('lotes', true);
  };

  const encerrarLote = async id => {
    const l = _lotes.find(x => x.id === id); if (!l) return;
    Modal.confirm(`Encerrar o lote <b>${l.peca}</b> com ${l.prontos-l.vendidos} peça(s) restante(s)?`, async () => {
      l.status = 'encerrado';
      await DB.save('lotes', l);
      Toast.show('success', 'Lote encerrado.');
      await render(); setTab('lotes', true);
    }, { title: '🔒 Encerrar Lote', confirmLabel: 'Encerrar' });
  };

  /* ────────────────────────────────────────────────
     VENDAS
  ──────────────────────────────────────────────── */
  const filterVendas = () => {
    const q = (document.getElementById('unifVendasSearch')?.value || '').toLowerCase().trim();
    _vendasFiltered = _vendas.filter(v => {
      if (!q) return true;
      const mat  = _mats.find(m => m.id === v.alunoId);
      const nome = Utils.normalize(mat?.nome || '');
      const peca = Utils.normalize(v.peca || '');
      return nome.includes(Utils.normalize(q)) || peca.includes(Utils.normalize(q));
    }).sort((a, b) => (b.dt || '').localeCompare(a.dt || ''));
    _vendasPage = 1;
    _renderVendas();
  };

  const _renderVendas = () => {
    const tbody = document.getElementById('unifVendasBody');
    if (!tbody) return;
    const PER = PER_VENDAS;
    const start = (_vendasPage - 1) * PER;
    const items = _vendasFiltered.slice(start, start + PER);

    tbody.innerHTML = items.length ? items.map(v => {
      const mat = _mats.find(m => m.id === v.alunoId);
      const marg = v.precoVenda > 0 ? Math.round(v.lucro / (v.precoVenda * v.qtd) * 100) : 0;
      return `<tr>
        <td style="font-size:var(--fs-xs)">${Utils.fmtDate(v.dt)}</td>
        <td style="font-weight:700;font-size:var(--fs-sm)">${Utils.esc((mat?.nome||'—').split(' ').slice(0,2).join(' '))}</td>
        <td>${Utils.esc(v.peca || '—')}</td>
        <td><span class="badge badge-teal">${v.tam || '—'}</span></td>
        <td style="text-align:center">${v.qtd || 1}</td>
        <td style="color:var(--danger)">${Utils.money(v.custoUnit)}</td>
        <td style="font-weight:700;color:var(--success-dk)">${Utils.money(v.precoVenda)}</td>
        <td><span style="font-weight:700;color:var(--teal-dk)">${Utils.money(v.lucro)}</span><span style="font-size:9px;color:var(--ink-3);margin-left:3px">(${marg}%)</span></td>
        <td><span class="badge badge-info">${v.forma || '—'}</span></td>
        <td><button class="btn btn-ghost btn-xs" onclick="Unif._reciboVenda('${v.id}')" title="Recibo">🧾</button></td>
      </tr>`;
    }).join('') : `<tr><td colspan="10" style="text-align:center;padding:28px;color:var(--ink-3)">Nenhuma venda</td></tr>`;

    const pag = document.getElementById('unifVendasPag');
    if (pag) {
      const pages = Math.ceil(_vendasFiltered.length / PER) || 1;
      const s = (_vendasPage-1)*PER+1, e = Math.min(_vendasPage*PER, _vendasFiltered.length);
      pag.innerHTML = `
        <div class="pagination-info">${_vendasFiltered.length ? `${s}–${e} de ${_vendasFiltered.length}` : '0 vendas'}</div>
        <div class="pagination-btns">
          <button class="pg-btn" onclick="Unif._vPage(${_vendasPage-1})" ${_vendasPage<=1?'disabled':''}>‹</button>
          ${Array.from({length:Math.min(pages,5)},(_,i)=>i+1).map(p=>`<button class="pg-btn ${p===_vendasPage?'active':''}" onclick="Unif._vPage(${p})">${p}</button>`).join('')}
          <button class="pg-btn" onclick="Unif._vPage(${_vendasPage+1})" ${_vendasPage>=pages?'disabled':''}>›</button>
        </div>`;
    }
  };
  const _vPage = p => { const pages = Math.ceil(_vendasFiltered.length / PER_VENDAS)||1; _vendasPage = Math.max(1,Math.min(p,pages)); _renderVendas(); };

  /* ── Modal Venda ── */
  const openVenda = async (loteIdPre = null) => {
    const lotesAtivos = _lotes.filter(l => l.status === 'ativo' && l.prontos - l.vendidos > 0);
    if (!lotesAtivos.length) { Toast.show('warning', 'Nenhum estoque disponível para venda.'); return; }
    const loteOpts = lotesAtivos.map(l => `<option value="${l.id}" ${l.id===loteIdPre?'selected':''}>${Utils.esc(l.peca)} — ${l.prontos-l.vendidos} disp. · ${Utils.money(l.precoVenda)}</option>`).join('');
    const matsOpts = _mats.filter(m => m.st === 'matriculado').sort((a,b)=>a.nome.localeCompare(b.nome)).map(m => `<option value="${m.id}">${Utils.esc(m.nome)}</option>`).join('');

    const html = `
      <div class="modal-header">
        <div class="modal-title">💰 Registrar Venda de Uniforme</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Aluno</label>
            <select class="form-select" id="vAluno"><option value="">Selecionar...</option>${matsOpts}</select>
          </div>
          <div class="form-group">
            <label class="form-label">Data</label>
            <input class="form-input" type="date" id="vDt" value="${Utils.today()}">
          </div>
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Lote / Peça <span class="required">*</span></label>
            <select class="form-select" id="vLote" onchange="Unif._onVendaLote()">${loteOpts}</select>
          </div>
          <div class="form-group">
            <label class="form-label">Tamanho</label>
            <select class="form-select" id="vTam"></select>
          </div>
        </div>
        <div class="form-row c3">
          <div class="form-group">
            <label class="form-label">Quantidade</label>
            <input class="form-input" type="number" id="vQtd" value="1" min="1" oninput="Unif._onVendaQtd()">
          </div>
          <div class="form-group">
            <label class="form-label">Preço de Venda (R$)</label>
            <input class="form-input" type="number" step="0.01" id="vPreco" oninput="Unif._onVendaQtd()">
          </div>
          <div class="form-group">
            <label class="form-label">Forma de Pagamento</label>
            <select class="form-select" id="vForma">
              <option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Fiado</option>
            </select>
          </div>
        </div>
        <div id="vLucroPreview" style="background:var(--success-lt);border-radius:var(--r-md);padding:10px;font-size:var(--fs-sm);margin-top:4px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-secondary" onclick="Unif.confirmarVenda()">💰 Confirmar Venda</button>
      </div>`;
    Modal.open('modalSec', html);
    _onVendaLote();
  };

  const _onVendaLote = () => {
    const loteId = document.getElementById('vLote')?.value;
    const lote   = _lotes.find(l => l.id === loteId);
    const tamSel = document.getElementById('vTam');
    const pSel   = document.getElementById('vPreco');
    if (!lote) return;
    const ft = _fichas.find(f => f.id === lote.ftId);
    if (tamSel) tamSel.innerHTML = (ft?.tamanhos || ['Único']).map(t => `<option>${t}</option>`).join('');
    if (pSel)   pSel.value = lote.precoVenda.toFixed(2);
    _onVendaQtd();
  };
  const _onVendaQtd = () => {
    const loteId = document.getElementById('vLote')?.value;
    const lote   = _lotes.find(l => l.id === loteId); if (!lote) return;
    const qtd    = parseInt(document.getElementById('vQtd')?.value) || 1;
    const preco  = parseFloat(document.getElementById('vPreco')?.value) || lote.precoVenda;
    const lucro  = (preco - lote.custoUnit) * qtd;
    const marg   = preco > 0 ? Math.round(lucro / (preco * qtd) * 100) : 0;
    const disp   = lote.prontos - lote.vendidos;
    const el = document.getElementById('vLucroPreview');
    if (el) el.innerHTML = `
      <b>${lote.peca}</b> · Custo unit.: ${Utils.money(lote.custoUnit)} · Disp.: ${disp}<br>
      💰 <b>Lucro estimado: ${Utils.money(lucro)}</b> (margem: ${marg}%)
      ${qtd > disp ? `<br><span style="color:var(--danger)">⚠️ Quantidade maior que o disponível (${disp})</span>` : ''}`;
  };

  const confirmarVenda = async () => {
    const loteId = document.getElementById('vLote')?.value;
    const alunoId= document.getElementById('vAluno')?.value;
    const qtd    = parseInt(document.getElementById('vQtd')?.value) || 1;
    const lote   = _lotes.find(l => l.id === loteId);
    if (!lote) { Toast.show('error', 'Selecione o lote!'); return; }
    const disp = lote.prontos - lote.vendidos;
    if (qtd > disp) { Toast.show('error', `Apenas ${disp} disponível/is!`); return; }

    const preco = parseFloat(document.getElementById('vPreco')?.value) || lote.precoVenda;
    const lucro = parseFloat(((preco - lote.custoUnit) * qtd).toFixed(2));
    const tam   = document.getElementById('vTam')?.value || '—';
    const forma = document.getElementById('vForma')?.value || 'PIX';
    const dt    = document.getElementById('vDt')?.value || Utils.today();

    lote.vendidos += qtd;
    await DB.save('lotes', lote);

    const vendaId = Utils.uuid();
    await DB.save('vendasUnif', {
      id: vendaId, alunoId: alunoId || null, loteId,
      peca: lote.peca, tam, qtd,
      custoUnit: lote.custoUnit, precoVenda: preco,
      lucro, dt, forma, st: 'pago'
    });

    // Recibo de venda automático
    await _reciboVendaData(vendaId, lote, preco, lucro, tam, qtd, dt, forma, alunoId);

    Modal.close('modalSec');
    Toast.show('success', `✅ Venda registrada! Lucro: ${Utils.money(lucro)}`);
    await render();
    setTab('vendas', true);
  };

  const _reciboVendaData = async (vendaId, lote, preco, lucro, tam, qtd, dt, forma, alunoId) => {
    const mat = _mats.find(m => m.id === alunoId);
    const cfg = await DB.getConfig();
    const seq = cfg.reciboSeq || 1;
    const num = `${cfg.reciboPrefixo || 'BSM'}-UNI-${new Date().getFullYear()}-${String(seq).padStart(3,'0')}`;
    try {
      await DB.save('recibos', {
        id: Utils.uuid(), vendaId, mensId: null, alunoId: alunoId || null,
        numero: num, ref: `Uniforme — ${lote.peca} Tam. ${tam} ×${qtd}`,
        valor: preco * qtd, forma, dtEmissao: dt,
        nomeAluno: mat?.nome || 'Cliente', nomeResp: mat?.mae || mat?.pai || '—'
      });
      cfg.reciboSeq = seq + 1;
      await DB.setConfig(cfg);
    } catch {}
  };

  const _reciboVenda = async id => {
    const v = _vendas.find(x => x.id === id); if (!v) return;
    const mat = _mats.find(m => m.id === v.alunoId);
    const cfg = await DB.getConfig();
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Recibo Uniforme</title>
      <style>body{font-family:Arial;padding:28px;max-width:480px;margin:0 auto}h2{text-align:center;font-size:13px}h3{text-align:center;font-size:11px;color:#666}
      .tit{font-size:16px;font-weight:bold;text-align:center;border-top:2px solid #000;border-bottom:2px solid #000;padding:7px;margin:10px 0}
      .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee;font-size:12.5px}
      .val{font-size:22px;font-weight:bold;text-align:center;padding:14px;background:#e8f8f0;border-radius:8px;margin:14px 0}
      .ass{display:flex;justify-content:space-between;margin-top:44px}.al{border-top:1px solid #000;width:44%;text-align:center;padding-top:5px;font-size:11px}
      @media print{body{padding:14px}}</style></head><body>
      <h2>${cfg.nomeEscola || 'Berçário Sonho Meu'}</h2><h3>CNPJ: ${cfg.cnpj || '44.306.911-0001-17'}</h3>
      <div class="tit">RECIBO — UNIFORME</div>
      <div class="row"><span><b>Aluno(a):</b></span><span>${Utils.esc(mat?.nome || '—')}</span></div>
      <div class="row"><span><b>Peça:</b></span><span>${Utils.esc(v.peca)} · Tam. ${v.tam} · Qtd: ${v.qtd}</span></div>
      <div class="row"><span><b>Forma:</b></span><span>${v.forma}</span></div>
      <div class="row"><span><b>Data:</b></span><span>${Utils.fmtDate(v.dt)}</span></div>
      <div class="val">R$ ${(v.precoVenda * v.qtd).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
      <div class="ass"><div class="al">Responsável</div><div class="al">${cfg.nomeEscola || 'Berçário Sonho Meu'}</div></div>
      <script>window.print()<\/script></body></html>`);
    w.document.close();
  };

  const exportVendasCSV = () => {
    const rows = ['Data,Aluno,Peça,Tamanho,Qtd,Custo Unit.,Preço Venda,Lucro,Forma'];
    _vendasFiltered.forEach(v => {
      const mat = _mats.find(m => m.id === v.alunoId);
      rows.push(`"${Utils.fmtDate(v.dt)}","${mat?.nome||'—'}","${v.peca}","${v.tam||'—'}","${v.qtd}","${v.custoUnit.toFixed(2)}","${v.precoVenda.toFixed(2)}","${v.lucro.toFixed(2)}","${v.forma||'—'}"`);
    });
    Utils.downloadCSV(rows, `vendas_uniformes_${Utils.today()}.csv`);
    Toast.show('success', 'CSV exportado!');
  };

  /* ────────────────────────────────────────────────
     API PÚBLICA
  ──────────────────────────────────────────────── */
  return {
    render, setTab,
    openFichaTec, saveFicha, duplicarFicha, delFicha,
    _ftAutoUnid, _ftAddRow, _ftDelRow, _ftCalcCusto,
    filterLotes, openLote, _calcLote, _recalcLote, confirmarLote, encerrarLote,
    filterVendas, _vPage, openVenda, _onVendaLote, _onVendaQtd, confirmarVenda,
    _reciboVenda, exportVendasCSV,
  };
})();



/* ============================================================
   AGENDA — Módulo Agenda (Etapa 9.1)
   ============================================================ */
const Agenda = (() => {
  let _eventos = [], _mats = [], _mens = [];
  let _calY = new Date().getFullYear();
  let _calM = new Date().getMonth();
  let _diaSel = null;

  const TIPOS = {
    aniversario: { ic: '🎂', cor: 'var(--pink)',   lb: 'Aniversário'  },
    vencimento:  { ic: '💰', cor: 'var(--warning)', lb: 'Vencimento'  },
    reuniao:     { ic: '👥', cor: 'var(--info)',    lb: 'Reunião'      },
    feriado:     { ic: '🏖️', cor: 'var(--success)', lb: 'Feriado'     },
    outro:       { ic: '📌', cor: 'var(--ink-3)',   lb: 'Outro'        },
  };

  const render = async () => {
    [_eventos, _mats, _mens] = await Promise.all([
      DB.getAll('eventos').catch(() => []),
      DB.getAll('matriculas'),
      DB.getAll('mensalidades'),
    ]);
    _renderCal();
    _renderAniversarios();
    _selDia(Utils.today());
  };

  /* ── Navega mês ── */
  const navCal = delta => {
    if (delta === 0) { _calY = new Date().getFullYear(); _calM = new Date().getMonth(); }
    else { _calM += delta; if (_calM > 11) { _calM = 0; _calY++; } if (_calM < 0) { _calM = 11; _calY--; } }
    _renderCal();
  };

  /* ── Calendário HTML puro ── */
  const _renderCal = () => {
    const tit = document.getElementById('agCalTitulo');
    if (tit) tit.textContent = `${Utils.MONTHS_FULL[_calM]} ${_calY}`;

    const primDia   = new Date(_calY, _calM, 1).getDay();
    const ultDia    = new Date(_calY, _calM + 1, 0).getDate();
    const hoje      = Utils.today();
    const DN        = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

    // Mapeia eventos do mês
    const evMap = {};
    // Aniversários
    _mats.forEach(m => {
      if (!m.nasc) return;
      const d = m.nasc.slice(5); // MM-DD
      const k = `${_calY}-${d}`;
      if (!evMap[k]) evMap[k] = [];
      evMap[k].push({ tipo: 'aniversario', label: m.nome.split(' ')[0] });
    });
    // Vencimentos do mês (não pagos)
    _mens.filter(m => m.st !== 'pago' && (m.vencimento||'').startsWith(`${_calY}-${String(_calM+1).padStart(2,'0')}`)).forEach(m => {
      const mat = _mats.find(a => a.id === m.alunoId);
      if (!evMap[m.vencimento]) evMap[m.vencimento] = [];
      evMap[m.vencimento].push({ tipo: 'vencimento', label: mat?.nome.split(' ')[0] || '?' });
    });
    // Eventos manuais
    _eventos.forEach(e => {
      if (!(e.dt||'').startsWith(`${_calY}-${String(_calM+1).padStart(2,'0')}`)) return;
      if (!evMap[e.dt]) evMap[e.dt] = [];
      evMap[e.dt].push({ tipo: e.tipo || 'outro', label: e.titulo || '' });
    });

    const grid = document.getElementById('agCalGrid');
    if (!grid) return;

    let html = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">
      ${DN.map(d => `<div style="text-align:center;font-size:9px;font-weight:800;color:var(--ink-3);padding:4px">${d}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">`;

    for (let i = 0; i < primDia; i++) html += `<div></div>`;
    for (let d = 1; d <= ultDia; d++) {
      const k      = `${_calY}-${String(_calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const evs    = evMap[k] || [];
      const isHoje = k === hoje;
      const isSel  = k === _diaSel;
      const dow    = (primDia + d - 1) % 7;
      const isDom  = dow === 0;
      html += `<div onclick="Agenda._selDia('${k}')"
        style="min-height:58px;padding:4px;border-radius:var(--r-sm);cursor:pointer;
               border:1.5px solid var(--${isSel?'teal-md':isHoje?'teal-lt':'border'});
               background:var(--${isSel?'teal-lt':isHoje?'bg-2':'white'})"
        onmouseover="this.style.background='var(--bg-2)'" onmouseout="this.style.background='var(--${isSel?'teal-lt':isHoje?'bg-2':'white'})'">
        <div style="font-size:12px;font-weight:${isHoje?800:500};color:var(--${isHoje?'teal-dk':isDom?'danger':'ink'});
             ${isHoje?'background:var(--teal-dk);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;':''}">${d}</div>
        ${evs.slice(0,2).map(e => {
          const t = TIPOS[e.tipo] || TIPOS.outro;
          return `<div style="font-size:8px;font-weight:700;padding:1px 3px;border-radius:3px;margin-top:2px;
            background:${t.cor}22;color:${t.cor};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.ic} ${Utils.esc(e.label)}</div>`;
        }).join('')}
        ${evs.length > 2 ? `<div style="font-size:8px;color:var(--ink-3)">+${evs.length-2}</div>` : ''}
      </div>`;
    }
    html += '</div>';
    grid.innerHTML = html;
  };

  const _selDia = k => {
    _diaSel = k;
    const lbl = document.getElementById('agDiaSel');
    if (lbl) lbl.textContent = `— ${Utils.fmtDate(k)}`;
    _renderEventosDia(k);
    // Re-renderiza só os dias (sem recriar todo o grid)
    document.querySelectorAll('#agCalGrid > div > div[onclick]').forEach(el => {
      const dt = el.getAttribute('onclick').match(/'([^']+)'/)?.[1];
      const isSel  = dt === _diaSel;
      const isHoje = dt === Utils.today();
      el.style.borderColor = `var(--${isSel?'teal-md':isHoje?'teal-lt':'border'})`;
      el.style.background  = `var(--${isSel?'teal-lt':isHoje?'bg-2':'white'})`;
    });
  };

  const _renderEventosDia = k => {
    const el = document.getElementById('agEventosDia');
    if (!el) return;
    const evs = [];
    // Aniversários
    _mats.forEach(m => {
      if (!m.nasc) return;
      if (m.nasc.slice(5) === k.slice(5)) {
        const anos = _calY - parseInt(m.nasc.slice(0,4));
        evs.push({ tipo: 'aniversario', titulo: `🎂 ${m.nome.split(' ').slice(0,2).join(' ')}`, sub: `${anos} ano(s) · ${Utils.salaLabel ? Utils.salaLabel(m.turma) : m.turma}`, matId: m.id, telMae: m.telMae || m.telPai || '' });
      }
    });
    // Vencimentos
    _mens.filter(m => m.vencimento === k && m.st !== 'pago').forEach(m => {
      const mat = _mats.find(a => a.id === m.alunoId);
      evs.push({ tipo: 'vencimento', titulo: `💰 ${mat?.nome.split(' ').slice(0,2).join(' ') || '—'}`, sub: `${m.ref} · ${Utils.money(m.valor)}` });
    });
    // Eventos manuais
    _eventos.filter(e => e.dt === k).forEach(e => {
      evs.push({ tipo: e.tipo || 'outro', titulo: e.titulo, sub: e.desc || '', id: e.id });
    });

    if (!evs.length) {
      el.innerHTML = '<div style="font-size:var(--fs-sm);color:var(--ink-3);padding:8px 0">Nenhum evento neste dia.</div>'; return;
    }
    el.innerHTML = evs.map(e => {
      const t = TIPOS[e.tipo] || TIPOS.outro;
      const waLink = e.matId && e.telMae
        ? `<a href="https://wa.me/55${(e.telMae||'').replace(/\D/g,'')}?text=${encodeURIComponent(`Parabéns, ${e.titulo.replace(/🎂 /,'')}! 🎂 Feliz aniversário!`)}" target="_blank" class="btn btn-wa btn-xs" style="margin-top:6px">💬 Parabéns WA</a>`
        : '';
      const delBtn = e.id ? `<button class="btn btn-danger btn-xs" onclick="Agenda.delEvento('${e.id}')">🗑️</button>` : '';
      return `<div style="padding:9px;border-radius:var(--r-md);background:${t.cor}18;border-left:3px solid ${t.cor};margin-bottom:6px">
        <div style="font-weight:700;font-size:var(--fs-sm)">${Utils.esc(e.titulo)}</div>
        ${e.sub ? `<div style="font-size:var(--fs-xs);color:var(--ink-3)">${Utils.esc(e.sub)}</div>` : ''}
        <div style="display:flex;gap:4px;margin-top:4px">${waLink}${delBtn}</div>
      </div>`;
    }).join('');
  };

  /* ── Aniversários próximos ── */
  const _renderAniversarios = () => {
    const el = document.getElementById('agAniversarios');
    if (!el) return;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const todos = [..._mats].map(m => {
      if (!m.nasc) return null;
      const nasc = new Date(m.nasc.replace(/-/g, '/'));
      let prox = new Date(hoje.getFullYear(), nasc.getMonth(), nasc.getDate());
      if (prox < hoje) prox.setFullYear(hoje.getFullYear() + 1);
      const dias = Math.round((prox - hoje) / 86400000);
      return { m, dias, prox };
    }).filter(Boolean).sort((a,b) => a.dias - b.dias).slice(0, 8);

    el.innerHTML = todos.map(({ m, dias }) => {
      const cor = dias === 0 ? 'danger' : dias <= 7 ? 'warning' : 'ink-3';
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
        <div style="width:30px;height:30px;border-radius:50%;background:${Utils.avatarColor(m.id)};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0">${Utils.initials(m.nome)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:var(--fs-sm);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${Utils.esc(m.nome.split(' ').slice(0,2).join(' '))}</div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3)">${Utils.fmtDate(m.nasc.slice(5).split('-').reverse().join('/'))||''} · ${Utils.salaLabel ? Utils.salaLabel(m.turma) : m.turma}</div>
        </div>
        <span class="badge badge-${dias===0?'danger':dias<=7?'warning':'teal'}">${dias===0?'🎉 Hoje!':dias+'d'}</span>
      </div>`;
    }).join('') || '<div style="font-size:var(--fs-sm);color:var(--ink-3)">Nenhum aniversário próximo</div>';
  };

  /* ── CRUD Eventos ── */
  const openEvento = (id = null) => {
    const ev = id ? _eventos.find(e => e.id === id) : null;
    const html = `
      <div class="modal-header">
        <div class="modal-title">${id ? '✏️ Editar Evento' : '📌 Novo Evento'}</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom:var(--sp-md)">
          <label class="form-label">Título <span class="required">*</span></label>
          <input class="form-input" id="evTit" value="${Utils.esc(ev?.titulo||'')}" placeholder="Ex: Reunião de pais, Feriado...">
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Data <span class="required">*</span></label>
            <input class="form-input" type="date" id="evDt" value="${ev?.dt || _diaSel || Utils.today()}">
          </div>
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <select class="form-select" id="evTipo">
              ${Object.entries(TIPOS).filter(([k]) => !['aniversario','vencimento'].includes(k)).map(([k,v])=>`<option value="${k}" ${ev?.tipo===k?'selected':''}>${v.ic} ${v.lb}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Descrição</label>
          <textarea class="form-textarea" id="evDesc" rows="2">${Utils.esc(ev?.desc||'')}</textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalSec')">Cancelar</button>
        <button class="btn btn-secondary" onclick="Agenda.saveEvento('${id||''}')">💾 Salvar</button>
      </div>`;
    Modal.open('modalSec', html);
  };

  const saveEvento = async id => {
    const titulo = document.getElementById('evTit')?.value.trim();
    if (!titulo) { Toast.show('error', 'Título obrigatório!'); return; }
    const ev = { id: id || Utils.uuid(), titulo, dt: document.getElementById('evDt')?.value || Utils.today(), tipo: document.getElementById('evTipo')?.value || 'outro', desc: document.getElementById('evDesc')?.value || '' };
    await DB.save('eventos', ev);
    Modal.close('modalSec');
    Toast.show('success', '✅ Evento salvo!');
    await render();
  };

  const delEvento = async id => {
    if (!confirm('Excluir este evento?')) return;
    await DB.remove('eventos', id);
    Toast.show('success', 'Evento removido.');
    await render();
  };

  /* ── Exportar ICS para Google Calendar ── */
  const exportICS = () => {
    const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Berçário Sonho Meu//v4.0//PT'];
    _eventos.forEach(e => {
      const d = (e.dt||Utils.today()).replace(/-/g,'');
      lines.push('BEGIN:VEVENT', `UID:${e.id}@bsm`, `DTSTART;VALUE=DATE:${d}`, `SUMMARY:${e.titulo||''}`, `DESCRIPTION:${e.desc||''}`, 'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    Utils.downloadCSV(lines, 'agenda-bsm.ics');
    Toast.show('success', '📤 Arquivo .ics exportado! Importe no Google Calendar.');
  };

  return { render, navCal, _selDia, openEvento, saveEvento, delEvento, exportICS };
})();

/* ============================================================
   COZINHA — Módulo Cozinha (Etapa 9.2)
   ============================================================ */
const Cozinha = (() => {
  let _mats = [], _est = [], _cardapio = {};
  let _semanaOffset = 0;

  const DK  = ['seg','ter','qua','qui','sex'];
  const DN  = ['Segunda','Terça','Quarta','Quinta','Sexta'];
  const REF = ['cafe','alm','lch'];
  const LBL = { cafe: '☀️ Café da Manhã', alm: '🍽️ Almoço', lch: '🍎 Lanche' };

  const _cardapioDefault = () => ({
    seg: { cafe:['Mingau de aveia','Banana','Leite'],        alm:['Arroz','Feijão','Frango grelhado','Cenoura'], lch:['Iogurte','Bolacha de arroz'] },
    ter: { cafe:['Pão integral','Manteiga','Suco de laranja'],alm:['Macarrão','Carne moída','Vagem'],            lch:['Banana','Biscoito de aveia'] },
    qua: { cafe:['Vitamina de frutas','Tapioca'],             alm:['Arroz','Lentilha','Frango','Abóbora'],       lch:['Melancia','Iogurte'] },
    qui: { cafe:['Mingau de milho','Mamão'],                  alm:['Arroz','Feijão','Peixe','Brócolis'],         lch:['Maçã','Biscoito integral'] },
    sex: { cafe:['Cuscuz','Ovo mexido','Suco'],               alm:['Arroz','Feijão','Carne bovina','Cenoura'],   lch:['Fruta da época','Suco'] },
  });

  const render = async () => {
    [_mats, _est] = await Promise.all([DB.getAll('matriculas'), DB.getAll('estoque')]);
    // Carrega cardápio salvo ou usa default
    try {
      const cfg = await DB.getConfig();
      _cardapio = cfg.cardapio || _cardapioDefault();
    } catch { _cardapio = _cardapioDefault(); }
    _renderKpis();
    _renderSemanaLabel();
    _renderCardapio();
    _renderAlertasAlergia();
    _renderEstoqueAlerta();
  };

  const navSemana = delta => { _semanaOffset += delta; _renderSemanaLabel(); _renderCardapio(); _renderAlertasAlergia(); _renderEstoqueAlerta(); };

  const _semanaInfo = () => {
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const dow  = hoje.getDay();
    const seg  = new Date(hoje); seg.setDate(hoje.getDate() - (dow === 0 ? 6 : dow - 1) + _semanaOffset * 7);
    const sex  = new Date(seg);  sex.setDate(seg.getDate() + 4);
    return { seg, sex };
  };

  const _renderSemanaLabel = () => {
    const el = document.getElementById('czSemanaLabel'); if (!el) return;
    const { seg, sex } = _semanaInfo();
    const f = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
    el.textContent = `${f(seg)} – ${f(sex)}/${sex.getFullYear()}`;
  };

  const _renderKpis = () => {
    const el = document.getElementById('czKpis'); if (!el) return;
    const alerg   = _mats.filter(m => m.st === 'matriculado' && (m.alergias||[]).length);
    const bxCoz   = _est.filter(e => e.categ === 'cozinha' && e.qtd <= e.minimo).length;
    const refeic  = DK.length * REF.length;
    el.innerHTML = [
      { l:'Itens Cozinha',     v: _est.filter(e=>e.categ==='cozinha').length, s:'em estoque',          i:'📦', c:'teal'    },
      { l:'Estoque Baixo',     v: bxCoz,   s:'itens críticos',                i:'⚠️', c: bxCoz?'danger':'success' },
      { l:'Alunos c/ Alergia', v: alerg.length, s:'monitorados',              i:'⚠️', c: alerg.length?'warning':'success' },
      { l:'Refeições/Semana',  v: refeic,  s:'planejadas',                    i:'📅', c:'info' },
    ].map((k,i)=>`<div class="kpi ${k.c}" style="animation-delay:${i*.04}s">
      <div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div>
      <div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div>
    </div>`).join('');
  };

  const _renderCardapio = () => {
    const el = document.getElementById('czCardapio'); if (!el) return;
    const HC = ['#12586a','#1a7a8a','#2a9daf','#f59e0b','#7c5cbf'];
    // Verifica itens do estoque para highlight
    const estNomes = _est.filter(e => e.categ==='cozinha' && e.qtd <= e.minimo).map(e => e.nome.toLowerCase());

    el.innerHTML = `<div style="display:grid;grid-template-columns:120px repeat(5,1fr);gap:1px;background:var(--border);border-radius:var(--r-md);overflow:hidden;min-width:620px">
      <div style="background:var(--bg-2);padding:8px;font-weight:700;font-size:var(--fs-xs)">Refeição</div>
      ${DN.map((d,i) => `<div style="background:${HC[i]};color:#fff;padding:8px;font-family:var(--font-display);font-size:var(--fs-sm);font-weight:700;text-align:center">${d}</div>`).join('')}
      ${REF.map(ref => `
        <div style="background:var(--bg-2);padding:8px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-2);display:flex;align-items:flex-start">${LBL[ref]}</div>
        ${DK.map((dk, di) => {
          const itens = (_cardapio[dk]?.[ref] || []);
          return `<div style="background:var(--white);padding:8px;vertical-align:top">
            ${itens.map((item, ii) => {
              const baixo = estNomes.some(n => item.toLowerCase().includes(n));
              return `<div style="font-size:var(--fs-xs);line-height:1.5;cursor:pointer;border-radius:3px;padding:1px 4px;${baixo?'color:var(--danger);font-weight:700':'color:var(--ink)'}"
                contenteditable="true" title="Clique para editar"
                onblur="Cozinha._editItem('${dk}','${ref}',${ii},this.textContent.trim())"
                >${Utils.esc(item)}</div>`;
            }).join('')}
            <div style="font-size:9px;color:var(--teal-md);cursor:pointer;margin-top:2px" onclick="Cozinha._addItem('${dk}','${ref}')">+ item</div>
          </div>`;
        }).join('')}
      `).join('')}
    </div>`;
  };

  const _editItem = (dk, ref, idx, val) => {
    if (!_cardapio[dk]) _cardapio[dk] = {};
    if (!_cardapio[dk][ref]) _cardapio[dk][ref] = [];
    if (val) _cardapio[dk][ref][idx] = val;
    else _cardapio[dk][ref].splice(idx, 1);
  };

  const _addItem = (dk, ref) => {
    const nome = prompt('Nome do item:'); if (!nome?.trim()) return;
    if (!_cardapio[dk]) _cardapio[dk] = {};
    if (!_cardapio[dk][ref]) _cardapio[dk][ref] = [];
    _cardapio[dk][ref].push(nome.trim());
    _renderCardapio();
  };

  const _renderAlertasAlergia = () => {
    const el = document.getElementById('czAlertasAlergia'); if (!el) return;
    const alergicos = _mats.filter(m => m.st==='matriculado' && (m.alergias||[]).length);
    if (!alergicos.length) { el.innerHTML=''; return; }
    const alertas = [];
    DK.forEach((dk, di) => {
      REF.forEach(ref => {
        const itens = (_cardapio[dk]?.[ref] || []).join(' ').toLowerCase();
        alergicos.forEach(m => {
          (m.alergias||[]).forEach(al => {
            if (itens.includes(al.toLowerCase().slice(0,5))) {
              alertas.push(`<b>${DN[di]} ${LBL[ref]}</b>: ${m.nome.split(' ')[0]} — alergia a <b>${al}</b>`);
            }
          });
        });
      });
    });
    el.innerHTML = alertas.length
      ? `<div style="background:var(--danger-lt);border:1px solid var(--danger);border-radius:var(--r-md);padding:10px 12px">
           <div style="font-weight:700;color:var(--danger);margin-bottom:6px">⚠️ ${alertas.length} alerta(s) de alergia nesta semana</div>
           ${alertas.map(a => `<div style="font-size:var(--fs-xs);padding:2px 0">${a}</div>`).join('')}
         </div>`
      : `<div style="background:var(--success-lt);border:1px solid var(--success);border-radius:var(--r-md);padding:8px 12px;font-size:var(--fs-sm);color:var(--success-dk);font-weight:700">✅ Nenhum alerta de alergia no cardápio desta semana</div>`;
  };

  const _renderEstoqueAlerta = () => {
    const el = document.getElementById('czEstoqueAlerta'); if (!el) return;
    const todosItens = new Set(DK.flatMap(dk => REF.flatMap(ref => _cardapio[dk]?.[ref] || [])).map(i => i.toLowerCase()));
    const alertas = _est.filter(e => e.categ==='cozinha' && e.qtd <= e.minimo && [...todosItens].some(it => it.includes(e.nome.toLowerCase().slice(0,4))));
    el.innerHTML = alertas.length
      ? alertas.map(e => `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--danger-lt);border-radius:var(--r-md);border-left:3px solid var(--danger);margin-bottom:5px">
          <span>⚠️</span><div style="flex:1"><b>${e.nome}</b> — apenas ${e.qtd} ${e.unid} (mín: ${e.minimo})</div>
          <button class="btn btn-ghost btn-xs" onclick="Router.go('estoque')">📦 Estoque</button>
        </div>`).join('')
      : '<div style="font-size:var(--fs-sm);color:var(--success-dk)">✅ Estoque da cozinha adequado para o cardápio desta semana</div>';
  };

  const salvar = async () => {
    const cfg = await DB.getConfig();
    cfg.cardapio = _cardapio;
    await DB.setConfig(cfg);
    Toast.show('success', '💾 Cardápio salvo!');
  };

  const imprimir = () => {
    const { seg } = _semanaInfo();
    const f = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
    const w = window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Cardápio</title>
    <style>body{font-family:Arial;padding:20px;max-width:700px;margin:0 auto;font-size:11px}
    h2{text-align:center;font-size:14px}h3{text-align:center;color:#666;font-size:11px;margin-bottom:12px}
    table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px 8px;vertical-align:top}
    th{background:#f0f7f9;font-size:11px}td{font-size:10.5px}@media print{body{padding:10px}}</style></head><body>
    <h2>Berçário Sonho Meu — Cardápio Semanal</h2>
    <h3>Semana de ${f(seg)} · Trindade-GO</h3>
    <table><thead><tr><th>Refeição</th>${DN.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>
    ${REF.map(ref=>`<tr><td><b>${LBL[ref]}</b></td>${DK.map(dk=>`<td>${(_cardapio[dk]?.[ref]||[]).join('<br>')}</td>`).join('')}</tr>`).join('')}
    </tbody></table><p style="text-align:center;margin-top:14px;font-size:10px">Nutricionista responsável: ________________________</p>
    <script>window.print()<\/script></body></html>`);
    w.document.close();
  };

  return { render, navSemana, _editItem, _addItem, salvar, imprimir };
})();

/* ============================================================
   FUNCS — Módulo Funcionários (Etapa 9.3)
   ============================================================ */
const Funcs = (() => {
  let _all = [];
  let _tab = 'equipe';

  const INSS = 0.08;
  const IR   = sal => sal > 4664.68 ? 0.275 : sal > 3751.05 ? 0.225 : sal > 2428.8 ? 0.15 : sal > 1903.98 ? 0.075 : 0;
  const liq  = f => parseFloat((f.sal * (1 - INSS - IR(f.sal))).toFixed(2));

  const render = async () => {
    _all = await DB.getAll('funcionarios');
    _renderKpis();
    setTab(_tab, true);
  };

  const _renderKpis = () => {
    const el = document.getElementById('funcsKpis'); if (!el) return;
    const at     = _all.filter(f => f.ativo);
    const folha  = at.reduce((s, f) => s + f.sal, 0);
    const liquido= at.reduce((s, f) => s + liq(f), 0);
    const hoje   = new Date();
    const anivSem= at.filter(f => {
      if (!f.nasc) return false;
      const n = new Date(f.nasc.replace(/-/g,'/'));
      const p = new Date(hoje.getFullYear(), n.getMonth(), n.getDate());
      if (p < hoje) p.setFullYear(hoje.getFullYear()+1);
      return Math.round((p-hoje)/86400000) <= 7;
    }).length;
    el.innerHTML = [
      { l:'Funcionários',     v: at.length,          s:'ativos',         i:'👩‍💼', c:'teal'    },
      { l:'Total Folha',      v: Utils.money(folha),  s:'bruto mensal',  i:'💰', c:'info'    },
      { l:'Total Líquido',    v: Utils.money(liquido),s:'após descontos', i:'✅', c:'success' },
      { l:'Aniversários 7d',  v: anivSem,             s:'na semana',     i:'🎂', c: anivSem?'warning':'teal' },
    ].map((k,i)=>`<div class="kpi ${k.c}" style="animation-delay:${i*.04}s">
      <div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div>
      <div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div>
    </div>`).join('');
  };

  const setTab = (tab, force=false) => {
    if (_tab===tab && !force) return;
    _tab = tab;
    ['equipe','escala','folha'].forEach(t => {
      document.getElementById(`ftab-${t}`)?.classList.toggle('active', t===tab);
      const c = document.getElementById(`ftab-content-${t}`);
      if (c) c.style.display = t===tab ? '' : 'none';
    });
    if (tab==='equipe') _renderEquipe();
    if (tab==='escala') _renderEscala();
    if (tab==='folha')  _renderFolha();
  };

  const _renderEquipe = () => {
    const el = document.getElementById('funcsEquipe'); if (!el) return;
    const at = _all.filter(f => f.ativo);
    el.innerHTML = at.map((f, i) => {
      const hoje = new Date();
      const anivHoje = f.nasc && (() => { const n = new Date(f.nasc.replace(/-/g,'/')); return n.getDate()===hoje.getDate()&&n.getMonth()===hoje.getMonth(); })();
      return `<div class="card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div style="width:44px;height:44px;border-radius:50%;background:${Utils.avatarColor(f.id)};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0">${Utils.initials(f.nome)}</div>
          <div style="flex:1">
            <div style="font-family:var(--font-display);font-size:14px;font-weight:700">${Utils.esc(f.nome)}${anivHoje?' 🎂':''}</div>
            <div style="font-size:var(--fs-xs);color:var(--ink-3)">${Utils.esc(f.cargo)} · ${f.turno}</div>
          </div>
          <div style="display:flex;gap:4px">
            <button class="btn btn-ghost btn-xs" onclick="Funcs.openForm('${f.id}')">✏️</button>
            <button class="btn btn-ghost btn-xs" onclick="Funcs.printContracheque('${f.id}')" title="Contracheque">🖨️</button>
            <button class="btn btn-danger btn-xs" onclick="Funcs.toggleAtivo('${f.id}')">🚫</button>
          </div>
        </div>
        ${[
          ['📞 Tel', f.tel||'—'],
          ['💰 Salário', Utils.money(f.sal)],
          ['✅ Líquido', Utils.money(liq(f))],
          ['📅 Turno', f.turno],
        ].map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:var(--fs-sm);padding:4px 0;border-bottom:1px solid var(--border)"><span style="color:var(--ink-3)">${k}</span><span style="font-weight:700">${v}</span></div>`).join('')}
        ${f.nasc ? `<div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:5px">🎂 ${Utils.fmtDate(f.nasc)}</div>` : ''}
      </div>`;
    }).join('') || '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">👩‍💼</div><div class="empty-title">Nenhum funcionário ativo</div></div>';
  };

  const _renderEscala = () => {
    const el = document.getElementById('funcsEscala'); if (!el) return;
    const at  = _all.filter(f => f.ativo);
    const DD  = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    el.innerHTML = `<table><thead><tr><th>Funcionário</th><th>Cargo</th>${DD.map(d=>`<th style="text-align:center">${d}</th>`).join('')}</tr></thead><tbody>
      ${at.map(f => `<tr>
        <td style="font-weight:700">${Utils.esc(f.nome.split(' ').slice(0,2).join(' '))}</td>
        <td style="font-size:var(--fs-xs)">${Utils.esc(f.cargo)}</td>
        ${DD.map((d,i) => {
          const work = i < 5 || (f.turno === 'Integral' && i < 6);
          return `<td style="text-align:center">

    if (tot) tot.innerHTML = `Total Bruto: <span style="color:var(--danger)">${Utils.money(totalBruto)}</span> &nbsp;|&nbsp; Total Líquido: <span style="color:var(--success-dk)">${Utils.money(totalLiq)}</span>`;

/* Card central creme — exatamente como no mockup */
.blg-card {
  position: relative;
  z-index: 1;
  background: rgb(255, 252, 230);
  border-radius: 32px;
  border: 2px solid rgba(245, 200, 66, 0.7);
  padding: 0 28px 24px;
  width: 420px;
  max-width: 90vw;
  max-height: 92vh;
  overflow-y: auto;
  overflow-x: hidden;
  box-shadow:
    0 24px 80px rgba(0, 0, 0, 0.55),
    0 8px 24px rgba(0, 0, 0, 0.30),
    0 0 0 1px rgba(255,255,255,0.15) inset;
  animation: blgIn .5s cubic-bezier(.16,1,.3,1) both;
  text-align: center;
  scrollbar-width: none;
}
.blg-card::-webkit-scrollbar { display: none; }
@keyframes blgIn {
  from { opacity:0; transform:translateY(32px) scale(.94); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

/* ── Logo flutuando acima do card ── */
.blg-logo-wrap {
  margin-top: -90px;
  margin-bottom: 8px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  pointer-events: none;
}
.blg-logo-img {
  width: 180px;
  height: auto;
  display: block;
  /* sombra suave sob a lua */
  filter: drop-shadow(0 8px 24px rgba(0,0,0,.40));
  animation: blgLogoFloat 4s ease-in-out infinite alternate;
}
@keyframes blgLogoFloat {
  from { transform: translateY(0px); }
  to   { transform: translateY(-8px); }
}

/* ── Textos ── */
.blg-welcome-title {
  font-family: 'Baloo 2', 'Arial Rounded MT Bold', sans-serif;
  font-size: 30px;
  font-weight: 900;
  color: #1a1a2e;
  margin: 0 0 4px;
  line-height: 1.1;
}
.blg-welcome-sub {
  font-size: 14px;
  color: #555;
  margin-bottom: 16px;
  line-height: 1.5;
}

/* ── Divisor estrela ── */
.blg-star-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0 16px;
}
.blg-star-divider::before,
.blg-star-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #d8c890;
}
.blg-star-ico {
  font-size: 14px;
  color: #d4a800;
}

/* ── Label seção ── */
.blg-section-lbl {
  font-size: 13px;
  font-weight: 700;
  color: #5a4a1a;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 14px;
  text-align: center;
}

/* ── Grid de perfis (cartõezinhos) ── */
.blg-user-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
  text-align: center;
}
.blg-user-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 12px;
  background: #fff;
  border: 1.5px solid #e8dfc0;
  border-radius: 16px;
  cursor: pointer;
  transition: all .22s cubic-bezier(.16,1,.3,1);
  font-family: inherit;
  overflow: hidden;
  position: relative;
}
.blg-user-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,.15);
  border-color: #f5c842;
}
/* Tarja colorida no topo do card */
.blg-user-av {
  width: 100%;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  color: #fff;
  border-radius: 14px 14px 0 0;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}
/* Avatar / ícone do perfil */
.blg-user-emoji {
  font-size: 28px;
  margin-bottom: 6px;
  line-height: 1;
}
.blg-user-info { width: 100%; padding: 0 6px; }
.blg-user-nome {
  font-size: 11px;
  font-weight: 700;
  color: #1a1a2e;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.blg-user-cargo-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 10px;
  color: #888;
}
.blg-user-arrow {
  font-size: 12px;
  color: #ccc;
  margin-top: 4px;
}
.blg-user-item:hover .blg-user-arrow { color: #f5c842; }
.blg-loading { text-align:center; padding:16px; color:#9a8a50; font-size:13px; }

/* ── Step 2 — PIN ── */
.blg-step { text-align: left; }
.blg-back {
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  color: #9a8a50;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  padding: 0;
  margin-bottom: 14px;
  font-family: inherit;
  transition: color .15s;
}
.blg-back:hover { color: #1a1a2e; }
.blg-selected-info {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fffbea;
  border: 1.5px solid #f5c842;
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 18px;
}
.blg-sel-av {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.blg-sel-nome { font-size: 14px; font-weight: 700; color: #1a1a2e; }
.blg-sel-cargo { font-size: 12px; color: #9a8a50; }
.blg-pin-lbl {
  font-size: 13px; font-weight: 600; color: #5a4a20;
  text-align: center; margin-bottom: 14px;
}
.blg-pin-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 6px; }
.blg-pin {
  width: 58px; height: 64px;
  background: #fff; border: 2px solid #e8dfc0;
  border-radius: 14px;
  font-size: 28px; font-weight: 800;
  color: #1a1a2e; text-align: center;
  transition: border-color .18s, box-shadow .18s;
  font-family: monospace; -webkit-appearance: none;
}
.blg-pin:focus {
  outline: none; border-color: #f5c842;
  background: #fffbea; box-shadow: 0 0 0 3px rgba(245,200,66,.25);
}
.blg-pin.filled { border-color: #e6a800; background: #fffbea; }
.blg-pin-erro {
  text-align: center; font-size: 12px; color: #c0392b;
  min-height: 18px; margin-bottom: 8px; font-weight: 500;
}
.blg-enter-btn {
  width: 100%;
  background: linear-gradient(135deg, #f5c842 0%, #e6a800 100%);
  border: none; border-radius: 14px;
  color: #1a1a2e; font-size: 16px; font-weight: 800;
  padding: 15px; cursor: pointer;
  transition: opacity .18s, transform .12s, box-shadow .18s;
  font-family: inherit; margin-top: 10px;
  box-shadow: 0 6px 20px rgba(245,200,66,.45);
}
.blg-enter-btn:hover   { opacity:.92; box-shadow: 0 8px 28px rgba(245,200,66,.55); }
.blg-enter-btn:active  { transform: scale(.98); }
.blg-enter-btn:disabled {
  background: #d0c890; color: #6a5a30;
  cursor: not-allowed; box-shadow: none;
}
.blg-first-access {
  margin-top: 12px; text-align: center;
  font-size: 12px; color: #9a8a50;
}
.blg-first-access a {
  color: #c09000; font-weight: 600; text-decoration: none; cursor: pointer;
}

/* ============================================================
   MANUT — Módulo Manutenção (Etapa 9.4)
   ============================================================ */
const Manut = (() => {
  let _all = [], _fornec = [], _revis = [];

  const render = async () => {
    _all    = await DB.getAll('manutencao');
    _fornec = await DB.getAll('fornecedores').catch(() => []);
    _revis  = await DB.getAll('revisoes').catch(() => []);
    _renderKpis();
    _renderAbertos();
    _renderConcluidos();
    _renderFornecedores();
    _renderRevisoes();
  };

  const _renderKpis = () => {
    const el = document.getElementById('manutKpis'); if (!el) return;
    const ab  = _all.filter(m => m.status === 'aberto');
    const urg = ab.filter(m => m.prioridade === 'urgente').length;
    const tot = _all.filter(m => m.status==='concluido').reduce((s,m) => s+(m.custo||0), 0);
    el.innerHTML = [
      { l:'Chamados Abertos', v: ab.length,         s:'aguardando',     i:'🔧', c: ab.length?'danger':'success' },
      { l:'Urgentes',         v: urg,                s:'alta prioridade',i:'🔴', c: urg?'danger':'success'       },
      { l:'Concluídos',       v: _all.filter(m=>m.status==='concluido').length, s:'histórico', i:'✅', c:'success' },
      { l:'Custo Total',      v: Utils.money(tot),   s:'manutenções',   i:'💸', c:'info'                         },
    ].map((k,i)=>`<div class="kpi ${k.c}" style="animation-delay:${i*.04}s">
      <div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div>
      <div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div>
    </div>`).join('');
  };

  const _card = m => {
    const f = _fornec.find(f => f.id === m.fornecedorId);
    return `<div class="card" style="margin-bottom:var(--sp-sm);border-left:4px solid var(--${m.prioridade==='urgente'?'danger':'warning'})">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div>
          <div style="font-family:var(--font-display);font-size:14px;font-weight:700">${Utils.esc(m.titulo)}</div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3)">📍 ${Utils.esc(m.local)} · ${Utils.fmtDate(m.dt)}</div>
          ${m.desc ? `<div style="font-size:var(--fs-xs);color:var(--ink-2);margin-top:3px">${Utils.esc(m.desc)}</div>` : ''}
        </div>
        <span class="badge ${m.prioridade==='urgente'?'badge-danger':'badge-warning'}">${m.prioridade}</span>
      </div>
      ${f ? `<div style="font-size:var(--fs-xs);color:var(--ink-3)">🏢 Fornecedor: <b>${Utils.esc(f.nome)}</b> · ${Utils.esc(f.tel||'')}</div>` : ''}
      ${m.custo ? `<div style="font-size:var(--fs-sm);font-weight:700;color:var(--success-dk);margin-top:4px">💰 ${Utils.money(m.custo)}</div>` : ''}
      <div style="display:flex;gap:5px;margin-top:8px">
        ${m.status==='aberto' ? `<button class="btn btn-success btn-xs" onclick="Manut.concluir('${m.id}')">✅ Concluir</button>` : ''}
        <button class="btn btn-ghost btn-xs" onclick="Manut.openForm('${m.id}')">✏️</button>
        <button class="btn btn-danger btn-xs" onclick="Manut.del('${m.id}')">🗑️</button>
      </div>
    </div>`;
  };

  const _renderAbertos = () => {
    const el = document.getElementById('manutAbertos'); if (!el) return;
    const ab = _all.filter(m => m.status==='aberto').sort((a,b) => {
      const pc = { urgente:0, alta:1, normal:2 };
      return (pc[a.prioridade]||2) - (pc[b.prioridade]||2);
    });
    el.innerHTML = ab.map(_card).join('') || '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-sub">Sem chamados abertos</div></div>';
  };

  const _renderConcluidos = () => {
    const el = document.getElementById('manutConcluidos'); if (!el) return;
    const cc = _all.filter(m => m.status==='concluido').sort((a,b) => (b.dtConclusao||b.dt||'').localeCompare(a.dtConclusao||a.dt||'')).slice(0,5);
    el.innerHTML = cc.map(_card).join('') || '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-sub">Nenhum concluído</div></div>';
  };

  const _renderFornecedores = () => {
    const el = document.getElementById('manutFornecedores'); if (!el) return;
    if (!_fornec.length) {
      el.innerHTML = `<div style="color:var(--ink-3);font-size:var(--fs-sm)">Nenhum fornecedor cadastrado. <button class="btn btn-ghost btn-xs" onclick="Manut.openFornecedor()">+ Cadastrar</button></div>`;
      return;
    }
    el.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
      ${_fornec.map(f => `<div style="border:1px solid var(--border);border-radius:var(--r-md);padding:10px">
        <div style="font-weight:700;font-size:var(--fs-sm)">${Utils.esc(f.nome)}</div>
        <div style="font-size:var(--fs-xs);color:var(--ink-3)">${Utils.esc(f.especialidade||'—')}</div>
        <div style="font-size:var(--fs-xs)">${Utils.esc(f.tel||'—')}</div>
        <div style="display:flex;gap:4px;margin-top:6px">
          ${f.tel?`<a href="https://wa.me/55${(f.tel||'').replace(/\D/g,'')}" target="_blank" class="btn btn-wa btn-xs">💬</a>`:''}
          <button class="btn btn-ghost btn-xs" onclick="Manut.openFornecedor('${f.id}')">✏️</button>
          <button class="btn btn-danger btn-xs" onclick="Manut.delFornecedor('${f.id}')">🗑️</button>
        </div>
      </div>`).join('')}
    </div>`;
  };

  const _renderRevisoes = () => {
    const el = document.getElementById('manutRevisoes'); if (!el) return;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const itens = [
      { nome:'Dedetização',     interv:180 },
      { nome:'Manutenção AC',   interv:90  },
      { nome:'Vistoria elétrica',interv:365},
      { nome:'Extintores',      interv:365 },
      ..._revis,
    ];
    el.innerHTML = itens.map(r => {
      const ultima = _all.filter(m => m.status==='concluido' && Utils.normalize(m.titulo).includes(Utils.normalize(r.nome).slice(0,6))).sort((a,b)=>(b.dt||'').localeCompare(a.dt||''))[0];
      const ultDt  = ultima?.dt ? new Date(ultima.dt.replace(/-/g,'/')) : null;
      const prox   = ultDt ? new Date(ultDt.getTime() + r.interv * 86400000) : null;
      const dias   = prox ? Math.round((prox - hoje) / 86400000) : null;
      const cor    = dias === null ? 'ink-3' : dias < 0 ? 'danger' : dias <= 30 ? 'warning' : 'success-dk';
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1">
          <div style="font-weight:700;font-size:var(--fs-sm)">${Utils.esc(r.nome)}</div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3)">A cada ${r.interv}d${ultima ? ` · Última: ${Utils.fmtDate(ultima.dt)}` : ' · Sem registro'}</div>
        </div>
        <span class="badge" style="color:var(--${cor});background:var(--${cor==='success-dk'?'success-lt':cor==='warning'?'warning-lt':'danger-lt'});border:1px solid var(--${cor})">
          ${dias === null ? '—' : dias < 0 ? `Vencida ${Math.abs(dias)}d` : dias === 0 ? 'Hoje!' : `${dias}d`}
        </span>
      </div>`;
    }).join('');
  };

  /* ── Form Chamado ── */
  const openForm = async (id = null) => {
    const m  = id ? _all.find(x => x.id === id) : null;
    const fornOpts = _fornec.map(f => `<option value="${f.id}" ${m?.fornecedorId===f.id?'selected':''}>${Utils.esc(f.nome)}</option>`).join('');
    const html = `
      <div class="modal-header">
        <div class="modal-title">${id ? '✏️ Editar Chamado' : '🔧 Novo Chamado'}</div>
        <button class="modal-close" onclick="Modal.close('modalSec')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom:var(--sp-md)">
          <label class="form-label">Problema <span class="required">*</span></label>
          <input class="form-input" id="mnTit" value="${Utils.esc(m?.titulo||'')}" placeholder="Ex: Torneira com vazamento">
        </div>
        <div class="form-row c3">
          <div class="form-group">
            <label class="form-label">Local</label>
            <input class="form-input" id="mnLoc" value="${Utils.esc(m?.local||'')}" placeholder="Ex: Cozinha, Sala 2...">
          </div>
          <div class="form-group">
            <label class="form-label">Prioridade</label>
            <select class="form-select" id="mnPri">
              ${['urgente','alta','normal'].map(p=>`<option value="${p}" ${m?.prioridade===p?'selected':''}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Data</label>
            <input class="form-input" type="date" id="mnDt" value="${m?.dt || Utils.today()}">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:var(--sp-md)">
          <label class="form-label">Descrição detalhada</label>
          <textarea class="form-textarea" id="mnDesc">${Utils.esc(m?.desc||'')}</textarea>
        </div>
        <div class="form-row c2">
          <div class="form-group">
            <label class="form-label">Fornecedor</label>
            <select class="form-select" id="mnForn">
              <option value="">Selecionar...</option>${fornOpts}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Custo (R$)</label>
            <input class="form-input" type="number" step="0.01" id="mnCusto" value="${m?.custo||''}">
